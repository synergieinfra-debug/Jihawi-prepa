 notions:[
  {n:"Roman à thèse",d:"Roman qui défend une idée (ici l'abolition de la peine de mort) en la faisant vivre à travers une histoire et des personnages."},
  {n:"Thèse",d:"Idée défendue par l'auteur : la peine de mort est cruelle, inutile, injuste et irréversible."},
  {n:"Argument",d:"Raison qui soutient la thèse. Ex. : la peine frappe aussi la famille innocente (Marie)."},
  {n:"Exemple",d:"Fait concret qui illustre un argument. Ex. : le friauche, fils de pendu devenu voleur, montre que le châtiment n'empêche rien."},
  {n:"Plaidoyer",d:"Discours pour défendre une cause ou une personne. La préface de 1832 est un plaidoyer contre la peine de mort."},
  {n:"Réquisitoire",d:"Discours qui accuse. Le roman est un réquisitoire contre la société et la justice de son temps."},
  {n:"Journal intime",d:"Forme du récit : écriture au jour le jour, à la 1ʳᵉ personne, au présent, pour soi-même."},
  {n:"Monologue intérieur",d:"Flux de pensées du personnage retranscrit sans intermédiaire : angoisses, souvenirs, calculs du condamné."},
  {n:"Narrateur anonyme",d:"Le condamné n'a ni nom ni crime connu : procédé d'universalisation, le lecteur s'identifie."},
  {n:"Focalisation interne",d:"Tout est vu par le condamné : ses peurs déforment le réel (le cachot, la foule, la guillotine)."},
  {n:"Présent d'énonciation",d:"Le narrateur écrit au moment où il vit : le présent crée l'urgence et l'immédiateté."},
  {n:"Analepse (retour en arrière)",d:"Souvenirs insérés dans le présent du cachot : le procès (ch. 2), Pepa (ch. 33), Notre-Dame (ch. 36)."},
  {n:"Ellipse",d:"Omission d'une partie du temps : les cinq semaines sont résumées, le crime n'est jamais raconté (ch. 47 vide)."},
  {n:"Rythme du récit",d:"Chapitres de plus en plus courts à mesure que l'heure approche : accélération et dilatation du temps."},
  {n:"Registre pathétique",d:"Vise à émouvoir : la visite de Marie, les adieux, les larmes."},
  {n:"Registre tragique",d:"Le héros face à une mort inéluctable ; le temps compté ; l'absence d'issue."},
  {n:"Registre polémique",d:"Attaque d'une institution ou d'une idée : la justice, la foule, le prêtre, la guillotine."},
  {n:"Registre réaliste",d:"Description précise du monde carcéral : argot, cachot, ferrement, toilette du condamné."},
  {n:"Argot",d:"Langue des prisonniers et des voleurs (le friauche, la chanson). Hugo l'utilise pour montrer un monde à part et ses codes."},
  {n:"Hyperbole",d:"Exagération : la guillotine devient un monstre, la foule une mer hurlante."},
  {n:"Personnification",d:"L'idée de la mort devient une compagne qui habite avec lui ; la guillotine « attend »."},
  {n:"Antithèse",d:"Opposition : vie/mort, dedans/dehors, soleil/cachot, enfant/bourreau."},
  {n:"Ironie",d:"Dire le contraire de ce qu'on pense pour dénoncer : le gendarme qui demande les numéros de loterie, l'architecte qui mesure."},
  {n:"Champ lexical",d:"Ensemble de mots liés à une idée : mort, enfermement, temps, angoisse, foule."},
  {n:"Préface de 1832",d:"Texte ajouté par Hugo où il assume la thèse abolitionniste et répond aux objections : arguments politiques, moraux, religieux."},
  {n:"Peine de mort en France",d:"Hugo la combat toute sa vie (discours de 1848). Elle est abolie en 1981 (loi Badinter)."},
  {n:"Bicêtre / Conciergerie / Grève",d:"Les trois lieux du roman : prison d'attente, prison du dernier jour, place de l'exécution."},

    if(e.svg)h+='<div class="fig">'+e.svg+(e.cap?'<div class="caption">'+e.cap+'</div>':'')+'</div>';
    h+=(o.rtl?'':arBtn('p'+i,a&&a.p,e.p))+'<p>'+e.p+'</p>';
    if(e.k)h+='<div class="keypoints">'+e.k+'</div>'+(o.rtl?'':arBtn('k'+i,a&&a.k,e.k,true));
  });
  if(c.chrono){h+='<h3>'+T('chrono')+'</h3><div class="timeline">';c.chrono.forEach(function(t){h+='<div class="tl">'+t+'</div>';});h+='</div>';}
  if(c.analyse){h+='<h3>'+(c.analyseTitre||T('outils'))+'</h3><table><tr><th>'+(c.analyseCols?c.analyseCols[0]:T('notion'))+'</th><th>'+(c.analyseCols?c.analyseCols[1]:T('dansCh'))+'</th></tr>';c.analyse.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';});h+='</table>';}
  if(c.citations){h+='<h3>'+T('retenir')+'</h3><div class="keypoints">'+c.citations+'</div>';}
  h+='<button class="btn w alt" onclick="segChap(1,document.querySelectorAll(\'.seg button\')[1])">'+T('passer')+'</button></div>';
  h+='<div id="seg1" style="display:none"><div class="bar"><i id="prog"></i></div><div id="quiz"></div><div class="score" id="score"></div><button class="btn ghost" onclick="resetQuiz()">'+T('recommencer')+'</button>'
    +(S.chap<L.length-1?' <button class="btn alt" onclick="go(\'chap\',{chap:'+(S.chap+1)+',list:\''+S.list+'\'})">'+T('suivant')+'</button>':'')+'</div></div>';
  if(S.full&&S.lic)h+='<p class="tip" style="text-align:center;font-size:.7rem">Jihawi Prépa · licence '+S.lic.code+(S.lic.nom?' · '+esc(S.lic.nom):'')+' · '+T('licence')+'</p>';
  m.innerHTML=h;renderQuiz(c.quiz,'chap');
}
/* ---------- traduction arabe ---------- */
function strip(h){return String(h).replace(/<[^>]+>/g,'');}
function arBtn(id,ar,fr,after){
  var bid='ar_'+id;
  if(ar){return '<button class="arbtn" onclick="toggleAr(this,\''+bid+'\')">🇲🇦 ترجمة · Traduire en arabe</button><div class="ar" id="'+bid+'">'+ar+'</div>';}
  var url='https://translate.google.com/?sl=fr&tl=ar&op=translate&text='+encodeURIComponent(strip(fr).slice(0,1500));
  return '<a class="arbtn" href="'+url+'" target="_blank" rel="noopener">🇲🇦 Traduire en arabe (en ligne)</a>';
}
function toggleAr(btn,id){var d=$(id);var on=d.classList.toggle('show');btn.classList.toggle('on',on);}
function segChap(i,btn){document.querySelectorAll('.seg button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');$('seg0').style.display=i?'none':'block';$('seg1').style.display=i?'block':'none';window.scrollTo(0,0);}

/* ---------- quiz ---------- */
var QZ=[],QMODE='chap';
function renderQuiz(list,mode){
  QZ=list;QMODE=mode;S.answers={};
  var box=$('quiz');box.innerHTML='';
  list.forEach(function(q,i){
    var d=document.createElement('div');d.className='q';
    var h='<span class="tag">'+(i+1)+' · '+q.t+'</span><div class="stem">'+q.s+'</div>';
    if(q.open){
      h+='<textarea placeholder="'+T('placeholder')+'"></textarea><button class="btn alt" onclick="showModel('+i+')">'+T('voirCorrige')+'</button><div class="expl" id="ex'+i+'"><b>'+T('corrige')+'</b><br>'+q.m+'<div class="selfeval"><button onclick="selfEval('+i+',0,this)">'+T('nonAcquis')+'</button><button onclick="selfEval('+i+',0.5,this)">'+T('partiel')+'</button><button onclick="selfEval('+i+',1,this)">'+T('acquis')+'</button></div></div>';
    }else{
      q.o.forEach(function(o,j){h+='<button class="opt" id="o'+i+'_'+j+'" onclick="answer('+i+','+j+')">'+String.fromCharCode(65+j)+'. '+o+'</button>';});
      h+='<div class="expl" id="ex'+i+'"><b>'+T('explication')+'</b> '+q.e+'</div>';
    }
    d.innerHTML=h;box.appendChild(d);
  });
  updateScore();
}
function answer(i,j){
  if(S.answers[i]!==undefined)return;
  S.answers[i]=(j===QZ[i].a)?1:0;
  QZ[i].o.forEach(function(_,k){var b=$('o'+i+'_'+k);b.disabled=true;if(k===QZ[i].a)b.classList.add('good');else if(k===j)b.classList.add('bad');});
  $('ex'+i).classList.add('show');updateScore();
}
function showModel(i){$('ex'+i).classList.add('show');}
function selfEval(i,v,btn){S.answers[i]=v;btn.parentNode.querySelectorAll('button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');updateScore();}
function updateScore(){
  var done=Object.keys(S.answers).length,pts=0;for(var k in S.answers)pts+=S.answers[k];
  $('prog').style.width=Math.round(done/QZ.length*100)+'%';
  var s=$('score');if(done===0){s.textContent='';return;}
  s.textContent=T('score')+fmt(pts)+' / '+QZ.length+(done<QZ.length?' ('+done+T('repondues')+')':'');
  if(done===QZ.length){
    if(QMODE==='chap'){var p=load('prog',{});p[progKey(cur(),S.chap)]={pts:pts,tot:QZ.length};store('prog',p);}
    if(QMODE==='exam'){var n=Math.round(pts/QZ.length*200)/10;s.textContent=T('note')+fmt(n)+' / 20';var b=load('examBest',0);if(n>b)store('examBest',n);clearInterval(S.exam);}
  }
}
function resetQuiz(){renderQuiz(QZ,QMODE);window.scrollTo(0,0);}

/* ---------- personnages ---------- */
function avatar(color,hair,female){
  return '<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="40" fill="'+color+'" opacity=".18"/><path d="M14 80 Q14 52 42 52 Q70 52 70 80Z" fill="'+color+'"/><circle cx="42" cy="34" r="17" fill="#e3b58a"/>'
   +(female?'<path d="M22 30 Q42 2 62 30 L62 50 Q42 56 22 50Z" fill="'+hair+'"/><circle cx="42" cy="34" r="17" fill="#e3b58a"/><path d="M25 28 Q42 8 59 28Z" fill="'+hair+'"/>':'<path d="M25 30 Q42 8 59 30Z" fill="'+hair+'"/>')
   +'<circle cx="36" cy="35" r="2" fill="#2b2118"/><circle cx="48" cy="35" r="2" fill="#2b2118"/><path d="M37 43 Q42 46 47 43" stroke="#2b2118" fill="none" stroke-width="1.5"/></svg>';
}
function renderPersos(m,o){
  var h='<div class="card"><h2>'+T('persos')+'</h2><p class="tip">'+T('persosTip')+'</p><div class="grid">';
  o.persos.forEach(function(p,i){h+='<div class="perso" onclick="this.classList.toggle(\'open\')">'+avatar(p.c,p.h,p.f)+'<b>'+p.n+'</b><small>'+p.r+'</small><div class="more">'+p.d+'</div></div>';});
  h+='</div>'+(o.schema?'<h3>'+T('schema')+'</h3><div class="fig">'+o.schema+'</div>':'')+'</div>';
  m.innerHTML=h;
}

/* ---------- examen blanc ---------- */
function renderExam(m,o){
  var h='<div class="card"><h2>'+T('examTitle')+'</h2><p class="tip">'+T('examTip')+'</p>'
   +'<div class="seg"><button class="on" onclick="examSeg(0,this)">'+T('qcm')+'</button><button onclick="examSeg(1,this)">'+T('flash')+'</button></div>'
   +'<div id="eseg0"><button class="btn w" onclick="startExam()">'+T('lancer')+'</button><div id="examzone"></div></div>'
   +'<div id="eseg1" style="display:none"><p class="tip">'+T('flashTip')+'</p><div class="flash" id="flash" onclick="flipCard()"></div><div class="row"><button class="btn ghost" onclick="nextCard()">'+T('carteSuiv')+'</button></div></div></div>';
  m.innerHTML=h;FC=shuffle(o.notions.slice());FI=0;showCard(false);
}
function examSeg(i,btn){document.querySelectorAll('.seg button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');$('eseg0').style.display=i?'none':'block';$('eseg1').style.display=i?'block':'none';}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startExam(){
  var o=cur(),pool=[];o.chapitres.concat(o.langue||[]).forEach(function(c){c.quiz.forEach(function(q){if(!q.open)pool.push(q);});});
  var list=shuffle(pool).slice(0,10),left=20*60;
  $('examzone').innerHTML='<p class="score">'+T('temps')+'<span class="timer" id="tm">20:00</span></p><div class="bar"><i id="prog"></i></div><div id="quiz"></div><div class="score" id="score"></div>';
  renderQuiz(list,'exam');
  clearInterval(S.exam);
  S.exam=setInterval(function(){left--;var mm=Math.floor(left/60),ss=left%60;var t=$('tm');if(!t){clearInterval(S.exam);return;}t.textContent=mm+':'+(ss<10?'0':'')+ss;if(left<=0){clearInterval(S.exam);t.textContent=T('termine');document.querySelectorAll('.opt').forEach(function(b){b.disabled=true});}},1000);
}
var FC=[],FI=0,FB=false;
function showCard(back){FB=back;var c=FC[FI];var f=$('flash');if(!f||!c)return;f.className='flash'+(back?' back':'');f.innerHTML=back?'<div><b>'+c.d+'</b></div>':'<div><small style="color:#7a6a58">'+T('definissez')+'</small><br><b style="font-size:1.1rem">'+c.n+'</b></div>';}
function flipCard(){showCard(!FB);}
function nextCard(){FI=(FI+1)%FC.length;showCard(false);}

/* ---------- init ---------- */
(function(){initLicence();var last=load('last',null);if(last&&BAM.oeuvres[last]){S.oeuvre=last;}go('home',null,true);})();
</script>
</body>
