<style>
:root{--bg:#f7f1e6;--card:#fffdf8;--ink:#2b2118;--muted:#7a6a58;--accent:#b5452c;--accent2:#1f6f78;--gold:#d9a441;--line:#e6d9c3;--ok:#2e7d4f;--ko:#b5452c;--radius:14px;font-size:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding-bottom:72px}
header{background:linear-gradient(135deg,#1f6f78,#2b2118);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:10px}
header .back{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;width:34px;height:34px;font-size:1.1rem;display:none;font-family:inherit}
header .back.show{display:block}
header h1{margin:0;font-size:1.05rem;font-weight:700;flex:1;line-height:1.2}
header small{display:block;font-size:.72rem;opacity:.8;font-weight:400}
.chip{display:inline-block;background:var(--gold);color:#2b2118;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:middle}
main{padding:14px 14px 20px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 8px;font-size:1.05rem;color:var(--accent2)}
.card h3{margin:14px 0 6px;font-size:.95rem;color:var(--accent)}
.card p{margin:6px 0}
.card ul{margin:6px 0;padding-left:20px}
.card li{margin:3px 0}
.fig{width:100%;border-radius:10px;overflow:hidden;background:#fbf6ec;border:1px solid var(--line);margin:8px 0}
.fig svg{display:block;width:100%;height:auto}
.caption{font-size:.78rem;color:var(--muted);text-align:center;padding:4px 8px 8px;font-style:italic}
.keypoints{background:#fff3e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:8px;font-size:.92rem;margin:8px 0}
.keypoints strong{color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perso{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.perso svg{width:84px;height:84px}
.perso b{display:block;font-size:.92rem;margin-top:4px}
.perso small{color:var(--muted);font-size:.78rem;display:block}
.perso .more{display:none;text-align:left;font-size:.82rem;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.perso.open .more{display:block}
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;margin-bottom:10px;font-size:.9rem}
.tl:before{content:"";position:absolute;left:-19px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent2)}
.tl b{color:var(--accent2)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f1e8d8}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:9}
nav button{background:none;border:0;font-size:.66rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 4px;font-family:inherit}
nav button span.ic{font-size:1.2rem;line-height:1}
nav button.on{color:var(--accent)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.q .tag{font-size:.7rem;font-weight:700;color:#fff;background:var(--accent2);padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:6px}
.q .stem{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:#fbf6ec;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin:6px 0;font-size:.92rem;font-family:inherit;color:var(--ink)}
.opt.good{border-color:var(--ok);background:#e3f3e8}
.opt.bad{border-color:var(--ko);background:#fae4df}
.q textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;padding:8px;font-family:inherit;font-size:.92rem;resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;font-size:.92rem;font-family:inherit;margin-top:6px}
.btn.alt{background:var(--accent2)}
.card.adm{border:1px dashed var(--accent)}
.mat{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;font-weight:700}.oeuvres .mat:first-child{margin-top:0}
.admg .inp,#adQ{text-transform:none;letter-spacing:0;font-size:.95rem}#licNom,#licTel{text-transform:none;letter-spacing:0;font-size:1rem}
.admg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.admg .lab{display:block}.admg .inp{margin-top:2px}
.adc,.adl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid #eadfcf}.adc:first-child,.adl:first-child{border-top:0}
.adc code,.adl code{font-size:1rem;font-weight:700;letter-spacing:.5px}.adl>div:first-child{flex:1;min-width:170px}.adl .acts{display:flex;gap:6px;flex-wrap:wrap}
.adl .btn,.adc .btn{padding:6px 10px;font-size:.8rem;margin:0}.asg{display:flex;gap:6px;margin-top:4px;width:100%}.asg .inp{flex:1;min-width:0;margin:0;padding:6px 8px;font-size:.85rem;text-transform:none;letter-spacing:0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid #d9ccb8;background:#fff;border-radius:999px;padding:4px 10px;font-size:.75rem;font-family:inherit}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.wa{background:#25d366;color:#fff;text-decoration:none;display:inline-block}.btn.wa.w{display:block;text-align:center;padding:11px 14px;font-size:1rem;margin-top:10px}.btn.red{color:#b5452c;border-color:#b5452c}
.st{font-size:.75rem;padding:2px 7px;border-radius:9px;background:#eee;color:#555;margin-left:4px}.st.on{background:#dff3e4;color:#1d6b3a}.st.off{background:#f9dcd6;color:#9b2f1a}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.w{width:100%}
.expl{display:none;margin-top:8px;background:#f1f7f7;border-left:4px solid var(--accent2);padding:8px 10px;border-radius:8px;font-size:.88rem}
.expl.show{display:block}
.score{font-size:1.1rem;font-weight:700;color:var(--accent2);text-align:center;margin:10px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent2);width:0;transition:width .4s}
.tip{font-size:.85rem;color:var(--muted)}
.model{background:#fbf6ec;border:1px dashed var(--gold);border-radius:9px;padding:10px;font-size:.88rem;margin-top:8px}
.selfeval{display:flex;gap:6px;margin-top:6px}
.selfeval button{flex:1;font-family:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;padding:6px;font-size:.8rem}
.selfeval button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.chaplist{display:flex;flex-direction:column;gap:8px}
.chapbtn{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.chapbtn .num{width:36px;height:36px;border-radius:10px;background:var(--accent2);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.chapbtn .t{flex:1}
.chapbtn .t b{display:block;font-size:.92rem}
.chapbtn .t small{color:var(--muted);font-size:.76rem}
.chapbtn .st{font-size:.72rem;color:var(--muted);text-align:right;flex:none}
.chapbtn .st b{color:var(--ok)}
.seg{display:flex;background:#f1e8d8;border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-family:inherit;font-size:.85rem;color:var(--muted)}
.seg button.on{background:#fff;color:var(--accent2);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.flash{background:var(--card);border:2px solid var(--accent2);border-radius:14px;padding:22px 16px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1rem;cursor:pointer}
.flash.back{background:#f1f7f7}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.oeuvres{display:grid;gap:10px}
.oeuvre{border-radius:14px;padding:14px;color:#fff;text-align:left;border:0;font-family:inherit;position:relative;overflow:hidden}
.oeuvre{display:flex;align-items:center;gap:12px}.oeuvre .ico{flex:0 0 44px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}.oeuvre .ico svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.oeuvre .tx{flex:1 1 auto;min-width:0}.oeuvre .chev{flex:0 0 auto;font-size:1.5rem;opacity:.8;line-height:1}.oeuvre b{display:block;font-size:1.05rem}
.oeuvre small{opacity:.85;font-size:.8rem}
.oeuvre.soon{opacity:.55}
.oeuvre .ribbon{position:absolute;top:10px;right:-28px;transform:rotate(35deg);background:var(--gold);color:#2b2118;font-size:.65rem;font-weight:700;padding:2px 34px}
.stat{display:flex;gap:8px;margin:8px 0}
.stat div{flex:1;background:#fbf6ec;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.2rem;color:var(--accent2)}
.stat small{font-size:.72rem;color:var(--muted)}
.install{display:none;background:#fff3e0;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:12px;align-items:center;gap:10px}
.install.show{display:flex}
.install img{width:40px;height:40px;border-radius:9px;flex:none}
.install .t{flex:1;font-size:.85rem}
.install .t b{display:block}
.install button{font-family:inherit;border-radius:8px;padding:7px 10px;font-size:.82rem;border:0}
.install .ok{background:var(--accent2);color:#fff}
.install .no{background:none;color:var(--muted)}
.toast{position:fixed;left:12px;right:12px;bottom:76px;background:#2b2118;color:#fff;border-radius:10px;padding:10px 12px;font-size:.85rem;display:none;z-index:20;align-items:center;gap:10px}
.toast.show{display:flex}
.toast button{margin-left:auto;background:var(--gold);border:0;border-radius:8px;padding:6px 10px;font-family:inherit;font-weight:700}
.arbtn{display:inline-flex;align-items:center;gap:5px;background:#eef5f5;color:var(--accent2);border:1px solid #cfe0e2;border-radius:999px;padding:3px 10px;font-size:.76rem;font-family:inherit;margin:2px 0 6px}
.arbtn.on{background:var(--accent2);color:#fff}
.ar{display:none;direction:rtl;text-align:right;font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-size:1.02rem;line-height:1.9;background:#f1f7f7;border-right:4px solid var(--accent2);border-radius:8px;padding:8px 12px;margin:4px 0 10px}
.ar.show{display:block}
.ar b{color:var(--accent2)}
.redac{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.redac>button{width:100%;text-align:left;background:none;border:0;padding:12px;font-family:inherit;color:var(--ink);display:flex;gap:10px;align-items:center}
.redac>button b{flex:1;font-size:.92rem}
.redac>button .n{width:28px;height:28px;border-radius:8px;background:var(--gold);color:#2b2118;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:.85rem}
.redac>button .ch{color:var(--muted);transition:transform .2s}
.redac.open>button .ch{transform:rotate(90deg)}
.redac .body{display:none;padding:0 12px 12px;font-size:.92rem}
.redac.open .body{display:block}
.redac .sujet{background:#fff3e0;border-left:4px solid var(--gold);padding:8px 10px;border-radius:8px;font-style:italic;margin-bottom:10px}
.redac .para{margin:8px 0;text-align:justify}
.redac .para .lab{display:inline-block;font-size:.68rem;font-weight:700;color:#fff;background:var(--accent2);padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:middle}
.redac .para.c .lab{background:var(--gold);color:#2b2118}
.redac .para.a .lab{background:var(--accent)}
.redac .conn{background:#fffbe6}
.lic h2{margin-bottom:4px}.lic.ok{border-color:#2e7d4f;background:#f0f8f2}.lic code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.9rem}
.inp{width:100%;font:inherit;font-size:1.05rem;letter-spacing:.08em;padding:10px;border:1px solid var(--line);border-radius:9px;margin:4px 0 10px;text-transform:uppercase}
.lab{display:block;font-size:.8rem;color:var(--muted);margin-top:6px}
.chapbtn.locked{opacity:.75;background:#fbf6ec}.chapbtn.locked .num{background:#c9b48e}
.redac .plan{font-size:.82rem;line-height:2.1;margin-bottom:8px;padding:8px 10px;background:#fff;border:1px dashed var(--line);border-radius:8px}.redac .plan .pl{display:inline-block;padding:1px 8px;border-radius:999px;background:#eee;color:#2b2118;margin:0 2px}.redac .plan .pl.i{background:#dbe9ec;color:#174f56}.redac .plan .pl.a{background:#f6ddd3;color:#8a2e1e}.redac .plan .pl.c{background:#f3e6c9;color:#6b4a12}.redac .plan .ar{color:var(--muted);margin:0 2px}.redac .rab{font-size:.82rem;margin-top:8px;line-height:2.1}.redac .rab .conn{margin:0 2px}
.redac .note{font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:8px}

/* ---------- arabe (RTL) ---------- */
body.rtl{font-family:"Noto Naskh Arabic","Noto Sans Arabic","Amiri","Droid Arabic Naskh","Segoe UI",Tahoma,system-ui,sans-serif;letter-spacing:0}
body.rtl main{line-height:1.9;font-size:1.02rem}body.rtl h2,body.rtl h3{letter-spacing:0;line-height:1.5}
body.rtl button.back{transform:scaleX(-1)}body.rtl .keypoints,body.rtl .tip,body.rtl .expl{line-height:1.85}
body.rtl .chapbtn .st{text-align:left}body.rtl .para .lab{margin:0 0 0 8px}body.rtl .redac button .ch{transform:rotate(180deg)}
body.rtl table th,body.rtl table td{text-align:right}body.rtl .inp{text-transform:none;letter-spacing:0}
body.rtl .caption{font-size:.85rem}
body.rtl .opt,body.rtl .btn,body.rtl textarea,body.rtl .stem,body.rtl .q,body.rtl .redac button,body.rtl .chapbtn .t{text-align:right}body.rtl .btn.w,body.rtl .seg button,body.rtl .flash,body.rtl .selfeval button{text-align:center}.opt .ol{font-weight:700;color:var(--accent2)}
body.rtl .keypoints,body.rtl .expl,body.rtl .redac .sujet{border-left:0;border-right:4px solid var(--gold)}body.rtl .expl{border-right-color:var(--accent2)}body.rtl .q .tag{letter-spacing:0}
</style>

<header>

<script>
var BAM={oeuvres:{}};
function reg(o){BAM.oeuvres[o.id]=o;o.chapitres=o.chapitres||[];}
function addChap(oid,c){BAM.oeuvres[oid].chapitres.push(c);}
function addAr(oid,i,arr){var c=BAM.oeuvres[oid].chapitres[i];if(c)c.ar=arr;}
function addLocked(oid,l){var o=BAM.oeuvres[oid];var k=l.list==='langue'?'lockedL':'locked';o[k]=o[k]||[];o[k].push(l);}
function addRedac(oid,list){var o=BAM.oeuvres[oid];o.redactions=(o.redactions||[]).concat(list);}
function addLangue(oid,c){var o=BAM.oeuvres[oid];o.langue=o.langue||[];o.langue.push(c);}

/* === _lib/00-illus.js === */
/* Bibliothèque d'illustration Jihawi (SVG vectoriel enrichi) — personnages expressifs, décors, accessoires.
   Toutes les fonctions renvoient des chaînes SVG. Scène standard : viewBox 0 0 360 220. */
var I=(function(){
 var uid=0;function id(p){return p+(++uid);}
 var SK={clair:['#f3d2ad','#dcae84'],moyen:['#e6b98f','#c9946a'],mat:['#c98f63','#a66f49'],fonce:['#8d5a3b','#6b4128']};
 function grad(gid,a,b,vert){return '<linearGradient id="'+gid+'" x1="0" y1="0" x2="'+(vert?0:1)+'" y2="'+(vert?1:0)+'"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient>';}
 function rad(gid,c,o1,o2){return '<radialGradient id="'+gid+'" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="'+c+'" stop-opacity="'+(o1==null?.8:o1)+'"/><stop offset="1" stop-color="'+c+'" stop-opacity="'+(o2||0)+'"/></radialGradient>';}
 /* ---------- visages ---------- */
 function face(o){ // o: expr, skin [light,dark], hair, hairstyle, beard, size (rayon ~ 20), veil
   var r=o.r||20,s=o.skin,h='',e=o.expr||'neutre',hc=o.hair||'#2b1d12';
   var g=id('sk');h+='<defs>'+grad(g,s[0],s[1],1)+'</defs>';
   // voile (derrière la tête)
   if(o.hairstyle==='voile')h+='<path d="M'+(-r*1.5)+' '+(r*2.4)+' L'+(-r*1.25)+' '+(-r*.2)+' Q0 '+(-r*1.75)+' '+(r*1.25)+' '+(-r*.2)+' L'+(r*1.5)+' '+(r*2.4)+'Z" fill="'+(o.veil||'#1f6f78')+'"/><path d="M'+(-r*1.5)+' '+(r*2.4)+' L'+(-r*1.25)+' '+(-r*.2)+' Q'+(-r*.6)+' '+(-r*1.2)+' 0 '+(-r*1.35)+' L0 '+(r*2.4)+'Z" fill="#fff" opacity=".12"/>';
   h+='<ellipse cx="0" cy="0" rx="'+r+'" ry="'+(r*1.12)+'" fill="url(#'+g+')"/>';
   // oreilles
   h+='<ellipse cx="'+(-r)+'" cy="'+(r*.1)+'" rx="'+(r*.18)+'" ry="'+(r*.28)+'" fill="'+s[1]+'"/><ellipse cx="'+r+'" cy="'+(r*.1)+'" rx="'+(r*.18)+'" ry="'+(r*.28)+'" fill="'+s[1]+'"/>';
   // cheveux
   var hs=o.hairstyle||'court';

 +'<div class="fig"><svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="160" fill="#1b1f2a"/><rect x="0" y="130" width="360" height="30" fill="#2b2118"/><g fill="#e8d4b0"><rect x="40" y="40" width="14" height="90"/><rect x="100" y="40" width="14" height="90"/><rect x="246" y="40" width="14" height="90"/><rect x="306" y="40" width="14" height="90"/><path d="M30 40 h300 l-10 -14 h-280Z"/></g><g><path d="M150 130 Q150 70 180 70 Q210 70 210 130Z" fill="#2b2118"/><circle cx="180" cy="58" r="16" fill="#e3b58a"/><path d="M164 56 Q180 36 196 56Z" fill="#2b2118"/></g><circle cx="180" cy="80" r="70" fill="#f3b54a" opacity=".12"/><text x="180" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#f3e6c9">Thèbes, un palais, une nuit</text><text x="180" y="152" text-anchor="middle" font-size="9" fill="#c9b48e">Créée à Paris en février 1944, sous l’Occupation</text></svg><div class="caption">Un décor neutre, des personnages en habits de soirée : la tragédie en costume moderne</div></div>'
 +'<table><tr><th>Auteur</th><td>Jean Anouilh (Bordeaux 1910 – Lausanne 1987), dramaturge français ; auteur des « pièces noires », « roses », « brillantes »</td></tr>'
 +'<tr><th>Création</th><td>4 février 1944, théâtre de l\'Atelier (Paris), pendant l\'Occupation allemande ; publiée en 1946</td></tr>'
 +'<tr><th>Genre</th><td>Tragédie moderne en prose, en un seul acte, sans découpage en scènes</td></tr>'
 +'<tr><th>Source</th><td>L\'Antigone de Sophocle (Vᵉ s. av. J.-C.) et le mythe des Labdacides (Œdipe)</td></tr>'
 +'<tr><th>Cadre</th><td>Thèbes, le palais de Créon, de l\'aube à la fin du jour (unité de temps et de lieu)</td></tr>'
 +'<tr><th>Thèmes</th><td>Révolte et refus, devoir et pouvoir, bonheur, enfance et pureté, mort, fatalité, solitude du héros</td></tr>'
 +'<tr><th>Registres</th><td>Tragique, pathétique, polémique ; touches comiques (gardes, nourrice)</td></tr></table>'
 +'<h3>Le mythe en bref (ce que le spectateur doit savoir)</h3><p><b>Œdipe</b>, roi de Thèbes, a épousé sans le savoir sa mère Jocaste. Ils ont eu quatre enfants : <b>Étéocle</b>, <b>Polynice</b>, <b>Antigone</b> et <b>Ismène</b>. Après la mort d\'Œdipe, les deux frères devaient régner à tour de rôle ; Étéocle refuse de céder le trône, Polynice attaque Thèbes avec une armée étrangère : <b>ils s\'entretuent</b>. <b>Créon</b>, leur oncle, devient roi. Il fait de belles funérailles à Étéocle et interdit d\'enterrer Polynice, laissé aux corbeaux, sous peine de mort. Antigone décide de <b>désobéir</b>.</p>'
 +'<div class="fig">'+I.D.svg(210,[I.D.pill(100,8,160,30,'Les Labdacides'),

 +'<h3>Pourquoi « tragédie moderne » ?</h3><ul><li><b>Tragédie</b> : un héros face à un destin inéluctable, une fin par la mort, le registre tragique, la fatalité annoncée dès le Prologue.</li><li><b>Moderne</b> : en prose, en costumes contemporains, avec des <b>anachronismes</b> (cigarettes, cartes à jouer, voiture, bals), un langage familier (les gardes), un Chœur qui <b>commente</b> le genre lui-même, et <b>sans les dieux</b> : la fatalité est intérieure, Antigone choisit.</li></ul>'
 +'<h3>Le contexte de 1944</h3><p>Créée sous l\'Occupation, la pièce a été lue de deux façons : Antigone comme figure de la <b>Résistance</b> (le non à l\'ordre injuste), Créon comme figure du pouvoir <b>collaborateur</b> qui « dit oui » pour sauver ce qui peut l\'être. Anouilh laisse les deux lectures ouvertes : c\'est la force de la pièce.</p>'
 +'<h3>Les trois piliers à mémoriser</h3><div class="keypoints"><strong>1.</strong> Le <b>conflit</b> Antigone / Créon : l\'absolu contre le compromis, le « non » contre le « oui ».<br><strong>2.</strong> La <b>fatalité</b> : tout est annoncé dès le Prologue ; le Chœur dit que « le ressort est bandé ».<br><strong>3.</strong> Le <b>bonheur</b> : Antigone refuse le bonheur médiocre des adultes ; elle veut « tout, tout de suite » ou rien.</div>'
 +'<h3>Les personnages en un coup d\'œil</h3><table><tr><th>Camp du « non »</th><th>Camp du « oui »</th><th>Hors du conflit</th></tr><tr><td>Antigone<br>Hémon (à la fin)</td><td>Créon<br>Ismène (au début)<br>Les gardes</td><td>Le Prologue / Chœur<br>La Nourrice<br>Le Page, le Messager, Eurydice</td></tr></table>'
 +'</div>',
 persos:[
  {n:"Antigone",r:"L'héroïne, fille d'Œdipe",c:"#b5452c",h:"#2b2118",f:true,d:"Petite, maigre, noiraude, renfermée : la « sale bête » que personne ne prenait au sérieux. Elle refuse le compromis, le mensonge et le bonheur tiède des adultes. Elle enterre Polynice moins par piété que par fidélité à elle-même et à l'enfance : elle dit « non ». Elle meurt seule, sans savoir pourquoi, ce qui fait sa grandeur tragique."},
  {n:"Créon",r:"Le roi, oncle d'Antigone",c:"#2b2118",h:"#999",f:false,d:"Homme robuste, fatigué, amateur de musique et de livres, devenu roi par devoir. Il incarne le réalisme politique : accepter le « sale travail », dire oui pour que la machine tourne. Il tente de sauver Antigone, lui révèle la vérité sur ses frères, mais échoue. À la fin, il perd son fils et sa femme et continue, seul, à gouverner."},
  {n:"Ismène",r:"La sœur d'Antigone",c:"#d9a441",h:"#d9a441",f:true,d:"Belle, blonde, raisonnable, coquette. Elle a peur de la mort et de la foule ; elle tente de dissuader Antigone au nom de la prudence. Elle représente le compromis et la vie ordinaire. Trop tard, elle voudra mourir avec sa sœur : Antigone la repousse."},
  {n:"Hémon",r:"Fils de Créon, fiancé d'Antigone",c:"#1f6f78",h:"#2b2118",f:false,d:"Jeune homme amoureux et sincère. Il a préféré Antigone à Ismène. Quand son père condamne sa fiancée, il le supplie, puis le renie. Il se tue dans le tombeau auprès d'Antigone morte : sa mort entraîne celle de sa mère Eurydice."},
  {n:"La Nourrice",r:"Celle qui a élevé les deux sœurs",c:"#8a6d3b",h:"#999",f:true,d:"Personnage tendre et comique, venu de la comédie. Elle gronde Antigone, lui prépare du café et des tartines, l'appelle « ma colombe ». Elle représente l'enfance protégée et l'amour simple ; Antigone lui confie sa chienne Douce."},
  {n:"Le Prologue / Le Chœur",r:"Le narrateur de la pièce",c:"#4a3b5c",h:"#2b2118",f:false,d:"Au début, il présente les personnages et annonce leur destin : c'est le Prologue. Ensuite, il intervient pour commenter l'action et définir la tragédie (« c'est propre, c'est reposant, c'est sûr »). Il est la voix de l'auteur et crée la distance avec le spectateur."},
  {n:"Les gardes (Jonas, Durand, Boudousse)",r:"Les exécutants",c:"#7a6a58",h:"#2b2118",f:false,d:"Hommes du peuple, vulgaires, préoccupés par leur paie, leur avancement et leurs beuveries. Ils arrêtent Antigone sans comprendre. Leur langage familier et leur indifférence introduisent le comique et dénoncent la banalité de la soumission. Jonas écrit la dernière lettre d'Antigone."},
  {n:"Le Messager",r:"Celui qui annonce la mort",c:"#555",h:"#2b2118",f:false,d:"Personnage pâle et solitaire, présent dès le Prologue, qui sait déjà ce qu'il viendra annoncer : la mort d'Antigone et d'Hémon dans le tombeau. Il assure le récit du dénouement (la mort n'est pas montrée sur scène)."},
  {n:"Eurydice",r:"Femme de Créon",c:"#9c4f7a",h:"#999",f:true,d:"Vieille dame qui tricote pour les pauvres de Thèbes pendant toute la pièce, sans dire un mot. À l'annonce de la mort de son fils Hémon, elle pose son tricot et se tranche la gorge. Figure muette du malheur."},
  {n:"Le Page",r:"Petit garçon au service de Créon",c:"#5aa9d6",h:"#2b2118",f:false,d:"Enfant silencieux qui accompagne Créon. Dans la scène finale, Créon lui confie sa lassitude ; le page voudrait vite être grand, Créon lui dit qu'il est fou. Il symbolise l'innocence qui deviendra, elle aussi, compromis."},
  {n:"Polynice et Étéocle",r:"Les frères morts",c:"#4f4f4f",h:"#2b2118",f:false,d:"Absents de la scène, ils sont le point de départ du conflit. Créon révèle qu'ils étaient tous deux des voyous qui voulaient tuer leur père, et que les corps étaient si abîmés qu'on ne sait pas lequel a été enterré. Cette révélation ébranle Antigone un instant."}

 notions:[
  {n:"Tragédie",d:"Pièce de théâtre mettant en scène un héros noble face à un destin inéluctable, qui se termine par la mort. Elle inspire terreur et pitié."},
  {n:"Tragédie moderne",d:"Tragédie du XXᵉ siècle qui reprend un mythe antique en prose, en costumes contemporains, avec anachronismes et sans intervention des dieux."},
  {n:"Mythe",d:"Récit légendaire fondateur transmis depuis l'Antiquité (ici : Œdipe et ses enfants), repris et réinterprété par les auteurs."},
  {n:"Fatalité (fatum)",d:"Destin fixé d'avance auquel le héros ne peut échapper. Chez Anouilh, elle est annoncée dès le Prologue et incarnée par le Chœur."},
  {n:"Prologue",d:"Personnage qui, au début, présente les personnages et annonce l'histoire. Procédé antique repris par Anouilh pour créer la distance."},
  {n:"Chœur",d:"Dans la tragédie grecque, groupe qui commente l'action. Chez Anouilh, un seul personnage qui réfléchit sur la tragédie et le destin."},
  {n:"Anachronisme",d:"Élément d'une époque placé dans une autre : cigarettes, cartes, voiture, bal dans une Thèbes antique. Il modernise et universalise."},
  {n:"Catharsis",d:"Purification des passions du spectateur par la terreur et la pitié qu'inspire la tragédie (Aristote)."},
  {n:"Hybris (démesure)",d:"Orgueil excessif du héros tragique qui défie l'ordre établi. L'absolu d'Antigone peut être lu comme une forme d'hybris."},
  {n:"Dilemme tragique",d:"Choix impossible entre deux devoirs : pour Créon, sauver sa nièce ou faire respecter la loi."},
  {n:"Didascalie",d:"Indication scénique de l'auteur (gestes, ton, décor) en italique, non prononcée par les acteurs."},
  {n:"Réplique",d:"Prise de parole d'un personnage dans un dialogue."},
  {n:"Tirade",d:"Longue réplique d'un personnage, ex. : Créon expliquant son métier de roi, l'image du bateau."},
  {n:"Stichomythie",d:"Échange rapide de répliques brèves, vers à vers ou phrase à phrase, qui traduit la tension (Antigone/Créon)."},
  {n:"Monologue",d:"Un personnage seul en scène parle à lui-même ou au public (ex. : le Chœur sur la tragédie)."},
  {n:"Aparté",d:"Réplique dite à part, que les autres personnages sont censés ne pas entendre."},
  {n:"Double énonciation",d:"Au théâtre, le personnage parle à un autre personnage ET au public en même temps."},
  {n:"Ironie tragique",d:"Le spectateur sait ce que le personnage ignore (grâce au Prologue) : chaque espoir des personnages sonne faux."},
  {n:"Registre tragique",d:"Exprime la fatalité, la mort, la grandeur du héros face au destin : lexique de la mort, du devoir, de la nécessité."},
  {n:"Registre pathétique",d:"Vise à émouvoir, à faire pleurer : supplications d'Hémon, adieux d'Antigone, lettre à Hémon."},
  {n:"Registre polémique",d:"Affrontement d'idées, ton vif, arguments et attaques : le débat Antigone/Créon."},
  {n:"Registre comique",d:"Les gardes (paie, avancement, langage familier) et la Nourrice apportent le rire dans la tragédie."},
  {n:"Antithèse",d:"Opposition de termes : oui / non, vivre / mourir, bonheur / absolu, enfant / adulte."},
  {n:"Métaphore filée",d:"Image poursuivie sur plusieurs phrases : le bateau qui coule et son capitaine (Créon sur le pouvoir)."},
  {n:"Mise en abyme",d:"La pièce parle d'elle-même : le Chœur explique ce qu'est une tragédie pendant la tragédie."},
  {n:"Distanciation",d:"Procédé qui empêche le spectateur de s'identifier totalement (Prologue, Chœur, anachronismes) pour le faire réfléchir."},
  {n:"Schéma actantiel",d:"Sujet : Antigone · Objet : enterrer Polynice / rester fidèle à soi · Opposant : Créon, la loi, Ismène · Adjuvant : personne (solitude du héros)."},
  {n:"Les Labdacides",d:"Lignée maudite de Thèbes : Laïos, Œdipe, puis Étéocle, Polynice, Antigone, Ismène."}

 methode:'<div class="card"><h2>Production écrite — Méthode</h2><p>Au régional, la production écrite (10 pts) demande un <b>texte argumentatif</b> d\'une quinzaine de lignes sur un thème lié à l\'œuvre ou à la société.</p>'
 +'<div class="fig">'+I.D.planRedaction()+'</div>'
 +'<h3>Connecteurs indispensables</h3><table><tr><th>Pour…</th><th>Utilisez</th></tr><tr><td>Introduire</td><td>De nos jours, Il est fréquent de constater que, La question se pose de savoir si</td></tr><tr><td>Ajouter un argument</td><td>D\'abord, Ensuite, De plus, Par ailleurs, Enfin</td></tr><tr><td>Illustrer</td><td>Par exemple, Ainsi, Comme le montre Anouilh dans Antigone</td></tr><tr><td>Opposer / nuancer</td><td>Cependant, Toutefois, Néanmoins, Certes… mais</td></tr><tr><td>Cause / conséquence</td><td>Car, Parce que, En effet · Donc, C\'est pourquoi, Par conséquent</td></tr><tr><td>Conclure</td><td>En somme, Pour conclure, En définitive</td></tr></table>'
 +'<h3>Les thèmes qui tombent (et un plan pour chacun)</h3>'
 +'<div class="model"><b>Faut-il toujours obéir aux lois ?</b> — Thèse (Créon) : la loi garantit l\'ordre, sans elle c\'est le chaos. Antithèse (Antigone) : une loi injuste doit être refusée ; la conscience est au-dessus. Conclusion : obéir, mais garder le droit de dire non à l\'injustice par des moyens légitimes.</div>'
 +'<div class="model"><b>La révolte des jeunes contre les adultes</b> — Thèse : les jeunes ont raison de refuser les compromis et l\'hypocrisie (Antigone). Antithèse : l\'expérience des adultes évite des drames (Créon, Ismène). Conclusion : dialogue entre générations.</div>'
 +'<div class="model"><b>Qu\'est-ce que le bonheur ?</b> — Thèse : le bonheur modeste (famille, travail, petites joies) que défend Créon. Antithèse : Antigone refuse ce bonheur « tiède », elle veut l\'absolu. Conclusion : définir son propre bonheur sans mépriser celui des autres.</div>'
 +'<div class="model"><b>Le pouvoir et ses compromissions</b> — Thèse : gouverner oblige à des choix impurs (le « sale travail »). Antithèse : le pouvoir sans morale détruit (Créon perd tout). Conclusion : autorité et éthique doivent aller ensemble.</div>'
 +'<div class="model"><b>Peut-on mourir pour une idée ?</b> — Thèse : certains sacrifices donnent sens à l\'histoire (résistants, martyrs). Antithèse : la vie est la valeur suprême ; Antigone meurt sans même savoir pourquoi. Conclusion : vivre pour ses idées plutôt que mourir pour elles.</div>'
 +'<div class="model"><b>La place de la femme face à l\'autorité</b> — Antigone, jeune femme seule face au roi et aux gardes ; Ismène, la soumise. Plan : la force d\'Antigone / ses limites / la femme d\'aujourd\'hui.</div>'
 +'<h3>Les 5 erreurs qui coûtent des points</h3><ul><li>Oublier d\'<b>annoncer le plan</b> dans l\'introduction.</li><li>Donner des arguments <b>sans exemple</b> (prenez-en un dans la pièce et un dans la vie réelle).</li><li>Un seul long paragraphe : <b>un paragraphe par argument</b>, avec un connecteur en tête.</li><li>Raconter la pièce au lieu d\'<b>argumenter</b>.</li><li>Ne pas donner son <b>avis personnel</b> en conclusion.</li></ul>'
 +'<h3>Spécial théâtre : les questions de langue qui tombent</h3><table><tr><th>On vous demande</th><th>Répondez</th></tr><tr><td>Genre du texte</td><td>Texte théâtral (dialogue, répliques, didascalies, noms des personnages en tête de réplique)</td></tr><tr><td>Type de texte</td><td>Souvent argumentatif (débat Créon/Antigone) ou narratif (récit du Messager, du Prologue)</td></tr><tr><td>Qui parle à qui ?</td><td>Nommer les deux personnages + rappeler la double énonciation (au public aussi)</td></tr><tr><td>Tonalité / registre</td><td>Tragique, pathétique, polémique, comique selon l\'extrait ; justifier par le lexique</td></tr><tr><td>Rôle des didascalies</td><td>Indiquer le ton, les gestes, les déplacements ; révéler les sentiments</td></tr></table>'
 +'</div>'

<div class="fig">${ARD.prog}<div class="caption">اثنا عشر درسا في النصوص، موزعة على أربع مجزوءات. النص المقترح في الامتحان ينتمي إلى إحداها، لكن الأسئلة تقيس المنهجية لا الحفظ.</div></div>
<table><tr><th>المكون</th><th>الدروس المقررة</th></tr>
<tr><td>النصوص</td><td>الخطاب الإشهاري · الخطاب الصحفي · الخطاب السياسي · الإنسان والتنمية · الإنسان والتكنولوجيا · الإنسان ومشاكل الهجرة · مفهوم الحداثة · مفهوم التواصل · مفهوم الإبداع · التضامن · التسامح · الجمال</td></tr>
<tr><td>علوم اللغة</td><td>التمييز · العدد · الاستفهام · الأمر والنهي · التمني والنداء · المصادر · النسبة · الممنوع من الصرف · الاستعارة · الطباق والمقابلة · الإيجاز والإطناب</td></tr>
<tr><td>التعبير والإنشاء</td><td>تحليل صورة · توسيع فكرة · الربط بين الأفكار · المقارنة والاستنتاج</td></tr></table></div>

<div class="card"><h2>كيف أوزع وقتي ؟</h2>
<div class="fig">${ARD.temps}</div>
<p>الخطأ الأكثر شيوعا هو الإطالة في أسئلة الفهم وترك الإنشاء (6 نقط !) للدقائق الأخيرة. ابدأ بقراءة النص مرتين : الأولى للفهم العام، والثانية بالقلم في اليد لتسطير <b>الكلمات المفاتيح، الروابط، والحجج</b>. ثم أجب عن الأسئلة بالترتيب، وخصص للإنشاء أربعين دقيقة كاملة.</p></div>

<div class="card"><h2>الأسئلة السبعة المتكررة في مكون النصوص</h2>
<p class="tip">هذه هي الأسئلة التي تتكرر، بصيغ متقاربة، في جميع الأكاديميات. تعلّم الطريقة مرة واحدة، تُجِب عنها مهما كان النص.</p>
<table><tr><th>السؤال</th><th>كيف أجيب ؟</th></tr>
<tr><td>1 · علاقة العنوان (أو الفقرة الأولى) بموضوع النص (1 ن)</td><td>أحدد نوع العنوان (اسمي/فعلي، خبري/إنشائي)، ثم أبين أنه يُعلن القضية أو يُلخصها أو يحدد موقف الكاتب، مع الاستشهاد بعبارة من النص.</td></tr>
<tr><td>2 · القضية المركزية (1 ن)</td><td>جملة اسمية واحدة دقيقة تبدأ بـ«يطرح النص قضية…» أو «يعالج الكاتب…»، دون سرد التفاصيل.</td></tr>
<tr><td>3 · شرح قول الكاتب (1 ن)</td><td>أعيد صياغة القول بأسلوبي، أشرح مفاهيمه المفاتيح، وأربطه بسياقه في النص. لا أكرر العبارة نفسها.</td></tr>
<tr><td>4 · الحقول الدلالية (2 ن)</td><td>أستخرج العدد المطلوب من <b>العبارات الحرفية</b> من النص لكل حقل، في جدول، ثم أبين العلاقة بين الحقلين (تكامل، تضاد، سببية…).</td></tr>
<tr><td>5 · استخلاص عناصر/أسباب/مظاهر (1 ن)</td><td>أعدّ العناصر المطلوبة بالضبط (أربعة إن طُلبت أربعة)، بصياغة مختصرة، كل عنصر في سطر.</td></tr>
<tr><td>6 · الأطروحة والحجة (1 ن)</td><td>أميز بين أطروحة الكاتب (رأيه) والأطروحة المدحوضة (رأي الخصم)، وأسمي نوع الحجة : واقعية، منطقية، تاريخية، مقارنة، شاهد، أرقام…</td></tr>
<tr><td>7 · تركيب فقرة تلخيصية + إبداء الرأي (3 ن)</td><td>فقرة واحدة متماسكة : القضية ← الأفكار الأساسية بروابط («يرى الكاتب أن… ثم… ليخلص إلى…») ← رأيي الشخصي معللا بحجة واحدة على الأقل. دون نقل جمل النص حرفيا.</td></tr></table></div>

<div class="card"><h2>أخطاء تُضيّع النقط</h2>
<div class="keypoints">✗ نقل جمل من النص بدل التلخيص بالأسلوب الشخصي.<br>✗ الإجابة عن سؤال الحقول الدلالية بكلمات من عندك لا من النص.<br>✗ إهمال الشكل في علوم اللغة حين يُطلب «الشكل التام».<br>✗ خلط الأطروحة بالقضية : القضية هي الموضوع، والأطروحة هي الموقف منه.<br>✗ إنشاء بلا مقدمة أو بلا خاتمة، أو يتجاوز عشرين سطرا.<br>✗ ترك سؤال فارغا : الجواب الجزئي يُنقَّط، والفراغ لا.</div></div>`,
 persos:[], schema:'',
 notions:[
  {n:'الخطاب',d:'كل إنتاج لغوي موجه من مرسل إلى متلقٍّ في سياق معين وبقصد معين (إخبار، إقناع، تأثير). يتنوع بحسب مجاله : إشهاري، صحفي، سياسي، علمي…'},
  {n:'الخطاب الإشهاري',d:'خطاب إقناعي يروّج لسلعة أو خدمة أو فكرة، يجمع بين رسالة لغوية (شعار، نص) ورسالة أيقونية (صورة، ألوان)، ويعتمد الاستمالة العاطفية والتكرار والمبالغة.'},
  {n:'الخطاب الصحفي',d:'خطاب إخباري وتفسيري يُنتج في الصحافة (خبر، تقرير، مقال، تحقيق)، يتميز بالوضوح والآنية والموضوعية النسبية، وقد يتضمن رأيا في المقال الافتتاحي.'},
  {n:'الخطاب السياسي',d:'خطاب يصدر عن فاعل سياسي (حزب، زعيم، دولة) للتعبئة والإقناع ببرنامج أو موقف، يكثر فيه ضمير الجماعة، والشعارات، والحجاج العاطفي والقيمي.'},
  {n:'القضية المركزية',d:'الموضوع العام الذي يدور حوله النص كله ؛ تُصاغ في جملة واحدة دقيقة، وتختلف عن الأطروحة التي هي موقف الكاتب من هذه القضية.'},
  {n:'الأطروحة',d:'الرأي أو الموقف الذي يدافع عنه الكاتب ويسعى إلى إقناع القارئ به بواسطة الحجج.'},
  {n:'الأطروحة النقيضة (المدحوضة)',d:'الرأي المخالف الذي يعرضه الكاتب ليردّه ويفنّده ؛ يُستدل عليه بعبارات مثل «يزعم البعض…»، «قد يُقال…»، «خلافا لمن يرى…».'},
  {n:'الحجاج',d:'مجموع الوسائل التي يستعملها الكاتب لإقناع المتلقي بأطروحته : حجج، أمثلة، شواهد، مقارنات، أساليب منطقية ولغوية.'},
  {n:'أنواع الحجج',d:'حجة واقعية (معطيات ووقائع)، منطقية/عقلية (سبب ونتيجة، قياس)، تاريخية، إحصائية (أرقام)، حجة السلطة (الاستشهاد بعالم أو نص)، حجة المقارنة، حجة المثال.'},
  {n:'الحقل الدلالي (المعجمي)',d:'مجموعة الكلمات والعبارات في النص التي تنتمي إلى مجال معنوي واحد (حقل التكنولوجيا، حقل القيم…). يُطلب استخراجها حرفيا من النص ثم بيان العلاقة بين الحقول.'},
  {n:'البنية الحجاجية',d:'تنظيم النص الحجاجي : طرح القضية/الأطروحة ← عرض الحجج وتوسيعها ← الاستنتاج. وقد تبدأ بعرض الأطروحة النقيضة ثم دحضها.'},
  {n:'الروابط الحجاجية',d:'أدوات تنظم تسلسل الأفكار : التعليل (لأن، إذ)، الاستنتاج (إذن، وبالتالي، ومن ثم)، الاستدراك (لكن، غير أن، بيد أن)، الإضافة (كما، فضلا عن)، التمثيل (مثلا، كـ).'},
  {n:'أساليب التفسير',d:'التعريف، التصنيف، المقارنة، التمثيل، الوصف، السرد القصير، إيراد الأرقام ؛ يلجأ إليها الكاتب لتوضيح فكرته قبل البرهنة عليها.'},
  {n:'الوظيفة الإقناعية (التأثيرية)',d:'وظيفة الخطاب حين يستهدف تغيير رأي المتلقي أو سلوكه ؛ تظهر في الأمر والنهي والنداء والمبالغة ومخاطبة العاطفة.'},
  {n:'الوظيفة الإخبارية (المرجعية)',d:'وظيفة الخطاب حين ينقل معلومات عن الواقع بموضوعية ؛ تظهر في الجمل الخبرية والأرقام والأسماء والتواريخ.'},
  {n:'الشعار الإشهاري',d:'جملة قصيرة مركزة سهلة الحفظ تختزل الرسالة الإشهارية، تعتمد الإيقاع والجناس والتكرار والمبالغة.'},
  {n:'الرسالة الأيقونية',d:'المكوّن البصري في الخطاب الإشهاري (صورة، ألوان، أشكال، تنظيم الفضاء) ؛ يُقرأ ويُؤوّل كما يُقرأ النص اللغوي.'},
  {n:'التنمية',d:'عملية تحوّل شامل يهدف إلى تحسين شروط عيش الإنسان : اقتصاديا واجتماعيا وثقافيا. والتنمية البشرية تجعل الإنسان غايتها ووسيلتها (التعليم، الصحة، الحرية).'},
  {n:'مجتمع المعرفة',d:'مجتمع يقوم اقتصاده وتقدمه على إنتاج المعرفة ونشرها وتوظيفها، لا على الموارد الطبيعية وحدها.'},
  {n:'التكنولوجيا',d:'التطبيق العملي للمعرفة العلمية في إنتاج الأدوات والتقنيات ؛ يطرح النص علاقتها بالثقافة والهوية : أداة تقدم أم وسيلة تبعية ؟'},
  {n:'الهجرة',d:'انتقال الأفراد أو الجماعات من بلد إلى آخر لأسباب اقتصادية أو سياسية أو اجتماعية ؛ تطرح مشاكل الاندماج والهوية و«هجرة الأدمغة».'},
  {n:'الحداثة',d:'نمط في التفكير والعيش يقوم على العقل والحرية والنقد والتجديد ؛ تمييزا لها عن التحديث (نقل المظاهر المادية) والمعاصرة (العيش في الزمن الحاضر).'},
  {n:'التواصل',d:'عملية تبادل الرسائل بين مرسل ومتلقٍّ عبر قناة وبشفرة مشتركة في سياق معين ؛ أركانه الستة : المرسل، المتلقي، الرسالة، القناة، الشفرة (اللغة)، المرجع (السياق).'},
  {n:'الإبداع',d:'القدرة على إنتاج الجديد والأصيل في الفكر أو الفن أو العلم ؛ شروطه : الحرية، الخيال، المعرفة، النقد، والمجتمع المشجع.'},
  {n:'التضامن',d:'قيمة إنسانية تعني التآزر والتعاون بين أفراد المجتمع وشعوره بالمسؤولية المشتركة ؛ في الشعر : دعوة إلى التكافل ونبذ الأنانية.'},
  {n:'التسامح',d:'قبول الآخر المختلف في دينه أو رأيه أو ثقافته والعفو عند المقدرة ؛ عكسه التعصب.'},
  {n:'الشعر العمودي وشعر التفعيلة',d:'الشعر العمودي يلتزم بالبيت ذي الشطرين والقافية الموحدة ؛ شعر التفعيلة يعتمد السطر الشعري وتكرار التفعيلة بحرية في العدد والقافية.'},
  {n:'التمييز',d:'اسم نكرة منصوب يُذكر لإزالة إبهام ما قبله : تمييز ذات (مفرد : بعد العدد والمقادير) وتمييز نسبة (جملة : محوّل عن فاعل أو مفعول أو مبتدأ، أو غير محوّل).'},
  {n:'المصدر',d:'اسم يدل على الحدث مجردا من الزمن ؛ مصادر الثلاثي سماعية، ومصادر غير الثلاثي قياسية (أفعل ← إفعال، فعّل ← تفعيل، استفعل ← استفعال…). ومنه المصدر الميمي ومصدر المرة والهيئة والمصدر الصناعي.'},
  {n:'النسبة',d:'إلحاق ياء مشددة بآخر الاسم للدلالة على الانتساب (مغرب ← مغربيّ)، مع تغييرات في المقصور والمنقوص والممدود والمختوم بتاء التأنيث.'},
  {n:'الاستعارة',d:'تشبيه حُذف أحد طرفيه : مكنية (حُذف المشبه به وأُبقي على لازمة من لوازمه) وتصريحية (صُرّح بالمشبه به وحُذف المشبه). أركانها : المستعار له، المستعار منه، الجامع، القرينة.'},
  {n:'الطباق والمقابلة',d:'الطباق : الجمع بين الشيء وضده في الكلام (إيجاب : ليل/نهار ؛ سلب : يعلم/لا يعلم). المقابلة : الإتيان بمعنيين أو أكثر ثم بما يقابلها على الترتيب.'},
  {n:'الإيجاز والإطناب',d:'الإيجاز : أداء المعنى بأقل من العبارة المعتادة (إيجاز قصر أو حذف). الإطناب : زيادة اللفظ على المعنى لفائدة (الإيضاح بعد الإبهام، التكرار، الاعتراض، التذييل).'},
  {n:'الممنوع من الصرف',d:'اسم لا يُنوَّن ويُجرّ بالفتحة : لعلة واحدة (صيغة منتهى الجموع، ألف التأنيث) أو لعلتين (علمية أو وصفية مع عجمة أو تأنيث أو زيادة ألف ونون أو وزن الفعل أو العدل أو التركيب المزجي).'},
  {n:'مهارة توسيع فكرة',d:'الانطلاق من فكرة مركزة لشرحها وتحليلها ودعمها بالحجج والأمثلة ومناقشتها، في موضوع متكامل : مقدمة تقدّم الفكرة، عرض يشرح ويحلل ويبرهن، خاتمة تركّب وتبدي الموقف.'},
  {n:'مهارة المقارنة والاستنتاج',d:'وضع موضوعين (نصين، ظاهرتين، موقفين) جنبا إلى جنب لرصد أوجه التشابه والاختلاف وفق معايير محددة، ثم استخلاص نتيجة تفسّر هذه العلاقة.'},
  {n:'مهارة الربط بين الأفكار',d:'بناء نص متماسك باستعمال الروابط المنطقية واللغوية (الإضافة، التعليل، الاستنتاج، الاستدراك) لتنظيم الانتقال بين الأفكار والفقرات.'},
  {n:'مهارة تحليل صورة',d:'قراءة صورة (ملصق، صورة صحفية، إشهار) : الوصف (المكونات، الألوان، الفضاء) ← التحليل (الدلالات، العلاقات، الرسالة) ← التأويل وإبداء الرأي.'}

<div class="card"><h2>مكون التعبير والإنشاء · المهارات الأربع</h2>
<p class="tip">6 نقط من 20، تُمنح 4 منها للتقيد بخطوات المهارة. المصحح يبحث عن <b>البنية</b> قبل الأفكار : مقدمة واضحة، عرض منظم بروابط، خاتمة تركّب وتبدي الرأي.</p>
<table><tr><th>المهارة</th><th>ما يُطلب</th><th>خطواتها</th></tr>
<tr><td><b>توسيع فكرة</b> (الأكثر تكرارا)</td><td>فكرة من النص أو من خارجه تُوسَّع في عشرين سطرا</td><td>فهم الفكرة وتحديد مفاهيمها ← مقدمة تمهّد وتعيد صياغتها ← شرح، تحليل، حجج وأمثلة، مناقشة ← خاتمة تركّب وتبدي الموقف</td></tr>
<tr><td><b>الربط بين الأفكار</b></td><td>أفكار متفرقة تُنظَّم في نص متماسك</td><td>ترتيب الأفكار منطقيا ← اختيار الروابط المناسبة (إضافة، تعليل، استنتاج، استدراك) ← صياغة نص واحد بفقرات متدرجة</td></tr>
<tr><td><b>المقارنة والاستنتاج</b></td><td>نصان أو ظاهرتان أو موقفان</td><td>تحديد معايير المقارنة ← جدول أوجه التشابه والاختلاف ← تفسير أسباب الاختلاف ← استنتاج عام</td></tr>
<tr><td><b>تحليل صورة</b></td><td>ملصق إشهاري أو صورة صحفية</td><td>التعريف (النوع، المصدر، الموضوع) ← الوصف (المكونات، الألوان، الفضاء، النص المصاحب) ← التحليل (الدلالات، العلاقة صورة/نص) ← التأويل والرأي</td></tr></table>

<div class="card"><h2>كيف يُختار موضوع الإنشاء في الامتحان الجهوي ؟</h2>
<p>يسير واضعو الامتحان على منطق ثابت تحدده التوجيهات التربوية والإطار المرجعي :</p>
<div class="keypoints">1 · <b>الموضوع مرتبط بالنص</b> : ينطلق غالبا من قول وارد فيه («ورد في النص قول الكاتب… وسّع هذه الفكرة») أو من قضيته.<br>2 · <b>مجاله هو مجال المجزوءة</b> التي ينتمي إليها النص : أنواع الخطاب، قضايا معاصرة (التنمية، التكنولوجيا، الهجرة)، المفاهيم (الحداثة، التواصل، الإبداع)، القيم (التضامن، التسامح، الجمال).<br>3 · <b>يُطلب بإحدى المهارات الأربع</b> صراحة («مسترشدا بمهارة توسيع فكرة»)، وتوسيع الفكرة هي الأكثر ورودا، تليها المقارنة والاستنتاج.<br>4 · <b>عشرون سطرا على الأكثر</b>، والتنقيط : خطوات المهارة 4 ن · سلامة اللغة والترقيم 1 ن · التنظيم والخط وعدد الأسطر 1 ن.<br>5 · <b>يُكافَأ توظيف معارف الدروس</b> : مفاهيم المجال (التنمية البشرية، التوطين، الحداثة/التحديث…) وأسماء الكتاب المرجعيين.</div>
<p class="tip">لهذا نقترح أسفله مواضيع نموذجية تغطي المهارات الأربع والمجالات الأربعة، كل منها مُعلَّق عليه خطوة خطوة، مع إبراز هيكله وروابطه.</p></div>

  {t:'تطبيق على نمط الامتحان',s:'حوّل الجملتين إلى جملتين تتضمنان تمييزا، مع الشكل التام وتحديد نوعه : (أ) «كَثُرَ شجرُ الحديقةِ» (ب) «اتّسعت دائرةُ اهتماماتِ الشبابِ».',open:true,m:'(أ) كَثُرَتِ الحديقةُ شجرًا : «شجرًا» تمييز نسبة محوّل عن فاعل، منصوب بالفتحة.<br>(ب) اتّسعَ الشبابُ اهتماماتٍ / اتّسعتْ دائرةُ الشبابِ اهتماماتٍ : «اهتماماتٍ» تمييز نسبة محوّل عن مضاف إليه في الأصل (ويُقبل اعتباره محوّلا عن فاعل في الصياغة الأولى)، منصوب وعلامة نصبه الكسرة لأنه جمع مؤنث سالم.'},

addChap('ar',{
 titre:"الخطاب الإشهاري", sous:"المجزوءة 1 · أنواع الخطاب · النص المرجعي : «آليات الخطاب الإشهاري» لحميد لحمداني",
 tip:'الإشهار هو أكثر الخطابات حضورا في حياتنا اليومية، وأكثرها خفاءً في آلياته. الامتحان لا يسألك عن النص المدروس في القسم، بل يقترح نصا جديدا من المجال نفسه : المطلوب إذن هو امتلاك <b>مفاهيم المجال</b> و<b>طريقة التحليل</b>.',
 episodes:[
  {t:'مدخل مفاهيمي : ما الإشهار ؟',svg:schemaCom,cap:'مخطط التواصل الإشهاري : مرسل، رسالة مزدوجة، قناة، متلقٍّ، وهدف واحد هو دفع المستهلك إلى الفعل.',
   p:'الإشهار (الإعلان) خطاب تواصلي <b>إقناعي</b> تنتجه مؤسسة أو شركة للترويج لسلعة أو خدمة أو فكرة، عبر وسائل الإعلام والفضاءات العمومية. يتميز عن الخطابات الأخرى بأنه <b>رسالة مزدوجة</b> : رسالة لغوية (الشعار، النص المصاحب، اسم المنتوج) ورسالة أيقونية (الصورة، الألوان، الأشكال، تنظيم الفضاء). وهو خطاب <b>مؤدّى عنه</b> : المرسل يدفع ثمن المساحة أو الزمن، ولذلك يحرص على أقصى تأثير في أقصر وقت. تاريخيا ارتبط الإشهار بالثورة الصناعية وبمجتمع الاستهلاك، حين صار الإنتاج يفوق الحاجة فاحتاج إلى من «يصنع» الحاجة.',
   k:'<b>تعريف يُحفظ :</b> الإشهار خطاب إقناعي، مؤدّى عنه، يجمع بين اللغوي والأيقوني، هدفه التأثير في سلوك المتلقي.<br><b>أنواعه :</b> تجاري (سلعة)، مؤسساتي (صورة شركة)، اجتماعي/توعوي (حملة ضد التدخين)، سياسي (حملة انتخابية).<br><b>وظائفه :</b> إخبارية (التعريف بالمنتوج)، إقناعية/تأثيرية (الغالبة)، جمالية (الإمتاع بالصورة والإيقاع).'},
  {t:'آليات الإقناع والتأثير',svg:schemaMec,cap:'ثماني آليات تتكرر في كل إشهار تقريبا ؛ تعرّف عليها في أي نص أو صورة تُقترح عليك.',
   p:'يشتغل الإشهار على <b>النفس</b> قبل العقل. يعتمد <b>الشعار</b> : جملة قصيرة ذات إيقاع (جناس، سجع، تكرار) تلتصق بالذاكرة. ويعتمد <b>التكرار</b> لترسيخ اسم المنتوج، و<b>المبالغة</b> بصيغ التفضيل («الأفضل»، «الأول»، «الوحيد»)، و<b>الاستمالة العاطفية</b> حين يربط السلعة بالسعادة والنجاح والجمال والانتماء، و<b>الإيحاء</b> حين يجعل الصورة تقول ما لا يجرؤ النص على قوله. كما يستعمل <b>حجة السلطة</b> (طبيب، نجم، خبير يوصي) و<b>الأرقام</b> («9 من 10 أمهات») و<b>المقارنة</b> مع منتوج منافس مجهول. أما لغويا فتكثر فيه الجمل الاسمية القصيرة، وأفعال الأمر الموجهة إلى المتلقي («جرّب»، «اكتشف»)، وضمير المخاطب، والأسئلة البلاغية.',
   k:'<b>المؤشرات اللغوية للإشهار :</b> الأمر · ضمير المخاطب · صيغ التفضيل · الجمل القصيرة · النداء والاستفهام · المعجم الإيجابي (جديد، مجاني، طبيعي، حصري).<br><b>الآلية النفسية :</b> خلق الحاجة ← ربطها بقيمة (سعادة، تميز) ← تقديم السلعة حلا ← دعوة إلى الفعل.'},
  {t:'النص المرجعي : «آليات الخطاب الإشهاري» لحميد لحمداني',
   p:'حميد لحمداني ناقد وأكاديمي مغربي معاصر، اشتغل على تحليل الخطاب والنقد الأدبي. في نصه يقارب الإشهار مقاربة <b>تحليلية نقدية</b> : يبين أن الخطاب الإشهاري لا يكتفي بالإخبار عن السلعة بل يعمل على <b>التأثير النفسي</b> في المتلقي، مستثمرا رغباته وأحلامه ومخاوفه. ويميز بين مستويين في الرسالة الإشهارية : <b>المستوى اللغوي</b> (ما يُقال) و<b>المستوى الأيقوني</b> (ما يُعرض)، ويرى أن الثاني هو الأقوى تأثيرا لأنه يتسلل إلى اللاوعي ولا يترك للمتلقي فرصة النقاش. ويخلص إلى أن الإشهار صار آلية من آليات <b>مجتمع الاستهلاك</b> : لا يلبي حاجات قائمة بل يخلق حاجات جديدة باستمرار، ويحوّل المواطن إلى مستهلك.',
   k:'<b>القضية المركزية :</b> الآليات التي يعتمدها الخطاب الإشهاري للتأثير في المتلقي ودفعه إلى الاستهلاك.<br><b>أطروحة الكاتب :</b> الإشهار خطاب إيهامي يشتغل على اللاوعي ويصنع الحاجة بدل أن يلبيها.<br><b>الخصائص الأسلوبية للنص :</b> التعريف، التصنيف (لغوي/أيقوني)، التفسير بالأمثلة، لغة تقريرية بضمير الغائب، معجم نقدي (الإيهام، التأثير، الاستهلاك، اللاوعي).'},
  {t:'منهجية تحليل نص عن الخطاب الإشهاري',
   p:'أمام نص جديد من هذا المجال، اتبع الخطوات نفسها دائما. <b>أولا</b> الملاحظة : العنوان (مركب اسمي غالبا يعلن الموضوع)، المصدر (كتاب نقدي، مجلة)، بداية النص ونهايته. <b>ثانيا</b> الفهم : القضية المركزية في جملة، الأفكار الأساسية لكل فقرة. <b>ثالثا</b> التحليل : الحقول الدلالية (حقل الإشهار : الصورة، الشعار، المستهلك ؛ حقل التأثير : الإقناع، الإغراء، الرغبة)، الأطروحة والحجج، أساليب التفسير والحجاج، الروابط. <b>رابعا</b> التركيب : تلخيص بالأسلوب الشخصي ثم موقف شخصي معلل : هل الإشهار خدمة للمستهلك أم تلاعب به ؟',
   k:'<b>حقول دلالية متوقعة :</b> حقل الإشهار/التسويق – حقل التأثير النفسي – حقل الاستهلاك/الاقتصاد – حقل الصورة/الوسائط.<br><b>قالب للرأي الشخصي :</b> «أتفق مع الكاتب في… لأن…، غير أنني أرى أن… فالإشهار قد يكون مفيدا حين…».'},
  {t:'نموذج الإجابة : نص تطبيقي على نمط الامتحان',
   p:'<b>النص :</b> «لم يعد الإشهار مجرد وسيلة للتعريف بالسلع، بل أصبح صانعا للرغبات. فهو لا يخاطب عقل المستهلك بقدر ما يخاطب أحلامه ؛ يعده بالجمال إن اشترى صابونا، وبالحرية إن اقتنى سيارة، وبالسعادة إن غيّر هاتفه. ولتحقيق ذلك يستعين بالصورة المبهرة، والشعار الموجز، والوجوه المشهورة، والتكرار الذي لا يملّ. ويزعم البعض أن المستهلك حرّ في اختياره، وأن الإشهار مجرد معلومة إضافية ؛ لكن الواقع يكذّب هذا الزعم : فالدراسات تُظهر أن أغلب قرارات الشراء تُتخذ تحت تأثير انفعالي لا عقلي. إن الإشهار، في نهاية المطاف، مرآة لمجتمع يقيس قيمة الإنسان بما يملك لا بما يكون.»<br><br><b>1 · علاقة الجملة الأولى بالنص (1 ن) :</b> تُعلن الجملة الأولى أطروحة النص كلها (الإشهار صانع للرغبات)، وما تلاها شرح لها وبرهنة عليها.<br><b>2 · القضية المركزية (1 ن) :</b> تحوّل الإشهار من وسيلة إخبار إلى آلية لصناعة الرغبات والتأثير في سلوك المستهلك.<br><b>3 · شرح «لا يخاطب عقل المستهلك بقدر ما يخاطب أحلامه» (1 ن) :</b> الإشهار لا يقدّم حججا منطقية عن جودة السلعة، بل يربطها بما يتمناه الإنسان (الجمال، الحرية، السعادة) ليدفعه إلى الشراء بدافع عاطفي.<br><b>4 · الحقول الدلالية (2 ن) :</b> حقل الإشهار : «الصورة المبهرة»، «الشعار الموجز»، «التكرار» · حقل الرغبة/العاطفة : «أحلامه»، «يعده بالجمال»، «تأثير انفعالي». العلاقة : سببية، فأدوات الإشهار هي وسيلة لإثارة العاطفة.<br><b>5 · أربع آليات يعتمدها الإشهار (1 ن) :</b> الصورة المبهرة – الشعار الموجز – الوجوه المشهورة (حجة السلطة) – التكرار.<br><b>6 · الأطروحة المدحوضة وحجة دحضها (1 ن) :</b> الأطروحة المدحوضة : «المستهلك حرّ في اختياره والإشهار مجرد معلومة». الحجة : حجة واقعية/علمية (الدراسات تُظهر أن القرارات تُتخذ تحت تأثير انفعالي).<br><b>7 · تركيب وإبداء الرأي (3 ن) :</b> يرى الكاتب أن الإشهار تجاوز وظيفته الإخبارية ليصبح صانعا للرغبات، إذ يخاطب أحلام المستهلك بوسائل مؤثرة كالصورة والشعار والتكرار، ويردّ على من يعتبره مجرد معلومة بأن الدراسات تثبت الطابع الانفعالي لقرارات الشراء، ليخلص إلى أنه مرآة لمجتمع استهلاكي. وأشاطر الكاتب رأيه إلى حد بعيد، لأن تجربتنا اليومية تؤكد أننا نشتري أحيانا ما لا نحتاج إليه بتأثير الإعلانات ؛ غير أن الإشهار يظل ضروريا للتعريف بالمنتوجات، وبالتالي فالمطلوب ليس إلغاؤه بل تربية المستهلك على القراءة النقدية له.',
   k:'لاحظ في الجواب السابع : <b>روابط</b> (إذ، ليخلص، غير أن، وبالتالي) + <b>أفعال التلخيص</b> (يرى، يردّ، يخلص) + <b>رأي معلل</b> في جملتين. هذا القالب صالح لكل نص حجاجي.'}
 ],
 analyse:[['القضية','تحوّل الإشهار إلى آلية للتأثير والاستهلاك'],['الأطروحة','الإشهار يصنع الحاجة ويشتغل على اللاوعي'],['الحجج','واقعية (أمثلة من اليومي)، علمية (دراسات)، مقارنة (قديما/حديثا)'],['الأساليب','التعريف، التصنيف، التمثيل، النفي والاستدراك («لم يعد… بل»)'],['الحقول','الإشهار – التأثير النفسي – الاستهلاك'],['الرأي','قراءة نقدية للإشهار دون إلغائه']],
 analyseTitre:'خلاصة أدوات التحليل', analyseCols:['الأداة','في نص عن الإشهار'],
 citations:'<b>الإشهار</b> = خطاب إقناعي مؤدّى عنه، رسالة لغوية + أيقونية، هدفه دفع المتلقي إلى الفعل.<br><b>آلياته :</b> الشعار، التكرار، المبالغة، الصورة، الاستمالة العاطفية، الإيحاء، حجة السلطة، الأرقام.<br><b>مؤشراته اللغوية :</b> الأمر، ضمير المخاطب، صيغ التفضيل، الجمل القصيرة، المعجم الإيجابي.<br><b>أطروحة لحمداني :</b> الإشهار يصنع الحاجة ولا يلبيها، ويحوّل المواطن إلى مستهلك.',
 quiz:[
  {t:'مفهوم',s:'ما الذي يميز الخطاب الإشهاري عن غيره من الخطابات ؟',o:['أنه يعتمد اللغة وحدها','أنه رسالة مزدوجة لغوية وأيقونية مؤدّى عنها هدفها التأثير','أنه خطاب إخباري محايد','أنه موجه إلى المختصين فقط'],a:1,e:'الإشهار يجمع بين النص والصورة، يدفع المعلن ثمنه، وغايته الأولى الإقناع والتأثير لا الإخبار المحايد.'},
  {t:'وظيفة',s:'الوظيفة الغالبة في الخطاب الإشهاري هي :',o:['الوظيفة الإخبارية','الوظيفة الشعرية','الوظيفة الإقناعية التأثيرية','الوظيفة الانتباهية'],a:2,e:'كل مكونات الإشهار (شعار، صورة، تكرار) تخدم هدفا واحدا : التأثير في المتلقي ودفعه إلى الشراء.'},
  {t:'آلية',s:'«9 من كل 10 أطباء ينصحون به» : أي آليتين تجتمعان في هذا الشعار ؟',o:['المبالغة والإيحاء','التكرار والنداء','الأرقام وحجة السلطة','الاستفهام والتشبيه'],a:2,e:'الرقم يوهم بالدقة العلمية، والطبيب سلطة معرفية يُستشهد بها لإقناع المتلقي.'},
  {t:'مؤشر لغوي',s:'أي صيغة من الصيغ التالية هي الأكثر حضورا في الإشهار ؟',o:['الفعل الماضي بضمير الغائب','فعل الأمر الموجه إلى المخاطب','الجمل الطويلة المركبة','الأسلوب العلمي الدقيق'],a:1,e:'«اكتشف»، «جرّب»، «لا تفوّت» : الأمر يدعو المتلقي مباشرة إلى الفعل، وهو جوهر الوظيفة التأثيرية.'},
  {t:'النص المرجعي',s:'ما أطروحة حميد لحمداني في نصه «آليات الخطاب الإشهاري» ؟',o:['الإشهار خدمة إعلامية ضرورية للمستهلك','الإشهار فن جميل ينبغي تشجيعه','الإشهار خطاب إيهامي يصنع الحاجة ويشتغل على اللاوعي','الإشهار ظاهرة عابرة ستختفي'],a:2,e:'الكاتب يقارب الإشهار مقاربة نقدية : آلية من آليات مجتمع الاستهلاك تخلق حاجات جديدة بدل تلبية الحاجات القائمة.'},
  {t:'منهجية',s:'في سؤال الحقول الدلالية، ما الجواب الصحيح منهجيا ؟',o:['كلمات من عندي تنتمي إلى الحقل','عبارات منقولة حرفيا من النص مع بيان العلاقة بين الحقلين','تعريف الحقل الدلالي فقط','تلخيص الفقرة المعنية'],a:1,e:'الحقل الدلالي يُستخرج من النص نفسه، في جدول غالبا، ثم تُحدد العلاقة بين الحقلين (سببية، تضاد، تكامل).'},
  {t:'تمييز',s:'ما الفرق بين القضية المركزية والأطروحة ؟',o:['لا فرق بينهما','القضية هي الموضوع المطروح، والأطروحة هي موقف الكاتب منه','الأطروحة هي العنوان والقضية هي الخاتمة','القضية رأي الخصم والأطروحة رأي الكاتب'],a:1,e:'مثال : القضية = تأثير الإشهار في المستهلك ؛ الأطروحة = الإشهار يتلاعب بالمستهلك ويصنع حاجاته.'},
  {t:'نوع الإشهار',s:'حملة تلفزية تدعو إلى ربط حزام السلامة هي إشهار :',o:['تجاري','اجتماعي توعوي','مؤسساتي','سياسي'],a:1,e:'لا يروّج لسلعة بل لسلوك مفيد للمجتمع ؛ يستعمل آليات الإشهار نفسها (شعار، صورة مؤثرة) لغاية توعوية.'},
  {t:'تحرير',s:'اشرح بأسلوبك قول الكاتب : «الإشهار مرآة لمجتمع يقيس قيمة الإنسان بما يملك لا بما يكون». (3 أسطر)',open:true,m:'يرى الكاتب أن الإشهار يعكس طبيعة المجتمع الاستهلاكي الذي لا يحكم على الأفراد بأخلاقهم أو معارفهم أو عملهم، بل بما يقتنونه من سلع ومظاهر. فحين يَعِد الإشهار بالتميز لمن يشتري سيارة أو هاتفا، فإنه يرسّخ فكرة أن الملكية هي معيار القيمة، وهو ما يختزل الإنسان في بعده المادي ويُهمل بعده الإنساني.'},
  {t:'تركيب',s:'في خمسة أسطر، لخّص أطروحة النص التطبيقي ثم أبدِ رأيك فيها معللا.',open:true,m:'يدافع الكاتب عن فكرة أن الإشهار لم يعد وسيلة إخبار بل آلية لصناعة الرغبات، إذ يخاطب أحلام المستهلك بالصورة والشعار والتكرار، ويفنّد زعم حرية المستهلك بحجة علمية، ليخلص إلى أن الإشهار صورة لمجتمع مادي. وأرى أن هذا الحكم صحيح في جوهره، لأن كثيرا من مشترياتنا لا تلبي حاجة حقيقية ؛ غير أن الحل ليس في محاربة الإشهار، وإنما في تكوين مستهلك واعٍ قادر على التمييز بين الحاجة والرغبة.'}
 ]
});

/* === ar/94-redactions-demo.js === */
/* مواضيع إنشائية نموذجية (مجانية في النسخة التجريبية) : موضوع واحد لكل مهارة، مُعلَّق عليه خطوة خطوة */
addRedac('ar',[
 {t:'توسيع فكرة · «التواصل الحقيقي لا تصنعه الوسائل بل يصنعه الإنصات» (مجال التواصل)',
  sujet:'ورد في نص عن مفهوم التواصل قول الكاتب : «التواصل الحقيقي لا تصنعه الوسائل بل يصنعه الإنصات». وسّع هذه الفكرة في موضوع متكامل لا يتجاوز عشرين سطرا، مسترشدا بخطوات مهارة توسيع فكرة : فهم الفكرة وتحديد مفاهيمها، التمهيد لها وإعادة صياغتها، شرحها وتحليلها وتدعيمها بالحجج والأمثلة ومناقشتها، ثم الخلاصة والموقف.',
  paras:[
   {type:'i',lab:'الخطوة 1 · المقدمة : تمهيد عام ← تقديم الفكرة ← إعادة صياغتها',txt:'من المعلوم أن عصرنا هو عصر الاتصال بامتياز : شبكات وهواتف وتطبيقات تربط الإنسان بالعالم في لحظة. ومع ذلك يشكو كثيرون من الوحدة وسوء الفهم. في هذا السياق يرى الكاتب أن التواصل الحقيقي لا تصنعه الوسائل بل يصنعه الإنصات، بمعنى أن جودة التواصل رهينة بقدرتنا على الاستماع إلى الآخر لا بكثرة الأدوات التي نملكها.'},
   {type:'a',lab:'الخطوة 2 · العرض : شرح المفاهيم المفاتيح',txt:'بداية، ينبغي التمييز بين مفهومين يخلط بينهما كثيرون : الاتصال والتواصل. فالاتصال نقل للرسائل عبر قناة، وقد يتم في اتجاه واحد دون أن يفهم أحد أحدا ؛ أما التواصل فتبادل يقوم على الفهم المشترك والاعتراف بالآخر. ومعنى ذلك أن الوسيلة، مهما تطورت، لا تضمن سوى الاتصال ؛ أما التواصل فيحتاج إلى شيء آخر هو الإنصات : أن نستمع لنفهم، لا لنرد.'},
   {type:'a',lab:'الخطوة 3 · العرض : التحليل والحجاج (حجة منطقية + حجة واقعية + مثال)',txt:'ذلك أن الإنصات هو الركن الذي تقوم عليه بقية أركان التواصل : فبدونه لا تُفهم الرسالة، ولا تُفسَّر الشفرة تفسيرا صحيحا، ولا تصل التغذية الراجعة. والدليل على ذلك أن أغلب الخلافات بين الناس لا تنشأ من نقص في الوسائل بل من سوء فهم : كل طرف يتكلم ولا أحد يستمع. خير دليل على ذلك مشهد الأسرة الحديثة : أفراد يجلسون على مائدة واحدة، كل واحد متصل بآلاف الأشخاص عبر هاتفه، ولا أحد يُنصت لمن يجلس أمامه. فضلا عن ذلك، أثبتت الدراسات التربوية أن المعلم الذي يُنصت لتلاميذه يُحقق نتائج أفضل من الذي يكتفي بنقل المعلومة.'},
   {type:'a',lab:'الخطوة 4 · العرض : المناقشة (التسليم الجزئي ثم الرد)',txt:'صحيح أن الوسائل الحديثة قرّبت البعيد وأتاحت للمهاجر أن يرى أهله وللمتعلم أن يحاور أستاذا في قارة أخرى، ولا أحد ينكر هذه الفضائل ؛ غير أن هذه الوسائل نفسها قد تُنتج تواصلا سطحيا سريعا إذا غاب الإنصات : إعجاب وتعليق ثم نسيان. فالمشكل إذن ليس في الوسيلة بل في طريقة استعمالها.'},
   {type:'c',lab:'الخطوة 5 · الخاتمة : التركيب ← الموقف الشخصي ← الأفق',txt:'خلاصة القول، إن التواصل علاقة إنسانية قبل أن يكون تقنية، وجوهر هذه العلاقة الإنصات. وفي رأيي أن الكاتب محق، لأن تجربتنا اليومية تؤكد أن كلمة واحدة تُسمَع بانتباه تُغني عن مائة رسالة لا يقرؤها أحد. ومن ثم فإن تربية الناشئة على فن الإنصات لا تقل أهمية عن تعليمهم استعمال التكنولوجيا.'}
  ],
  note:'هذا الموضوع مُعلَّق عليه خطوة خطوة : لاحظ أن كل فقرة تؤدي وظيفة محددة من خطوات المهارة، وأن الانتقال بين الفقرات يتم بروابط مناسبة (بداية ← ذلك أن ← صحيح أن… غير أن ← خلاصة القول). وُظّفت مفاهيم درس التواصل (الاتصال/التواصل، الأركان، التغذية الراجعة) : هذا ما يُميّز إنشاء التلميذ المتمكن.'},
 {t:'الربط بين الأفكار · الإبداع شرط التقدم (مجال المفاهيم)',
  sujet:'اكتب نصا متماسكا لا يتجاوز عشرين سطرا تربط فيه بين الأفكار التالية موظفا روابط الإضافة والتعليل والاستدراك والتمثيل والاستنتاج : (1) الإبداع شرط لتقدم الأمم في عصر المعرفة – (2) مدرستنا تقوم على التلقين والحفظ – (3) لا إبداع بلا حرية – (4) تجارب الدول الناهضة تؤكد ذلك – (5) المطلوب إصلاح التعليم ومناخ الحرية.',
  paras:[
   {type:'i',lab:'المقدمة · تقديم الموضوع وطرح الإشكال',txt:'يتفق الجميع على أن العالم يتغير بسرعة لم يعرفها التاريخ من قبل، وأن مكانة الأمم صارت تُقاس بقدرتها على الابتكار لا بما تملكه من ثروات. ومن هنا يُطرح سؤال ملحّ : ما موقع الإبداع في مجتمعنا، وما الذي يعيقه ؟'},
   {type:'a',lab:'الفكرة 1 · رابط الترتيب والتقرير',txt:'أولا، لا شك أن الإبداع صار شرطا لتقدم الأمم في عصر المعرفة. فقيمة الهاتف الذي نحمله ليست في مواده الخام بل في الفكرة والتصميم والبرمجة، وأغنى شركات العالم اليوم لا تملك مناجم بل عقولا. ومعنى ذلك أن الأمة التي لا تُبدع محكوم عليها بأن تستهلك ما يبدعه غيرها.'},
   {type:'a',lab:'الفكرة 2 · رابط الاستدراك',txt:'غير أن الناظر في مدرستنا يلاحظ أنها ما زالت تقوم في الغالب على التلقين والحفظ : التلميذ يستظهر ما في الكتاب، ويُكافأ على التكرار، ويُعاقب أحيانا على السؤال الذي لم يرد في المقرر. وهكذا نُنتج متعلمين يُجيدون الحفظ ولا يُجيدون التفكير.'},
   {type:'a',lab:'الفكرة 3 · رابط التعليل',txt:'ذلك أن الإبداع لا ينمو إلا في مناخ من الحرية : حرية السؤال، وحرية الخطأ، وحرية الاختلاف. فالتلميذ الذي يخاف من الخطأ لا يجرؤ على التجريب، والمجتمع الذي يُقدّس الجاهز لا يُرحب بالجديد. لذلك فإن غياب الحرية في المدرسة والأسرة والمجتمع هو السبب الأعمق لعجزنا الإبداعي.'},
   {type:'a',lab:'الفكرة 4 · رابط التمثيل',txt:'خير دليل على ذلك تجارب الدول الناهضة : فكوريا الجنوبية وفنلندا وسنغافورة لم تملك موارد طبيعية كبيرة، لكنها بنت مدارس تُعلّم التساؤل والمشروع والعمل الجماعي، وأحاطت المبدعين بالاعتراف والتحفيز، فصارت في جيلين من أكثر الاقتصادات ابتكارا في العالم.'},
   {type:'c',lab:'الفكرة 5 · رابط الاستنتاج والخاتمة',txt:'وبناء على ما سبق، يتضح أن المطلوب ليس مزيدا من المقررات بل إصلاح عميق للتعليم يجعل من التلميذ منتجا للمعرفة لا مستهلكا لها، ومناخ من الحرية يحمي حق الاختلاف والخطأ. وفي رأيي أن هذا الإصلاح يبدأ من القسم : من أستاذ يُرحّب بالسؤال، ومن تقويم يُكافئ الفهم لا الحفظ.'}
  ],
  note:'تُقوَّم هذه المهارة على جودة الروابط ومنطقية الانتقال. لاحظ أن كل فقرة تبدأ برابط يُحدد علاقتها بما قبلها : أولا (ترتيب) ← غير أن (استدراك) ← ذلك أن (تعليل) ← خير دليل على ذلك (تمثيل) ← وبناء على ما سبق (استنتاج). والترتيب المنطقي : الأطروحة ← المشكل ← سببه ← الدليل ← الحل.'},
 {t:'المقارنة والاستنتاج · الحداثة والتحديث (مجال المفاهيم)',
  sujet:'قارن بين مفهومي «الحداثة» و«التحديث» من حيث طبيعتهما، ومجالهما، وطريقة تحققهما، ثم استنتج ما يترتب عن الخلط بينهما في المجتمعات العربية. (عشرون سطرا على الأكثر، وفق خطوات مهارة المقارنة والاستنتاج)',
  paras:[
   {type:'i',lab:'الخطوة 1 · المقدمة : تحديد طرفي المقارنة ومعاييرها',txt:'يتردد في الخطاب الفكري العربي مفهومان متقاربان في اللفظ متباعدان في الدلالة : الحداثة والتحديث. وكثيرا ما يُستعمل أحدهما مكان الآخر، مما يُنتج التباسا في فهم مشروع النهضة. ولذلك تستدعي المقارنة بينهما تحديد ثلاثة معايير : طبيعة كل مفهوم، ومجاله، وطريقة تحققه.'},
   {type:'a',lab:'الخطوة 2 · أوجه التشابه',txt:'من جهة التشابه، يشترك المفهومان في الانتماء إلى الحقل الدلالي نفسه : حقل الجديد والمعاصر في مقابل القديم والموروث. كما يشتركان في كونهما نتاج احتكاك المجتمعات العربية بالحضارة الغربية منذ القرن التاسع عشر، وفي كونهما يطمحان معا إلى اللحاق بركب التقدم. وكلاهما، فضلا عن ذلك، موضوع نقاش وصراع بين دعاة الأصالة ودعاة التجديد.'},
   {type:'a',lab:'الخطوة 3 · أوجه الاختلاف (معيارا معيارا)',txt:'غير أن الاختلاف بينهما جوهري. فمن حيث الطبيعة، الحداثة موقف فكري وقيمة : سيادة العقل، والنقد، والحرية، والإيمان بالتقدم ؛ بينما التحديث إجراء عملي : نقل الآلات والتقنيات وأساليب التنظيم. ومن حيث المجال، تمس الحداثة العقليات والذهنيات والعلاقة بالتراث والسلطة، في حين يمس التحديث المظاهر المادية : العمران، والإدارة، والاقتصاد، واللباس. أما من حيث طريقة التحقق، فالحداثة تُبنى من الداخل عبر التعليم والنقد والزمن الطويل ولا تُستورد، في المقابل يمكن شراء التحديث واستيراده في سنوات قليلة بالمال.'},
   {type:'a',lab:'الخطوة 4 · تفسير الاختلاف',txt:'ويُفسَّر هذا الاختلاف بأن التحديث نتيجة والحداثة سبب : فأوروبا حدّثت عمرانها وصناعتها لأنها كانت قد غيّرت طريقة تفكيرها أولا مع عصر الأنوار. أما حين يُستورد التحديث وحده فإنه يبقى قشرة بلا جذور، كما بيّن محمد عابد الجابري حين رفض اعتبار الحداثة تقليدا للغرب أو قطيعة مع التراث.'},
   {type:'c',lab:'الخطوة 5 · الاستنتاج',txt:'وبناء على ما سبق، نستنتج أن الخلط بين المفهومين هو ما يُنتج في مجتمعاتنا ظاهرة «الازدواجية» : مدن حديثة وعقليات تقليدية، أحدث التقنيات في اليد وأقدم الخرافات في الرأس. ومن ثم فإن النهضة الحقيقية لا تتحقق بمضاعفة التحديث، بل بالاستثمار في الحداثة : مدرسة تُعلّم النقد، وفضاء عمومي يسمح بالاختلاف، وقراءة عقلانية للتراث.'}
  ],
  note:'لاحظ أن المقارنة بنيت على معايير مُعلنة في المقدمة ثم عولجت بالترتيب نفسه في فقرة الاختلاف (الطبيعة ← المجال ← طريقة التحقق). روابط المقارنة : بينما، في حين، في المقابل، أما… فـ، من جهة… ومن جهة أخرى. والاستنتاج يُجيب عن سؤال المقارنة ولا يكتفي بتلخيصها.'},
 {t:'تحليل صورة · ملصق حملة التمدرس في العالم القروي (مجال التنمية)',
  sujet:'حلّل الملصق التالي الذي أنجزته جمعية تنموية، في عشرين سطرا على الأكثر، وفق خطوات مهارة تحليل الصورة : التعريف بالصورة، وصف مكوناتها، تحليل دلالاتها وعلاقة النص بالصورة، ثم التأويل وإبداء الرأي.<div class="fig" style="margin-top:8px">'+I.D.svg(230,[

  paras:[
   {type:'i',lab:'الخطوة 1 · التعريف بالصورة',txt:'الوثيقة المقترحة ملصق توعوي تحسيسي أنجزته جمعية تنموية في إطار حملة لدعم التمدرس في العالم القروي، كما يدل على ذلك اسم الجمعية وعنوان الحملة ورقم الهاتف المخصص للمساهمة. وهي صورة ثابتة مرسومة تجمع بين مشهد قروي صباحي ونص مصاحب، وتستهدف جمهورا عاما من المتبرعين والفاعلين، ويندرج موضوعها ضمن مجال الإنسان والتنمية.'},
   {type:'a',lab:'الخطوة 2 · الوصف (من المركز إلى الأطراف، ثم الألوان، ثم النص)',txt:'يُهيمن على الصورة لون ذهبي دافئ : سماء صباحية مشرقة بشمس كاملة، وأرض ترابية تُحيل على البادية. في الجهة اليسرى ثلاثة أطفال، بنتان وولد، يسيرون مبتسمين وقد حملوا محافظهم، والولد يمد ذراعيه في حركة انطلاق. وفي الجهة اليمنى، على ربوة، مدرسة صغيرة بيضاء بسقف أحمر وعلم يرفرف فوقها، نوافذها زرقاء مفتوحة. وفي أسفل الملصق شعار بخط عريض : «كل طفل في قسمه، كل قرية في المستقبل»، تحته اسم الجمعية وعنوان الحملة ودعوة إلى المساهمة بتجهيز قسم.'},
   {type:'a',lab:'الخطوة 3 · التحليل (دلالة العناصر، التكوين، علاقة النص بالصورة)',txt:'يقوم تكوين الصورة على حركة من اليسار إلى اليمين : من الأطفال إلى المدرسة، أي من الحاضر إلى المستقبل، ويُجسد الطريق بينهما مسافة ينبغي قطعها، وهي المسافة التي تسعى الحملة إلى تقليصها. وتحمل الألوان دلالات واضحة : الذهبي والشمس رمزان للأمل والبداية، والأبيض للمدرسة رمز للعلم والطهارة، والأحمر للسقف والعلم يربط المدرسة بالوطن. أما حضور بنتين من بين ثلاثة أطفال فليس اعتباطيا : إنه تنبيه إلى تمدرس الفتاة القروية بوصفه أول ضحايا الهدر المدرسي. ويعضد النصُّ الصورةَ : فالشعار مبني على توازٍ وتدرج (طفل ← قرية، قسم ← مستقبل) يجعل تمدرس الفرد شرطا لتنمية الجماعة، وهو يختزل في إيجاز بليغ أطروحة التنمية البشرية : الاستثمار في الإنسان هو الطريق إلى تنمية المجال.'},
   {type:'c',lab:'الخطوة 4 · التأويل وإبداء الرأي',txt:'يُؤوَّل الملصق إذن باعتباره خطابا إقناعيا يستعمل آليات الإشهار (الصورة المؤثرة، الشعار الموجز، الاستمالة العاطفية بوجوه الأطفال) في خدمة قضية تنموية نبيلة، وهو يُترجم بصريا الفكرة التي يدافع عنها نادر فرجاني : لا تنمية بلا اكتساب المعرفة. وأرى أن الملصق موفق لأنه اختار التفاؤل بدل التخويف، وربط التبرع بنتيجة ملموسة (تجهيز قسم) ؛ غير أن التنمية القروية تحتاج، إلى جانب المبادرات الجمعوية، إلى التزام الدولة بالطرق والنقل المدرسي والأساتذة، فالمدرسة القريبة لا تكفي إن بقيت فارغة.'}
  ],
  note:'موضوع تحليل الصورة يُقوَّم على احترام الخطوات الأربع وعلى الربط بين الصورة والنص المصاحب. لاحظ توظيف معارف الدروس : التنمية البشرية (فرجاني)، آليات الإشهار (لحمداني)، والإيجاز في قراءة الشعار. تجنّب الوصف المحض بلا تحليل، أو التحليل بلا وصف.'}
]);

 persos:[
  {n:"Sidi Mohammed",r:"Le narrateur, 6 ans",c:"#f3b54a",h:"#2b2118",f:false,d:"Enfant unique, solitaire, rêveur, sensible et parfois jaloux (de Zineb). Il observe le monde des adultes sans tout comprendre. Sa boîte à merveilles est son refuge. Il tombe souvent malade quand l'émotion est trop forte. L'adulte qu'il est devenu raconte avec tendresse et mélancolie."},
  {n:"Lalla Zoubida",r:"La mère",c:"#1f6f78",h:"#2b2118",f:true,d:"Femme de caractère, bavarde, émotive, superstitieuse, fière d'être chérifa (descendante du Prophète). Très attachée à son fils, elle se dispute volontiers avec les voisines puis se réconcilie. Elle est jalouse de la lampe de Fatma Bziouya. Pendant l'absence du père, elle consulte voyants et marabouts."},
  {n:"Maâlem Abdeslem",r:"Le père, tisserand",c:"#2b2118",h:"#2b2118",f:false,d:"Homme calme, pieux, digne, d'origine montagnarde. Il parle peu mais raconte des histoires (Abdallah l'épicier). Il perd son capital (ch. 9) et part travailler comme moissonneur à la campagne pour ne pas s'endetter. Son retour (ch. 12) ramène la joie."},
  {n:"Lalla Aïcha",r:"Amie de la mère",c:"#8a6d3b",h:"#555",f:true,d:"Ancienne voisine, grosse, chérifa comme Lalla Zoubida. Elle apparaît dès le ch. 2 (visite à Sidi Boughaleb). Son mari Moulay Larbi, babouchier, est ruiné par son associé puis se remarie. Elle conseille à Lalla Zoubida de consulter le voyant Si El Arafi. Personnage de la fidélité en amitié."},
  {n:"Moulay Larbi",r:"Mari de Lalla Aïcha",c:"#4a3b5c",h:"#2b2118",f:false,d:"Babouchier. Trahi par son associé Abdelkader (ch. 4), il perd son atelier. Il prend une seconde épouse, la fille du coiffeur (ch. 11), puis la répudie et revient vers Lalla Aïcha (ch. 12). Il incarne les malheurs qui frappent les gens simples."},
  {n:"Lalla Kenza (la Chouafa)",r:"La voyante du rez-de-chaussée",c:"#7a6a58",h:"#555",f:true,d:"Donne son nom à la maison. Reçoit des clientes et organise des cérémonies avec les Gnaouas. Elle incarne le monde des croyances et de la superstition."},
  {n:"Rahma",r:"Voisine du 1er étage",c:"#b5452c",h:"#2b2118",f:true,d:"Épouse de Driss El Aouad, mère de Zineb. Se dispute avec Lalla Zoubida (ch. 1), mais devient une alliée : la maison entière cherche Zineb (ch. 3) et Rahma offre un repas aux mendiants pour remercier Dieu. Elle raconte l'histoire de Lalla Khadija (ch. 6)."},
  {n:"Zineb",r:"Fille de Rahma",c:"#d9a441",h:"#2b2118",f:true,d:"La seule autre enfant de la maison. Le narrateur la déteste, la trouve sotte et se dispute avec elle. Elle se perd dans la médina (ch. 3) et est retrouvée chez les Idrissides."},
  {n:"Fatma Bziouya",r:"Voisine du 2e étage",c:"#5aa9d6",h:"#2b2118",f:true,d:"Épouse d'Allal le jardinier. Sa lampe à pétrole (ch. 3) provoque la jalousie de Lalla Zoubida : épisode qui révèle la modernité qui entre dans la maison et la rivalité des femmes."},
  {n:"Le fqih",r:"Maître du Msid",c:"#2e7d4f",h:"#2b2118",f:false,d:"Maître de l'école coranique, sévère et craint (sa baguette). Mais à l'approche de l'Achoura il devient plus doux et organise la fête avec les élèves (ch. 5-7). Figure de l'autorité traditionnelle."},
  {n:"Abdallah l'épicier",r:"Le conteur du quartier",c:"#c48a5a",h:"#555",f:false,d:"Épicier dont le père rapporte les histoires merveilleuses (ch. 4). Il représente la tradition orale, la sagesse populaire et nourrit l'imaginaire de l'enfant."},
  {n:"Si El Arafi",r:"Le voyant aveugle",c:"#4f4f4f",h:"#999",f:false,d:"Voyant aveugle consulté par Lalla Zoubida et Lalla Aïcha pendant l'absence du père (ch. 10). Il rassure les deux femmes. Incarne la sagesse populaire et la religiosité du peuple."},
  {n:"Salama",r:"La marieuse",c:"#9c4f7a",h:"#2b2118",f:true,d:"Entremetteuse qui a arrangé le second mariage de Moulay Larbi avec la fille du coiffeur (ch. 11). Elle le regrette et raconte les difficultés du couple."},
  {n:"Driss El Aouad · Allal · Driss le teigneux",r:"Personnages secondaires",c:"#7a6a58",h:"#2b2118",f:false,d:"Driss El Aouad : mari de Rahma, fabricant de charrues. Allal : jardinier, mari de Fatma Bziouya. Driss le teigneux : apprenti du père, qui fait les courses et apporte les nouvelles."}

 notions:[
  {n:"Roman autobiographique",d:"Récit à la 1ʳᵉ personne inspiré de la vie de l'auteur, mais avec une part de fiction (le narrateur ne porte pas le nom de l'auteur)."},
  {n:"Pacte autobiographique",d:"Engagement de l'auteur à dire la vérité sur sa vie ; auteur = narrateur = personnage. Dans La Boîte à merveilles, ce pacte n'est qu'implicite."},
  {n:"Narrateur-personnage",d:"Le narrateur participe à l'histoire et dit « je ». Ici, il y a deux « je » : l'enfant qui vit et l'adulte qui se souvient."},
  {n:"Point de vue interne",d:"Le lecteur perçoit l'histoire à travers un seul personnage : ses pensées, ses sentiments, ce qu'il voit."},
  {n:"Point de vue omniscient",d:"Le narrateur sait tout de tous les personnages, passé et avenir compris."},
  {n:"Point de vue externe",d:"Le narrateur ne décrit que ce qu'une caméra verrait ; pas d'accès aux pensées."},
  {n:"Présent d'énonciation",d:"Présent qui renvoie au moment où le narrateur parle ; signale la voix de l'adulte qui commente."},
  {n:"Analepse (retour en arrière)",d:"Récit d'un événement antérieur au moment de l'histoire. Tout le roman est une grande analepse de l'adulte vers l'enfance."},
  {n:"Hyperbole",d:"Exagération pour frapper l'esprit. Ex. : le bain maure décrit comme un enfer."},
  {n:"Comparaison",d:"Rapprochement de deux éléments avec un outil (comme, tel, pareil à…)."},
  {n:"Métaphore",d:"Comparaison sans outil : un mot est employé pour un autre. Ex. : « un enfer » pour le bain."},
  {n:"Personnification",d:"Donner des traits humains à une chose ou un animal. Ex. : les objets de la boîte sont des « amis »."},
  {n:"Antithèse",d:"Opposition de deux idées ou mots dans une même phrase. Ex. : la fête de l'Achoura / la tristesse du départ."},
  {n:"Énumération",d:"Suite de mots ou groupes de même nature. Ex. : la liste des objets de la boîte."},
  {n:"Champ lexical",d:"Ensemble de mots d'un texte qui renvoient à une même idée (solitude, peur, religion…)."},
  {n:"Registre lyrique",d:"Expression des sentiments personnels (nostalgie, tristesse, émerveillement)."},
  {n:"Registre réaliste",d:"Description précise et fidèle de la vie quotidienne (métiers, lieux, objets)."},
  {n:"Registre comique",d:"Vise à faire rire : disputes de voisines, exagérations de la mère."},
  {n:"Texte narratif",d:"Raconte des événements (passé simple, imparfait, connecteurs temporels)."},
  {n:"Texte descriptif",d:"Décrit un lieu, un personnage, un objet (imparfait, adjectifs, repères spatiaux)."},
  {n:"Texte argumentatif",d:"Défend une thèse avec des arguments et des exemples (présent, connecteurs logiques)."},
  {n:"Discours direct",d:"Paroles rapportées telles quelles, entre guillemets, avec verbe de parole."},
  {n:"Discours indirect",d:"Paroles rapportées dans une subordonnée (il dit que…), avec changement de temps et de pronoms."},
  {n:"Schéma narratif",d:"Situation initiale → élément perturbateur → péripéties → dénouement → situation finale. Ici : équilibre → ruine et départ du père → épreuves → retour."},
  {n:"Leitmotiv",d:"Thème ou mot qui revient de façon répétée. Ex. : la solitude du narrateur."},
  {n:"Chérifa",d:"Femme descendant du Prophète ; titre dont Lalla Zoubida et Lalla Aïcha sont fières."},
  {n:"Msid",d:"École coranique où l'enfant apprend le Coran sous la baguette du fqih."},
  {n:"Achoura",d:"Fête religieuse (10 Muharram) : jouets, tambours, habits neufs ; point culminant de la joie dans le roman (ch. 5-7)."}
 ],
 methode:'<div class="card"><h2>Production écrite — Méthode</h2><p>Au régional, la production écrite (10 pts) demande un <b>texte argumentatif</b> d\'une quinzaine de lignes sur un thème lié à l\'œuvre ou à la société.</p>'
 +'<div class="fig">'+I.D.planRedaction()+'</div>'
 +'<h3>Connecteurs indispensables</h3><table><tr><th>Pour…</th><th>Utilisez</th></tr><tr><td>Introduire</td><td>De nos jours, Il est fréquent de constater que, La question se pose de savoir si</td></tr><tr><td>Ajouter un argument</td><td>D\'abord, Ensuite, De plus, Par ailleurs, Enfin</td></tr><tr><td>Illustrer</td><td>Par exemple, Ainsi, Comme le montre, Dans La Boîte à merveilles</td></tr><tr><td>Opposer / nuancer</td><td>Cependant, Toutefois, Néanmoins, Certes… mais</td></tr><tr><td>Exprimer la cause / conséquence</td><td>Car, Parce que, En effet · Donc, C\'est pourquoi, Par conséquent</td></tr><tr><td>Conclure</td><td>En somme, Pour conclure, En définitive</td></tr></table>'
 +'<h3>Les thèmes qui tombent (et un plan pour chacun)</h3>'
 +'<div class="model"><b>La solitude de l\'enfant</b> (ch. 1, 12) — Thèse : l\'enfant d\'aujourd\'hui, entouré d\'écrans, est moins seul. Antithèse : une compagnie virtuelle n\'est pas une présence. Conclusion : la solitude a changé de forme.</div>'
 +'<div class="model"><b>La superstition et les voyants</b> (ch. 1, 10) — Thèse : consulter un voyant rassure dans l\'épreuve, comme Lalla Zoubida. Antithèse : c\'est une exploitation de la crédulité ; la raison et la médecine valent mieux. Conclusion : comprendre sans juger, éduquer.</div>'
 +'<div class="model"><b>Le bain maure / les traditions</b> (ch. 1) — Thèse : les traditions (hammam, fêtes, contes) créent du lien social. Antithèse : certaines sont dépassées ou pénibles. Conclusion : garder l\'esprit, adapter la forme.</div>'
 +'<div class="model"><b>L\'école et la sévérité du maître</b> (ch. 2, 5) — Thèse : la discipline forge le caractère. Antithèse : la peur bloque l\'apprentissage ; la pédagogie moderne respecte l\'enfant. Conclusion : autorité sans violence.</div>'
 +'<div class="model"><b>Les fêtes (Achoura) et la joie collective</b> (ch. 6-7) — Thèse : les fêtes transmettent les valeurs et unissent la famille. Antithèse : elles deviennent commerciales et pèsent sur les familles pauvres. Conclusion : revenir au sens.</div>'
 +'<div class="model"><b>La pauvreté, la dignité, le travail</b> (ch. 9) — Thèse : le père qui part moissonner montre la dignité du travail. Antithèse : la société devrait protéger les familles frappées par la ruine. Conclusion : solidarité et courage.</div>'
 +'<div class="model"><b>L\'amitié</b> (Lalla Zoubida / Lalla Aïcha) — Thèse : l\'amie est présente dans le malheur. Antithèse : l\'amitié peut aussi mal conseiller (voyants). Conclusion : une vraie amitié est sincère et lucide.</div>'
 +'<div class="model"><b>La polygamie / le remariage</b> (ch. 11-12) — Sujet délicat : exposer les deux positions avec respect, s\'appuyer sur l\'échec du second mariage de Moulay Larbi, conclure sur le respect et l\'équité.</div>'
 +'<h3>Les 5 erreurs qui coûtent des points</h3><ul><li>Oublier d\'<b>annoncer le plan</b> dans l\'introduction.</li><li>Donner des arguments <b>sans exemple</b> (prenez-en un dans l\'œuvre et un dans la vie réelle).</li><li>Un seul long paragraphe : <b>un paragraphe par argument</b>, avec un connecteur en tête.</li><li>Mélanger les temps : le <b>présent</b> pour argumenter.</li><li>Ne pas donner son <b>avis personnel</b> en conclusion.</li></ul>'
 +'<h3>Rappel du format de l\'épreuve</h3><table><tr><th>Partie</th><th>Points</th><th>Ce qu\'on attend</th></tr><tr><td>Compréhension</td><td>10</td><td>Situer le passage, genre, énonciation, type de texte, champ lexical, figure de style, point de vue, compréhension, réaction personnelle</td></tr><tr><td>Production écrite</td><td>10</td><td>Texte argumentatif de 15 lignes environ : respect du sujet, plan, arguments, langue</td></tr></table>'
 +'</div>'
});

   cap:"Sidi Mohammed, six ans, enfant solitaire",
   p:"Le narrateur adulte se souvient : à <b>six ans</b>, il était un enfant <b>seul</b>, sans ami, mal à l'aise avec les autres enfants. Il vit avec ses parents au <b>premier étage</b> de <b>Dar Chouafa</b>, une maison partagée dont le rez-de-chaussée est occupé par la <b>Chouafa</b> (la voyante), Lalla Kenza.",
