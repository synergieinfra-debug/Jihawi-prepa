  paras:[
   {type:'i',lab:'المقدمة · تأطير زماني ومكاني ← تقديم ← إشكالية',txt:'شكّل القرن 19 منعطفا حاسما في تاريخ أوروبا الغربية والولايات المتحدة، إذ انتقل الاقتصاد الرأسمالي، بفضل الثورة الصناعية الثانية التي انطلقت حوالي 1870، من مرحلة المنافسة الحرة إلى مرحلة التركيز والاحتكار. ولم يكن هذا التحول اقتصاديا فحسب، بل أعاد تشكيل المجتمع والفكر معا. فما مظاهر التحولات الاقتصادية والمالية التي عرفها العالم الرأسمالي خلال هذا القرن ؟ وكيف انعكست على بنية المجتمع ؟ وما المذاهب الفكرية التي واكبتها ؟'},
   {type:'a',lab:'العرض · المحور الأول : التحولات الاقتصادية والمالية (تعريف ← تفسير)',txt:'تجلت التحولات الاقتصادية أولا في ثورة صناعية ثانية قامت على مصادر طاقة جديدة هي الكهرباء والبترول، ومواد جديدة أبرزها الصلب الذي قفز إنتاجه العالمي من نصف مليون طن سنة 1870 إلى 76 مليون طن سنة 1913، فضلا عن الكيمياء والمحرك الانفجاري وشبكة السكك الحديدية التي تجاوزت مليون كلم عشية 1914. وقد أدت حدة المنافسة والأزمات الدورية، كالانكماش الكبير بين 1873 و1896، إلى تركيز رأسمالي اتخذ شكل الكارتل في ألمانيا والترست في الولايات المتحدة، حيث احتكرت ستاندرد أويل منذ 1882 تكرير البترول، والهولدينغ. وبموازاة ذلك هيمنت الأبناك الكبرى والبورصات والشركات المساهمة على تمويل الصناعة وتصدير الرساميل، فدخلت الرأسمالية مرحلتها المالية.'},
   {type:'a',lab:'العرض · المحور الثاني : الانعكاسات الاجتماعية (تفسير ← تركيب)',txt:'وقد ترتب عن هذه التحولات تغيير عميق في بنية المجتمع. فقد عرفت أوروبا انفجارا ديمغرافيا انتقل بسكانها من 190 إلى 420 مليون نسمة بين 1800 و1900، وهجرة قروية كثيفة نحو المدن الصناعية، وهجرة نحو 50 مليون أوروبي إلى العالم الجديد. كما انقسم المجتمع إلى طبقتين كبيرتين : بورجوازية صناعية ومالية تملك وسائل الإنتاج وتسيطر على السلطة، وبروليتاريا تعيش ظروفا قاسية من عمل يمتد 12 إلى 14 ساعة وتشغيل للأطفال وسكن غير صحي. وردا على هذا الاستغلال تبلورت حركة عمالية تدرجت من الإضرابات إلى النقابات المعترف بها في بريطانيا سنة 1871 وفرنسا سنة 1884، ثم إلى الأممية الأولى سنة 1864 والثانية سنة 1889، مما أجبر الدول على سن تشريعات اجتماعية كتأمينات بسمارك بين 1883 و1889.'},
   {type:'a',lab:'العرض · المحور الثالث : المذاهب الفكرية (تركيب)',txt:'وواكبت هذه التحولات مذاهب فكرية متعارضة. فمن جهة دافعت الليبرالية، منذ آدم سميث في «ثروة الأمم» سنة 1776، عن حرية المبادرة والمنافسة وعدم تدخل الدولة، وكانت فكر البورجوازية الصاعدة. ومن جهة أخرى انتقدت الاشتراكية مساوئ الرأسمالية : فاقترح الطوباويون كسان سيمون وفورييه وروبرت أوين مجتمعات مثالية تعاونية، بينما أسس كارل ماركس وفريدريك إنجلز في «البيان الشيوعي» سنة 1848 ثم «رأس المال» سنة 1867 الاشتراكية العلمية القائمة على الصراع الطبقي والثورة البروليتارية. فضلا عن ذلك رفضت الفوضوية مع برودون وباكونين كل سلطة بما فيها الدولة، في حين دعت الكاثوليكية الاجتماعية في منشور «ريروم نوفاروم» سنة 1891 إلى التوفيق بين الطبقات.'},
   {type:'c',lab:'الخاتمة · خلاصة تجيب عن الإشكالية ← فتح أفق',txt:'وفي المحصلة، أفرزت الثورة الصناعية الثانية رأسمالية احتكارية ومالية غيّرت بنية المجتمع بإنتاج طبقتين متصارعتين، وولّدت مذاهب فكرية ما زال صداها قائما إلى اليوم. غير أن هذه القوة الاقتصادية الجديدة احتاجت إلى أسواق ومواد أولية ومجالات لتصدير الرساميل خارج أوروبا، وهو ما سيدفع القوى الرأسمالية إلى التنافس الإمبريالي الذي سينتهي باندلاع الحرب العالمية الأولى سنة 1914.'}
  ],
  note:'لاحظ : مقدمة بتأطير زماني (القرن 19، 1870) ومكاني (أوروبا الغربية والولايات المتحدة) وثلاثة أسئلة تُعلن المحاور الثلاثة ؛ ثم فقرة لكل محور بالترتيب نفسه ؛ 20 معطى دقيقا (تواريخ، أرقام، أسماء) ؛ خاتمة تجيب وتفتح على الدرس الموالي. لا عناوين داخل المقال يوم الامتحان (التسميات هنا للتوضيح فقط).'},
 {t:'الجغرافيا · مفهوم التنمية ومؤشراتها والتقسيمات الكبرى للعالم',
  sujet:'تعددت مقاربات مفهوم التنمية وتنوعت مؤشرات قياسها، كما أفرز تفاوتها تقسيمات كبرى للعالم. اكتب موضوعا مقاليا تتناول فيه : تطور مفهوم التنمية ومقارباته ؛ أهم مؤشرات قياسها وحدودها ؛ التقسيمات الكبرى للعالم وعوامل التفاوت.',
  paras:[
   {type:'i',lab:'المقدمة · معطى جغرافي ← تقديم ← إشكالية',txt:'يعيش اليوم أزيد من 8 مليارات إنسان في عالم شديد التفاوت : يتجاوز متوسط العمر 84 سنة في اليابان بينما لا يبلغ 55 سنة في بعض بلدان إفريقيا، ويفوق الدخل الفردي في النرويج دخل البوروندي بمئات المرات. ولفهم هذه الفوارق وقياسها ومعالجتها برز مفهوم التنمية بعد الحرب العالمية الثانية وتطور باستمرار. فكيف تطور هذا المفهوم ؟ وبأي مؤشرات يُقاس وما حدودها ؟ وما التقسيمات الكبرى التي يُنتجها تفاوت التنمية في العالم وما عواملها ؟'},
   {type:'a',lab:'العرض · المحور الأول : تطور المفهوم (وصف)',txt:'يتميز مفهوم التنمية عن النمو : فالنمو زيادة كمية في الإنتاج تُقاس بالناتج الداخلي الخام، بينما التنمية تحول نوعي شامل يمس الاقتصاد والمجتمع والثقافة. وقد تعاقبت مقارباته : ركزت المقاربة الاقتصادية في الخمسينيات والستينيات على التصنيع والنمو، ثم أدمجت المقاربة الاجتماعية في السبعينيات الحاجات الأساسية من تغذية وصحة وتعليم، ثم بلور برنامج الأمم المتحدة الإنمائي منذ 1990 مفهوم التنمية البشرية الذي يجعل الإنسان غاية التنمية ووسيلتها، وأخيرا فرضت التنمية المستدامة نفسها منذ تقرير برونتلاند سنة 1987 وقمة ريو سنة 1992، وتُجسدها اليوم أهداف التنمية المستدامة السبعة عشر في أفق 2030.'},
   {type:'a',lab:'العرض · المحور الثاني : المؤشرات وحدودها (وصف ← تفسير)',txt:'وتُقاس التنمية بمؤشرات متعددة. فالمؤشرات الاقتصادية تشمل الناتج الداخلي الخام والدخل الفردي وبنية الناتج حسب القطاعات ؛ والمؤشرات الاجتماعية تشمل العمر المتوقع ووفيات الأطفال ونسب التمدرس والأمية والتغطية الصحية. أما مؤشر التنمية البشرية، المركب منذ 1990 من العمر المتوقع والتمدرس والدخل، فيرتب البلدان بين 0 و1 : من سويسرا (0.967) إلى الصومال (0.380)، ويحتل المغرب الرتبة 120 بقيمة 0.698 حسب تقرير 2023/2024. غير أن لهذه المؤشرات حدودا : فالدخل الفردي معدل يُخفي الفوارق الداخلية، ومؤشر التنمية البشرية لا يقيس الحرية ولا جودة البيئة ولا توزيع الثروة، مما استدعى مؤشرات مكملة كمؤشر الفقر متعدد الأبعاد.'},
   {type:'a',lab:'العرض · المحور الثالث : التقسيمات والعوامل (تفسير ← تعميم)',txt:'وقد أفرز تفاوت التنمية تقسيمات كبرى للعالم. فبعد ثلاثية العوالم خلال الحرب الباردة، اقترح تقرير برانت سنة 1980 خطا يفصل شمالا متقدما يضم أمريكا الشمالية وأوروبا الغربية واليابان وأستراليا، عن جنوب نامٍ. في المقابل تفكك هذا الجنوب منذ الثمانينيات إلى بلدان صاعدة كالصين والهند والبرازيل المجتمعة في بريكس منذ 2009، وبلدان نفطية مرتفعة الدخل، وبلدان متوسطة كالمغرب، وبلدان أقل نموا يبلغ عددها 45 سنة 2024 أغلبها في إفريقيا جنوب الصحراء. ويُفسَّر هذا التفاوت بعوامل تاريخية تتمثل في الإرث الاستعماري والتبادل غير المتكافئ، واقتصادية كالمديونية وتصدير المواد الخام، وديمغرافية حيث يلتهم النمو السكاني ثمار النمو، وسياسية مرتبطة بالحكامة والنزاعات، وطبيعية كالجفاف، بينما يبقى الرأسمال البشري العامل الحاسم كما تُثبته تجربة كوريا الجنوبية.'},
   {type:'c',lab:'الخاتمة · خلاصة ← فتح أفق',txt:'ومن ثم فإن التنمية مفهوم متعدد الأبعاد تجاوز الاختزال الاقتصادي، وتكشف مؤشراته عالما متعدد السرعات لم يعد يستقيم فيه التقسيم الثنائي بين شمال وجنوب. ويطرح ذلك على بلدان كالمغرب تحدي الانتقال من الفئة المتوسطة إلى المرتفعة عبر الاستثمار في التعليم والصحة وتقليص الفوارق المجالية، وهو ما ستتناوله دروس المجال المغربي.'}

<div class="card"><h2>بطاقة الامتحان الجهوي</h2>
<p class="tip">مادة التربية الإسلامية تُجتاز في الامتحان الجهوي الموحد لجميع الشعب. <b>المدة ساعة واحدة، المعامل 2، على 20 نقطة.</b></p>
<div class="fig">${ISD.exam}<div class="caption">وضعية واحدة وأسئلة كثيرة قصيرة : السرعة والدقة أهم من الإطالة.</div></div>
<div class="keypoints"><b>ما يُقوَّم :</b> فهم الوضعية (القضية، المشكلة) · التحكم في <b>المفاهيم</b> (تعريف اصطلاحي دقيق) · <b>حفظ سورة يوسف</b> (إتمام آيات، استشهاد بآية مناسبة) · معارف الدروس (مضامين، أحكام، مقاصد، شروط) · <b>الموقف المعلل</b> بالدرس والدليل الشرعي · الربط بين المداخل.</div></div>

<div class="card"><h2>المداخل الخمسة : خريطة البرنامج</h2>
<div class="fig">${ISD.madakhil}</div>
<table><tr><th>المدخل</th><th>الدروس</th></tr>
<tr><td><b>التزكية</b> (القرآن)</td><td>سورة يوسف في ستة أشطر : 1-21 · 22-42 · 43-57 · 58-76 · 77-93 · 94-111</td></tr>
<tr><td><b>التزكية</b> (العقيدة)</td><td>الإيمان والغيب · الإيمان والعلم · الإيمان والفلسفة · الإيمان وعمارة الأرض</td></tr>
<tr><td><b>الاقتداء</b></td><td>صلح الحديبية وفتح مكة · الرسول ﷺ مفاوضا ومستشيرا · عثمان بن عفان : قوة البذل والحياء · الرسول ﷺ في بيته</td></tr>
<tr><td><b>الاستجابة</b></td><td>فقه الأسرة : الزواج · الطلاق · رعاية الأطفال وحقوقهم · الأسرة نواة المجتمع</td></tr>
<tr><td><b>القسط</b></td><td>حق الله : الوفاء بالأمانة والمسؤولية · حق النفس : الصبر واليقين · حق الغير : العفة والحياء · حق البيئة : التوسط والاعتدال</td></tr>
<tr><td><b>الحكمة</b></td><td>الكفاءة والاستحقاق أساس التكليف · العفو والتسامح · وقاية المجتمع من تفشي الفواحش · السبعة الذين يظلهم الله</td></tr></table></div>

<div class="card"><h2>أنواع الأسئلة وكيف أجيب عنها</h2>
<table><tr><th>نوع السؤال</th><th>الطريقة</th></tr>
<tr><td>تحديد <b>القضية</b></td><td>جملة اسمية مختصرة : «قضية علاقة الإيمان بالغيب بالتفكير العلمي». القضية المحورية لا الفرعية.</td></tr>
<tr><td>تحديد <b>المشكلة/الإشكالية</b></td><td>إن كان في الوضعية رأي واحد : ما يتعارض مع الدروس هو المشكل. إن كانت آراء متعددة : «اختلاف/تضارب الآراء حول…».</td></tr>
<tr><td><b>تعريف المفاهيم</b></td><td>التعريف الاصطلاحي كما في الدرس، في جملة أو جملتين، دون أمثلة مطولة.</td></tr>
<tr><td><b>كتابة الآيات</b></td><td>إتمام الآيات من الحفظ بالرسم الصحيح والترتيب ؛ كل خطأ أو نقص يُنقص. راجع الأشطر الستة قبل الامتحان.</td></tr>
<tr><td><b>الاستدلال</b></td><td>آية (غالبا من سورة يوسف) أو حديث مناسب للمعنى المطلوب، مع ذكر المصدر : «قال تعالى :…»، «قال ﷺ :…».</td></tr>
<tr><td><b>الحكم الشرعي</b> على تصرف</td><td>«جائز / غير جائز / واجب / مكروه…» + التعليل بالشرط أو المقصد أو المفهوم من الدرس.</td></tr>
<tr><td><b>الموقف والرأي</b></td><td>«أوافق / لا أوافق» + تعليل من الدرس + دليل إن طُلب. لا موقف بلا تعليل.</td></tr>
<tr><td><b>العلاقة</b> بين مفهومين/قيمتين</td><td>تكامل وترابط (الأغلب)، أو سببية، أو شرطية، أو تضاد ؛ مع الشرح في سطرين.</td></tr>
<tr><td><b>الاستخلاص</b> من الوضعية</td><td>قيم، أحكام، خصائص، أساليب… من النص بصياغة شخصية، في جدول إن طُلب.</td></tr>
<tr><td><b>السؤال المركب</b></td><td>الربط بين درسين أو أكثر : مثلا دور الإيمان بالغيب في صبر يعقوب عليه السلام.</td></tr></table></div>

<div class="card"><h2>كيف أوزع وقتي ؟</h2><div class="fig">${ISD.temps}</div>
<p>ساعة واحدة لخمسة عشر سؤالا : أقل من أربع دقائق للسؤال. اقرأ الوضعية مرتين، ثم أجب بالترتيب مبتدئا بما تتقنه، واترك الآيات والاستدلال لآخر الوقت إن كنت مترددا. أجوبة قصيرة دقيقة أفضل من فقرات طويلة.</p></div>

<div class="card"><h2>أخطاء تُضيّع النقط</h2>
<div class="keypoints">✗ تعريف المفهوم بالمعنى اللغوي أو بمثال بدل التعريف الاصطلاحي.<br>✗ موقف بلا تعليل، أو حكم بلا شرط/مقصد.<br>✗ خطأ في كتابة الآيات أو خلط آيات سورة يوسف بغيرها.<br>✗ الاستدلال بآية لا علاقة لها بالمعنى المطلوب.<br>✗ الخلط بين القضية (الموضوع) والمشكلة (التعارض/الخلاف).<br>✗ إهمال مدخل كامل في المراجعة (الأسئلة تغطي الخمسة).<br>✗ ترك سؤال فارغا.</div></div>`,

  {n:'الغيب',d:'كل ما غاب عن الحواس والعقل ولا يُعلم إلا بخبر الوحي : الله، الملائكة، اليوم الآخر، القدر، الجنة والنار.'},

  {n:'الفلسفة',d:'التفكير العقلي في الوجود والمعرفة والقيم ؛ لا يتعارض مع الإيمان إذا التزم حدود العقل وأقر بالوحي.'},

  {n:'صلح الحديبية',d:'معاهدة بين النبي ﷺ وقريش سنة 6 هـ ؛ ظاهره تنازل وباطنه فتح مبين : هدنة 10 سنوات مهدت لفتح مكة.'},
  {n:'فتح مكة',d:'دخول النبي ﷺ مكة سنة 8 هـ في رمضان بلا قتال تقريبا ؛ العفو العام : «اذهبوا فأنتم الطلقاء».'},

  {n:'الزواج',d:'ميثاق تراض وترابط شرعي بين رجل وامرأة على وجه الدوام، غايته الإحصان والعفاف وإنشاء أسرة مستقرة (مدونة الأسرة، المادة 4).'},

  {n:'اليقين',d:'العلم الجازم الذي لا شك معه ؛ أعلى مراتب الإيمان : علم اليقين، عين اليقين، حق اليقين.'},
  {n:'العفة',d:'كف النفس عن الحرام وعما لا يليق ؛ يوسف عليه السلام : «معاذ الله إنه ربي أحسن مثواي».'},
  {n:'التوسط والاعتدال',d:'التزام الوسط في استغلال الموارد دون إفراط أو تفريط : «وكلوا واشربوا ولا تسرفوا».'},
  {n:'البيئة',d:'المحيط الطبيعي الذي استخلف الله فيه الإنسان ؛ حفظها أمانة وإفسادها محرم : «ولا تفسدوا في الأرض بعد إصلاحها».'},

  {n:'الاستحقاق',d:'نيل المنصب أو الأجر بالجدارة لا بالمحاباة ؛ «إن خير من استأجرت القوي الأمين».'},
  {n:'العفو',d:'التجاوز عن المسيء مع القدرة على العقاب ؛ يوسف لإخوته : «لا تثريب عليكم اليوم».'},
  {n:'التسامح',d:'قبول الآخر والتجاوز عن إساءته وحسن معاملته ؛ النبي ﷺ يوم الفتح : «اذهبوا فأنتم الطلقاء».'},
  {n:'الفاحشة',d:'كل فعل قبيح تجاوز حده في القبح كالزنا واللواط والقذف ؛ «ولا تقربوا الزنا إنه كان فاحشة».'},
  {n:'السبعة الذين يظلهم الله',d:'الإمام العادل، شاب نشأ في طاعة الله، رجل قلبه معلق بالمساجد، رجلان تحابا في الله، رجل دعته امرأة فقال إني أخاف الله، متصدق بالسر، ذاكر خاليا ففاضت عيناه.'},

 tip:'يُسأل عن <b>بنود الصلح</b>، <b>لماذا سُمي فتحا</b> («إنا فتحنا لك فتحا مبينا»)، <b>سبب الفتح</b> (نقض قريش)، و<b>دروس</b> : بعد النظر، الوفاء بالعهد، العفو عند المقدرة. يُربط بدرس العفو والتسامح والشطر الخامس من يوسف.',
 episodes:[
  {t:'السياق والتسلسل',svg:fr,cap:'سنتان فقط بين صلح بدا تنازلا وفتح بلا دماء.',
   p:'في <b>ذي القعدة 6 هـ</b> خرج الرسول ﷺ في نحو <b>1400 صحابي</b> معتمرين لا محاربين (ساقوا الهدي ولبسوا الإحرام)، فصدّتهم قريش عند <b>الحديبية</b>. أرسل <b>عثمان بن عفان</b> مفاوضا، فشاع أنه قُتل، فبايع الصحابة النبي على الموت تحت الشجرة : <b>بيعة الرضوان</b> («لقد رضي الله عن المؤمنين إذ يبايعونك تحت الشجرة»). ثم جاء <b>سهيل بن عمرو</b> فعُقد الصلح. اعترض سهيل على «بسم الله الرحمن الرحيم» فكُتبت «باسمك اللهم»، وعلى «محمد رسول الله» فمحاها النبي بيده وكتب «محمد بن عبد الله». رأى بعض الصحابة (عمر) البنود إجحافا : «علام نعطي الدنية في ديننا ؟»، فقال ﷺ : «إني رسول الله ولست أعصيه وهو ناصري». وفي طريق العودة نزلت : <b>«إنا فتحنا لك فتحا مبينا»</b>. دخلت <b>خزاعة</b> في عقد النبي و<b>بنو بكر</b> في عقد قريش ؛ فلما اعتدت بنو بكر بمساعدة قريش على خزاعة (8 هـ) انتقض الصلح، فسار النبي في <b>10 آلاف</b> في رمضان 8 هـ ودخل مكة <b>بلا قتال يُذكر</b>، مطأطئ الرأس تواضعا، وحطّم الأصنام : «جاء الحق وزهق الباطل»، وقال لقريش : «ما تظنون أني فاعل بكم ؟ قالوا : خيرا، أخ كريم وابن أخ كريم. قال : <b>اذهبوا فأنتم الطلقاء</b>».',

  {t:'بنود الصلح ولماذا هو فتح',svg:kh,cap:'بنود بدت ظالمة وكانت نصرا استراتيجيا.',

  {t:'الدروس والعبر',
   p:'<b>من الحديبية :</b> <b>السلم</b> هو الأصل في الإسلام والحرب استثناء ؛ <b>بعد النظر</b> : النظر إلى النتائج البعيدة لا الشكل الآني ؛ <b>المرونة في الوسائل</b> (محو اللقب) و<b>الثبات في المبادئ</b> (لم يتنازل عن الدعوة) ؛ <b>الشورى</b> (استشار أم سلمة حين تردد الصحابة في النحر فأشارت أن يبدأ بنفسه) ؛ <b>الطاعة</b> رغم عدم الفهم (الصحابة نفّذوا) ؛ <b>الوفاء بالعهد</b> : ردّ أبا جندل رغم تعذيبه. <b>من الفتح :</b> <b>العفو عند المقدرة</b> : «اذهبوا فأنتم الطلقاء» بعد 21 سنة اضطهاد ؛ <b>التواضع</b> في النصر ؛ <b>حقن الدماء</b> («من دخل دار أبي سفيان فهو آمن… من أغلق بابه فهو آمن») ؛ <b>الحزم مع نقض العهد</b> ؛ <b>التوحيد</b> غاية الفتح لا الغنيمة. <b>الربط :</b> يوسف : «لا تثريب عليكم اليوم» · الحكمة : العفو والتسامح · الرسول مفاوضا.',
   k:'<b>قالب :</b> «يتجلى درس… في موقف النبي ﷺ حين…، وهو ما ينبغي للمسلم اليوم أن يقتدي به في…».'},
  {t:'نموذج أسئلة الامتحان (مصحَّح)',
   p:'<b>س1 (1 ن) :</b> متى وقع صلح الحديبية ؟ وما سببه المباشر ؟ ← ذو القعدة 6 هـ ؛ صدّ قريش للمسلمين عن العمرة.<br><b>س2 (1 ن) :</b> اذكر بندين من بنود الصلح ← هدنة عشر سنين ؛ من جاء محمدا من قريش بلا إذن وليه رُدّ، ومن جاء قريشا من المسلمين لم يُردّ.<br><b>س3 (1 ن) :</b> لماذا اعتبر القرآن الصلح فتحا ؟ ← لأنه حقق الأمن للدعوة واعتراف قريش بالمسلمين وتفرغهم لأعداء آخرين فكثر الداخلون في الإسلام.<br><b>س4 (1 ن) :</b> ما سبب فتح مكة ؟ ← نقض قريش للعهد بإعانة بني بكر على خزاعة.<br><b>س5 (1 ن) :</b> استخرج قيمة من قول النبي «اذهبوا فأنتم الطلقاء» واربطها بسورة يوسف ← العفو عند المقدرة ؛ «لا تثريب عليكم اليوم».',
   k:'<b>احذر :</b> الحديبية سنة 6 وفتح مكة سنة 8، وخيبر بينهما (7 هـ).'}
 ],

 tip:'سورة يوسف مكية (111 آية)، نزلت في عام الحزن تسلية للنبي ﷺ، وهي السورة الوحيدة التي تروي قصة كاملة متسلسلة. في الامتحان : <b>إتمام كتابة آيات</b> من أي شطر، و<b>الاستشهاد بآية</b> لمعنى (الصبر، العفة، التوكل، العفو)، و<b>استخلاص العبر</b>. احفظ من المصحف، واستعمل هذا الدرس للفهم والمراجعة.',
 episodes:[
  {t:'سياق الشطر ومحاوره',svg:kh,cap:'من الرؤيا إلى بيت العزيز : بداية سلسلة الابتلاءات.',
   p:'تفتتح السورة بالحروف المقطعة والثناء على القرآن العربي المبين، وتعد النبي ﷺ بـ«أحسن القصص». ثم يروي يوسف عليه السلام لأبيه يعقوب رؤياه : <b>أحد عشر كوكبا والشمس والقمر له ساجدين</b>، فيأمره أبوه بكتمانها عن إخوته خوف الحسد والشيطان، ويبشره بالاجتباء وتعليم تأويل الأحاديث. ويأتمر الإخوة : «ليوسف وأخوه أحب إلى أبينا منا»، فيقترح أحدهم إلقاءه في غيابة الجب بدل قتله، ويستأذنون أباهم بحجة اللعب والرتع، ويعودون عشاء يبكون بالدم الكذب على قميصه، فيجيب يعقوب : <b>«بل سولت لكم أنفسكم أمرا فصبر جميل والله المستعان على ما تصفون»</b>. وتلتقطه سيارة فيبيعونه <b>بثمن بخس دراهم معدودة</b>، ويشتريه عزيز مصر قائلا لامرأته : «أكرمي مثواه عسى أن ينفعنا أو نتخذه ولدا». ويختم الشطر : <b>«والله غالب على أمره ولكن أكثر الناس لا يعلمون»</b>.',
   k:'<b>آيات للاستشهاد :</b> الصبر : «فصبر جميل والله المستعان» (18) · تدبير الله : «والله غالب على أمره» (21) · خطر الحسد : «فيكيدوا لك كيدا إن الشيطان للإنسان عدو مبين» (5) · أحسن القصص (3).'},
  {t:'شرح المفردات',

   k:'<b>قاعدة تجويدية مطلوبة أحيانا :</b> في «الر» مدّ لازم حرفي (6 حركات) في «لام» و«را» مد طبيعي … وفي «نحن نقص» إدغام بغنة (نون ساكنة + نون). راجع أحكام النون الساكنة والتنوين والمدود.'},
  {t:'المضامين والدروس والعبر',
   p:'<b>المضامين :</b> 1) إعجاز القرآن وأفضلية قصصه ؛ 2) رؤيا يوسف وتأويلها الضمني بالنبوة والملك ؛ 3) وصية يعقوب بكتمان النعمة اتقاء الحسد ؛ 4) حسد الإخوة ومكرهم ونتيجته ؛ 5) صبر يعقوب وتوكله ؛ 6) تدبير الله الخفي الذي يحول المحنة إلى منحة. <b>الدروس والعبر :</b> الحسد داء يُفسد الأخوة ويدفع إلى الجريمة ← وجوب تزكية النفس ؛ <b>كتمان النعم</b> عمن يُخشى حسده حكمة ؛ <b>الصبر الجميل</b> هو الصبر بلا جزع ولا شكوى ؛ <b>العدل بين الأبناء</b> في الظاهر يقي من الحسد ؛ الشر الذي يصيب المؤمن قد يكون طريقا إلى الخير («والله غالب على أمره») ؛ المحنة مرحلة من مراحل التمكين. <b>الربط بالمداخل :</b> القسط (الصبر واليقين)، الاقتداء (التوكل مع الأخذ بالأسباب : تربية يعقوب لأبنائه)، الاستجابة (رعاية الأطفال : الأب المربي).',
   k:'<b>قالب جواب «استخلص عبرة» :</b> «يُستفاد من الآيات أن… والدليل قوله تعالى :…، ومن تطبيقاتها في حياتنا…».'},
  {t:'نموذج أسئلة الامتحان (مصحَّح)',

addRedac('is',[
 {t:'النموذج 1 · أمين بين الرشوة والإغراء وغلاء المهور (مجاني)',
  sujet:'أمين شاب في السادسة والعشرين، تخرج بتفوق وعُيّن محاسبا في مؤسسة عمومية. عرض عليه مقاول مبلغا ماليا مقابل تمرير فاتورة مضخمة، وقال له : «الجميع يفعل ذلك ولن يعلم أحد». وفي الوقت نفسه كانت زميلة له ذات نفوذ في الإدارة تراوده عن نفسه وتلمّح إلى ترقيته إن استجاب. وكان أمين يعتزم الزواج من فتاة متدينة لكن أهلها اشترطوا مهرا باهظا، فأصابه الإحباط وقال لصديقه : «لعلي أقبل المال فأحل كل مشاكلي». تذكّر أمين قول الله تعالى على لسان يوسف عليه السلام : «قال رب السجن أحب إلي مما يدعونني إليه…».',
  paras:[
   {type:'i',lab:'توجيهات عامة · 1 ساعة · المعامل 2',txt:'اقرأ الوضعية مرتين، ضع خطا تحت المشكلات (الرشوة، المراودة، غلاء المهر، الإحباط) وتحت المدخل الذي تنتمي إليه كل مشكلة. أجب بالترتيب، واكتب رقم السؤال، واستشهد في كل جواب بنص شرعي ولو قصيرا. وزّع الوقت : 10 دقائق للقراءة، 40 للإجابة، 10 للمراجعة.'},
   {type:'a',lab:'س1 · حدد المشكلة المطروحة في الوضعية (1 ن)',txt:'تطرح الوضعية مشكلة شاب يتعرض لثلاثة اختبارات متزامنة : إغراء مالي (الرشوة) يهدد أمانته المهنية، وإغراء شهواني (المراودة) يهدد عفته، وعائق اجتماعي (غلاء المهور) يعطل زواجه ؛ فيقف بين الثبات على القيم والاستسلام تحت ضغط الإحباط.'},
   {type:'a',lab:'س2 · أتمم الآية الكريمة واذكر سياقها (1 ن)',txt:'«قال رب السجن أحب إلي مما يدعونني إليه وإلا تصرف عني كيدهن أصب إليهن وأكن من الجاهلين» (يوسف 33). السياق : بعد أن هددته امرأة العزيز بالسجن إن لم يستجب، وبعد كيد النسوة، آثر يوسف السجن على المعصية ودعا الله أن يصرف عنه كيدهن.'},
   {type:'a',lab:'س3 · اشرح : «أصب إليهن» · «كيدهن» (1 ن)',txt:'أصب إليهن : أمِل إليهن وأستجب لهن. كيدهن : مكرهن وحيلتهن.'},
   {type:'a',lab:'س4 · استخرج من الآية القيمة التي تنفع أمين في موقفه مع زميلته (1 ن)',txt:'قيمة العفة والمراقبة : كما آثر يوسف السجن على الفاحشة رغم توفر الإغراء والأمان من الفضيحة، على أمين أن يرفض المراودة ولو ضحّى بالترقية ؛ وهو من الصنف الخامس في حديث السبعة : «رجل طلبته امرأة ذات منصب وجمال فقال إني أخاف الله».'},
   {type:'a',lab:'س5 · ما حكم ما عُرض على أمين من مال ؟ استدل وبيّن أثره على المجتمع (2 ن)',txt:'المال المعروض رشوة محرمة بإجماع : «لعن الله الراشي والمرتشي» (الترمذي)، وهو أكل لأموال الناس بالباطل : «ولا تأكلوا أموالكم بينكم بالباطل وتدلوا بها إلى الحكام». وحجة «الجميع يفعل ذلك» باطلة لأن المسؤولية فردية : «كل نفس بما كسبت رهينة». أثرها على المجتمع : نهب المال العام، ضعف المرافق، انهيار الثقة، تعطيل التنمية، وإحباط النزهاء ؛ وهي من إضاعة الأمانة التي قال عنها النبي ﷺ : «فانتظر الساعة».'},
   {type:'a',lab:'س6 · بيّن العلاقة بين الأمانة والمسؤولية من خلال وظيفة أمين، مع الاستدلال من سورة يوسف (2 ن)',txt:'وظيفة أمين أمانة ائتمنه المجتمع عليها، ومسؤولية يُسأل عنها أمام الله والقانون : «كلكم راع وكلكم مسؤول عن رعيته». فالمسؤولية أمانة، والأمانة لا تؤدى إلا بشعور بالمسؤولية ؛ وقد جمعهما يوسف حين طلب خزائن مصر : «اجعلني على خزائن الأرض إني حفيظ عليم» : حفيظ = أمين، عليم = كفء مسؤول ؛ وشهد لنفسه : «ذلك ليعلم أني لم أخنه بالغيب». فعلى أمين أن يكون حفيظا على مال المؤسسة في غيبة الرقيب.'},

   {type:'a',lab:'س8 · حدد المدخل الذي تنتمي إليه كل مشكلة في الوضعية (2 ن)',txt:'الرشوة ← مدخل القسط : الأمانة والمسؤولية (ومدخل الحكمة : الكفاءة والاستحقاق). المراودة ← مدخل القسط : العفة والحياء (ومدخل الحكمة : وقاية المجتمع من الفواحش ؛ ومدخل التزكية : الشطر الثاني من سورة يوسف). غلاء المهر ← مدخل الاستجابة : الزواج أحكامه ومقاصده. الإحباط ← مدخل القسط : الصبر واليقين.'},
   {type:'a',lab:'س9 · ما القيمة التي يحتاجها أمين لمواجهة إحباطه ؟ استدل من سورة يوسف (2 ن)',txt:'يحتاج إلى الصبر واليقين : الصبر عن المعصية (المال الحرام والفاحشة) والصبر على البلاء (تأخر الزواج)، مع اليقين بأن الله يعوّض من ترك شيئا له : «وليستعفف الذين لا يجدون نكاحا حتى يغنيهم الله من فضله». ويوسف صبر على الجب والرق والفتنة والسجن بيقين فكان التمكين : «إنه من يتق ويصبر فإن الله لا يضيع أجر المحسنين» (يوسف 90) ؛ والصبر لا يعني الاستسلام بل الأخذ بالأسباب : الحوار مع الأهل، الادخار، طلب الوساطة.'},
   {type:'a',lab:'س10 · اقترح على أمين ثلاثة حلول عملية مستندة إلى الدرس (2 ن)',txt:'1) رفض الرشوة والتبليغ عن المقاول عبر القنوات القانونية، حفاظا على أمانته ومسؤوليته. 2) قطع الطريق على المراودة : تجنب الخلوة بزميلته، الحزم في الرفض، والتماس النقل عند الضرورة، اقتداء بيوسف الذي فرّ إلى الباب. 3) التفاوض مع أهل الفتاة بحكمة عبر وسيط من أهل الخير وتذكيرهم بالسنة في تيسير المهر، أو تأجيل بعض المؤخر، مع الصوم والاشتغال في انتظار اليسر : «ومن لم يستطع فعليه بالصوم فإنه له وجاء».'},
   {type:'a',lab:'س11 · تحرير : اكتب فقرة (8 أسطر) تبين فيها كيف يحمي الثبات على القيم الفرد والمجتمع، موظفا ما درست (4 ن)',txt:'إن الثبات على القيم في لحظات الإغراء هو المحك الحقيقي للإيمان ؛ فحين يرفض الموظف الرشوة ويصون نفسه عن الفاحشة، فإنه يحمي أولا نفسه من عذاب الله ومن الندم والفضيحة، ويحفظ كرامته التي لا تُشترى : «وما زاد الله عبدا بعفو إلا عزا». ويحمي ثانيا أسرته التي سيبنيها على حلال طيب، فالبيت القائم على المال الحرام لا بركة فيه. ويحمي ثالثا مجتمعه، لأن المال العام أمانة الجميع، ولأن انتشار الرشوة والفواحش ينذر بالفساد الشامل : «ظهر الفساد في البر والبحر بما كسبت أيدي الناس». وقد أعطانا يوسف عليه السلام النموذج : شاب غريب مملوك قال «معاذ الله» ثم «رب السجن أحب إلي»، فمكّن الله له وجعله على خزائن الأرض «حفيظا عليما». فالثبات مؤقت المشقة دائم الثمرة، وهو طريق المسلم ليكون من السبعة الذين يظلهم الله يوم لا ظل إلا ظله.'},

var API='https://jihawi-api.synergieinfra.workers.dev',FREE_CH=1,PAID_V='f78abe6a';
var S={oeuvre:null,view:'home',chap:null,list:'chapitres',hist:[],answers:{},exam:null,full:false,lic:null};
var $=function(id){return document.getElementById(id)};
function store(k,v){try{localStorage.setItem('bp_'+k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{var v=localStorage.getItem('bp_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function fmt(n){return (Math.round(n*10)/10).toString().replace('.',',');}
function esc(s){return String(s).replace(/</g,'&lt;');}
function cur(){return BAM.oeuvres[S.oeuvre];}

var _tapN=0,_tapT=0;function titleTap(){var n=Date.now();if(n-_tapT>1500)_tapN=0;_tapT=n;if(++_tapN>=7){_tapN=0;adminLogin();}}
function setTitle(t,s){$('title').childNodes[0].nodeValue=t;$('sub').textContent=s||'';}
function go(view,opt,noHist){
  if(!noHist)S.hist.push({view:S.view,chap:S.chap,list:S.list});
  S.view=view;if(opt&&opt.chap!==undefined)S.chap=opt.chap;if(opt&&opt.list)S.list=opt.list;else if(view!=='chap')S.list='chapitres';
  render();window.scrollTo(0,0);
}
function goBack(){var h=S.hist.pop();if(!h)return go('home',null,true);S.view=h.view;S.chap=h.chap;S.list=h.list||'chapitres';render();window.scrollTo(0,0);}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){
  if(b.dataset.v!=='home'&&!S.oeuvre){go('home');return;}
  S.hist=[];go(b.dataset.v,null,true);
});});


/* ---------- textes d'interface (français par défaut ; une matière peut fournir o.ui) ---------- */
var UI_FR={cours:'Cours',entr:'Entraînement',chrono:'Chronologie',outils:'Outils d\'analyse sur ce chapitre',notion:'Notion',dansCh:'Dans ce chapitre',retenir:'À retenir pour l\'examen',passer:'Passer à l\'entraînement →',recommencer:'Recommencer',suivant:'Chapitre suivant →',locked:'version<br>complète',debloquer:'Débloquer tous les chapitres',listTip:'Chaque chapitre : résumé illustré, points clés, puis entraînement type régional.',dernier:'dernier score',afaire:'à faire',placeholder:'Rédigez votre réponse…',voirCorrige:'Voir le corrigé modèle',corrige:'Corrigé modèle :',nonAcquis:'Non acquis',partiel:'Partiel',acquis:'Acquis',explication:'Explication :',score:'Score : ',repondues:' répondues',note:'Note : ',examTitle:'Examen blanc',examTip:'10 questions tirées au sort dans tous les chapitres, 20 minutes, note sur 20. Comme le jour J : pas de retour en arrière.',qcm:'QCM chronométré',flash:'Flashcards',flashTip:'Touchez la carte pour la retourner.',lancer:'Lancer un examen blanc',carteSuiv:'Carte suivante →',definissez:'Définissez',temps:'Temps restant : ',termine:'Terminé',redacTitle:'Rédactions modèles',redacTip:'Une rédaction complète par thème, au format attendu le jour de l\'examen (15 à 20 lignes). Touchez un titre pour l\'ouvrir. Les connecteurs sont surlignés.',sujet:'Sujet :',labels:{i:'Introduction',a:'Argument',c:'Conclusion',t:'Thèse',at:'Antithèse'},persos:'Les personnages',persosTip:'Touchez une carte pour voir le détail. À l\'examen : « présentez ce personnage en 2-3 phrases ».',schema:'Schéma des relations',licence:'usage personnel'};
function T(k){var o=cur();return (o&&o.ui&&o.ui[k]!==undefined)?o.ui[k]:UI_FR[k];}
function setDir(o){var rtl=!!(o&&o.rtl&&S.view!=='home'&&S.view!=='francais'&&S.view!=='licence'&&S.view!=='admin');document.documentElement.dir=rtl?'rtl':'ltr';document.documentElement.lang=rtl?'ar':'fr';document.body.classList.toggle('rtl',rtl);}
function chapList(o){return S.list==='langue'?(o.langue||[]):o.chapitres;}
function progKey(o,i){return o.id+(S.list==='langue'?'_L':'_')+i;}
function render(){
  var m=$('main');setDir(cur());
  var oo=cur(),nv=(oo&&oo.nav)||{};document.querySelectorAll('nav button').forEach(function(b){var v=b.dataset.v;var on=v===S.view||(S.view==='chap'&&((S.list==='langue'&&v==='persos')||(S.list!=='langue'&&v==='chapitres')));b.classList.toggle('on',on);if(v!=='home'){var l=b.querySelector('span.l');if(l)l.textContent=(S.view!=='home'&&S.view!=='francais'&&nv[v])||l.dataset.fr;}});
  $('back').classList.toggle('show',S.hist.length>0);
  var o=cur();
  if(S.view==='home')return renderHome(m);
  if(S.view==='licence')return renderLicence(m);
  if(S.view==='admin')return renderAdmin(m);
  if(S.view==='francais')return renderFrancais(m);
  if(!o)return renderHome(m);
  setTitle(o.titre,o.auteur+' · '+o.genre);
  if(S.view==='oeuvre')m.innerHTML=o.fiche;
  else if(S.view==='chapitres'){S.list='chapitres';renderChapList(m,o);}
  else if(S.view==='chap')renderChap(m,o,chapList(o)[S.chap]);
  else if(S.view==='persos'){if(o.langue){S.list='langue';renderChapList(m,o);}else renderPersos(m,o);}
  else if(S.view==='exam')renderExam(m,o);
  else if(S.view==='methode')renderMethode(m,o);
}
function renderMethode(m,o){
  var h=o.methode;
  if(o.redactions&&o.redactions.length){
    h+='<div class="card"><h2>'+T('redacTitle')+'</h2><p class="tip">'+T('redacTip')+'</p>';
    o.redactions.forEach(function(r,i){
      h+='<div class="redac" id="rd'+i+'"><button onclick="this.parentNode.classList.toggle(\'open\')"><span class="n">'+(i+1)+'</span><b>'+r.t+'</b><span class="ch">›</span></button><div class="body"><div class="sujet"><b>'+T('sujet')+'</b> '+r.sujet+'</div>';
      if(o.rtl){h+='<div class="plan"><b>الهيكل :</b> '+r.paras.map(function(p,k){return '<span class="pl '+p.type+'">'+(k+1)+' · '+String(p.lab||T('labels')[p.type]||p.type).split(' · ')[0]+'</span>';}).join('<span class="ar">←</span>')+'</div>';}
      r.paras.forEach(function(p){h+='<p class="para '+p.type+'"><span class="lab">'+(p.lab||T('labels')[p.type]||p.type)+'</span>'+hiliteConn(p.txt)+'</p>';});
      if(o.rtl){var used=[];r.paras.forEach(function(p){CONN_AR.forEach(function(c){if(used.indexOf(c)<0&&new RegExp('(^|[\\s(«])'+c+'(?=[\\s،,;:.!؟»)])').test(p.txt))used.push(c);});});
        if(used.length)h+='<div class="rab"><b>تقنيات الربط المستعملة :</b> '+used.map(function(c){return '<mark class="conn">'+c+'</mark>';}).join(' ')+'</div>';}
      if(r.note)h+='<div class="note">💡 '+r.note+'</div>';
      h+='</div></div>';
    });
    h+='</div>';
  }
  m.innerHTML=h;
}
var CONN=['De nos jours','Il est fréquent de constater que','La question se pose de savoir si','Tout d\'abord','D\'abord','Ensuite','De plus','Par ailleurs','En outre','Enfin','Par exemple','Ainsi','Comme le montre','Cependant','Toutefois','Néanmoins','Certes','mais','En effet','Car','Donc','C\'est pourquoi','Par conséquent','En somme','Pour conclure','En définitive','D\'une part','D\'autre part','En revanche','Au contraire','Il est vrai que','Pourtant','Or','Finalement'];
var CONN_AR=['أولا','ثانيا','ثالثا','بداية','في البداية','من جهة','من جهة أخرى','فضلا عن ذلك','علاوة على ذلك','إضافة إلى ذلك','زد على ذلك','كذلك','أيضا','مثلا','على سبيل المثال','خير دليل على ذلك','والدليل على ذلك','لكن','غير أن','بيد أن','إلا أن','في المقابل','على العكس من ذلك','صحيح أن','لا شك أن','مما لا شك فيه','ذلك أن','لأن','بما أن','لذلك','ولذلك','وبالتالي','ومن ثم','وعليه','إذن','خلاصة القول','وخلاصة القول','في الختام','وفي الأخير','ختاما','وهكذا','بناء على ما سبق','ومجمل القول','في نظري','وفي رأيي','أعتقد أن'];
function hiliteConn(t){var o=cur();if(o&&o.rtl){CONN_AR.forEach(function(c){var re=new RegExp('(^|[\\s(«])('+c+')(?=[\\s،,;:.!؟»)])','g');t=t.replace(re,'$1<mark class="conn">$2</mark>');});return t;}CONN.forEach(function(c){var re=new RegExp('(^|[\\s(«])('+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?=[\\s,;:.!?»)])','g');t=t.replace(re,'$1<mark class="conn">$2</mark>');});return t;}

/* ---------- accueil ---------- */
var MOD_META={bam:{ic:'feather',t:'La Boîte à merveilles',a:'Ahmed Sefrioui · roman autobiographique',c:'linear-gradient(135deg,#b5452c,#d9a441)'},
            antigone:{ic:'mask',t:'Antigone',a:'Jean Anouilh · tragédie moderne',c:'linear-gradient(135deg,#1f6f78,#2b2118)'},
            ddc:{ic:'scale',t:'Le Dernier Jour d\'un condamné',a:'Victor Hugo · roman à thèse',c:'linear-gradient(135deg,#4a3b5c,#8a6d3b)'},
            francais:{ic:'book',t:'Français',a:'Les trois œuvres au programme · l\'épreuve : analyse, langue, production écrite',c:'linear-gradient(135deg,#b5452c,#2b2118)'},
            fr:{ic:'pencil',t:'Épreuve de français',a:'Référentiel · outils d\'analyse · langue · production écrite',c:'linear-gradient(135deg,#2b2118,#1f6f78)'},
            ar:{ic:'pen',t:'اللغة العربية',a:'الشعب العلمية والتقنية · النصوص، علوم اللغة، التعبير والإنشاء',c:'linear-gradient(135deg,#0f5e4a,#1f8a6a)',rtl:true},
            hg:{ic:'globe',t:'الاجتماعيات',a:'الشعب العلمية والتقنية · التاريخ والجغرافيا',c:'linear-gradient(135deg,#6b3f1d,#b5452c)',rtl:true},
            is:{ic:'mosque',t:'التربية الإسلامية',a:'جميع الشعب · التزكية، الاقتداء، الاستجابة، القسط، الحكمة',c:'linear-gradient(135deg,#1f4f78,#2b7a8a)',rtl:true}};
var MOD_ICO={"book": "<svg viewBox=\"0 0 24 24\"><path d=\"M12 6c-1.5-1.3-3.5-2-6-2H3v14h3c2.5 0 4.5.7 6 2 1.5-1.3 3.5-2 6-2h3V4h-3c-2.5 0-4.5.7-6 2zM12 6v14\"/></svg>", "pen": "<svg viewBox=\"0 0 24 24\"><path d=\"M14 3l7 7-9.5 9.5L4 21l1.5-7.5L14 3zM12.5 8.5l3 3M4 21l5-5\"/><circle cx=\"11\" cy=\"13\" r=\"1.2\"/></svg>", "globe": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18M5 7.5h14M5 16.5h14\"/></svg>", "mosque": "<svg viewBox=\"0 0 24 24\"><path d=\"M2 21h20M5 21v-8h14v8M5 13c0-3.5 3.5-5.5 7-8.5 3.5 3 7 5 7 8.5M12 4.5V2.5M20.5 13V8l1-2.5L22.5 8v13M1.5 21V8l1-2.5L3.5 8v5M10 21v-4.5h4V21\"/></svg>", "feather": "<svg viewBox=\"0 0 24 24\"><path d=\"M20 4c-6 0-11 4-13 10l-3 6 6-3c6-2 10-7 10-13zM4 20l9-9M9 15h4\"/></svg>", "mask": "<svg viewBox=\"0 0 24 24\"><path d=\"M4 5h16v7c0 4-3.5 7-8 7s-8-3-8-7V5z\"/><path d=\"M8 10c.7-.8 1.8-.8 2.5 0M13.5 10c.7-.8 1.8-.8 2.5 0M8.5 14c2 1.5 5 1.5 7 0\"/></svg>", "scale": "<svg viewBox=\"0 0 24 24\"><path d=\"M12 3v18M5 21h14M12 6l-6 2 6-2 6 2M6 8l-3 7h6l-3-7zM18 8l-3 7h6l-3-7z\"/></svg>", "pencil": "<svg viewBox=\"0 0 24 24\"><path d=\"M4 20l4-1L19 8l-3-3L5 16l-1 4zM14 7l3 3M4 20h16\"/></svg>"};
function modCard(id){var x=MOD_META[id];var ico='<span class="ico">'+(MOD_ICO[x.ic]||MOD_ICO.book)+'</span>';if(id==='francais'){return '<button class="oeuvre" style="background:'+x.c+'" onclick="go(\'francais\')">'+ico+'<span class="tx"><b>'+x.t+'</b><small>'+x.a+'</small></span><span class="chev">›</span></button>';}var ok=!!BAM.oeuvres[id];
    return '<button class="oeuvre'+(ok?'':' soon')+'" style="background:'+x.c+(x.rtl?';direction:rtl;text-align:right':'')+'" '+(ok?'onclick="openOeuvre(\''+id+'\')"':'disabled')+'>'+ico+'<span class="tx"><b>'+x.t+'</b><small>'+x.a+'</small></span><span class="chev">'+(x.rtl?'‹':'›')+'</span>'+(ok?'':'<span class="ribbon">'+(x.rtl?'قريبا':'BIENTÔT')+'</span>')+'</button>';}
function renderFrancais(m){
  setTitle('Français','1ʳᵉ année bac · Examen régional');
  var h='<div class="card"><h2>Français</h2><p class="tip">L\'examen régional porte sur les trois œuvres au programme (étude de texte) et sur l\'épreuve elle-même : outils d\'analyse, langue et production écrite.</p><div class="oeuvres">';
  h+='<p class="mat">1. Les œuvres au programme</p>'+modCard('bam')+modCard('antigone')+modCard('ddc');
  h+='<p class="mat">2. L\'épreuve : analyse, langue, production écrite</p>'+modCard('fr');
  h+='</div></div>';m.innerHTML=h;
}
function renderHome(m){
  setTitle('Jihawi Prépa','1ʳᵉ année bac · Examen régional');
  var h='<div class="install" id="install"><img src="icon-192.png" alt=""><div class="t"><b>Installer l\'application</b>Icône sur l\'écran d\'accueil, fonctionne hors connexion.</div><button class="ok" onclick="doInstall()">Installer</button><button class="no" onclick="hideInstall(true)">✕</button></div>';
  h+='<div class="card"><h2>Choisissez une matière</h2><p class="tip">Tout le programme de la 1ʳᵉ année bac pour l\'examen régional, matière par matière.</p><div class="oeuvres">';
  h+='<p class="mat">Français</p>'+modCard('francais');
  h+='<p class="mat">المواد بالعربية</p>'+modCard('ar')+modCard('hg')+modCard('is');
  h+='</div></div>';
  var p=load('prog',{}),tot=0,done=0;
  Object.keys(BAM.oeuvres).forEach(function(id){BAM.oeuvres[id].chapitres.forEach(function(c,i){tot++;if(p[id+'_'+i])done++;});});
  h+=licCard();
  if(admKey())h+='<div class="card adm"><h2>Administration</h2><p class="tip">Visible uniquement sur cet appareil.</p><button class="btn w" onclick="go(\'admin\')">Gérer les codes de licence</button></div>';
  h+='<div class="card"><h2>Votre progression</h2><div class="stat"><div><b>'+done+'/'+tot+'</b><small>chapitres travaillés</small></div><div><b>'+(load('examBest',null)===null?'—':fmt(load('examBest',0))+'/20')+'</b><small>meilleur examen blanc</small></div></div></div>';
  m.innerHTML=h;refreshInstall();
}
/* ---------- Licence : activation, contenu payant, cache, vérification ---------- */
function deviceId(){var d=load('dev',null);if(!d){d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);store('dev',d);}return d;}
function loadPaid(src){try{new Function(src)();S.full=true;return true;}catch(e){return false;}}
function initLicence(){
  if(BAM.preview){S.full=true;S.lic={code:'APERCU-COMPLET',nom:'Aperçu de validation',exp:Date.now()+30*86400000};return;}
  S.lic=load('lic',null);var src=null;try{src=localStorage.getItem('jp_paid');}catch(e){}
  if(S.lic&&src){if(!loadPaid(src)){S.lic=null;}}else{S.lic=null;}
  // contenu payant plus récent que la copie locale (nouveau module, corrections) : on le récupère en arrière-plan
  if(S.lic&&navigator.onLine&&load('paidV',null)!==PAID_V&&S.lic.token){
    fetch(API+'/content?tok='+encodeURIComponent(S.lic.token)).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(nsrc){
      try{new Function(nsrc);}catch(e){return;}
      try{localStorage.setItem('jp_paid',nsrc);}catch(e){return;}
      store('paidV',PAID_V);
      var t=$('toast');if(t){t.querySelector('span').textContent=(cur()&&cur().rtl)?'محتوى جديد متاح.':'Nouveau contenu disponible.';t.classList.add('show');}
    }).catch(function(){});
  }
  if(S.lic&&navigator.onLine&&Date.now()-(S.lic.checked||0)>7*86400000){
    fetch(API+'/check?tok='+encodeURIComponent(S.lic.token)).then(function(r){return r.json();}).then(function(j){
      if(j&&j.ok){S.lic.checked=Date.now();S.lic.exp=j.exp;store('lic',S.lic);}
      else if(j&&j.ok===false){clearLicence('Votre licence n\'est plus valide (désactivée ou expirée).');}
    }).catch(function(){});
  }
}
function clearLicence(msg){S.lic=null;S.full=false;try{localStorage.removeItem('jp_paid');}catch(e){}store('lic',null);if(msg)alert(msg);location.reload();}
function licCard(){
  if(S.full&&S.lic){return '<div class="card lic ok"><h2>Licence active ✓</h2><p>'+(S.lic.nom?'<b>'+esc(S.lic.nom)+'</b> · ':'')+'code <code>'+S.lic.code+'</code><br><span class="tip">Valable jusqu\'au '+new Date(S.lic.exp).toLocaleDateString('fr-MA')+' · '+'tous les chapitres et rédactions sont débloqués, hors ligne compris.</span></p></div>';}
  return '<div class="card lic"><h2>Version démo</h2><p>Les premières leçons de chaque module (français, العربية, الاجتماعيات, التربية الإسلامية), les fiches, flashcards et la méthode sont gratuits. La version complète débloque les <b>'+countLocked()+' autres leçons</b>, les traductions arabes et <b>toutes les rédactions et sujets d\'examen corrigés</b>.</p><button class="btn w" onclick="go(\'licence\')">J\'ai un code · Activer</button><a class="btn wa w" href="https://wa.me/212661996001?text='+encodeURIComponent('Bonjour, je souhaite un code d\'activation Jihawi Prépa (version complète).')+'" target="_blank" rel="noopener">💬 Demander un code sur WhatsApp</a><p class="tip" style="margin-top:6px;text-align:center">+212 661 996 001 · réponse rapide</p></div>';
}
function countLocked(){var n=0;Object.keys(BAM.oeuvres).forEach(function(id){var o=BAM.oeuvres[id];n+=(o.locked||[]).length+(o.lockedL||[]).length;});return n;}
function renderLicence(m){
  setTitle('Jihawi Prépa','Activation de la licence');
  if(S.full){m.innerHTML=licCard()+'<div class="card"><button class="btn ghost w" onclick="if(confirm(\'Retirer la licence de cet appareil ?\'))clearLicence()">Retirer la licence de cet appareil</button></div>';return;}
  m.innerHTML='<div class="card"><h2>Activer la version complète</h2><p class="tip">Entrez le code reçu. Il est lié à cet appareil (2 appareils maximum par code). Connexion Internet nécessaire une seule fois : ensuite tout fonctionne hors ligne.</p>'
   +'<label class="lab">Code de licence</label><input id="licCode" class="inp" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" oninput="this.value=fmtCode(this.value)">'
   +'<label class="lab">Votre nom et prénom</label><input id="licNom" class="inp" placeholder="ex. Yassine El Amrani" maxlength="40">'
   +'<label class="lab">Votre numéro WhatsApp (celui qui a demandé le code)</label><input id="licTel" class="inp" placeholder="06 XX XX XX XX" inputmode="tel" maxlength="20">'
   +'<button class="btn w" id="licBtn" onclick="activate()">Activer</button><div id="licMsg" class="tip" style="margin-top:8px"></div></div>'
   +'<div class="card"><h3 style="margin-top:0">Comment obtenir un code ?</h3><p>Le code est envoyé sur WhatsApp après paiement et reste valable toute l\'année scolaire, sur 2 appareils.</p><a class="btn wa w" href="https://wa.me/212661996001?text='+encodeURIComponent('Bonjour, je souhaite un code d\'activation Jihawi Prépa (version complète).')+'" target="_blank" rel="noopener">💬 Demander un code sur WhatsApp</a><p class="tip" style="margin-top:6px;text-align:center">+212 661 996 001</p></div>';
}
function fmtCode(v){v=v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);return v.replace(/(.{4})(?=.)/g,'$1-');}
function activate(){
  var code=($('licCode').value||'').trim(),nom=($('licNom').value||'').trim(),tel=($('licTel').value||'').trim(),msg=$('licMsg'),btn=$('licBtn');
  if(code.length!==14){msg.textContent='Le code doit comporter 12 caractères (XXXX-XXXX-XXXX).';return;}
  if(!nom){msg.textContent='Indiquez votre nom et prénom.';return;}
  if(!normTel(tel)){msg.textContent='Indiquez un numéro WhatsApp valide (ex. 0661996001).';return;}
  if(!navigator.onLine){msg.textContent='Connectez-vous à Internet pour activer (une seule fois).';return;}
  btn.disabled=true;msg.textContent='Vérification…';
  fetch(API+'/activate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:code,device:deviceId(),nom:nom,tel:normTel(tel)})})
  .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
  .then(function(x){
    if(x.s!==200)throw new Error(x.j.error||'Activation refusée');
    msg.textContent='Code accepté. Téléchargement du contenu…';
    return fetch(API+'/content?tok='+encodeURIComponent(x.j.token)).then(function(r){if(!r.ok)throw new Error('Téléchargement impossible ('+r.status+')');return r.text();}).then(function(src){
      if(!loadPaid(src))throw new Error('Contenu invalide');
      try{localStorage.setItem('jp_paid',src);}catch(e){throw new Error('Mémoire du téléphone insuffisante');}
      store('paidV',PAID_V);
      S.lic={code:code,nom:x.j.nom||nom,exp:x.j.exp,token:x.j.token,checked:Date.now()};store('lic',S.lic);
      msg.textContent='Activation réussie !';setTimeout(function(){S.hist=[];go('home',null,true);},600);
    });
  }).catch(function(e){msg.textContent='✗ '+e.message;btn.disabled=false;});
}

  });

  else el.innerHTML=rows.join('');

var QZ=[],QMODE='chap';
function renderQuiz(list,mode){
  QZ=list;QMODE=mode;S.answers={};
  var box=$('quiz');box.innerHTML='';
  list.forEach(function(q,i){
    var d=document.createElement('div');d.className='q';
    var h='<span class="tag">'+(i+1)+' · '+q.t+'</span><div class="stem">'+q.s+'</div>';
    if(q.open){
      h+='<textarea placeholder="'+T('placeholder')+'"></textarea><button class="btn alt" onclick="showModel('+i+')">'+T('voirCorrige')+'</button><div class="expl" id="ex'+i+'"><b>'+T('corrige')+'</b><br>'+q.m+'<div class="selfeval"><button onclick="selfEval('+i+',0,this)">'+T('nonAcquis')+'</button><button onclick="selfEval('+i+',0.5,this)">'+T('partiel')+'</button><button onclick="selfEval('+i+',1,this)">'+T('acquis')+'</button></div></div>';
    }else{
      q.o.forEach(function(o,j){h+='<button class="opt" id="o'+i+'_'+j+'" onclick="answer('+i+','+j+')"><span class="ol">'+(cur()&&cur().rtl?(j+1)+' ·':String.fromCharCode(65+j)+'.')+'</span> '+o+'</button>';});
      h+='<div class="expl" id="ex'+i+'"><b>'+T('explication')+'</b> '+q.e+'</div>';
    }
    d.innerHTML=h;box.appendChild(d);
  });
  updateScore();
}
function answer(i,j){
  if(S.answers[i]!==undefined)return;
  S.answers[i]=(j===QZ[i].a)?1:0;
  QZ[i].o.forEach(function(_,k){var b=$('o'+i+'_'+k);b.disabled=true;if(k===QZ[i].a)b.classList.add('good');else if(k===j)b.classList.add('bad');});
  $('ex'+i).classList.add('show');updateScore();
}
function showModel(i){$('ex'+i).classList.add('show');}
function selfEval(i,v,btn){S.answers[i]=v;btn.parentNode.querySelectorAll('button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');updateScore();}
function updateScore(){
  var done=Object.keys(S.answers).length,pts=0;for(var k in S.answers)pts+=S.answers[k];
  $('prog').style.width=Math.round(done/QZ.length*100)+'%';
  var s=$('score');if(done===0){s.textContent='';return;}
  s.textContent=T('score')+fmt(pts)+' / '+QZ.length+(done<QZ.length?' ('+done+T('repondues')+')':'');
  if(done===QZ.length){
    if(QMODE==='chap'){var p=load('prog',{});p[progKey(cur(),S.chap)]={pts:pts,tot:QZ.length};store('prog',p);}
    if(QMODE==='exam'){var n=Math.round(pts/QZ.length*200)/10;s.textContent=T('note')+fmt(n)+' / 20';var b=load('examBest',0);if(n>b)store('examBest',n);clearInterval(S.exam);}
  }
}

function examSeg(i,btn){document.querySelectorAll('.seg button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');$('eseg0').style.display=i?'none':'block';$('eseg1').style.display=i?'block':'none';}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startExam(){
  var o=cur(),pool=[];o.chapitres.concat(o.langue||[]).forEach(function(c){c.quiz.forEach(function(q){if(!q.open)pool.push(q);});});
  var list=shuffle(pool).slice(0,10),left=20*60;
  $('examzone').innerHTML='<p class="score">'+T('temps')+'<span class="timer" id="tm">20:00</span></p><div class="bar"><i id="prog"></i></div><div id="quiz"></div><div class="score" id="score"></div>';
  renderQuiz(list,'exam');
  clearInterval(S.exam);
  S.exam=setInterval(function(){left--;var mm=Math.floor(left/60),ss=left%60;var t=$('tm');if(!t){clearInterval(S.exam);return;}t.textContent=mm+':'+(ss<10?'0':'')+ss;if(left<=0){clearInterval(S.exam);t.textContent=T('termine');document.querySelectorAll('.opt').forEach(function(b){b.disabled=true});}},1000);
}
var FC=[],FI=0,FB=false;
function showCard(back){FB=back;var c=FC[FI];var f=$('flash');if(!f||!c)return;f.className='flash'+(back?' back':'');f.innerHTML=back?'<div><b>'+c.d+'</b></div>':'<div><small style="color:#7a6a58">'+T('definissez')+'</small><br><b style="font-size:1.1rem">'+c.n+'</b></div>';}
function flipCard(){showCard(!FB);}
function nextCard(){FI=(FI+1)%FC.length;showCard(false);}

/* ---------- init ---------- */
(function(){initLicence();var last=load('last',null);if(last&&BAM.oeuvres[last]){S.oeuvre=last;}go('home',null,true);})();
</script>
