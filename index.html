  {t:"Le bain maure : un cauchemar d'enfant",
   svg:'<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="160" fill="#c9dde1"/><path d="M0 0 h360 v30 q-180 30 -360 0Z" fill="#b7cfd4"/><g fill="none" stroke="#fff" stroke-width="2" opacity=".7"><path d="M40 140 q10-20 0-40 q-10-20 0-40"/><path d="M300 150 q12-22 0-44 q-12-22 0-44"/><path d="M180 150 q8-18 0-36"/></g><g fill="#9fb8bd"><path d="M20 160 V90 a40 40 0 0 1 80 0 V160Z"/><path d="M260 160 V90 a40 40 0 0 1 80 0 V160Z"/></g><g fill="#6d8a90"><ellipse cx="140" cy="130" rx="22" ry="30"/><circle cx="140" cy="92" r="12"/><ellipse cx="215" cy="135" rx="26" ry="25"/><circle cx="215" cy="102" r="13"/></g><g transform="translate(165,115)"><ellipse cx="12" cy="30" rx="10" ry="14" fill="#e3b58a"/><circle cx="12" cy="12" r="9" fill="#e3b58a"/><circle cx="9" cy="11" r="1.5" fill="#2b2118"/><circle cx="15" cy="11" r="1.5" fill="#2b2118"/><ellipse cx="12" cy="17" rx="2" ry="2.5" fill="#2b2118"/></g><g fill="#8a6d3b"><rect x="60" y="135" width="20" height="18" rx="3"/><rect x="280" y="138" width="18" height="16" rx="3"/></g><text x="180" y="22" text-anchor="middle" font-size="12" fill="#2b2118" font-weight="700">Vapeur, cris, corps inconnus…</text></svg>',
   cap:"Le hammam : chaleur, bruit, promiscuité — un enfer aux yeux de l'enfant",
   p:"La mère emmène l'enfant au <b>bain maure</b>. Pour lui, c'est un lieu <b>effrayant</b> : vapeur, chaleur, femmes qui crient, disputes autour des seaux. Il s'y sent <b>étranger</b>, perdu, et garde de cette expérience un <b>souvenir pénible</b>.",
   k:"<strong>Procédé clé :</strong> la description du bain est une <b>hyperbole</b> continue (l'enfant exagère), avec un <b>champ lexical de l'enfer</b> et du <b>malaise</b>."},
  {t:"La soirée des Gnaouas chez la Chouafa",
   svg:'<svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="170" fill="#3a2a4a"/><radialGradient id="glow1" cx=".5" cy=".6" r=".6"><stop offset="0" stop-color="#f3b54a" stop-opacity=".9"/><stop offset="1" stop-color="#3a2a4a" stop-opacity="0"/></radialGradient><rect width="360" height="170" fill="url(#glow1)"/><rect x="175" y="110" width="10" height="30" fill="#fff5d6"/><ellipse cx="180" cy="106" rx="5" ry="9" fill="#ffb347"/><g fill="#111"><ellipse cx="80" cy="130" rx="22" ry="30"/><circle cx="80" cy="90" r="14"/><ellipse cx="280" cy="130" rx="22" ry="30"/><circle cx="280" cy="90" r="14"/></g><g fill="#d9a441"><ellipse cx="55" cy="120" rx="8" ry="4"/><ellipse cx="105" cy="120" rx="8" ry="4"/></g><rect x="296" y="95" width="6" height="60" fill="#8a4b2a"/><ellipse cx="299" cy="150" rx="12" ry="8" fill="#c48a5a"/><g fill="#b5452c" opacity=".9"><path d="M165 150 q15-50 30-10 q10 25 -15 20Z"/><circle cx="188" cy="90" r="11"/></g><path d="M150 150 q15-50 30-10 q10 25 -15 20Z" fill="#b5452c" opacity=".35"/><path d="M230 150 q-8-14 0-26 q8-12 0-24" stroke="#ddd" fill="none" stroke-width="2" opacity=".6"/><text x="180" y="22" text-anchor="middle" font-size="12" fill="#f3e6c9" font-weight="700">Crotales, guembri, encens, transe</text></svg>',

   p:"La Chouafa organise une <b>cérémonie</b> avec des musiciens <b>Gnaouas</b> : encens, chants, crotales, danse jusqu'à la transe. Toute la maison vibre. L'enfant observe avec un mélange de <b>peur</b> et de <b>fascination</b>."},

   cap:"La querelle des voisines : la terrasse comme champ de bataille",

  {t:"Compréhension",s:"Qui est le narrateur de La Boîte à merveilles ?",o:["Ahmed Sefrioui lui-même, sous son vrai nom","Sidi Mohammed, un enfant de six ans, raconté par l'adulte qu'il est devenu","Maâlem Abdeslem, le père","Un narrateur extérieur à l'histoire"],a:1,e:"Le récit est à la 1ʳᵉ personne : le narrateur est un personnage, Sidi Mohammed. Il y a deux « je » : l'enfant qui vit et l'adulte qui se souvient. Ce n'est pas le nom de l'auteur, d'où « roman autobiographique »."},
  {t:"Genre",s:"Pourquoi parle-t-on de roman autobiographique et non d'autobiographie ?",o:["Parce que l'auteur est marocain","Parce que le narrateur porte un autre nom que l'auteur et que des détails sont inventés","Parce que le livre est court","Parce qu'il y a des dialogues"],a:1,e:"Dans une autobiographie, auteur, narrateur et personnage portent le même nom (pacte autobiographique). Ici la distance entre Ahmed et Sidi Mohammed et la part d'invention justifient « roman autobiographique »."},

  {t:"Énonciation",s:"Le narrateur emploie l'imparfait et le passé simple pour raconter son enfance, et le présent pour commenter. Comment appelle-t-on ce double niveau ?",o:["Le discours indirect","L'alternance narrateur-enfant / narrateur-adulte","Le point de vue omniscient","Le dialogue"],a:1,e:"Question très fréquente. Le présent d'énonciation signale la voix de l'adulte ; les temps du passé, celle de l'enfant. Savoir repérer les deux dans un extrait."},

  {t:"Champ lexical",s:"Quel champ lexical domine l'ouverture du chapitre ?",o:["La guerre","La solitude et la tristesse","La richesse","Le voyage"],a:1,e:"Mots attendus : seul, solitude, ennui, tristesse, mélancolie, rêve… À l'examen, citez au moins trois mots du texte."},

  {t:"Réaction personnelle",s:"L'enfant est effrayé par la cérémonie des Gnaouas mais ne peut s'empêcher de la regarder. Avez-vous déjà ressenti cette attirance pour ce qui fait peur ? Justifiez en 3 lignes.",open:true,m:"Réponse attendue : une prise de position claire, un exemple personnel concret (fête, spectacle, lieu…) et l'explication du sentiment mêlé (curiosité + peur). Ex. : lors d'une fête de l'Achoura, les tambours et les masques m'effrayaient mais je restais au premier rang : la peur rend le spectacle plus intense."}

 {p:"يتذكر الراوي البالغ: في <b>السادسة</b> من عمره كان طفلاً <b>وحيداً</b>، بلا صديق، لا يرتاح مع الأطفال الآخرين. يعيش مع والديه في <b>الطابق الأول</b> من <b>دار الشوافة</b>، وهي دار مشتركة تشغل طابقَها الأرضي <b>الشوافة</b> (العرّافة) لالة كنزة.",k:"<b>للحفظ:</b> الافتتاحية <b>تأمل</b> للبالغ في وحدته؛ النبرة <b>حزينة</b>؛ وكلمة «الوحدة» تتكرر كلازمة."},
 {p:"تحمل الدار اسم أشهر ساكنة فيها: <b>الشوافة</b>، عرّافة تأتي النساء لاستشارتها. تعيش الأسر فوق بعضها: رحمة وزوجها <b>إدريس العواد</b> (صانع المحاريث) وابنتهما <b>زينب</b>؛ و<b>فاطمة بزيوية</b> وزوجها علال البستاني. <b>الصحن</b> و<b>السطح</b> مشتركان، ولذلك هما مصدر <b>الخصومات</b>."},
 {p:"تأخذ الأم الطفل إلى <b>الحمام</b>. وهو بالنسبة إليه مكان <b>مخيف</b>: بخار، حرارة، نساء يصرخن، شجار حول الدلاء. يشعر فيه بأنه <b>غريب</b> وضائع، ويحتفظ من هذه التجربة بذكرى <b>مؤلمة</b>.",k:"<b>الأسلوب المفتاح:</b> وصف الحمام <b>مبالغة</b> متواصلة (الطفل يضخّم)، مع <b>حقل معجمي للجحيم</b> و<b>الضيق</b>."},
 {p:"تنظم الشوافة <b>حفلاً</b> بموسيقيين من <b>كناوة</b>: بخور، أناشيد، قراقب، رقص حتى الجذبة. تهتز الدار كلها. يراقب الطفل المشهد بمزيج من <b>الخوف</b> و<b>الانبهار</b>."},
 {p:"في يوم <b>غسيل</b>، تحتل رحمة السطح؛ وترى لالة زبيدة أنها مظلومة. تتبادل المرأتان <b>الشتائم</b> بعنف وتتدخل الدار كلها. يفزع الطفل ويلجأ إلى الزقاق ثم يتعزّى. تُظهر الخصومة <b>العنف اللفظي</b> للنساء لكنها تُظهر أيضاً قوة روابطهن: فستتصالحان لاحقاً."},
 {p:"هرباً من الحزن، يفتح الطفل <b>علبة العجائب</b>: أشياء تافهة (أزرار، كرات زجاجية، مسامير، خواتم...) تصبح عنده كنوزاً و<b>أصدقاء</b>. إنها <b>رمز</b> <b>الخيال</b> والعزاء، وهي التي تمنح الرواية عنوانها.",k:"<b>للامتحان:</b> العلبة = ملجأ، خيال، طفولة. تفتتح الرواية (ف1) وتختمها (ف12): <b>بنية دائرية</b>."}

 +'<tr><th>Parution</th><td>1829, anonyme ; préface-manifeste ajoutée en 1832 (après la révolution de 1830)</td></tr>'
 +'<tr><th>Genre</th><td>Roman à thèse (contre la peine de mort), écrit sous forme de <b>journal intime</b> / monologue intérieur</td></tr>'
 +'<tr><th>Narrateur</th><td>Un condamné à mort <b>anonyme</b> : on ignore son nom, son crime, son passé. Récit à la 1ʳᵉ personne, au présent</td></tr>'
 +'<tr><th>Cadre</th><td>Paris, 1820s : Bicêtre (prison), la Conciergerie, l\'Hôtel de Ville, la place de Grève. Cinq semaines résumées, puis les dernières 24 heures</td></tr>'
 +'<tr><th>Structure</th><td>49 chapitres très inégaux (une ligne à vingt pages), chapitre 47 vide (« Mon histoire »), rythme qui s\'accélère</td></tr>'

 +'<tr><th>Registres</th><td>Pathétique, tragique, polémique, réaliste (argot, prison), parfois lyrique (souvenirs)</td></tr></table>'
 +'<h3>Pourquoi « roman à thèse » ?</h3><p>Un roman à thèse défend une <b>idée</b> à travers une <b>histoire</b>. Ici, la thèse est l\'<b>abolition de la peine de mort</b>. Hugo ne plaide pas directement dans le récit : il fait <b>vivre</b> au lecteur l\'agonie morale d\'un homme ordinaire. La <b>préface de 1832</b> explicite ensuite les arguments :</p>'

 +'<h3>Pourquoi le condamné est-il anonyme ?</h3><ul><li>Pour qu\'il représente <b>tous</b> les condamnés : c\'est l\'<b>universalité</b> du propos.</li><li>Pour que le lecteur ne juge pas le <b>crime</b> mais ressente le <b>châtiment</b>.</li><li>Pour que le lecteur s\'<b>identifie</b> : « je » peut être n\'importe qui. Le chapitre 47, « Mon histoire », reste <b>vide</b>.</li></ul>'

 +'<h3>Les trois piliers à mémoriser</h3><div class="keypoints"><strong>1.</strong> Une <b>idée fixe</b> : la pensée de la mort obsède chaque page ; le temps devient le vrai sujet.<br><strong>2.</strong> Un <b>plaidoyer</b> par l\'émotion : Hugo veut faire <b>sentir</b>, pas démontrer ; la préface démontre.<br><strong>3.</strong> Une <b>société accusée</b> : juges, prêtre indifférent, foule avide de spectacle, geôliers, architecte : tous complices.</div>'

 persos:[
  {n:"Le condamné",r:"Narrateur anonyme",c:"#b5452c",h:"#2b2118",f:false,d:"Jeune homme instruit (il écrit, cite, raisonne), issu d'une famille aisée, marié, père d'une petite fille, Marie. On ne connaît ni son nom ni son crime (un meurtre, semble-t-il, jamais précisé). Il traverse l'espoir, la révolte, le désespoir, la peur ; il écrit pour résister et témoigner. Il représente tout condamné."},
  {n:"Marie",r:"Sa fille, trois ans",c:"#d9a441",h:"#2b2118",f:true,d:"Pensée la plus douce et la plus douloureuse du condamné. Lors de la visite (ch. 43), elle ne le reconnaît pas et l'appelle « monsieur » : elle croit son papa mort. Elle incarne l'innocence frappée par le châtiment et l'avenir volé. Argument central contre la peine de mort."},
  {n:"La mère, la femme",r:"Les siennes",c:"#8a6d3b",h:"#999",f:true,d:"Évoquées surtout au chapitre 9 : sa mère âgée qui mourra de chagrin, sa femme malade qui ne survivra pas. Elles ne viennent pas le voir. Le condamné pense à ces « trois femmes » dont il est le soutien : la peine frappe toute une famille."},
  {n:"Le friauche",r:"Le forçat de la Conciergerie",c:"#7a6a58",h:"#2b2118",f:false,d:"Condamné aux galères, puis à mort, qu'il rencontre au chapitre 23. Fils d'un pendu, voleur par misère, il raconte sa vie en argot avec insolence et demande au narrateur sa redingote pour la vendre. Il montre comment la société fabrique les criminels : la misère et la prison."},
  {n:"L'aumônier",r:"Le prêtre",c:"#4f4f4f",h:"#999",f:false,d:"Prêtre de la prison, bienveillant mais mécanique : il récite des consolations usées, sans vraie compassion. Le condamné ne trouve en lui aucun réconfort et refuse sa confession ; il aurait voulu un prêtre qui pleure avec lui. Critique de la religion institutionnelle."},
  {n:"Les geôliers et gendarmes",r:"Les exécutants",c:"#555",h:"#2b2118",f:false,d:"Le guichetier, le directeur de Bicêtre, l'huissier qui lit l'arrêt, le gendarme qui demande des numéros de loterie (ch. 32) : des hommes ordinaires, parfois humains, souvent indifférents. Ils font « leur métier » : la banalité de l'appareil judiciaire."},
  {n:"Les forçats",r:"La chaîne pour Toulon",c:"#4a3b5c",h:"#2b2118",f:false,d:"Au chapitre 13, le condamné assiste au ferrement des forçats dans la cour de Bicêtre : hommes enchaînés, chantant, insultant, à demi nus sous la pluie. Scène d'enfer réaliste qui dénonce le bagne, autre face de la justice."},
  {n:"La foule",r:"Personnage collectif",c:"#2b2118",h:"#2b2118",f:false,d:"Présente à la cour d'assises, au ferrement, sous les fenêtres, à la Grève. Curieuse, cruelle, joyeuse : elle loue des fenêtres pour voir l'exécution. Hugo en fait l'accusée principale : le spectacle de la mort corrompt le peuple au lieu de l'édifier."},
  {n:"Pepa / Pepita",r:"L'amour d'enfance",c:"#9c4f7a",h:"#2b2118",f:true,d:"Jeune Andalouse dont le narrateur se souvient au chapitre 33 : un après-midi dans un jardin, une lecture partagée, un premier émoi. Souvenir lumineux qui contraste avec le cachot et rappelle que le condamné a été un enfant heureux."},
  {n:"L'architecte, le bourreau",r:"Les figures de la machine",c:"#8a8494",h:"#999",f:false,d:"L'architecte vient mesurer le cachot pour des travaux (ch. 31) comme si le prisonnier n'existait pas ; le bourreau et ses aides font la toilette du condamné (ch. 48) avec gestes d'habitude. Ils incarnent la mécanique froide de l'exécution."}

 notions:[
  {n:"Roman à thèse",d:"Roman qui défend une idée (ici l'abolition de la peine de mort) en la faisant vivre à travers une histoire et des personnages."},
  {n:"Thèse",d:"Idée défendue par l'auteur : la peine de mort est cruelle, inutile, injuste et irréversible."},
  {n:"Argument",d:"Raison qui soutient la thèse. Ex. : la peine frappe aussi la famille innocente (Marie)."},
  {n:"Exemple",d:"Fait concret qui illustre un argument. Ex. : le friauche, fils de pendu devenu voleur, montre que le châtiment n'empêche rien."},
  {n:"Plaidoyer",d:"Discours pour défendre une cause ou une personne. La préface de 1832 est un plaidoyer contre la peine de mort."},
  {n:"Réquisitoire",d:"Discours qui accuse. Le roman est un réquisitoire contre la société et la justice de son temps."},
  {n:"Journal intime",d:"Forme du récit : écriture au jour le jour, à la 1ʳᵉ personne, au présent, pour soi-même."},
  {n:"Monologue intérieur",d:"Flux de pensées du personnage retranscrit sans intermédiaire : angoisses, souvenirs, calculs du condamné."},
  {n:"Narrateur anonyme",d:"Le condamné n'a ni nom ni crime connu : procédé d'universalisation, le lecteur s'identifie."},
  {n:"Focalisation interne",d:"Tout est vu par le condamné : ses peurs déforment le réel (le cachot, la foule, la guillotine)."},
  {n:"Présent d'énonciation",d:"Le narrateur écrit au moment où il vit : le présent crée l'urgence et l'immédiateté."},
  {n:"Analepse (retour en arrière)",d:"Souvenirs insérés dans le présent du cachot : le procès (ch. 2), Pepa (ch. 33), Notre-Dame (ch. 36)."},
  {n:"Ellipse",d:"Omission d'une partie du temps : les cinq semaines sont résumées, le crime n'est jamais raconté (ch. 47 vide)."},
  {n:"Rythme du récit",d:"Chapitres de plus en plus courts à mesure que l'heure approche : accélération et dilatation du temps."},
  {n:"Registre pathétique",d:"Vise à émouvoir : la visite de Marie, les adieux, les larmes."},
  {n:"Registre tragique",d:"Le héros face à une mort inéluctable ; le temps compté ; l'absence d'issue."},
  {n:"Registre polémique",d:"Attaque d'une institution ou d'une idée : la justice, la foule, le prêtre, la guillotine."},
  {n:"Registre réaliste",d:"Description précise du monde carcéral : argot, cachot, ferrement, toilette du condamné."},
  {n:"Argot",d:"Langue des prisonniers et des voleurs (le friauche, la chanson). Hugo l'utilise pour montrer un monde à part et ses codes."},
  {n:"Hyperbole",d:"Exagération : la guillotine devient un monstre, la foule une mer hurlante."},
  {n:"Personnification",d:"L'idée de la mort devient une compagne qui habite avec lui ; la guillotine « attend »."},
  {n:"Antithèse",d:"Opposition : vie/mort, dedans/dehors, soleil/cachot, enfant/bourreau."},
  {n:"Ironie",d:"Dire le contraire de ce qu'on pense pour dénoncer : le gendarme qui demande les numéros de loterie, l'architecte qui mesure."},
  {n:"Champ lexical",d:"Ensemble de mots liés à une idée : mort, enfermement, temps, angoisse, foule."},
  {n:"Préface de 1832",d:"Texte ajouté par Hugo où il assume la thèse abolitionniste et répond aux objections : arguments politiques, moraux, religieux."},
  {n:"Peine de mort en France",d:"Hugo la combat toute sa vie (discours de 1848). Elle est abolie en 1981 (loi Badinter)."},
  {n:"Bicêtre / Conciergerie / Grève",d:"Les trois lieux du roman : prison d'attente, prison du dernier jour, place de l'exécution."},
  {n:"Marie",d:"Fille du condamné, trois ans ; ne le reconnaît pas (ch. 43). Argument affectif majeur contre la peine de mort."}

 methode:'<div class="card"><h2>Production écrite — Méthode</h2><p>Au régional, la production écrite (10 pts) demande un <b>texte argumentatif</b> d\'une quinzaine de lignes. Avec cette œuvre, le sujet porte très souvent sur la <b>peine de mort</b> ou la <b>justice</b> : préparez vos arguments des deux côtés.</p>'
 +'<div class="fig">'+I.D.planRedaction()+'</div>'
 +'<h3>Le sujet n° 1 : pour ou contre la peine de mort</h3><table><tr><th>Arguments CONTRE (Hugo)</th><th>Arguments POUR (à connaître pour nuancer)</th></tr><tr><td>Cruelle : torture morale de l\'attente (tout le roman)</td><td>Justice pour les victimes et leurs familles</td></tr><tr><td>Inutile : ne dissuade pas, la foule s\'amuse (ch. 48)</td><td>Dissuasion supposée des criminels</td></tr><tr><td>Injuste : frappe les pauvres, les innocents (Marie), les fils de pendus (friauche)</td><td>Protection de la société contre les récidivistes</td></tr><tr><td>Irréversible : l\'erreur judiciaire est sans retour</td><td>Coût de la détention à perpétuité</td></tr><tr><td>Barbare : une société qui tue se rabaisse au niveau du criminel</td><td>Tradition, textes religieux (interprétations discutées)</td></tr></table>'
 +'<h3>Les autres thèmes qui tombent</h3>'
 +'<div class="model"><b>La prison rend-elle meilleur ?</b> — Thèse : elle punit et protège. Antithèse : elle fabrique des criminels (le friauche, le bagne). Conclusion : punir en vue de réinsérer.</div>'
 +'<div class="model"><b>Le spectacle de la violence</b> (foule de la Grève, aujourd\'hui vidéos et réseaux) — Thèse : voir dissuade et informe. Antithèse : voir banalise et excite la cruauté. Conclusion : protéger surtout les jeunes.</div>'
 +'<div class="model"><b>L\'écriture peut-elle sauver ?</b> — Thèse : écrire soulage, résiste, témoigne (ch. 6). Antithèse : écrire ne change pas le réel ; le condamné meurt. Conclusion : l\'écriture sauve la dignité et transforme le lecteur.</div>'
 +'<div class="model"><b>Peut-on juger un homme sans connaître son histoire ?</b> — Le crime n\'est jamais dit (ch. 47 vide). Thèse : un acte suffit à juger. Antithèse : comprendre les causes (misère, enfance). Conclusion : juger l\'acte, comprendre l\'homme.</div>'
 +'<div class="model"><b>La famille du coupable est-elle coupable ?</b> — Marie, la mère, la femme. Thèse : non, et la société doit les protéger. Antithèse : elles subissent le déshonneur. Conclusion : la justice ne doit pas punir les innocents par ricochet.</div>'
 +'<h3>Les 5 erreurs qui coûtent des points</h3><ul><li>Oublier d\'<b>annoncer le plan</b>.</li><li>Prendre parti dès l\'introduction sans <b>exposer l\'autre thèse</b>.</li><li>Raconter le roman au lieu de l\'<b>utiliser comme exemple</b>.</li><li>Un seul paragraphe : <b>un argument = un paragraphe</b>.</li><li>Oublier l\'<b>ouverture</b> finale (ex. : l\'abolition en France en 1981, le débat dans le monde).</li></ul>'
 +'<h3>Rappel : les questions de langue sur ce roman</h3><table><tr><th>On vous demande</th><th>Répondez</th></tr><tr><td>Genre</td><td>Roman à thèse sous forme de journal intime</td></tr><tr><td>Énonciation</td><td>Narrateur-personnage anonyme, 1ʳᵉ personne, présent ; le lecteur est le destinataire implicite</td></tr><tr><td>Type de texte</td><td>Narratif, descriptif (cachot, foule), argumentatif (ch. 7, préface), souvent mêlés</td></tr><tr><td>Point de vue</td><td>Interne : on ne sait que ce que le condamné perçoit</td></tr><tr><td>Tonalité</td><td>Pathétique, tragique, polémique, ironique selon l\'extrait</td></tr><tr><td>Visée</td><td>Émouvoir pour convaincre : plaidoyer contre la peine de mort</td></tr></table>'
 +'</div>'

   svg:'<svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="170" fill="#2a2630"/><rect x="40" y="20" width="280" height="130" fill="#3b3542"/><g stroke="#8a8494" stroke-width="3"><line x1="80" y1="20" x2="80" y2="150"/><line x1="130" y1="20" x2="130" y2="150"/><line x1="180" y1="20" x2="180" y2="150"/><line x1="230" y1="20" x2="230" y2="150"/><line x1="280" y1="20" x2="280" y2="150"/></g><g transform="translate(140,60)"><rect x="10" y="22" width="36" height="70" rx="5" fill="#d8d2c4"/><circle cx="28" cy="12" r="12" fill="#e3b58a"/><path d="M16 10 Q28 -3 40 10Z" fill="#2b2118"/></g><g opacity=".35"><path d="M40 20 Q180 170 320 20" stroke="#b5452c" stroke-width="40" fill="none"/></g><text x="180" y="164" text-anchor="middle" font-size="10" fill="#f3e6c9">Toujours seul avec elle, toujours glacé de sa présence</text></svg>',
   cap:"La pensée de la mort : une présence physique, un poids",
   p:"Le roman s'ouvre sur un cri : <b>« Condamné à mort ! »</b>. Depuis <b>cinq semaines</b>, le narrateur vit avec cette pensée, seul avec elle, glacé de sa présence, courbé sous son poids. <b>Autrefois</b>, il était un homme comme les autres : chaque jour, chaque heure apportait une idée nouvelle, il était libre, jeune, riche de projets. <b>Maintenant</b>, une seule idée l'occupe, une idée <b>fixe</b> qui le réveille, qui s'interpose entre lui et le monde.<div class=\"model\"><b>Extrait (ch. 1) :</b> « Condamné à mort ! Voilà cinq semaines que j'habite avec cette pensée, toujours seul avec elle, toujours glacée de sa présence, toujours courbé sous son poids ! »</div>",
   k:"<strong>Procédés :</strong> phrase nominale exclamative en ouverture ; <b>personnification</b> de la pensée (elle habite, elle glace) ; <b>anaphore</b> de « toujours » ; <b>antithèse</b> autrefois / maintenant."},
  {t:"Le procès : une belle matinée d'août",
   p:"Le chapitre 2 est un <b>retour en arrière</b> : le dernier jour du procès, par une belle matinée d'août. Le narrateur se souvient de la salle d'assises : le soleil, les jurés fatigués après trois jours de débats, les juges, l'avocat qui parle avec peu de conviction, la <b>foule</b> curieuse qui le regarde comme une bête. Il n'écoute presque pas, il a <b>faim</b>, il regarde la lumière par la fenêtre. On le ramène ; la réponse du jury tombe : <b>coupable</b>.",
   k:"<strong>Réalisme et ironie :</strong> la justice est décrite comme une <b>mécanique lasse</b> ; le condamné pense à la vie (le soleil, la faim) pendant qu'on décide de sa mort : <b>antithèse</b> vie/mort."},
  {t:"Le verdict",
   p:"Le président prononce la sentence : <b>peine de mort</b>. Le narrateur raconte sa <b>stupeur</b> : la foule se rue vers la sortie, ravie du spectacle ; lui ne pense d'abord à rien, puis sent le sang lui monter au visage et comprend. Le mot « mort » devient physique. On le reconduit à Bicêtre dans une voiture grillagée : le peuple le regarde passer.",
   k:"<strong>Thème :</strong> dès le début, la <b>foule</b> est montrée avide de spectacle. Le procès n'est qu'une <b>formalité</b> : Hugo discrédite la justice sans la caricaturer."},
  {t:"Ce que l'incipit installe",
   p:"Trois choses sont posées : un narrateur <b>anonyme</b> (ni nom, ni crime), une <b>situation</b> sans issue (la mort certaine), et une <b>forme</b> (le monologue intérieur au présent). Le lecteur sait déjà la fin ; il va vivre l'attente <b>de l'intérieur</b>."}
 ],
 chrono:["<b>Ch. 1</b> — l'idée fixe, autrefois / maintenant","<b>Ch. 2</b> — retour en arrière : le procès","<b>Le jury</b> — « coupable »","<b>La sentence</b> — peine de mort","<b>Le retour</b> — Bicêtre, la foule"],
 analyse:[["Énonciation","1ʳᵉ personne, présent (ch. 1) puis passé (ch. 2 : analepse)"],["Figures","Personnification de la pensée, anaphore de « toujours », antithèse autrefois/maintenant, hyperbole"],["Registres","Tragique (la mort certaine), pathétique, réaliste (la salle d'assises)"],["Champs lexicaux","Mort, enfermement, poids ; lumière et vie dans le souvenir du procès"],["Point de vue","Interne : la salle vue par le regard distrait du condamné"],["Rôle de l'incipit","Poser le narrateur anonyme, la situation sans issue, la forme du journal"]],
 citations:"Mots-clés : <b>idée fixe</b>, <b>cinq semaines</b>, <b>autrefois / maintenant</b>, <b>personnification</b>, <b>anaphore</b>, <b>foule</b>, <b>Bicêtre</b>.",
 quiz:[
  {t:"Compréhension",s:"Depuis combien de temps le narrateur vit-il avec la pensée de sa condamnation au début du roman ?",o:["Trois jours","Cinq semaines","Six mois","Un an"],a:1,e:"« Voilà cinq semaines » : le roman résume d'abord ces semaines, puis s'attarde sur le dernier jour."},
  {t:"Compréhension",s:"Que sait-on du crime du narrateur ?",o:["Il a volé","Il a tué un gendarme","Presque rien : le crime n'est jamais précisé","Il est innocent"],a:2,e:"Hugo laisse le crime dans l'ombre (le ch. 47 « Mon histoire » est vide) pour que le lecteur juge la peine, non l'homme."},
  {t:"Compréhension",s:"À quoi pense le narrateur pendant que le jury délibère (ch. 2) ?",o:["À son crime","Au soleil, à la lumière, à sa faim","À sa vengeance","À s'évader"],a:1,e:"Détails de vie au moment où l'on décide de sa mort : antithèse poignante et réalisme."},
  {t:"Figure de style",s:"« Toujours seul avec elle, toujours glacée de sa présence, toujours courbé sous son poids. » Quelles figures ?",o:["Comparaison et métaphore","Anaphore et personnification","Litote et euphémisme","Ellipse et chiasme"],a:1,e:"Répétition de « toujours » en tête de groupe (anaphore) ; la pensée a une présence, un poids (personnification)."},
  {t:"Structure",s:"Le chapitre 2 (le procès) est par rapport au chapitre 1 :",o:["Une anticipation","Un retour en arrière (analepse)","Une description","Une préface"],a:1,e:"Le narrateur revient cinq semaines plus tôt pour raconter le procès : analepse."},
  {t:"Énonciation",s:"Quel temps domine le chapitre 1 et quel effet produit-il ?",o:["Le passé simple : distance","Le présent : urgence et immédiateté","Le futur : espoir","L'imparfait : nostalgie"],a:1,e:"Le présent du journal met le lecteur dans la tête du condamné, en temps réel."},
  {t:"Thème",s:"Comment la foule est-elle présentée dès le procès ?",o:["Compatissante","Indifférente","Curieuse et avide de spectacle","Révoltée contre le verdict"],a:2,e:"Elle regarde le condamné comme une bête et se rue dehors, satisfaite : première charge contre la société."},
  {t:"Question ouverte",s:"Analysez l'opposition autrefois / maintenant dans le chapitre 1. (3 phrases)",open:true,m:"Autrefois, le narrateur était libre et sa pensée allait de projet en projet, d'heure en heure, comme la vie elle-même. Maintenant, une seule idée l'occupe, fixe, qui exclut toutes les autres : il est prisonnier dans sa tête avant de l'être dans son cachot. Cette antithèse structure l'incipit et annonce le sujet du roman : non pas le crime, mais le supplice de l'attente."},
  {t:"Réaction personnelle",s:"Hugo choisit de ne pas dire le crime de son personnage. Approuvez-vous ce choix ? 3 lignes.",open:true,m:"Position + arguments + exemple. Ex. : Oui, car le lecteur ne peut pas se dire « il l'a mérité » : il est obligé de penser à la peine elle-même. Le condamné devient n'importe quel homme, et donc chacun de nous. Certains trouveront le procédé manipulateur, mais c'est la force du roman à thèse."}
 ]

addAr('ddc',0,{tip:"أشهر استهلال في المقرر. يرد كل سنة تقريباً في إحدى الأكاديميات.",ep:[
 {p:"تفتتح الرواية بصرخة: <b>«محكوم بالإعدام!»</b>. منذ <b>خمسة أسابيع</b> يعيش الراوي مع هذه الفكرة، وحيداً معها، متجمداً من حضورها، منحنياً تحت ثقلها. <b>في الماضي</b> كان رجلاً كالآخرين: كل يوم، كل ساعة، تأتي بفكرة جديدة، كان حراً شاباً غنياً بالمشاريع. <b>الآن</b> فكرة واحدة تشغله، فكرة <b>ثابتة</b> توقظه وتحول بينه وبين العالم.",k:"<b>أساليب:</b> جملة اسمية تعجبية في الافتتاح؛ <b>تشخيص</b> الفكرة (تسكن، تجمّد)؛ <b>تكرار استهلالي</b> لـ«دائماً»؛ <b>تضاد</b> الماضي/الآن."},
 {p:"الفصل الثاني <b>عودة إلى الوراء</b>: اليوم الأخير من المحاكمة، في صباح جميل من أغسطس. يتذكر الراوي قاعة الجنايات: الشمس، المحلفون المتعبون بعد ثلاثة أيام من المرافعات، القضاة، المحامي الذي يتكلم بقليل من الاقتناع، <b>الحشد</b> الفضولي الذي ينظر إليه كوحش. لا يكاد يستمع، <b>جائع</b>، ينظر إلى الضوء من النافذة. يُعاد إلى القاعة؛ ويسقط جواب المحلفين: <b>مذنب</b>.",k:"<b>واقعية وسخرية:</b> تُوصف العدالة كـ<b>آلية متعبة</b>؛ يفكر المحكوم في الحياة (الشمس، الجوع) بينما يُقرَّر موته: <b>تضاد</b> حياة/موت."},
 {p:"ينطق الرئيس بالحكم: <b>عقوبة الإعدام</b>. يروي الراوي <b>ذهوله</b>: يندفع الحشد نحو الخروج مسروراً بالمشهد؛ أما هو فلا يفكر في شيء أولاً، ثم يشعر بالدم يصعد إلى وجهه ويفهم. تصبح كلمة «الموت» جسدية. يُعاد إلى بيسيتر في عربة مسيَّجة: ويراه الشعب يمر.",k:"<b>الموضوع:</b> منذ البداية يُعرض <b>الحشد</b> متعطشاً للفرجة. المحاكمة مجرد <b>إجراء شكلي</b>: يُسقط هيغو مصداقية العدالة دون تشويهها."},
 {p:"تُوضع ثلاثة أشياء: راوٍ <b>مجهول</b> (لا اسم ولا جريمة)، <b>وضعية</b> بلا مخرج (الموت المؤكد)، و<b>شكل</b> (المونولوغ الداخلي في الحاضر). يعرف القارئ النهاية سلفاً؛ وسيعيش الانتظار <b>من الداخل</b>."}
]});

reg({
 id:'fr', noTrad:true, titre:'Épreuve de français', auteur:'Outils d\'analyse · Langue · Production écrite', genre:'Compléments transversaux aux trois œuvres',

 fiche:'<div class="card"><h2>Le cadre de référence de l\'examen régional</h2><p>L\'épreuve de français de 1ʳᵉ année bac est définie par le <b>cadre de référence</b> du ministère de l\'Éducation nationale : une épreuve de <b>2 heures</b>, notée sur <b>20</b>, composée d\'une <b>étude de texte</b> (10 points) portant sur un ou deux passages des œuvres au programme et d\'une <b>production écrite</b> (10 points). Les trois œuvres : <i>La Boîte à merveilles</i> (Sefrioui), <i>Antigone</i> (Anouilh), <i>Le Dernier Jour d\'un condamné</i> (Hugo) — révisées dans la partie « Les œuvres » de l\'application. Ce module rassemble <b>tout le reste</b> : les outils d\'analyse exigés par les items, la rubrique « langue » de la progression officielle et la méthode de la production écrite.</p>'

 notions:[
  {n:"Contextualiser",d:"Donner les repères de l'œuvre (titre, auteur, genre, date, courant) et situer le passage par ce qui précède et ce qui suit."},
  {n:"Analyser",d:"Relier un fait de langue ou de style (figure, temps, lexique, énonciation) au sens du passage."},
  {n:"Réagir",d:"Donner un avis personnel justifié sur une idée, une valeur ou un comportement du texte."},
  {n:"Texte narratif",d:"Raconte des événements : passé simple / imparfait, connecteurs temporels, narrateur."},
  {n:"Texte descriptif",d:"Donne à voir : imparfait, adjectifs, repères spatiaux, verbes de perception."},
  {n:"Texte argumentatif",d:"Défend une thèse : présent, connecteurs logiques, verbes d'opinion, exemples."},
  {n:"Texte explicatif",d:"Fait comprendre un fait de façon neutre : présent de vérité générale, définitions."},
  {n:"Texte injonctif",d:"Donne des ordres ou conseils : impératif, infinitif, « il faut »."},
  {n:"Énonciation",d:"Situation de production d'un énoncé : qui parle, à qui, où, quand."},
  {n:"Discours / récit",d:"Discours : ancré dans la situation (je, ici, maintenant, présent). Récit : coupé de la situation (il, là-bas, passé simple)."},
  {n:"Je narrant / je narré",d:"Dans l'autobiographie : l'adulte qui écrit (narrant) et l'enfant dont on raconte l'histoire (narré)."},
  {n:"Modalisateur",d:"Mot qui marque le degré de certitude ou le jugement du locuteur : peut-être, sans doute, hélas, il me semble."},
  {n:"Focalisation interne",d:"Le récit passe par la conscience d'un personnage ; on ne sait que ce qu'il sait."},
  {n:"Focalisation externe",d:"Le narrateur rapporte ce qu'une caméra verrait, sans pensées."},
  {n:"Focalisation zéro",d:"Narrateur omniscient : il sait tout de tous."},
  {n:"Narrateur-personnage",d:"Narrateur à la 1ʳᵉ personne qui participe à l'histoire (Sidi Mohammed, le condamné)."},
  {n:"Passé simple",d:"Actions de premier plan, ponctuelles, qui font avancer le récit."},
  {n:"Imparfait",d:"Arrière-plan : description, habitude, durée, actions en cours."},
  {n:"Présent de narration",d:"Présent employé dans un récit au passé pour rendre la scène vivante."},
  {n:"Présent de vérité générale",d:"Présent des maximes et des idées toujours vraies : « L'homme est… »."},
  {n:"Discours direct",d:"Paroles telles quelles, guillemets, verbe de parole : Il dit : « Je pars. »"},
  {n:"Discours indirect",d:"Paroles intégrées dans une subordonnée : Il dit qu'il partait."},
  {n:"Discours indirect libre",d:"Paroles ou pensées sans verbe introducteur ni guillemets, à la 3ᵉ personne et au temps du récit : Il partirait demain, c'était décidé."},
  {n:"Comparaison",d:"Rapproche deux éléments avec un outil (comme, tel, semblable à)."},
  {n:"Métaphore",d:"Rapprochement sans outil de comparaison ; filée si elle se prolonge."},
  {n:"Personnification",d:"Prête des traits humains à une chose ou une idée."},
  {n:"Allégorie",d:"Représentation concrète d'une idée abstraite (la Mort, la Justice)."},
  {n:"Métonymie",d:"Désigne par un terme lié : boire un verre, la couronne pour le roi."},
  {n:"Périphrase",d:"Remplace un mot par une expression : la machine (pour la guillotine)."},
  {n:"Antithèse",d:"Oppose deux termes dans une phrase : la vie / la mort, l'ombre / la lumière."},
  {n:"Oxymore",d:"Alliance de deux mots contradictoires : une obscure clarté."},
  {n:"Hyperbole",d:"Exagération : mourir de peur, mille fois."},
  {n:"Litote",d:"Dire moins pour suggérer plus : ce n'est pas mal (= c'est très bien)."},
  {n:"Euphémisme",d:"Adoucit une réalité brutale : il nous a quittés."},
  {n:"Gradation",d:"Succession de termes d'intensité croissante ou décroissante."},
  {n:"Anaphore",d:"Répétition d'un mot en tête de phrases ou de vers."},
  {n:"Énumération / accumulation",d:"Suite de termes de même nature, effet d'abondance."},
  {n:"Antiphrase / ironie",d:"Dire le contraire de ce que l'on pense pour se moquer."},
  {n:"Question rhétorique",d:"Question qui n'attend pas de réponse, pour convaincre ou émouvoir."},
  {n:"Chiasme",d:"Structure croisée AB / BA : il faut manger pour vivre et non vivre pour manger."},
  {n:"Registre tragique",d:"Personnage écrasé par un destin inéluctable ; lexique de la fatalité, de la mort."},
  {n:"Registre pathétique",d:"Vise à émouvoir, à faire pleurer : souffrance, exclamations, champ lexical de la douleur."},
  {n:"Registre lyrique",d:"Expression des sentiments personnels à la 1ʳᵉ personne."},
  {n:"Registre ironique / satirique",d:"Se moque par l'antiphrase, l'exagération, pour critiquer."},
  {n:"Registre polémique",d:"Attaque violente d'une idée ou d'une personne ; lexique dévalorisant, apostrophes."},
  {n:"Registre comique",d:"Fait rire : quiproquo, exagération, jeux de mots, comique de gestes."},
  {n:"Registre épique",d:"Grandit héros et combats : hyperboles, pluriels, forces collectives."},
  {n:"Registre réaliste",d:"Décrit fidèlement la réalité sociale et quotidienne."},
  {n:"Champ lexical",d:"Mots d'un texte renvoyant à une même idée (peur, religion, justice)."},
  {n:"Champ sémantique",d:"Ensemble des sens d'un même mot (« pièce » : théâtre, monnaie, salle)."},
  {n:"Connotation",d:"Sens suggéré, affectif, ajouté au sens premier (dénotation)."},
  {n:"Mélioratif / péjoratif",d:"Vocabulaire valorisant (admirable) ou dévalorisant (minable)."},
  {n:"Didascalie",d:"Indication scénique en italique : gestes, ton, décor."},
  {n:"Tirade",d:"Longue réplique d'un personnage sans interruption."},
  {n:"Monologue",d:"Personnage seul qui parle ; au théâtre, livre ses pensées au public."},
  {n:"Double énonciation",d:"Au théâtre, le personnage parle à un autre personnage ET au public."},
  {n:"Prologue / Chœur",d:"Chez Anouilh : voix qui présente les personnages et commente la tragédie."},
  {n:"Thèse",d:"Idée défendue par l'auteur ou le locuteur."},
  {n:"Argument",d:"Raison qui soutient la thèse ; l'exemple l'illustre."},
  {n:"Connecteur logique",d:"Mot de liaison qui marque cause, conséquence, opposition, addition…"},
  {n:"Plan dialectique",d:"Thèse → antithèse → synthèse (dépassement)."},
  {n:"Plan analytique",d:"Constat / causes / conséquences / solutions."},
  {n:"Roman à thèse",d:"Récit au service d'une idée à défendre (Hugo contre la peine de mort)."},
  {n:"Autobiographie",d:"Récit rétrospectif qu'une personne fait de sa propre vie (pacte autobiographique : auteur = narrateur = personnage)."},
  {n:"Tragédie",d:"Pièce où le héros, prisonnier de la fatalité, va vers une fin malheureuse et connue d'avance."}
 ],
 methode:'<div class="card"><h2>Production écrite — la méthode complète</h2><p>10 points : <b>5 pour le discours</b> (consigne respectée, argumentation cohérente, texte organisé et progressif) et <b>5 pour la langue</b> (vocabulaire précis, syntaxe, ponctuation, orthographe, conjugaison). Le sujet est un <b>texte argumentatif</b> en lien avec un thème des œuvres : ce n\'est <b>ni un résumé, ni une dissertation littéraire</b>.</p>'
 +'<div class="fig">'+I.D.planRedaction()+'</div>'
 +'<h3>Les 6 étapes au brouillon (15 min)</h3><ol><li><b>Décoder la consigne</b> : souligner le thème, le verbe (<i>discutez, partagez-vous, défendez</i>) et la forme attendue (lettre, article, texte).</li><li><b>Choisir le plan</b> : « Partagez-vous cet avis ? » → dialectique (thèse / antithèse / synthèse) ; « Quelles sont les causes et les solutions ? » → analytique ; « Défendez… » → un seul point de vue, 3 arguments.</li><li><b>Trouver 3 arguments</b> (un par domaine : individuel, familial / social, moral ou économique) et <b>un exemple</b> pour chacun (œuvre, actualité, expérience).</li><li><b>Rédiger l\'introduction</b> : amorce (constat général) → sujet reformulé → question → annonce du plan.</li><li><b>Un paragraphe par argument</b>, ouvert par un connecteur, avec l\'exemple et une phrase de bilan.</li><li><b>Conclure</b> : bilan + avis personnel + ouverture (question ou élargissement).</li></ol>'
 +'<h3>Grille du correcteur (à appliquer soi-même)</h3><table><tr><th>Critère</th><th>Pts</th><th>Vérifier</th></tr><tr><td>Conformité à la consigne</td><td>1,5</td><td>Thème exact, forme demandée, longueur (15-20 lignes)</td></tr><tr><td>Cohérence de l\'argumentation</td><td>2</td><td>Thèse claire, arguments pertinents et illustrés, pas de contradiction</td></tr><tr><td>Organisation et progression</td><td>1,5</td><td>Intro / 2-3 paragraphes / conclusion, connecteurs</td></tr><tr><td>Vocabulaire</td><td>1,5</td><td>Précis, varié, pas de répétitions ni de familiarités</td></tr><tr><td>Syntaxe et ponctuation</td><td>1,5</td><td>Phrases complètes, virgules, pas de phrases de 6 lignes</td></tr><tr><td>Orthographe et conjugaison</td><td>2</td><td>Accords, participes passés, temps du présent de l\'argumentation</td></tr></table>'
 +'<h3>Banque de connecteurs</h3><table><tr><th>Fonction</th><th>Connecteurs</th></tr><tr><td>Introduire</td><td>De nos jours · Il est fréquent de constater que · On s\'interroge souvent sur</td></tr><tr><td>Énumérer</td><td>D\'abord · Ensuite · De plus · Par ailleurs · Enfin</td></tr><tr><td>Illustrer</td><td>Par exemple · Ainsi · C\'est le cas de · Comme le montre</td></tr><tr><td>Opposer / concéder</td><td>Cependant · Toutefois · Certes… mais · Néanmoins · En revanche</td></tr><tr><td>Cause / conséquence</td><td>Car · En effet · Parce que · Donc · Par conséquent · C\'est pourquoi</td></tr><tr><td>Conclure</td><td>En somme · En définitive · Pour conclure · Finalement</td></tr></table>'
 +'<h3>Les thèmes transversaux du régional</h3><p>La peine de mort et la justice (<i>DJC</i>) · le devoir et le bonheur, la révolte, le pouvoir (<i>Antigone</i>) · l\'enfance, la solitude, la pauvreté, les traditions et la superstition, la place de la femme, l\'école (<i>LBM</i>) · l\'amitié, la famille, la lecture, les réseaux sociaux, la violence, le travail des enfants. Les productions modèles ci-dessous en traitent une par une, avec le plan apparent et les connecteurs surlignés.</p></div>'

   k:'<b>À retenir :</b> 1954 · 1944 · 1829. Genres : roman autobiographique · tragédie moderne · roman à thèse. Courants : littérature marocaine d\'expression française · réécriture du mythe antique (théâtre du XXᵉ) · romantisme.'},
  {t:'Item 2 : situer le passage et son contexte',
   p:'Situer, c\'est <b>encadrer</b> : dire <b>ce qui précède</b>, <b>ce qui se passe</b> dans le passage et <b>ce qui suit</b>, avec des repères précis (chapitre, événement, personnages). Formule type : « Ce passage est extrait du chapitre X de… Il se situe juste après… (événement) ; le narrateur / le personnage y… ; il prépare… ». Le <b>contexte historique et culturel</b> peut aussi être demandé : le Maroc traditionnel sous le protectorat (LBM : Msid, hammam, Achoura, voyante, artisans) ; la France occupée de 1944 et la question de la résistance / de l\'obéissance (Antigone) ; la France de la Restauration où les exécutions sont publiques, place de Grève (DJC). Indices pour retrouver le moment : LBM — présence ou absence du père (parti aux moissons ch. 9-11), âge du narrateur, fêtes ; Antigone — Antigone est-elle déjà arrêtée ? (ordre : Prologue → Nourrice → Ismène → Hémon → les gardes → Créon → Chœur → fin) ; DJC — lieu (Bicêtre ch. 1-21, Conciergerie ch. 22-47, Hôtel de Ville ch. 48-49), heure annoncée.',

  {t:'Items 9-10 : réagir',
   p:'La capacité « réagir » évalue votre aptitude à <b>porter un jugement justifié</b> sur une idée, une valeur ou un comportement du texte (la superstition de Lalla Zoubida, le refus d\'Antigone, le réalisme de Créon, la cruauté de la foule devant l\'échafaud…). Attendu : <b>une prise de position claire</b> (« Je partage / je ne partage pas… »), <b>un argument</b> (« car… »), <b>un exemple ou une référence</b> (au texte, à la réalité d\'aujourd\'hui, à une autre œuvre). Trois à cinq phrases suffisent ; une seule phrase ne rapporte rien. Les correcteurs valorisent la nuance (« certes… mais… ») et la référence aux <b>valeurs</b> (justice, dignité, liberté, solidarité, tolérance) et aux <b>éléments de civilisation</b> (traditions, religion, fêtes, rapport à l\'autorité). Évitez le hors-sujet moral (« c\'est mal de… ») et le résumé du texte.',
   k:'<b>Modèle :</b> « Je partage l\'avis de… , car… . En effet, aujourd\'hui encore… . Toutefois, il faut reconnaître que… ».'},

   k:'<b>Barème mental :</b> avis clair 0,25 · argument 0,5 · exemple / nuance 0,25.'}

/* Langue 1 — Types et formes de phrases */
(function(){
var b=I.D.box,f=I.D.fleche,pill=I.D.pill,band=I.D.bandeau,svg=I.D.svg;
var kh=svg(230,[pill(100,8,160,28,'La phrase : types et formes'),
  b(8,46,166,30,'#1f6f78','4 TYPES (un seul par phrase)',[]),b(186,46,166,30,'#b5452c','FORMES (cumulables)',[]),
  b(8,82,166,24,'#e8f3f4','déclarative · interrogative',[],null,true),b(186,82,166,24,'#fbeae5','affirmative / négative',[],null,true),
  b(8,110,166,24,'#e8f3f4','exclamative · injonctive (impérative)',[],null,true),b(186,110,166,24,'#fbeae5','active / passive',[],null,true),
  b(186,138,166,24,'#fbeae5','neutre / emphatique · personnelle / impersonnelle',[],null,true),
  band(184,'Les types et formes révèlent l\'intention et l\'émotion : à relier au registre')]);
addLangue('fr',{
 titre:"Types et formes de phrases", sous:"Déclarative, interrogative, exclamative, injonctive · négative, passive, emphatique, impersonnelle · valeurs expressives",
 tip:'Item de langue très fréquent : « Quel est le type de cette phrase ? Quelle est sa forme ? Quelle est sa valeur ? » Les tragédies et les plaidoyers regorgent d\'interrogatives, d\'exclamatives et de négations : savoir dire <b>ce qu\'elles expriment</b> (révolte, doute, ordre, refus).',
 episodes:[
  {t:'Les quatre types',svg:kh,cap:'Un type obligatoire, des formes qui s\'ajoutent.',
   p:'<b>Déclarative</b> : énonce un fait, point final (<i>Le père est parti aux moissons.</i>). <b>Interrogative</b> : pose une question, point d\'interrogation ; <b>totale</b> (réponse oui / non : <i>Viens-tu ? Est-ce que tu viens ? Tu viens ?</i>) ou <b>partielle</b> (mot interrogatif : <i>Pourquoi pars-tu ?</i>) ; <b>directe</b> (point d\'interrogation) ou <b>indirecte</b> (subordonnée : <i>je me demande si tu viens</i>) ; trois niveaux : inversion (soutenu), « est-ce que » (courant), intonation (familier). <b>Exclamative</b> : exprime une émotion, point d\'exclamation, souvent avec <i>que, comme, quel</i> (<i>Quelle nuit !</i>) ou une phrase nominale (<i>Condamné à mort !</i>). <b>Injonctive</b> (impérative) : ordre, conseil, prière, interdiction ; impératif (<i>Sortez !</i>), subjonctif (<i>Qu\'il entre.</i>), infinitif (<i>Ne pas se pencher</i>), futur (<i>Tu ne tueras point</i>), « il faut ». Valeurs stylistiques : l\'<b>interrogative</b> peut être <b>rhétorique</b> (affirmation déguisée), <b>délibérative</b> (le personnage s\'interroge : <i>Que faire ?</i>) ; l\'<b>exclamative</b> traduit le <b>pathétique</b>, la colère, l\'émerveillement ; l\'<b>injonctive</b> marque l\'autorité (Créon) ou la supplication (<i>Grâce !</i>).',
   k:'<b>Question type :</b> « Quel est le type de la phrase “Que faire ?” et que traduit-il ? » → interrogative délibérative : le désarroi du personnage.'},
  {t:'Les formes',
   p:'<b>Affirmative / négative</b> : la négation se construit avec <b>ne… pas / plus / jamais / rien / personne / aucun / ni… ni / guère / que</b> (restriction : <i>je n\'ai que toi</i>) ; <b>négation totale</b> (ne… pas) ou <b>partielle</b> (ne… plus, jamais, personne) ; <b>lexicale</b> (préfixes in-, dé-, mal- ; <i>injuste, incapable</i>) ; valeur : le <b>refus</b> d\'Antigone (« Je ne veux pas comprendre »), le <b>néant</b> du condamné (« rien, personne »). <b>Active / passive</b> : à la passive, le complément d\'objet devient sujet, le verbe prend <i>être</i> + participe, l\'agent est introduit par <i>par</i> (ou <i>de</i>) ou disparaît (<i>Le condamné a été conduit à la Grève</i>) ; valeur : mettre en relief la <b>victime</b>, <b>effacer</b> le responsable (la société anonyme qui tue). <b>Neutre / emphatique</b> : mise en relief par <b>détachement</b> et reprise pronominale (<i>Mon père, lui, ne parlait jamais</i>), par le <b>présentatif</b> <i>c\'est… qui / que</i> (<i>C\'est moi qui l\'ai enterré</i>), par <i>ce qui… c\'est</i> ; valeur : insistance, opposition. <b>Personnelle / impersonnelle</b> : <i>il</i> sans référent (<i>il pleut, il faut, il est nécessaire que</i>) ; valeur : objectivité, loi générale, fatalité (<i>il faut que quelqu\'un dise oui</i>).',
   k:'<b>Repère :</b> type = intonation / ponctuation ; forme = construction. « Ne sortez pas ! » : type injonctif, forme négative.'},
  {t:'Analyser la phrase pour le sens',

 {t:'1 · La peine de mort : un châtiment juste ou une vengeance ? (plan dialectique)',
  sujet:'Sujet type régional — « Certains pensent que la peine de mort est nécessaire pour protéger la société des grands criminels. Partagez-vous ce point de vue ? Vous développerez votre réflexion dans un texte argumentatif d\'une vingtaine de lignes, en vous appuyant sur des arguments et des exemples précis. »',
  paras:[
   {type:'i',lab:'Introduction · amorce → sujet → problématique → annonce du plan',txt:'De nos jours, chaque crime odieux relance dans l\'opinion publique le débat sur la peine capitale. Nombreux sont ceux qui estiment que seule la mort du criminel peut protéger la société et apaiser les victimes. Mais cette sanction extrême est-elle réellement une justice, ou n\'est-elle qu\'une vengeance déguisée ? Après avoir examiné les raisons de ses partisans, nous montrerons pourquoi elle nous paraît indéfendable, avant de proposer une autre voie.'},
   {type:'t',lab:'Thèse adverse (concédée) · deux arguments + exemple',txt:'Il est vrai que la peine de mort répond à un besoin de sécurité. Tout d\'abord, ses défenseurs y voient une protection définitive : un meurtrier exécuté ne récidivera jamais, alors qu\'un détenu peut s\'évader ou être libéré. Ensuite, elle passe pour dissuasive : la crainte de l\'échafaud retiendrait, dit-on, la main des criminels. Ainsi, dans certains pays, les autorités justifient son maintien par la lutte contre le trafic de drogue ou le terrorisme.'},
   {type:'at',lab:'Antithèse · réfutation point par point + exemple littéraire',txt:'Cependant, ces arguments ne résistent pas à l\'examen. En effet, les statistiques des pays abolitionnistes montrent que la criminalité n\'y a pas augmenté : la peur de la mort n\'arrête pas celui qui tue dans la colère ou la misère. De plus, la justice humaine est faillible ; or une erreur judiciaire est irréparable quand le condamné a été exécuté. Par ailleurs, comme le montre Victor Hugo dans Le Dernier Jour d\'un condamné, cette peine inflige une torture morale insoutenable : le narrateur, enfermé avec sa pensée pendant cinq semaines, meurt mille fois avant l\'heure, et sa fille Marie est punie avec lui. Enfin, une société qui tue froidement, à heure fixe, devant la foule, ne fait que reproduire la violence qu\'elle prétend combattre : elle se venge, elle ne juge pas.'},
   {type:'c',lab:'Conclusion · bilan → avis → ouverture',txt:'En somme, si la peine de mort rassure, elle ne protège ni ne dissuade, et elle avilit ceux qui l\'appliquent. À mon sens, une justice digne de ce nom doit punir sans tuer : la détention longue et la réinsertion protègent mieux la société qu\'un cadavre de plus. Finalement, la véritable question n\'est-elle pas de savoir quelle société nous voulons être ?'}
  ]},
 {t:'2 · Faut-il renoncer à ses idéaux pour être heureux ? (Antigone · plan dialectique)',
  sujet:'Sujet type régional — « Créon affirme à Antigone que la vie n\'est qu\'un bonheur modeste fait de compromis, et qu\'il faut savoir dire oui. Pensez-vous qu\'il faille renoncer à ses idéaux pour être heureux ? Répondez dans un texte argumentatif organisé d\'une vingtaine de lignes. »',
  paras:[
   {type:'i',lab:'Introduction · amorce → reformulation → problématique → plan',txt:'Il est fréquent de constater que les adultes conseillent aux jeunes d\'être « raisonnables » et de modérer leurs ambitions. C\'est la leçon que Créon, dans Antigone de Jean Anouilh, tente d\'inculquer à sa nièce : le bonheur serait fait de petits renoncements. La question se pose de savoir si l\'on doit sacrifier ses idéaux pour vivre heureux. Nous verrons que le compromis a ses vertus, mais qu\'une vie sans exigence perd son sens, avant de chercher un équilibre.'},
   {type:'t',lab:'Thèse · le compromis est nécessaire (2 arguments + exemple)',txt:'D\'abord, il faut reconnaître que le compromis est la condition de toute vie en société. Nul ne peut imposer ses convictions aux autres sans violence ; accepter de céder sur certains points, c\'est respecter autrui. Ensuite, l\'intransigeance mène souvent au malheur : à vouloir tout, tout de suite, on finit par ne rien obtenir. Ainsi, Créon n\'a pas tort lorsqu\'il décrit le bonheur simple d\'un métier, d\'une maison, d\'un enfant qui joue : bien des gens trouvent là une paix réelle.'},
   {type:'at',lab:'Antithèse · sans idéal, pas de dignité (2 arguments + exemples)',txt:'Toutefois, un bonheur acheté au prix de ses principes n\'est qu\'une résignation. En effet, l\'homme ne se distingue pas par sa capacité à s\'adapter mais par celle de dire non à l\'injustice : les grandes avancées de l\'humanité, de l\'abolition de l\'esclavage à l\'indépendance des peuples, sont nées de refus jugés déraisonnables. De plus, renoncer à ce que l\'on croit juste, c\'est se trahir soi-même ; Antigone le sait, qui préfère mourir plutôt que d\'accepter une vie « qu\'il faudrait aimer » à genoux. Par ailleurs, l\'histoire du Maroc offre l\'exemple de résistants qui ont refusé le confort du compromis au nom de la liberté.'},
   {type:'c',lab:'Conclusion · synthèse → avis nuancé → ouverture',txt:'Pour conclure, le compromis est une sagesse dans les petites choses et une lâcheté dans les grandes. Il me semble que le bonheur véritable ne consiste ni à tout refuser comme Antigone ni à tout accepter comme Créon, mais à savoir sur quoi l\'on ne cédera jamais. Finalement, n\'est-ce pas cette ligne, propre à chacun, qui donne un sens à une vie ?'}
  ]}
]);

<table><tr><th>السؤال</th><th>كيف أجيب ؟</th></tr>
<tr><td>1 · وضع الوثائق في سياقها التاريخي/الجغرافي (1 ن)</td><td>ثلاثة عناصر : <b>الزمن</b> (القرن، العقد، السنة)، <b>المجال</b> (المغرب، أوروبا، العالم)، <b>الموضوع</b> (الظاهرة التي تشترك فيها الوثائق). أستعين بمصدر كل وثيقة وتاريخها.</td></tr>
<tr><td>2 · شرح المصطلحات (2 ن)</td><td>تعريف دقيق في جملة أو جملتين، مع <b>الإطار الزمني</b> ومثال إن أمكن. لا أكتفي بالترجمة الحرفية.</td></tr>
<tr><td>3 · التعريف / الاستخراج / الجدول (4.5 ن)</td><td>أقرأ السؤال كلمة كلمة : «استخرج» = من الوثيقة بصياغتي · «عرّف» = من الدرس · «في جدول» = أعمدة بعناوين واضحة. أستعمل أفعال الوثيقة الدالة : تتميز، أدت إلى، نتج عنها.</td></tr>
<tr><td>4 · الفكرة الأساس (1 ن)</td><td>جملة واحدة تجمع ما تشترك فيه الوثائق الثلاث : الموضوع + الزمن + المجال + الزاوية (مظاهر، أسباب، نتائج).</td></tr>
<tr><td>5 · فقرة مركزة (1.5 ن)</td><td>6 إلى 8 أسطر من <b>الدرس</b> لا من الوثائق : مقدمة قصيرة، 3 أو 4 معلومات دقيقة (تواريخ/أرقام)، خلاصة. بروابط.</td></tr></table></div>

<div class="card"><h2>منهجية الموضوع المقالي</h2>
<div class="fig">${HGD.maqal}</div>
<table><tr><th></th><th>في التاريخ</th><th>في الجغرافيا</th></tr>
<tr><td><b>المقدمة</b></td><td>تأطير زماني (القرن، الفترة) ومكاني (المجال) + تقديم الموضوع + إشكالية في سؤالين أو ثلاثة تُعلن محاور العرض</td><td>تقديم الظاهرة أو المجال بمعطى رقمي أو جغرافي + إشكالية</td></tr>
<tr><td><b>العرض</b></td><td><b>تعريف</b> الظاهرة ومظاهرها ← <b>تفسير</b> بالعوامل والأسباب ← <b>تركيب</b> النتائج والامتدادات. ترتيب زمني، تواريخ، أسماء، معاهدات</td><td><b>وصف</b> المظاهر والتوزيع المجالي ← <b>تفسير</b> بالعوامل الطبيعية والبشرية والتنظيمية ← <b>تعميم</b> (المشاكل، الحلول، الآفاق). أرقام ونسب وأمثلة</td></tr>
<tr><td><b>الخاتمة</b></td><td>خلاصة تجيب عن الإشكالية + فتح أفق في الزمن (ما تلا الفترة)</td><td>خلاصة + فتح أفق في المجال أو الزمن (التحديات)</td></tr></table>
<div class="keypoints"><b>قواعد ذهبية :</b> لا أضع عناوين داخل المقال · فقرة لكل محور يبدأ برابط · أحترم ترتيب الإشكالية · أُدرج 6 معلومات دقيقة على الأقل (تواريخ، أرقام، أسماء) · أترك سطرا بين الفقرات · أكتب الخاتمة ولو ضاق الوقت.</div></div>

<div class="card"><h2>كيف أوزع وقتي ؟</h2><div class="fig">${HGD.temps}</div>
<p>الخطأ القاتل : البدء بالمقال والغرق فيه. ابدأ بالوثائق (أجوبتها محددة وسريعة)، ثم خطط المقال في المسودة برؤوس أقلام، ثم حرّره. اختر موضوع المقال الذي تملك عنه <b>أكثر المعطيات الدقيقة</b>، لا الذي يبدو أسهل.</p></div>

<div class="card"><h2>أخطاء تُضيّع النقط</h2>
<div class="keypoints">✗ نقل جمل الوثيقة حرفيا بدل إعادة الصياغة.<br>✗ الخلط بين «استخرج» (من الوثيقة) و«عرّف»/«بيّن» (من الدرس).<br>✗ سياق تاريخي بلا زمن أو بلا مجال.<br>✗ شرح مصطلح بكلمة واحدة أو بترجمته.<br>✗ مقال بلا إشكالية في المقدمة أو بلا خاتمة.<br>✗ مقال بلا تاريخ ولا رقم ولا اسم : «كلام عام» يُنقَّط على 3 أو 4 من 10.<br>✗ عناوين داخل المقال، أو تعداد بنقاط بدل الفقرات.</div></div>`,
 persos:[], schema:'',
 notions:[
  {n:'الثورة الصناعية الثانية',d:'مرحلة من التصنيع ابتداء من 1870 تقريبا، قامت على الطاقة الجديدة (الكهرباء، البترول)، والصلب، والكيمياء، والمحرك الانفجاري، والتنظيم العلمي للعمل.'},
  {n:'التركيز الرأسمالي',d:'اندماج المقاولات في وحدات كبرى للحد من المنافسة والتحكم في السوق : الكارتل (اتفاق)، الترست (اندماج)، الهولدينغ (شركة قابضة).'},
  {n:'الرأسمالية المالية',d:'مرحلة سيطرت فيها الأبناك والبورصات والشركات المساهمة على تمويل الصناعة والتجارة في أواخر القرن 19.'},
  {n:'البورجوازية والبروليتاريا',d:'البورجوازية : الطبقة المالكة لوسائل الإنتاج ؛ البروليتاريا : الطبقة العاملة التي لا تملك إلا قوة عملها. مفهومان مركزيان في التحليل الماركسي.'},
  {n:'الاشتراكية العلمية',d:'النظرية التي وضعها كارل ماركس وفريدريك إنجلز (البيان الشيوعي 1848، رأس المال 1867) : الصراع الطبقي محرك التاريخ، وإلغاء الملكية الخاصة لوسائل الإنتاج.'},
  {n:'الليبرالية الاقتصادية',d:'مذهب يقوم على حرية المبادرة والمنافسة وعدم تدخل الدولة (دعه يعمل دعه يمر) ؛ منظّره آدم سميث (ثروة الأمم 1776).'},
  {n:'الإمبريالية',d:'سياسة توسع الدول الرأسمالية الكبرى للسيطرة على مناطق خارجية سياسيا واقتصاديا وعسكريا، بلغت ذروتها بين 1880 و1914.'},
  {n:'مؤتمر برلين 1884-1885',d:'مؤتمر دولي نظّم تقسيم إفريقيا بين القوى الاستعمارية ووضع مبدأ الاحتلال الفعلي.'},
  {n:'الأحلاف',d:'التحالف الثلاثي (ألمانيا، النمسا-المجر، إيطاليا 1882) في مواجهة الوفاق الثلاثي (فرنسا، روسيا، بريطانيا 1907) قبل الحرب العالمية الأولى.'},
  {n:'اليقظة الفكرية',d:'حركة فكرية إصلاحية في المشرق العربي في القرن 19 (النهضة) بتيارين : سلفي (الأفغاني، محمد عبده) وعلماني/ليبرالي (الطهطاوي، شبلي شميل، فرح أنطون).'},
  {n:'الحماية القنصلية',d:'نظام منح به الأجانب حمايتهم لمغاربة فأعفوهم من الضرائب والقضاء المغربي ؛ وسّعته اتفاقية مدريد 1880 وأضعف سيادة المخزن.'},
  {n:'معاهدة 1856',d:'معاهدة الصداقة والتجارة بين المغرب وبريطانيا : حرية التجارة، تحديد الرسوم الجمركية في 10 %، امتيازات للرعايا الإنجليز ؛ فتحت المغرب أمام التغلغل الأوروبي.'},
  {n:'مؤتمر الجزيرة الخضراء 1906',d:'مؤتمر دولي أقرّ مبدئيا سيادة السلطان لكنه فرض تدويل المسألة المغربية : بنك مخزني، شرطة بالموانئ تحت إشراف فرنسا وإسبانيا.'},
  {n:'معاهدة فاس 30 مارس 1912',d:'المعاهدة التي فرضت الحماية الفرنسية على المغرب (وقّعها المولى عبد الحفيظ)، تلتها اتفاقية مدريد نونبر 1912 مع إسبانيا.'},
  {n:'أزمة 1929',d:'أزمة اقتصادية عالمية انطلقت من انهيار بورصة وول ستريت في 24 أكتوبر 1929 (الخميس الأسود) ؛ نتج عنها إفلاس وبطالة وانتشار الأنظمة الشمولية.'},
  {n:'الخطة الجديدة (New Deal)',d:'سياسة الرئيس روزفلت ابتداء من 1933 لمواجهة الأزمة : تدخل الدولة، أشغال كبرى، تنظيم الأبناك والفلاحة، حماية اجتماعية.'},
  {n:'النازية والفاشية',d:'أنظمة شمولية : الفاشية في إيطاليا مع موسوليني (1922) والنازية في ألمانيا مع هتلر (1933) ؛ قومية متطرفة، حزب وحيد، عسكرة، توسع.'},
  {n:'هيئة الأمم المتحدة',d:'منظمة دولية تأسست في 24 أكتوبر 1945 (ميثاق سان فرانسيسكو) لحفظ السلم والأمن الدوليين، خلفا لعصبة الأمم.'},
  {n:'الظهير البربري 16 ماي 1930',d:'ظهير أصدرته سلطات الحماية لإخضاع المناطق الأمازيغية للعرف بدل الشريعة ؛ أثار حركة احتجاج واسعة كانت منطلق الحركة الوطنية.'},
  {n:'وثيقة المطالبة بالاستقلال 11 يناير 1944',d:'وثيقة قدمها حزب الاستقلال طالبت باستقلال المغرب ووحدته تحت قيادة السلطان محمد بن يوسف.'},
  {n:'ثورة الملك والشعب 20 غشت 1953',d:'انتفاضة شعبية ومقاومة مسلحة ردا على نفي السلطان محمد الخامس ؛ انتهت بعودته في 16 نونبر 1955 والاستقلال في 1956.'},
  {n:'التنمية',d:'عملية تحوّل شامل اقتصادي واجتماعي وثقافي يهدف إلى تحسين شروط عيش السكان ؛ تختلف عن النمو (مجرد زيادة في الإنتاج).'},
  {n:'مؤشر التنمية البشرية',d:'مؤشر مركب أحدثه برنامج الأمم المتحدة الإنمائي سنة 1990 يجمع العمر المتوقع عند الولادة، ومستوى التعليم، والدخل الفردي ؛ يتراوح بين 0 و1.'},
  {n:'الناتج الداخلي الخام',d:'مجموع قيمة السلع والخدمات المنتجة داخل بلد خلال سنة ؛ وقسمته على عدد السكان تعطي الدخل الفردي.'},
  {n:'خط برانت / الشمال والجنوب',d:'تقسيم اقترحه تقرير فيلي برانت 1980 يفصل بين الشمال المتقدم والجنوب النامي ؛ تجاوزته اليوم البلدان الصاعدة.'},
  {n:'البلدان الصاعدة',d:'بلدان نامية تعرف نموا اقتصاديا سريعا واندماجا في الاقتصاد العالمي : الصين، الهند، البرازيل، جنوب إفريقيا… (مجموعة بريكس).'},
  {n:'إعداد التراب الوطني',d:'سياسة عمومية تهدف إلى التوزيع المتوازن للسكان والأنشطة والتجهيزات على المجال الوطني ؛ أداتها بالمغرب الميثاق الوطني لإعداد التراب (2001) والتصميم الوطني.'},
  {n:'الجهوية المتقدمة',d:'تنظيم ترابي اعتمده المغرب منذ 2015 بتقسيم البلاد إلى 12 جهة تتمتع بصلاحيات واسعة في التنمية الجهوية.'},
  {n:'المبادرة الوطنية للتنمية البشرية',d:'برنامج أطلقه الملك محمد السادس في 18 ماي 2005 لمحاربة الفقر والهشاشة والإقصاء في المدن والأرياف.'},
  {n:'التمدين',d:'ارتفاع نسبة سكان المدن ؛ تجاوزت بالمغرب 60 % وتُنتج ضغطا على السكن والتجهيزات ومدن الصفيح والأحياء الهامشية.'},
  {n:'الإجهاد المائي',d:'وضعية يقل فيها نصيب الفرد من الماء عن 1000 متر مكعب سنويا ؛ المغرب في حدود 600 م³ وأغلب البلدان العربية دون 500 م³.'},
  {n:'التصحر',d:'تدهور الأراضي في المناطق الجافة وشبه الجافة بفعل عوامل مناخية وبشرية (الرعي الجائر، اجتثاث الغابات، الملوحة).'},
  {n:'الميغالوبوليس',d:'تجمع حضري عملاق يضم عدة مدن كبرى متصلة ؛ أشهرها الميغالوبوليس الشمالي الشرقي للولايات المتحدة من بوسطن إلى واشنطن.'},
  {n:'الشركات متعددة الجنسيات',d:'شركات عملاقة تمارس نشاطها في عدة دول وتتحكم في جزء كبير من الإنتاج والتجارة العالميين ؛ أداة أساسية للقوة الاقتصادية الأمريكية.'},
  {n:'معاهدة ماستريخت 1992',d:'المعاهدة التي أسست الاتحاد الأوروبي ومهدت للعملة الموحدة (الأورو 1999/2002) والمواطنة الأوروبية.'},
  {n:'الاندماج الشامل',d:'مسار الاتحاد الأوروبي من السوق المشتركة (روما 1957) إلى الاتحاد الاقتصادي والنقدي والسياسي، مع تحديات التوسع والتباينات والبريكسيت (2020).'},
  {n:'الاشتراكية ذات الخصوصيات الصينية',d:'النموذج الصيني منذ إصلاحات دينغ شياو بينغ (1978) : انفتاح اقتصادي ومناطق اقتصادية خاصة مع احتفاظ الحزب الشيوعي بالسلطة.'},
  {n:'المناطق الاقتصادية الخاصة',d:'مناطق ساحلية صينية (شنتشن أولا، 1980) تتمتع بامتيازات لجذب الاستثمار الأجنبي ؛ كانت قاطرة الصعود الصيني.'},
  {n:'معركة إيسلي 1844',d:'هزيمة الجيش المغربي أمام فرنسا في 14 غشت 1844 بعد مساندة الأمير عبد القادر ؛ أول ضغط عسكري أوروبي كبير على المغرب في القرن 19.'},
  {n:'معاهدة واد راس 1860',d:'أنهت حرب تطوان مع إسبانيا : غرامة 20 مليون ريال، توسيع سبتة ومليلية ؛ أدخلت المغرب في المديونية.'},
  {n:'مؤتمر مدريد 1880',d:'مؤتمر دولي قنن الحماية القنصلية ووسعها بدل الحد منها.'},
  {n:'الحسن الأول',d:'سلطان المغرب 1873-1894 ؛ صاحب أهم محاولات الإصلاح : الجيش، البعثات، المكينة 1888، الريال الحسني، الأمناء.'},
  {n:'ليوطي',d:'أول مقيم عام فرنسي بالمغرب 1912-1925 ؛ نظّر لحماية «غير مباشرة» تحافظ على المظاهر وبنى المدن الجديدة.'},
  {n:'معركة أنوال 1921',d:'انتصار محمد بن عبد الكريم الخطابي على الجيش الإسباني في 21 يوليوز 1921 بالريف.'},
  {n:'خطاب طنجة 1947',d:'خطاب السلطان محمد بن يوسف في 9 أبريل 1947 أكد فيه انتماء المغرب العربي الإسلامي ومطالبه المشروعة.'},
  {n:'جيش التحرير',d:'المقاومة المسلحة التي انطلقت في 2 أكتوبر 1955 بالريف والأطلس ثم بالجنوب.'},
  {n:'المسيرة الخضراء',d:'6 نونبر 1975 : 350 ألف مغربي بالمصاحف والأعلام لاسترجاع الساقية الحمراء ؛ تلتها اتفاقية مدريد 14 نونبر 1975.'},
  {n:'جول فيري',d:'رئيس حكومة فرنسي برر الاستعمار سنة 1885 بـ«واجب الأجناس العليا في تمدين الأجناس الدنيا».'},
  {n:'اغتيال سراييفو',d:'28 يونيو 1914 : اغتيال ولي عهد النمسا فرانسوا فرديناند ؛ السبب المباشر للحرب العالمية الأولى.'},
  {n:'الهدنة 11 نونبر 1918',d:'نهاية الحرب العالمية الأولى بتوقيع ألمانيا الهدنة.'},
  {n:'لينين',d:'زعيم البلاشفة وقائد ثورة أكتوبر 1917 ؛ مؤسس الدولة السوفياتية ؛ النيب 1921.'},
  {n:'موسوليني',d:'مؤسس الفاشية الإيطالية ؛ وصل إلى السلطة بالمسيرة على روما في أكتوبر 1922.'},
  {n:'روزفلت',d:'الرئيس الأمريكي 1933-1945 ؛ صاحب الخطة الجديدة (New Deal) لمواجهة أزمة 1929.'},
  {n:'مؤتمر ميونيخ 1938',d:'شتنبر 1938 : تنازل بريطانيا وفرنسا لهتلر عن السوديت ؛ رمز سياسة التهدئة.'},
  {n:'بيرل هاربر',d:'7 دجنبر 1941 : هجوم ياباني على الأسطول الأمريكي أدخل الولايات المتحدة الحرب.'},
  {n:'ستالينغراد',d:'شتنبر 1942 – فبراير 1943 : أول هزيمة كبرى لألمانيا ومنعطف الحرب العالمية الثانية.'},
  {n:'مؤتمر أنفا 1943',d:'يناير 1943 بالدار البيضاء : روزفلت وتشرشل ؛ لقاء روزفلت بالسلطان محمد بن يوسف.'},
  {n:'يالطا 1945',d:'فبراير 1945 : تقاسم النفوذ بين الحلفاء بعد الحرب ؛ بداية الثنائية القطبية.'},
  {n:'الطهطاوي',d:'رفاعة الطهطاوي (1801-1873) : رائد التيار الليبرالي، «تخليص الإبريز» 1834، مدرسة الألسن.'},
  {n:'الأفغاني',d:'جمال الدين الأفغاني (1838-1897) : رائد السلفية الإصلاحية، الجامعة الإسلامية، العروة الوثقى 1884.'},
  {n:'الكواكبي',d:'عبد الرحمن الكواكبي (1855-1902) : «طبائع الاستبداد» ؛ الاستبداد أصل كل فساد.'},
  {n:'تقرير برونتلاند 1987',d:'التقرير الذي عرّف التنمية المستدامة : تلبية حاجات الحاضر دون المساس بحق الأجيال القادمة.'},
  {n:'نور ورزازات',d:'أكبر مركب للطاقة الشمسية في العالم (580 ميغاواط) ؛ رمز الاستراتيجية الطاقية المغربية (52 % متجددة في 2030).'},
  {n:'مدن بدون صفيح',d:'برنامج أُطلق سنة 2004 للقضاء على أحياء الصفيح ؛ أزيد من 60 مدينة معلنة و300 ألف أسرة مستفيدة.'},

  {t:'مدخل إشكالي وخطاطة الدرس',svg:khatata,cap:'أربعة محاور : المفهوم، القياس، التصنيف، التوزيع المجالي.',
   p:'يعيش في العالم اليوم أزيد من 8 مليارات نسمة في ظروف متفاوتة جدا : متوسط عمر يتجاوز 84 سنة في اليابان مقابل حوالي 53 سنة في تشاد، ودخل فردي يفوق 80 ألف دولار في النرويج مقابل أقل من 300 دولار في بوروندي. لفهم هذه التفاوتات وقياسها ظهر مفهوم <b>التنمية</b> بعد الحرب العالمية الثانية، وتعددت مقارباته من الاقتصادي الصرف إلى البشري والمستدام. <b>الإشكالية :</b> ما مفهوم التنمية وما مقارباتها ؟ بأي مؤشرات تُقاس ؟ وما التقسيمات الكبرى التي يُنتجها توزيعها في العالم ؟',
   k:'<b>المفاهيم المفاتيح :</b> النمو، التنمية، التنمية البشرية، التنمية المستدامة، الناتج الداخلي الخام، مؤشر التنمية البشرية، الشمال/الجنوب، البلدان الصاعدة، الأقل نموا.'},
  {t:'المحور 1 · مفهوم التنمية وتعدد مقارباته',
   p:'<b>النمو الاقتصادي</b> زيادة كمية في الإنتاج والثروة تُقاس بالناتج الداخلي الخام ؛ أما <b>التنمية</b> فتحوّل نوعي شامل في البنيات الاقتصادية والاجتماعية والثقافية يحسّن حياة الناس. وقد تعاقبت المقاربات : <b>المقاربة الاقتصادية</b> (الخمسينيات والستينيات) ركزت على التصنيع والنمو وافترضت أن الثروة ستنتشر تلقائيا ؛ ثم <b>المقاربة الاجتماعية</b> (السبعينيات) أدمجت الحاجات الأساسية (التغذية، الصحة، التعليم، السكن) ؛ ثم <b>التنمية البشرية</b> التي بلورها برنامج الأمم المتحدة الإنمائي منذ 1990 بتأثير من أمارتيا سن ومحبوب الحق : توسيع خيارات الإنسان (حياة طويلة وصحية، معرفة، مستوى عيش لائق، مشاركة) ؛ ثم <b>التنمية المستدامة</b> (تقرير برونتلاند 1987، قمة ريو 1992) : تلبية حاجات الحاضر دون المساس بقدرة الأجيال القادمة، بالتوفيق بين الاقتصادي والاجتماعي والبيئي ؛ وتُترجمها اليوم <b>أهداف التنمية المستدامة</b> السبعة عشر (2015-2030).',
   k:'<b>تسلسل يُحفظ :</b> نمو (كمّ) ← تنمية (كيف) ← تنمية بشرية 1990 (الإنسان) ← تنمية مستدامة 1987/1992 (الأجيال والبيئة) ← أهداف 2030.<br><b>مثال للمقال :</b> بلدان نفطية غنية بالناتج لكن تنميتها البشرية متوسطة : النمو لا يعني التنمية.'},
  {t:'المحور 2 · مؤشرات قياس التنمية',svg:hdi,cap:'المغرب في الفئة المتوسطة (0.698، الرتبة 120 من 193) حسب تقرير 2023/2024.',
   p:'<b>المؤشرات الاقتصادية :</b> <b>الناتج الداخلي الخام</b> (مجموع قيمة السلع والخدمات المنتجة في بلد خلال سنة) و<b>الدخل الفردي</b> (الناتج مقسوما على السكان، ويُحسب غالبا بتعادل القدرة الشرائية) ؛ وبنية الناتج حسب القطاعات (هيمنة الفلاحة مؤشر تخلف، هيمنة الخدمات والصناعة العالية مؤشر تقدم). <b>المؤشرات الاجتماعية :</b> العمر المتوقع عند الولادة، وفيات الأطفال، نسبة التمدرس والأمية، عدد الأطباء لكل 10 آلاف نسمة، الولوج إلى الماء الشروب. <b>المؤشرات المركبة :</b> <b>مؤشر التنمية البشرية</b> (منذ 1990) يجمع ثلاثة أبعاد : الصحة (العمر المتوقع)، المعرفة (سنوات التمدرس المتوقعة والفعلية)، مستوى العيش (الدخل الفردي) في قيمة بين 0 و1 ؛ ويُكمَّل بمؤشر الفقر متعدد الأبعاد ومؤشر الفوارق بين الجنسين. <b>حدود المؤشرات :</b> الدخل الفردي معدل يُخفي الفوارق الداخلية ؛ ومؤشر التنمية البشرية لا يقيس الحرية ولا البيئة ولا توزيع الثروة.',
   k:'<b>أرقام مرجعية (تقرير 2023/2024) :</b> سويسرا 0.967 (الأولى) · النرويج 0.966 · المغرب 0.698 (120) · النيجر 0.394 · الصومال 0.380 (الأخيرة).<br><b>للوثائق :</b> حين تُعطى جداول، احسب الفارق أو النسبة (مثلا : دخل النرويجي يفوق دخل البوروندي بـ 300 مرة) ثم فسّر.'},
  {t:'المحور 3 · التقسيمات الكبرى للعالم',svg:taqsim,cap:'من الثنائية البسيطة (شمال/جنوب) إلى عالم متعدد السرعات.',
   p:'أنتج تفاوت التنمية <b>تقسيمات</b> متعاقبة. خلال الحرب الباردة : العالم الأول (الرأسمالي)، الثاني (الاشتراكي)، <b>الثالث</b> (مصطلح ألفريد سوفي 1952 للبلدان المستقلة حديثا). ثم <b>الشمال والجنوب</b> : خط افتراضي اقترحه تقرير فيلي برانت سنة 1980 يفصل بلدان الشمال المتقدمة (أمريكا الشمالية، أوروبا، اليابان، أستراليا) عن بلدان الجنوب النامية. غير أن الجنوب <b>تفكك</b> منذ الثمانينيات إلى فئات : <b>البلدان الصاعدة</b> (الصين، الهند، البرازيل، جنوب إفريقيا، تركيا، المكسيك… ومجموعة بريكس منذ 2009 الموسعة سنة 2024) ذات النمو السريع والاندماج في العولمة ؛ <b>البلدان النفطية</b> ذات الدخل المرتفع والتنمية غير المتوازنة ؛ <b>البلدان المتوسطة</b> كالمغرب ومصر وإندونيسيا ؛ و<b>البلدان الأقل نموا</b> (لائحة أممية تضم 45 بلدا سنة 2024، أغلبها في إفريقيا جنوب الصحراء) تعاني الفقر والهشاشة والنزاعات.',
   k:'<b>للمقال :</b> «التقسيم الثنائي شمال/جنوب لم يعد كافيا» ← برهن بصعود الصين (ثاني اقتصاد عالمي) وبالفوارق داخل الجنوب (الإمارات/النيجر).<br><b>موقع المغرب :</b> جنوب، فئة متوسطة، في طور الانتقال (تنمية بشرية متوسطة، اقتصاد متنوع، تحديات التعليم والفوارق).'},
  {t:'المحور 4 · خريطة التنمية : التفاوتات المجالية وعواملها',
   p:'تُظهر خريطة مؤشر التنمية البشرية <b>تفاوتا بين القارات</b> : أوروبا وأمريكا الشمالية وأستراليا واليابان في الفئة المرتفعة جدا ؛ أمريكا اللاتينية وشرق آسيا وشمال إفريقيا في الفئتين المرتفعة والمتوسطة ؛ وإفريقيا جنوب الصحراء وأجزاء من جنوب آسيا في الفئة المنخفضة. كما توجد <b>تفاوتات داخل البلدان</b> : بين الساحل والداخل في الصين والمغرب، وبين المدن والأرياف في كل الجنوب. وتُفسَّر هذه التفاوتات بعوامل <b>تاريخية</b> (الاستعمار واقتسام العمل الدولي غير المتكافئ)، و<b>اقتصادية</b> (التبعية، المديونية، تصدير المواد الخام)، و<b>ديمغرافية</b> (نمو سكاني سريع يلتهم ثمار النمو)، و<b>سياسية</b> (الحكامة، الفساد، النزاعات)، و<b>طبيعية</b> (الجفاف، الأوبئة، البعد عن البحر)، فضلا عن <b>الرأسمال البشري</b> (التعليم والصحة) الذي يُعدّ اليوم العامل الحاسم.',
   k:'<b>قالب تفسير جغرافي :</b> عوامل تاريخية + اقتصادية + ديمغرافية + سياسية + طبيعية + بشرية. رتّبها من الأهم، ومثّل لكل عامل ببلد.<br><b>تحوّل حديث :</b> تراجع الفقر المدقع عالميا من 36 % (1990) إلى حوالي 9 % (2022) بفضل آسيا أساسا، بينما تتركز الهشاشة في إفريقيا.'},
  {t:'نموذج الاشتغال على الوثائق (مصحَّح)',
   p:'<b>الوثيقة 1 (جدول) :</b> مؤشرات مختارة (تقرير التنمية البشرية 2023/2024، أرقام مقرّبة) : النرويج : مؤشر 0.966، عمر متوقع 83 سنة، دخل فردي ~ 70 ألف دولار · المغرب : 0.698، 75 سنة، ~ 8 آلاف دولار (بتعادل القدرة الشرائية) · النيجر : 0.394، 62 سنة، ~ 1300 دولار.<br><b>الوثيقة 2 (نص) :</b> «التنمية البشرية هي عملية توسيع خيارات الناس. وأهم هذه الخيارات أن يعيش الإنسان حياة طويلة وصحية، وأن يكتسب المعرفة، وأن يحصل على الموارد اللازمة لمستوى عيش لائق. فالدخل وسيلة وليس غاية.» (مستوحى من تقرير التنمية البشرية الأول، 1990).<br><b>الوثيقة 3 (نص) :</b> «لم يعد الجنوب كتلة واحدة : فبينما صارت الصين ثاني قوة اقتصادية في العالم وتحتضن شنغهاي أبراجا تفوق نيويورك، ما زال طفل من كل عشرة في إفريقيا جنوب الصحراء لا يبلغ سن الخامسة. إن خريطة التنمية اليوم فسيفساء لا خطا مستقيما.» (نص مركّب لأغراض التدريب).<br><br><b>1 · السياق (1 ن) :</b> تتناول الوثائق قضية التنمية وتفاوتها في العالم المعاصر (العقدان الأولان من القرن 21)، على مستوى عالمي مع أمثلة من الشمال (النرويج) والجنوب (المغرب، النيجر، الصين، إفريقيا).<br><b>2 · المصطلحات (2 ن) :</b> <b>مؤشر التنمية البشرية</b> : مؤشر مركب وضعه برنامج الأمم المتحدة الإنمائي سنة 1990 يجمع العمر المتوقع والتمدرس والدخل الفردي في قيمة بين 0 و1 لترتيب البلدان. <b>الجنوب</b> : مجموع البلدان النامية جنوب خط برانت (1980)، وهي اليوم فئات متفاوتة من البلدان الصاعدة إلى الأقل نموا.<br><b>3 · أ – قارن وضعية البلدان الثلاثة (الوثيقة 1) (1.5 ن) :</b> فارق هائل : دخل النرويجي يفوق دخل المغربي بنحو 9 مرات ودخل النيجري بأزيد من 50 مرة ؛ ويعيش النرويجي 21 سنة أكثر من النيجري ؛ فالنرويج في الفئة المرتفعة جدا، والمغرب متوسط، والنيجر منخفض. <b>ب – استخرج من الوثيقة 2 أبعاد التنمية البشرية الثلاثة في جدول (1.5 ن) :</b> البعد | مضمونه : الصحة | حياة طويلة وصحية · المعرفة | اكتساب المعرفة · مستوى العيش | موارد لحياة لائقة ؛ مع ملاحظة أن الدخل وسيلة لا غاية. <b>ج – بيّن انطلاقا من الوثيقة 3 لماذا لم يعد تقسيم الشمال/الجنوب كافيا (1.5 ن) :</b> لأن الجنوب صار متباينا : بلدان صاعدة كالصين تنافس الشمال اقتصاديا، وبلدان أقل نموا في إفريقيا ما زالت تعاني وفيات أطفال مرتفعة ؛ فالتنمية «فسيفساء».<br><b>4 · الفكرة الأساس (1 ن) :</b> التنمية البشرية مفهوم متعدد الأبعاد يتجاوز الدخل، وتُظهر مؤشراته تفاوتات عميقة بين الشمال والجنوب وداخل الجنوب نفسه.<br><b>5 · فقرة مركزة : عوامل تفاوت التنمية في العالم (1.5 ن) :</b> يُفسَّر تفاوت التنمية بتضافر عوامل متعددة. فتاريخيا ورثت بلدان الجنوب عن الاستعمار اقتصادا تابعا قائما على تصدير المواد الخام ؛ واقتصاديا تُثقلها المديونية وتدهور شروط التبادل ؛ وديمغرافيا يلتهم النمو السكاني السريع ثمار النمو الاقتصادي ؛ وسياسيا تُعيق النزاعات وضعف الحكامة الاستثمار ؛ بينما يُعدّ الرأسمال البشري (التعليم والصحة) العامل الحاسم، كما تُثبته تجارب كوريا الجنوبية التي انتقلت في جيلين من الجنوب إلى الشمال.',

  {t:'المحور 1 · التحولات الاقتصادية والمالية',svg:tarkiz,cap:'ثلاثة أشكال للتركيز، وهدف واحد : الاحتكار.',
   p:'<b>أ · الثورة الصناعية الثانية (منذ 1870) :</b> مصادر طاقة جديدة (<b>الكهرباء</b> و<b>البترول</b> إلى جانب الفحم)، ومواد جديدة (<b>الصلب</b> بفضل طريقة بسمر 1856، <b>الكيمياء</b> والألمنيوم)، واختراعات غيّرت الحياة (المحرك الانفجاري 1886، الهاتف 1876، المصباح الكهربائي 1879، السيارة، الطائرة 1903)، وثورة في النقل (السكك الحديدية : من 9 آلاف كلم سنة 1840 إلى أزيد من مليون كلم عشية 1914 في العالم ؛ البواخر، قناة السويس 1869). وتطور <b>تنظيم العمل</b> : التايلورية (تقسيم المهام وقياس الزمن) ثم الفوردية (سلسلة التركيب 1913). <b>ب · التركيز الرأسمالي :</b> أدت المنافسة والأزمات الدورية (الانكماش الكبير 1873-1896) إلى اندماج المقاولات في وحدات ضخمة : <b>الكارتل</b> (اتفاق)، <b>الترست</b> (اندماج كلي : ستاندرد أويل لروكفلر 1882)، <b>الهولدينغ</b> (شركة قابضة)، والكونزرن في ألمانيا (كروب). <b>ج · الرأسمالية المالية :</b> صارت <b>الأبناك</b> (دويتشه بنك 1870، كريدي ليوني 1863) و<b>البورصات</b> (لندن، باريس، نيويورك) و<b>الشركات المساهمة</b> تتحكم في تمويل الصناعة، وتصدّر الرساميل إلى الخارج (القروض، الاستثمارات الاستعمارية)، فسُمّيت المرحلة <b>الرأسمالية المالية</b> أو الاحتكارية.',
   k:'<b>أرقام للمقال :</b> إنتاج الصلب العالمي : حوالي 0.5 مليون طن 1870 ← 28 مليون طن 1900 ← 76 مليون طن 1913 · بريطانيا «ورشة العالم» حتى 1870، ثم تجاوزتها ألمانيا والولايات المتحدة في الصلب قبل 1914.<br><b>المنطق :</b> اختراعات ← إنتاج كبير ← منافسة وأزمات ← تركيز ← احتكار ← حاجة إلى أسواق خارجية (الإمبريالية).'},
  {t:'المحور 2 · التحولات الاجتماعية',
   p:'<b>أ · ثورة ديمغرافية وتمدين :</b> انتقل سكان أوروبا من حوالي 190 مليون نسمة سنة 1800 إلى 420 مليونا سنة 1900 بفضل تراجع الوفيات (التغذية، الطب : لقاح باستور، النظافة). ونتج عن ذلك <b>هجرة قروية</b> كثيفة نحو المدن الصناعية (لندن تجاوزت 6 ملايين سنة 1900)، و<b>هجرة خارجية</b> لنحو 50 مليون أوروبي نحو الأمريكتين وأستراليا بين 1850 و1914. <b>ب · مجتمع طبقي جديد :</b> صعدت <b>البورجوازية</b> (الصناعية، المالية، التجارية) المالكة لوسائل الإنتاج وسيطرت على الثروة والسياسة ؛ وتشكلت <b>البروليتاريا</b> (الطبقة العاملة) في ظروف قاسية : يوم عمل من 12 إلى 14 ساعة، أجور زهيدة، تشغيل النساء والأطفال، سكن غير صحي، غياب التأمين ؛ وتراجعت الأرستقراطية العقارية والفلاحون والحرفيون. <b>ج · الحركة العمالية :</b> رد فعل على الاستغلال : إضرابات وتخريب الآلات (اللوديون) في البداية، ثم <b>النقابات</b> (الاعتراف بها في بريطانيا 1824/1871، فرنسا 1884 بقانون فالديك روسو، ألمانيا 1890)، و<b>الأممية الأولى</b> (لندن 1864) و<b>الثانية</b> (باريس 1889، التي أقرت فاتح ماي عيدا للعمال تخليدا لإضراب شيكاغو 1886)، والأحزاب الاشتراكية (الحزب الاشتراكي الديمقراطي الألماني 1875). وأفضى ذلك إلى <b>تشريعات اجتماعية</b> : تحديد سن التشغيل وساعات العمل، والتأمينات الاجتماعية في ألمانيا مع بسمارك (1883-1889).',
   k:'<b>للامتحان :</b> ميّز بين المظاهر (ظروف العمل) والأسباب (الرأسمالية الصناعية) والنتائج (الحركة العمالية والتشريعات).<br><b>تواريخ :</b> 1864 الأممية الأولى · 1886 شيكاغو · 1889 الأممية الثانية · 1884 قانون النقابات بفرنسا · 1883-1889 تأمينات بسمارك.'},
  {t:'المحور 3 · التحولات الفكرية : المذاهب الكبرى',svg:frise,cap:'المذاهب الفكرية تواكب التحولات الاقتصادية وتجيب عنها.',
   p:'<b>أ · الليبرالية :</b> فكر البورجوازية ؛ اقتصاديا تقوم على حرية المبادرة والمنافسة وعدم تدخل الدولة («دعه يعمل دعه يمر») مع <b>آدم سميث</b> (ثروة الأمم 1776) وريكاردو ومالتوس ؛ وسياسيا على الحريات الفردية والبرلمانية. <b>ب · الاشتراكية الطوباوية :</b> نقدت مساوئ الرأسمالية واقترحت مجتمعات مثالية تعاونية دون تحديد وسائل التغيير : <b>سان سيمون</b>، <b>فورييه</b> (الفالانستير)، <b>روبرت أوين</b> (تجربة نيو لانارك). <b>ج · الاشتراكية العلمية (الماركسية) :</b> مع <b>كارل ماركس</b> و<b>فريدريك إنجلز</b> (البيان الشيوعي 1848، رأس المال 1867) : التاريخ صراع طبقات، الرأسمالية تستغل فائض القيمة، والبروليتاريا ستُسقطها بالثورة لإقامة مجتمع بلا طبقات بعد إلغاء الملكية الخاصة لوسائل الإنتاج. <b>د · الفوضوية :</b> رفض كل سلطة بما فيها الدولة، مع <b>برودون</b> («الملكية سرقة») و<b>باكونين</b>. <b>هـ · الكاثوليكية الاجتماعية :</b> دعوة الكنيسة إلى العدالة الاجتماعية والتوفيق بين الطبقات (منشور «ريروم نوفاروم» للبابا ليون 13 سنة 1891).',
   k:'<b>جدول سريع :</b> ليبرالية = حرية السوق (سميث 1776) · طوباوية = مجتمع مثالي بلا ثورة (أوين، فورييه) · ماركسية = صراع طبقي وثورة (1848، 1867) · فوضوية = لا دولة (برودون، باكونين).<br><b>سؤال متكرر :</b> «قارن بين الاشتراكية الطوباوية والعلمية» ← الهدف مشترك (نقد الرأسمالية)، الوسيلة مختلفة (الإقناع والتجربة / الصراع الطبقي والثورة).'},
  {t:'نموذج الاشتغال على الوثائق (مصحَّح)',
   p:'<b>الوثيقة 1 (جدول) :</b> تطور إنتاج الصلب في العالم (بملايين الأطنان) : 1870 : 0.5 · 1880 : 4 · 1900 : 28 · 1913 : 76. (معطيات تقريبية مركبة من مصادر إحصائية تاريخية).<br><b>الوثيقة 2 (نص) :</b> «إن تاريخ كل مجتمع حتى الآن هو تاريخ صراع الطبقات… لقد بسّط عصرنا، عصر البورجوازية، التناقضات الطبقية : انقسم المجتمع كله أكثر فأكثر إلى معسكرين كبيرين متعاديين : البورجوازية والبروليتاريا.» ك. ماركس وف. إنجلز، البيان الشيوعي، 1848.<br><b>الوثيقة 3 (نص) :</b> «لم تعد المقاولة الصغيرة قادرة على الصمود أمام المنافسة. فقد اتفقت كبريات شركات الفحم في منطقة الرور سنة 1893 على تحديد الأسعار وتقاسم الأسواق، بينما ابتلعت شركة ستاندرد أويل منافسيها واحدا تلو الآخر حتى صارت تتحكم في تسعة أعشار تكرير البترول الأمريكي. وصارت الأبناك الكبرى شريكا في كل مشروع صناعي.» (نص مركّب لأغراض التدريب).<br><br><b>1 · السياق (1 ن) :</b> تتعلق الوثائق بالتحولات الاقتصادية والاجتماعية التي عرفها العالم الرأسمالي (أوروبا والولايات المتحدة) خلال النصف الثاني من القرن 19 ومطلع القرن 20 (1848-1913) في سياق الثورة الصناعية الثانية.<br><b>2 · المصطلحات (2 ن) :</b> <b>البروليتاريا</b> : الطبقة العاملة التي لا تملك سوى قوة عملها تبيعها مقابل أجر، ظهرت مع التصنيع في القرن 19. <b>الترست</b> : شكل من التركيز الرأسمالي تندمج فيه مقاولات القطاع نفسه في شركة واحدة تحتكر السوق، مثل ستاندرد أويل (1882).<br><b>3 · أ – صف تطور إنتاج الصلب (الوثيقة 1) (1 ن) :</b> عرف إنتاج الصلب ارتفاعا هائلا : تضاعف أزيد من 150 مرة بين 1870 و1913 (من 0.5 إلى 76 مليون طن)، مع تسارع خاص بعد 1880، مما يعكس انطلاق الثورة الصناعية الثانية. <b>ب – استخرج من الوثيقة 3 أشكال التركيز الرأسمالي في جدول (2 ن) :</b> الشكل | المثال : الكارتل | اتفاق شركات فحم الرور 1893 على الأسعار والأسواق · الترست | ابتلاع ستاندرد أويل لمنافسيها (90 % من التكرير) · الرأسمالية المالية | مشاركة الأبناك في المشاريع الصناعية. <b>ج – ما التحول الاجتماعي الذي تصفه الوثيقة 2 ؟ (1.5 ن) :</b> انقسام المجتمع الصناعي إلى طبقتين متعاديتين، البورجوازية المالكة والبروليتاريا العاملة، وهو ما يجعل الصراع الطبقي محرك التاريخ حسب ماركس.<br><b>4 · الفكرة الأساس (1 ن) :</b> أفرزت الثورة الصناعية الثانية في القرن 19 نموا إنتاجيا هائلا وتركيزا رأسماليا، وأنتجت مجتمعا طبقيا جديدا قائما على التناقض بين البورجوازية والبروليتاريا.<br><b>5 · فقرة مركزة : الحركة العمالية في القرن 19 (1.5 ن) :</b> ردا على ظروف العمل القاسية (12 إلى 14 ساعة يوميا، تشغيل الأطفال، أجور زهيدة)، نظّم العمال أنفسهم تدريجيا : من الإضرابات العفوية إلى النقابات التي اعترفت بها بريطانيا (1871) وفرنسا (1884)، ثم إلى التنظيم الدولي مع الأممية الأولى (لندن 1864) والثانية (باريس 1889) التي جعلت فاتح ماي عيدا للعمال. وقد أجبرت هذه الحركة الدول على سن تشريعات اجتماعية، كالتأمينات التي أقرها بسمارك في ألمانيا بين 1883 و1889، مما مهّد لتحسن تدريجي في أوضاع الطبقة العاملة.',
   k:'<b>لاحظ :</b> في السؤال 3 أ وُصف الجدول بالأرقام وبالحساب (تضاعف 150 مرة) ثم رُبط بالدرس (الثورة الصناعية الثانية). هذا هو المنتظر : وصف دقيق + تفسير موجز.'}

 {t:'التاريخ · التحولات الاقتصادية والاجتماعية في العالم الرأسمالي خلال القرن 19',
