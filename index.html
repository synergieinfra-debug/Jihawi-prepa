 {p:"ينطق الرئيس بالحكم: <b>عقوبة الإعدام</b>. يروي الراوي <b>ذهوله</b>: يندفع الحشد نحو الخروج مسروراً بالمشهد؛ أما هو فلا يفكر في شيء أولاً، ثم يشعر بالدم يصعد إلى وجهه ويفهم. تصبح كلمة «الموت» جسدية. يُعاد إلى بيسيتر في عربة مسيَّجة: ويراه الشعب يمر.",k:"<b>الموضوع:</b> منذ البداية يُعرض <b>الحشد</b> متعطشاً للفرجة. المحاكمة مجرد <b>إجراء شكلي</b>: يُسقط هيغو مصداقية العدالة دون تشويهها."},
 {p:"تُوضع ثلاثة أشياء: راوٍ <b>مجهول</b> (لا اسم ولا جريمة)، <b>وضعية</b> بلا مخرج (الموت المؤكد)، و<b>شكل</b> (المونولوغ الداخلي في الحاضر). يعرف القارئ النهاية سلفاً؛ وسيعيش الانتظار <b>من الداخل</b>."}
]});

</script>
<script>
/* ===================== MOTEUR ===================== */
var API='https://jihawi-api.synergieinfra.workers.dev',FREE_CH=1;
var S={oeuvre:null,view:'home',chap:null,hist:[],answers:{},exam:null,full:false,lic:null};
var $=function(id){return document.getElementById(id)};
function store(k,v){try{localStorage.setItem('bp_'+k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{var v=localStorage.getItem('bp_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function fmt(n){return (Math.round(n*10)/10).toString().replace('.',',');}
function esc(s){return String(s).replace(/</g,'&lt;');}
function cur(){return BAM.oeuvres[S.oeuvre];}

function setTitle(t,s){$('title').childNodes[0].nodeValue=t;$('sub').textContent=s||'';}
function go(view,opt,noHist){
  if(!noHist)S.hist.push({view:S.view,chap:S.chap});
  S.view=view;if(opt&&opt.chap!==undefined)S.chap=opt.chap;
  render();window.scrollTo(0,0);
}
function goBack(){var h=S.hist.pop();if(!h)return go('home',null,true);S.view=h.view;S.chap=h.chap;render();window.scrollTo(0,0);}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){
  if(b.dataset.v!=='home'&&!S.oeuvre){go('home');return;}
  S.hist=[];go(b.dataset.v,null,true);
});});

function render(){
  var m=$('main');
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.view||(S.view==='chap'&&b.dataset.v==='chapitres'));});
  $('back').classList.toggle('show',S.hist.length>0);
  var o=cur();
  if(S.view==='home')return renderHome(m);
  if(S.view==='licence')return renderLicence(m);
  if(!o)return renderHome(m);
  setTitle(o.titre,o.auteur+' · '+o.genre);
  if(S.view==='oeuvre')m.innerHTML=o.fiche;
  else if(S.view==='chapitres')renderChapList(m,o);
  else if(S.view==='chap')renderChap(m,o,o.chapitres[S.chap]);
  else if(S.view==='persos')renderPersos(m,o);
  else if(S.view==='exam')renderExam(m,o);
  else if(S.view==='methode')renderMethode(m,o);
}
function renderMethode(m,o){
  var h=o.methode;
  if(o.redactions&&o.redactions.length){
    h+='<div class="card"><h2>Rédactions modèles</h2><p class="tip">Une rédaction complète par thème, au format attendu le jour de l\'examen (15 à 20 lignes). Touchez un titre pour l\'ouvrir. Les connecteurs sont surlignés.</p>';
    o.redactions.forEach(function(r,i){
      h+='<div class="redac" id="rd'+i+'"><button onclick="this.parentNode.classList.toggle(\'open\')"><span class="n">'+(i+1)+'</span><b>'+r.t+'</b><span class="ch">›</span></button><div class="body"><div class="sujet"><b>Sujet :</b> '+r.sujet+'</div>';
      r.paras.forEach(function(p){h+='<p class="para '+p.type+'"><span class="lab">'+({i:'Introduction',a:'Argument',c:'Conclusion',t:'Thèse',at:'Antithèse'}[p.type]||p.type)+'</span>'+hiliteConn(p.txt)+'</p>';});
      if(r.note)h+='<div class="note">💡 '+r.note+'</div>';
      h+='</div></div>';
    });
    h+='</div>';
  }
  m.innerHTML=h;
}
var CONN=['De nos jours','Il est fréquent de constater que','La question se pose de savoir si','Tout d\'abord','D\'abord','Ensuite','De plus','Par ailleurs','En outre','Enfin','Par exemple','Ainsi','Comme le montre','Cependant','Toutefois','Néanmoins','Certes','mais','En effet','Car','Donc','C\'est pourquoi','Par conséquent','En somme','Pour conclure','En définitive','D\'une part','D\'autre part','En revanche','Au contraire','Il est vrai que','Pourtant','Or','Finalement'];
function hiliteConn(t){CONN.forEach(function(c){var re=new RegExp('(^|[\\s(«])('+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?=[\\s,;:.!?»)])','g');t=t.replace(re,'$1<mark class="conn">$2</mark>');});return t;}

/* ---------- accueil ---------- */
function renderHome(m){
  setTitle('Jihawi Prépa','1ʳᵉ année bac · Examen régional');
  var h='<div class="install" id="install"><img src="icon-192.png" alt=""><div class="t"><b>Installer l\'application</b>Icône sur l\'écran d\'accueil, fonctionne hors connexion.</div><button class="ok" onclick="doInstall()">Installer</button><button class="no" onclick="hideInstall(true)">✕</button></div>';
  h+='<div class="card"><h2>Choisissez une œuvre</h2><p class="tip">Les trois œuvres au programme de la 1ʳᵉ année bac. L\'œuvre tombée à l\'examen varie selon l\'académie : révisez les trois.</p><div class="oeuvres">';
  var ids=['bam','antigone','ddc'];
  var meta={bam:{t:'La Boîte à merveilles',a:'Ahmed Sefrioui · roman autobiographique',c:'linear-gradient(135deg,#b5452c,#d9a441)'},
            antigone:{t:'Antigone',a:'Jean Anouilh · tragédie moderne',c:'linear-gradient(135deg,#1f6f78,#2b2118)'},
            ddc:{t:'Le Dernier Jour d\'un condamné',a:'Victor Hugo · roman à thèse',c:'linear-gradient(135deg,#4a3b5c,#8a6d3b)'}};
  ids.forEach(function(id){
    var ok=!!BAM.oeuvres[id],x=meta[id];
    h+='<button class="oeuvre'+(ok?'':' soon')+'" style="background:'+x.c+'" '+(ok?'onclick="openOeuvre(\''+id+'\')"':'disabled')+'><b>'+x.t+'</b><small>'+x.a+'</small>'+(ok?'':'<span class="ribbon">BIENTÔT</span>')+'</button>';
  });
  h+='</div></div>';
  var p=load('prog',{}),tot=0,done=0;
  Object.keys(BAM.oeuvres).forEach(function(id){BAM.oeuvres[id].chapitres.forEach(function(c,i){tot++;if(p[id+'_'+i])done++;});});
  h+=licCard();
  h+='<div class="card"><h2>Votre progression</h2><div class="stat"><div><b>'+done+'/'+tot+'</b><small>chapitres travaillés</small></div><div><b>'+(load('examBest',null)===null?'—':fmt(load('examBest',0))+'/20')+'</b><small>meilleur examen blanc</small></div></div></div>';
  m.innerHTML=h;refreshInstall();
}
/* ---------- Licence : activation, contenu payant, cache, vérification ---------- */
function deviceId(){var d=load('dev',null);if(!d){d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);store('dev',d);}return d;}
function loadPaid(src){try{new Function(src)();S.full=true;return true;}catch(e){return false;}}
function initLicence(){
  if(BAM.preview){S.full=true;S.lic={code:'APERCU-COMPLET',nom:'Aperçu de validation',exp:Date.now()+30*86400000};return;}
  S.lic=load('lic',null);var src=null;try{src=localStorage.getItem('jp_paid');}catch(e){}
  if(S.lic&&src){if(!loadPaid(src)){S.lic=null;}}else{S.lic=null;}
  if(S.lic&&navigator.onLine&&Date.now()-(S.lic.checked||0)>7*86400000){
    fetch(API+'/check?tok='+encodeURIComponent(S.lic.token)).then(function(r){return r.json();}).then(function(j){
      if(j&&j.ok){S.lic.checked=Date.now();S.lic.exp=j.exp;store('lic',S.lic);}
      else if(j&&j.ok===false){clearLicence('Votre licence n\'est plus valide (désactivée ou expirée).');}
    }).catch(function(){});
  }
}
function clearLicence(msg){S.lic=null;S.full=false;try{localStorage.removeItem('jp_paid');}catch(e){}store('lic',null);if(msg)alert(msg);location.reload();}
function licCard(){
  if(S.full&&S.lic){return '<div class="card lic ok"><h2>Licence active ✓</h2><p>'+(S.lic.nom?'<b>'+esc(S.lic.nom)+'</b> · ':'')+'code <code>'+S.lic.code+'</code><br><span class="tip">Valable jusqu\'au '+new Date(S.lic.exp).toLocaleDateString('fr-MA')+' · '+'tous les chapitres et rédactions sont débloqués, hors ligne compris.</span></p></div>';}
  return '<div class="card lic"><h2>Version démo</h2><p>Le chapitre 1 de chaque œuvre, les fiches, personnages, flashcards et la méthode sont gratuits. La version complète débloque les <b>'+countLocked()+' autres chapitres</b>, toutes les traductions arabes et les <b>20 rédactions modèles</b>.</p><button class="btn w" onclick="go(\'licence\')">J\'ai un code · Activer</button><p class="tip" style="margin-top:8px">Pour obtenir un code : WhatsApp <a href="https://wa.me/212661996001?text='+encodeURIComponent('Bonjour, je souhaite un code Jihawi Prépa.')+'">+212 661 996 001</a></p></div>';
}
function countLocked(){var n=0;Object.keys(BAM.oeuvres).forEach(function(id){n+=(BAM.oeuvres[id].locked||[]).length;});return n;}
function renderLicence(m){
  setTitle('Jihawi Prépa','Activation de la licence');
  if(S.full){m.innerHTML=licCard()+'<div class="card"><button class="btn ghost w" onclick="if(confirm(\'Retirer la licence de cet appareil ?\'))clearLicence()">Retirer la licence de cet appareil</button></div>';return;}
  m.innerHTML='<div class="card"><h2>Activer la version complète</h2><p class="tip">Entrez le code reçu. Il est lié à cet appareil (2 appareils maximum par code). Connexion Internet nécessaire une seule fois : ensuite tout fonctionne hors ligne.</p>'
   +'<label class="lab">Code de licence</label><input id="licCode" class="inp" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" oninput="this.value=fmtCode(this.value)">'
   +'<label class="lab">Votre prénom (facultatif, affiché dans l\'app)</label><input id="licNom" class="inp" placeholder="ex. Yassine" maxlength="40">'
   +'<button class="btn w" id="licBtn" onclick="activate()">Activer</button><div id="licMsg" class="tip" style="margin-top:8px"></div></div>'
   +'<div class="card"><h3 style="margin-top:0">Comment obtenir un code ?</h3><p>Écrivez-nous sur WhatsApp au <a href="https://wa.me/212661996001?text='+encodeURIComponent('Bonjour, je souhaite un code Jihawi Prépa.')+'">+212 661 996 001</a>. Le code est envoyé après paiement et reste valable toute l\'année scolaire.</p></div>';
}
function fmtCode(v){v=v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);return v.replace(/(.{4})(?=.)/g,'$1-');}
function activate(){
  var code=($('licCode').value||'').trim(),nom=($('licNom').value||'').trim(),msg=$('licMsg'),btn=$('licBtn');
  if(code.length!==14){msg.textContent='Le code doit comporter 12 caractères (XXXX-XXXX-XXXX).';return;}
  if(!navigator.onLine){msg.textContent='Connectez-vous à Internet pour activer (une seule fois).';return;}
  btn.disabled=true;msg.textContent='Vérification…';
  fetch(API+'/activate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:code,device:deviceId(),nom:nom})})
  .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
  .then(function(x){
    if(x.s!==200)throw new Error(x.j.error||'Activation refusée');
    msg.textContent='Code accepté. Téléchargement du contenu…';
    return fetch(API+'/content?tok='+encodeURIComponent(x.j.token)).then(function(r){if(!r.ok)throw new Error('Téléchargement impossible ('+r.status+')');return r.text();}).then(function(src){
      if(!loadPaid(src))throw new Error('Contenu invalide');
      try{localStorage.setItem('jp_paid',src);}catch(e){throw new Error('Mémoire du téléphone insuffisante');}
      S.lic={code:code,nom:x.j.nom||nom,exp:x.j.exp,token:x.j.token,checked:Date.now()};store('lic',S.lic);
      msg.textContent='Activation réussie !';setTimeout(function(){S.hist=[];go('home',null,true);},600);
    });
  }).catch(function(e){msg.textContent='✗ '+e.message;btn.disabled=false;});
}
/* ---------- PWA : installation + mise à jour ---------- */
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;refreshInstall();});
window.addEventListener('appinstalled',function(){deferredPrompt=null;hideInstall(false);});
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function refreshInstall(){var el=$('install');if(!el)return;var dismissed=load('installDismissed',0);var show=deferredPrompt&&!isStandalone()&&(Date.now()-dismissed>7*86400000);el.classList.toggle('show',!!show);}
function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;refreshInstall();});}
function hideInstall(remember){if(remember)store('installDismissed',Date.now());var el=$('install');if(el)el.classList.remove('show');}
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!BAM.preview){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound',function(){var nw=reg.installing;nw&&nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)$('toast').classList.add('show');});});
    }).catch(function(){});
  });
}
function openOeuvre(id){S.oeuvre=id;S.hist=[];store('last',id);go('oeuvre',null,true);}

/* ---------- chapitres ---------- */
function renderChapList(m,o){
  var p=load('prog',{});
  var h='<div class="card"><h2>'+o.chapLabel+'</h2><p class="tip">Chaque chapitre : résumé illustré, points clés, puis entraînement type régional.</p><div class="chaplist">';
  o.chapitres.forEach(function(c,i){
    var sc=p[o.id+'_'+i];
    h+='<button class="chapbtn" onclick="go(\'chap\',{chap:'+i+'})"><span class="num">'+(i+1)+'</span><span class="t"><b>'+c.titre+'</b><small>'+c.sous+'</small></span><span class="st">'+(sc?'<b>'+fmt(sc.pts)+'/'+sc.tot+'</b><br>dernier score':'à faire')+'</span></button>';
  });
  if(!S.full&&o.locked){o.locked.forEach(function(c,j){var i=o.chapitres.length+j;
    h+='<button class="chapbtn locked" onclick="go(\'licence\')"><span class="num">🔒</span><span class="t"><b>'+(i+1)+'. '+c.titre+'</b><small>'+c.sous+'</small></span><span class="st">version<br>complète</span></button>';});
    h+='<button class="btn w" onclick="go(\'licence\')">Débloquer tous les chapitres</button>';}
  h+='</div></div>';m.innerHTML=h;
}
function renderChap(m,o,c){
  S.answers={};
  var h='<div class="card"><h2>'+o.chapShort+' '+(S.chap+1)+' — '+c.titre+'</h2>'+(c.tip?'<p class="tip">'+c.tip+'</p>':'')+'<div class="seg"><button class="on" onclick="segChap(0,this)">Cours</button><button onclick="segChap(1,this)">Entraînement</button></div>';
  h+='<div id="seg0">';
  if(c.tip){h+=arBtn('tip',c.ar&&c.ar.tip,c.tip);}
  c.episodes.forEach(function(e,i){
    var a=c.ar&&c.ar.ep&&c.ar.ep[i];
    h+='<h3>'+(i+1)+'. '+e.t+'</h3>';
    if(e.svg)h+='<div class="fig">'+e.svg+(e.cap?'<div class="caption">'+e.cap+'</div>':'')+'</div>';
    h+=arBtn('p'+i,a&&a.p,e.p)+'<p>'+e.p+'</p>';
    if(e.k)h+='<div class="keypoints">'+e.k+'</div>'+arBtn('k'+i,a&&a.k,e.k,true);
  });
  if(c.chrono){h+='<h3>Chronologie</h3><div class="timeline">';c.chrono.forEach(function(t){h+='<div class="tl">'+t+'</div>';});h+='</div>';}
  if(c.analyse){h+='<h3>Outils d\'analyse sur ce chapitre</h3><table><tr><th>Notion</th><th>Dans ce chapitre</th></tr>';c.analyse.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';});h+='</table>';}
  if(c.citations){h+='<h3>À retenir pour l\'examen</h3><div class="keypoints">'+c.citations+'</div>';}
  h+='<button class="btn w alt" onclick="segChap(1,document.querySelectorAll(\'.seg button\')[1])">Passer à l\'entraînement →</button></div>';
  h+='<div id="seg1" style="display:none"><div class="bar"><i id="prog"></i></div><div id="quiz"></div><div class="score" id="score"></div><button class="btn ghost" onclick="resetQuiz()">Recommencer</button>'
    +(S.chap<o.chapitres.length-1?' <button class="btn alt" onclick="go(\'chap\',{chap:'+(S.chap+1)+'})">Chapitre suivant →</button>':'')+'</div></div>';
  if(S.full&&S.lic)h+='<p class="tip" style="text-align:center;font-size:.7rem">Jihawi Prépa · licence '+S.lic.code+(S.lic.nom?' · '+esc(S.lic.nom):'')+' · usage personnel</p>';
  m.innerHTML=h;renderQuiz(c.quiz,'chap');
}
/* ---------- traduction arabe ---------- */
function strip(h){return String(h).replace(/<[^>]+>/g,'');}
function arBtn(id,ar,fr,after){
  var bid='ar_'+id;
  if(ar){return '<button class="arbtn" onclick="toggleAr(this,\''+bid+'\')">🇲🇦 ترجمة · Traduire en arabe</button><div class="ar" id="'+bid+'">'+ar+'</div>';}
  var url='https://translate.google.com/?sl=fr&tl=ar&op=translate&text='+encodeURIComponent(strip(fr).slice(0,1500));
  return '<a class="arbtn" href="'+url+'" target="_blank" rel="noopener">🇲🇦 Traduire en arabe (en ligne)</a>';
}
function toggleAr(btn,id){var d=$(id);var on=d.classList.toggle('show');btn.classList.toggle('on',on);}
function segChap(i,btn){document.querySelectorAll('.seg button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');$('seg0').style.display=i?'none':'block';$('seg1').style.display=i?'block':'none';window.scrollTo(0,0);}

/* ---------- quiz ---------- */
var QZ=[],QMODE='chap';
function renderQuiz(list,mode){
  QZ=list;QMODE=mode;S.answers={};
  var box=$('quiz');box.innerHTML='';
  list.forEach(function(q,i){
    var d=document.createElement('div');d.className='q';
    var h='<span class="tag">'+(i+1)+' · '+q.t+'</span><div class="stem">'+q.s+'</div>';
    if(q.open){
      h+='<textarea placeholder="Rédigez votre réponse…"></textarea><button class="btn alt" onclick="showModel('+i+')">Voir le corrigé modèle</button><div class="expl" id="ex'+i+'"><b>Corrigé modèle :</b><br>'+q.m+'<div class="selfeval"><button onclick="selfEval('+i+',0,this)">Non acquis</button><button onclick="selfEval('+i+',0.5,this)">Partiel</button><button onclick="selfEval('+i+',1,this)">Acquis</button></div></div>';
    }else{
      q.o.forEach(function(o,j){h+='<button class="opt" id="o'+i+'_'+j+'" onclick="answer('+i+','+j+')">'+String.fromCharCode(65+j)+'. '+o+'</button>';});
      h+='<div class="expl" id="ex'+i+'"><b>Explication :</b> '+q.e+'</div>';
    }
    d.innerHTML=h;box.appendChild(d);
  });
  updateScore();
}
function answer(i,j){
  if(S.answers[i]!==undefined)return;
  S.answers[i]=(j===QZ[i].a)?1:0;
  QZ[i].o.forEach(function(_,k){var b=$('o'+i+'_'+k);b.disabled=true;if(k===QZ[i].a)b.classList.add('good');else if(k===j)b.classList.add('bad');});
  $('ex'+i).classList.add('show');updateScore();
}
function showModel(i){$('ex'+i).classList.add('show');}
function selfEval(i,v,btn){S.answers[i]=v;btn.parentNode.querySelectorAll('button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');updateScore();}
function updateScore(){
  var done=Object.keys(S.answers).length,pts=0;for(var k in S.answers)pts+=S.answers[k];
  $('prog').style.width=Math.round(done/QZ.length*100)+'%';
  var s=$('score');if(done===0){s.textContent='';return;}
  s.textContent='Score : '+fmt(pts)+' / '+QZ.length+(done<QZ.length?' ('+done+' répondues)':'');
  if(done===QZ.length){
    if(QMODE==='chap'){var p=load('prog',{});p[S.oeuvre+'_'+S.chap]={pts:pts,tot:QZ.length};store('prog',p);}
    if(QMODE==='exam'){var n=Math.round(pts/QZ.length*200)/10;s.textContent='Note : '+fmt(n)+' / 20';var b=load('examBest',0);if(n>b)store('examBest',n);clearInterval(S.exam);}
  }
}
function resetQuiz(){renderQuiz(QZ,QMODE);window.scrollTo(0,0);}

/* ---------- personnages ---------- */
function avatar(color,hair,female){
  return '<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="40" fill="'+color+'" opacity=".18"/><path d="M14 80 Q14 52 42 52 Q70 52 70 80Z" fill="'+color+'"/><circle cx="42" cy="34" r="17" fill="#e3b58a"/>'
   +(female?'<path d="M22 30 Q42 2 62 30 L62 50 Q42 56 22 50Z" fill="'+hair+'"/><circle cx="42" cy="34" r="17" fill="#e3b58a"/><path d="M25 28 Q42 8 59 28Z" fill="'+hair+'"/>':'<path d="M25 30 Q42 8 59 30Z" fill="'+hair+'"/>')
   +'<circle cx="36" cy="35" r="2" fill="#2b2118"/><circle cx="48" cy="35" r="2" fill="#2b2118"/><path d="M37 43 Q42 46 47 43" stroke="#2b2118" fill="none" stroke-width="1.5"/></svg>';
}
function renderPersos(m,o){
  var h='<div class="card"><h2>Les personnages</h2><p class="tip">Touchez une carte pour voir le détail. À l\'examen : « présentez ce personnage en 2-3 phrases ».</p><div class="grid">';
  o.persos.forEach(function(p,i){h+='<div class="perso" onclick="this.classList.toggle(\'open\')">'+avatar(p.c,p.h,p.f)+'<b>'+p.n+'</b><small>'+p.r+'</small><div class="more">'+p.d+'</div></div>';});
  h+='</div>'+(o.schema?'<h3>Schéma des relations</h3><div class="fig">'+o.schema+'</div>':'')+'</div>';
  m.innerHTML=h;
}

/* ---------- examen blanc ---------- */
function renderExam(m,o){
  var h='<div class="card"><h2>Examen blanc</h2><p class="tip">10 questions tirées au sort dans tous les chapitres, 20 minutes, note sur 20. Comme le jour J : pas de retour en arrière.</p>'
   +'<div class="seg"><button class="on" onclick="examSeg(0,this)">QCM chronométré</button><button onclick="examSeg(1,this)">Flashcards</button></div>'
   +'<div id="eseg0"><button class="btn w" onclick="startExam()">Lancer un examen blanc</button><div id="examzone"></div></div>'
   +'<div id="eseg1" style="display:none"><p class="tip">Touchez la carte pour la retourner.</p><div class="flash" id="flash" onclick="flipCard()"></div><div class="row"><button class="btn ghost" onclick="nextCard()">Carte suivante →</button></div></div></div>';
  m.innerHTML=h;FC=shuffle(o.notions.slice());FI=0;showCard(false);
}
function examSeg(i,btn){document.querySelectorAll('.seg button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');$('eseg0').style.display=i?'none':'block';$('eseg1').style.display=i?'block':'none';}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startExam(){
  var o=cur(),pool=[];o.chapitres.forEach(function(c){c.quiz.forEach(function(q){if(!q.open)pool.push(q);});});
  var list=shuffle(pool).slice(0,10),left=20*60;
  $('examzone').innerHTML='<p class="score">Temps restant : <span class="timer" id="tm">20:00</span></p><div class="bar"><i id="prog"></i></div><div id="quiz"></div><div class="score" id="score"></div>';
  renderQuiz(list,'exam');
  clearInterval(S.exam);
  S.exam=setInterval(function(){left--;var mm=Math.floor(left/60),ss=left%60;var t=$('tm');if(!t){clearInterval(S.exam);return;}t.textContent=mm+':'+(ss<10?'0':'')+ss;if(left<=0){clearInterval(S.exam);t.textContent='Terminé';document.querySelectorAll('.opt').forEach(function(b){b.disabled=true});}},1000);
}
var FC=[],FI=0,FB=false;
function showCard(back){FB=back;var c=FC[FI];var f=$('flash');if(!f||!c)return;f.className='flash'+(back?' back':'');f.innerHTML=back?'<div><b>'+c.d+'</b></div>':'<div><small style="color:#7a6a58">Définissez</small><br><b style="font-size:1.1rem">'+c.n+'</b></div>';}
function flipCard(){showCard(!FB);}
function nextCard(){FI=(FI+1)%FC.length;showCard(false);}

/* ---------- init ---------- */
(function(){initLicence();var last=load('last',null);if(last&&BAM.oeuvres[last]){S.oeuvre=last;}go('home',null,true);})();
</script>
