<style>
:root{--bg:#f7f1e6;--card:#fffdf8;--ink:#2b2118;--muted:#7a6a58;--accent:#b5452c;--accent2:#1f6f78;--gold:#d9a441;--line:#e6d9c3;--ok:#2e7d4f;--ko:#b5452c;--radius:14px;font-size:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding-bottom:72px}
header{background:linear-gradient(135deg,#1f6f78,#2b2118);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:10px}
header .back{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;width:34px;height:34px;font-size:1.1rem;display:none;font-family:inherit}
header .back.show{display:block}
header h1{margin:0;font-size:1.05rem;font-weight:700;flex:1;line-height:1.2}
header small{display:block;font-size:.72rem;opacity:.8;font-weight:400}
.chip{display:inline-block;background:var(--gold);color:#2b2118;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:middle}
main{padding:14px 14px 20px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 8px;font-size:1.05rem;color:var(--accent2)}
.card h3{margin:14px 0 6px;font-size:.95rem;color:var(--accent)}
.card p{margin:6px 0}
.card ul{margin:6px 0;padding-left:20px}
.card li{margin:3px 0}
.fig{width:100%;border-radius:10px;overflow:hidden;background:#fbf6ec;border:1px solid var(--line);margin:8px 0}
.fig svg{display:block;width:100%;height:auto}
.caption{font-size:.78rem;color:var(--muted);text-align:center;padding:4px 8px 8px;font-style:italic}
.keypoints{background:#fff3e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:8px;font-size:.92rem;margin:8px 0}
.keypoints strong{color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perso{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.perso svg{width:84px;height:84px}
.perso b{display:block;font-size:.92rem;margin-top:4px}
.perso small{color:var(--muted);font-size:.78rem;display:block}
.perso .more{display:none;text-align:left;font-size:.82rem;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.perso.open .more{display:block}
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;margin-bottom:10px;font-size:.9rem}
.tl:before{content:"";position:absolute;left:-19px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent2)}
.tl b{color:var(--accent2)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f1e8d8}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:9}
nav button{background:none;border:0;font-size:.66rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 4px;font-family:inherit}
nav button span.ic{font-size:1.2rem;line-height:1}
nav button.on{color:var(--accent)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.q .tag{font-size:.7rem;font-weight:700;color:#fff;background:var(--accent2);padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:6px}
.q .stem{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:#fbf6ec;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin:6px 0;font-size:.92rem;font-family:inherit;color:var(--ink)}
.opt.good{border-color:var(--ok);background:#e3f3e8}
.opt.bad{border-color:var(--ko);background:#fae4df}
.q textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;padding:8px;font-family:inherit;font-size:.92rem;resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;font-size:.92rem;font-family:inherit;margin-top:6px}
.btn.alt{background:var(--accent2)}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.w{width:100%}
.expl{display:none;margin-top:8px;background:#f1f7f7;border-left:4px solid var(--accent2);padding:8px 10px;border-radius:8px;font-size:.88rem}
.expl.show{display:block}
.score{font-size:1.1rem;font-weight:700;color:var(--accent2);text-align:center;margin:10px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent2);width:0;transition:width .4s}
.tip{font-size:.85rem;color:var(--muted)}
.model{background:#fbf6ec;border:1px dashed var(--gold);border-radius:9px;padding:10px;font-size:.88rem;margin-top:8px}
.selfeval{display:flex;gap:6px;margin-top:6px}
.selfeval button{flex:1;font-family:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;padding:6px;font-size:.8rem}
.selfeval button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.chaplist{display:flex;flex-direction:column;gap:8px}
.chapbtn{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.chapbtn .num{width:36px;height:36px;border-radius:10px;background:var(--accent2);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.chapbtn .t{flex:1}
.chapbtn .t b{display:block;font-size:.92rem}
.chapbtn .t small{color:var(--muted);font-size:.76rem}
.chapbtn .st{font-size:.72rem;color:var(--muted);text-align:right;flex:none}
.chapbtn .st b{color:var(--ok)}
.seg{display:flex;background:#f1e8d8;border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-family:inherit;font-size:.85rem;color:var(--muted)}
.seg button.on{background:#fff;color:var(--accent2);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.flash{background:var(--card);border:2px solid var(--accent2);border-radius:14px;padding:22px 16px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1rem;cursor:pointer}
.flash.back{background:#f1f7f7}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.oeuvres{display:grid;gap:10px}
.oeuvre{border-radius:14px;padding:14px;color:#fff;text-align:left;border:0;font-family:inherit;position:relative;overflow:hidden}
.oeuvre b{display:block;font-size:1.05rem}
.oeuvre small{opacity:.85;font-size:.8rem}
.oeuvre.soon{opacity:.55}
.oeuvre .ribbon{position:absolute;top:10px;right:-28px;transform:rotate(35deg);background:var(--gold);color:#2b2118;font-size:.65rem;font-weight:700;padding:2px 34px}
.stat{display:flex;gap:8px;margin:8px 0}
.stat div{flex:1;background:#fbf6ec;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.2rem;color:var(--accent2)}
.stat small{font-size:.72rem;color:var(--muted)}
.install{display:none;background:#fff3e0;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:12px;align-items:center;gap:10px}
.install.show{display:flex}
.install img{width:40px;height:40px;border-radius:9px;flex:none}
.install .t{flex:1;font-size:.85rem}
.install .t b{display:block}
.install button{font-family:inherit;border-radius:8px;padding:7px 10px;font-size:.82rem;border:0}
.install .ok{background:var(--accent2);color:#fff}
.install .no{background:none;color:var(--muted)}
.toast{position:fixed;left:12px;right:12px;bottom:76px;background:#2b2118;color:#fff;border-radius:10px;padding:10px 12px;font-size:.85rem;display:none;z-index:20;align-items:center;gap:10px}
.toast.show{display:flex}
.toast button{margin-left:auto;background:var(--gold);border:0;border-radius:8px;padding:6px 10px;font-family:inherit;font-weight:700}
.arbtn{display:inline-flex;align-items:center;gap:5px;background:#eef5f5;color:var(--accent2);border:1px solid #cfe0e2;border-radius:999px;padding:3px 10px;font-size:.76rem;font-family:inherit;margin:2px 0 6px}
.arbtn.on{background:var(--accent2);color:#fff}
.ar{display:none;direction:rtl;text-align:right;font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-size:1.02rem;line-height:1.9;background:#f1f7f7;border-right:4px solid var(--accent2);border-radius:8px;padding:8px 12px;margin:4px 0 10px}
.ar.show{display:block}
.ar b{color:var(--accent2)}
.redac{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.redac>button{width:100%;text-align:left;background:none;border:0;padding:12px;font-family:inherit;color:var(--ink);display:flex;gap:10px;align-items:center}
.redac>button b{flex:1;font-size:.92rem}
.redac>button .n{width:28px;height:28px;border-radius:8px;background:var(--gold);color:#2b2118;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:.85rem}
.redac>button .ch{color:var(--muted);transition:transform .2s}
.redac.open>button .ch{transform:rotate(90deg)}
.redac .body{display:none;padding:0 12px 12px;font-size:.92rem}
.redac.open .body{display:block}
.redac .sujet{background:#fff3e0;border-left:4px solid var(--gold);padding:8px 10px;border-radius:8px;font-style:italic;margin-bottom:10px}
.redac .para{margin:8px 0;text-align:justify}
.redac .para .lab{display:inline-block;font-size:.68rem;font-weight:700;color:#fff;background:var(--accent2);padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:middle}
.redac .para.c .lab{background:var(--gold);color:#2b2118}
.redac .para.a .lab{background:var(--accent)}
.redac .conn{background:#fffbe6}
.lic h2{margin-bottom:4px}.lic.ok{border-color:#2e7d4f;background:#f0f8f2}.lic code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.9rem}
.inp{width:100%;font:inherit;font-size:1.05rem;letter-spacing:.08em;padding:10px;border:1px solid var(--line);border-radius:9px;margin:4px 0 10px;text-transform:uppercase}
.lab{display:block;font-size:.8rem;color:var(--muted);margin-top:6px}
.chapbtn.locked{opacity:.75;background:#fbf6ec}.chapbtn.locked .num{background:#c9b48e}
.redac .note{font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:8px}
</style>
</head>

  tambour:function(x,y){return '<g transform="translate('+x+','+y+')"><ellipse cx="0" cy="0" rx="22" ry="9" fill="#e8d4b0" stroke="#8a6d3b"/><rect x="-22" y="0" width="44" height="22" fill="#b5452c"/><ellipse cx="0" cy="22" rx="22" ry="9" fill="#8a4b2a"/><g stroke="#d9a441" stroke-width="1.5"><line x1="-18" y1="0" x2="-14" y2="22"/><line x1="18" y1="0" x2="14" y2="22"/><line x1="0" y1="0" x2="0" y2="22"/></g></g>';},

  foule:function(x,y,n,c){var h='<g transform="translate('+x+','+y+')">';for(var i=0;i<n;i++){var ox=i*16+(i%2)*4,oy=(i%3)*3;h+='<ellipse cx="'+ox+'" cy="'+(26+oy)+'" rx="9" ry="12" fill="'+(c||'#6e5a4a')+'"/><circle cx="'+ox+'" cy="'+(10+oy)+'" r="6.5" fill="#d9a97e"/><path d="M'+(ox-6)+' '+(8+oy)+' q6 -8 12 0Z" fill="#2b1d12"/>';}return h+'</g>';},

reg({
 id:'antigone',
 titre:'Antigone',
 auteur:'Jean Anouilh',
 genre:'Tragédie moderne',
 chapLabel:'Les 10 séquences',
 chapShort:'Séquence',
 fiche:'<div class="card"><h2>Fiche d\'identité de l\'œuvre</h2>'
 +'<div class="fig"><svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="160" fill="#1b1f2a"/><rect x="0" y="130" width="360" height="30" fill="#2b2118"/><g fill="#e8d4b0"><rect x="40" y="40" width="14" height="90"/><rect x="100" y="40" width="14" height="90"/><rect x="246" y="40" width="14" height="90"/><rect x="306" y="40" width="14" height="90"/><path d="M30 40 h300 l-10 -14 h-280Z"/></g><g><path d="M150 130 Q150 70 180 70 Q210 70 210 130Z" fill="#2b2118"/><circle cx="180" cy="58" r="16" fill="#e3b58a"/><path d="M164 56 Q180 36 196 56Z" fill="#2b2118"/></g><circle cx="180" cy="80" r="70" fill="#f3b54a" opacity=".12"/><text x="180" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#f3e6c9">Thèbes, un palais, une nuit</text><text x="180" y="152" text-anchor="middle" font-size="9" fill="#c9b48e">Créée à Paris en février 1944, sous l’Occupation</text></svg><div class="caption">Un décor neutre, des personnages en habits de soirée : la tragédie en costume moderne</div></div>'
 +'<table><tr><th>Auteur</th><td>Jean Anouilh (Bordeaux 1910 – Lausanne 1987), dramaturge français ; auteur des « pièces noires », « roses », « brillantes »</td></tr>'
 +'<tr><th>Création</th><td>4 février 1944, théâtre de l\'Atelier (Paris), pendant l\'Occupation allemande ; publiée en 1946</td></tr>'
 +'<tr><th>Genre</th><td>Tragédie moderne en prose, en un seul acte, sans découpage en scènes</td></tr>'
 +'<tr><th>Source</th><td>L\'Antigone de Sophocle (Vᵉ s. av. J.-C.) et le mythe des Labdacides (Œdipe)</td></tr>'
 +'<tr><th>Cadre</th><td>Thèbes, le palais de Créon, de l\'aube à la fin du jour (unité de temps et de lieu)</td></tr>'
 +'<tr><th>Thèmes</th><td>Révolte et refus, devoir et pouvoir, bonheur, enfance et pureté, mort, fatalité, solitude du héros</td></tr>'
 +'<tr><th>Registres</th><td>Tragique, pathétique, polémique ; touches comiques (gardes, nourrice)</td></tr></table>'
 +'<h3>Le mythe en bref (ce que le spectateur doit savoir)</h3><p><b>Œdipe</b>, roi de Thèbes, a épousé sans le savoir sa mère Jocaste. Ils ont eu quatre enfants : <b>Étéocle</b>, <b>Polynice</b>, <b>Antigone</b> et <b>Ismène</b>. Après la mort d\'Œdipe, les deux frères devaient régner à tour de rôle ; Étéocle refuse de céder le trône, Polynice attaque Thèbes avec une armée étrangère : <b>ils s\'entretuent</b>. <b>Créon</b>, leur oncle, devient roi. Il fait de belles funérailles à Étéocle et interdit d\'enterrer Polynice, laissé aux corbeaux, sous peine de mort. Antigone décide de <b>désobéir</b>.</p>'
 +'<div class="fig"><svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="190" fill="#fbf0dc"/><g stroke="#8a6d3b" stroke-width="1.5" fill="none"><line x1="180" y1="40" x2="180" y2="70"/><line x1="60" y1="70" x2="300" y2="70"/><line x1="60" y1="70" x2="60" y2="100"/><line x1="140" y1="70" x2="140" y2="100"/><line x1="220" y1="70" x2="220" y2="100"/><line x1="300" y1="70" x2="300" y2="100"/><line x1="130" y1="22" x2="230" y2="22" stroke-dasharray="3 3"/><line x1="300" y1="130" x2="300" y2="150"/></g><g font-size="9" text-anchor="middle" font-weight="700"><rect x="135" y="8" width="90" height="28" rx="6" fill="#4a3b5c"/><text x="180" y="26" fill="#fff">Œdipe + Jocaste</text><rect x="245" y="8" width="60" height="28" rx="6" fill="#2b2118"/><text x="275" y="26" fill="#fff">Créon (frère)</text><rect x="25" y="100" width="70" height="28" rx="6" fill="#7a6a58"/><text x="60" y="118" fill="#fff">Étéocle †</text><rect x="105" y="100" width="70" height="28" rx="6" fill="#7a6a58"/><text x="140" y="118" fill="#fff">Polynice †</text><rect x="185" y="100" width="70" height="28" rx="6" fill="#b5452c"/><text x="220" y="118" fill="#fff">Antigone</text><rect x="265" y="100" width="70" height="28" rx="6" fill="#d9a441"/><text x="300" y="118">Ismène</text><rect x="265" y="150" width="70" height="28" rx="6" fill="#1f6f78"/><text x="300" y="168" fill="#fff">Hémon</text></g><text x="258" y="145" font-size="8" fill="#7a6a58">fils de Créon,</text><text x="258" y="155" font-size="8" fill="#7a6a58" dx="0" dy="0"></text><text x="200" y="145" font-size="8" fill="#b5452c">fiancés →</text><text x="180" y="185" text-anchor="middle" font-size="9" fill="#7a6a58">Les Labdacides : une famille maudite</text></svg><div class="caption">L\'arbre familial : Antigone est à la fois la nièce de Créon et la fiancée de son fils</div></div>'
 +'<h3>Pourquoi « tragédie moderne » ?</h3><ul><li><b>Tragédie</b> : un héros face à un destin inéluctable, une fin par la mort, le registre tragique, la fatalité annoncée dès le Prologue.</li><li><b>Moderne</b> : en prose, en costumes contemporains, avec des <b>anachronismes</b> (cigarettes, cartes à jouer, voiture, bals), un langage familier (les gardes), un Chœur qui <b>commente</b> le genre lui-même, et <b>sans les dieux</b> : la fatalité est intérieure, Antigone choisit.</li></ul>'
 +'<h3>Le contexte de 1944</h3><p>Créée sous l\'Occupation, la pièce a été lue de deux façons : Antigone comme figure de la <b>Résistance</b> (le non à l\'ordre injuste), Créon comme figure du pouvoir <b>collaborateur</b> qui « dit oui » pour sauver ce qui peut l\'être. Anouilh laisse les deux lectures ouvertes : c\'est la force de la pièce.</p>'
 +'<h3>Les trois piliers à mémoriser</h3><div class="keypoints"><strong>1.</strong> Le <b>conflit</b> Antigone / Créon : l\'absolu contre le compromis, le « non » contre le « oui ».<br><strong>2.</strong> La <b>fatalité</b> : tout est annoncé dès le Prologue ; le Chœur dit que « le ressort est bandé ».<br><strong>3.</strong> Le <b>bonheur</b> : Antigone refuse le bonheur médiocre des adultes ; elle veut « tout, tout de suite » ou rien.</div>'
 +'<h3>Les personnages en un coup d\'œil</h3><table><tr><th>Camp du « non »</th><th>Camp du « oui »</th><th>Hors du conflit</th></tr><tr><td>Antigone<br>Hémon (à la fin)</td><td>Créon<br>Ismène (au début)<br>Les gardes</td><td>Le Prologue / Chœur<br>La Nourrice<br>Le Page, le Messager, Eurydice</td></tr></table>'
 +'</div>',
 persos:[
  {n:"Antigone",r:"L'héroïne, fille d'Œdipe",c:"#b5452c",h:"#2b2118",f:true,d:"Petite, maigre, noiraude, renfermée : la « sale bête » que personne ne prenait au sérieux. Elle refuse le compromis, le mensonge et le bonheur tiède des adultes. Elle enterre Polynice moins par piété que par fidélité à elle-même et à l'enfance : elle dit « non ». Elle meurt seule, sans savoir pourquoi, ce qui fait sa grandeur tragique."},
  {n:"Créon",r:"Le roi, oncle d'Antigone",c:"#2b2118",h:"#999",f:false,d:"Homme robuste, fatigué, amateur de musique et de livres, devenu roi par devoir. Il incarne le réalisme politique : accepter le « sale travail », dire oui pour que la machine tourne. Il tente de sauver Antigone, lui révèle la vérité sur ses frères, mais échoue. À la fin, il perd son fils et sa femme et continue, seul, à gouverner."},
  {n:"Ismène",r:"La sœur d'Antigone",c:"#d9a441",h:"#d9a441",f:true,d:"Belle, blonde, raisonnable, coquette. Elle a peur de la mort et de la foule ; elle tente de dissuader Antigone au nom de la prudence. Elle représente le compromis et la vie ordinaire. Trop tard, elle voudra mourir avec sa sœur : Antigone la repousse."},
  {n:"Hémon",r:"Fils de Créon, fiancé d'Antigone",c:"#1f6f78",h:"#2b2118",f:false,d:"Jeune homme amoureux et sincère. Il a préféré Antigone à Ismène. Quand son père condamne sa fiancée, il le supplie, puis le renie. Il se tue dans le tombeau auprès d'Antigone morte : sa mort entraîne celle de sa mère Eurydice."},
  {n:"La Nourrice",r:"Celle qui a élevé les deux sœurs",c:"#8a6d3b",h:"#999",f:true,d:"Personnage tendre et comique, venu de la comédie. Elle gronde Antigone, lui prépare du café et des tartines, l'appelle « ma colombe ». Elle représente l'enfance protégée et l'amour simple ; Antigone lui confie sa chienne Douce."},
  {n:"Le Prologue / Le Chœur",r:"Le narrateur de la pièce",c:"#4a3b5c",h:"#2b2118",f:false,d:"Au début, il présente les personnages et annonce leur destin : c'est le Prologue. Ensuite, il intervient pour commenter l'action et définir la tragédie (« c'est propre, c'est reposant, c'est sûr »). Il est la voix de l'auteur et crée la distance avec le spectateur."},
  {n:"Les gardes (Jonas, Durand, Boudousse)",r:"Les exécutants",c:"#7a6a58",h:"#2b2118",f:false,d:"Hommes du peuple, vulgaires, préoccupés par leur paie, leur avancement et leurs beuveries. Ils arrêtent Antigone sans comprendre. Leur langage familier et leur indifférence introduisent le comique et dénoncent la banalité de la soumission. Jonas écrit la dernière lettre d'Antigone."},
  {n:"Le Messager",r:"Celui qui annonce la mort",c:"#555",h:"#2b2118",f:false,d:"Personnage pâle et solitaire, présent dès le Prologue, qui sait déjà ce qu'il viendra annoncer : la mort d'Antigone et d'Hémon dans le tombeau. Il assure le récit du dénouement (la mort n'est pas montrée sur scène)."},
  {n:"Eurydice",r:"Femme de Créon",c:"#9c4f7a",h:"#999",f:true,d:"Vieille dame qui tricote pour les pauvres de Thèbes pendant toute la pièce, sans dire un mot. À l'annonce de la mort de son fils Hémon, elle pose son tricot et se tranche la gorge. Figure muette du malheur."},
  {n:"Le Page",r:"Petit garçon au service de Créon",c:"#5aa9d6",h:"#2b2118",f:false,d:"Enfant silencieux qui accompagne Créon. Dans la scène finale, Créon lui confie sa lassitude ; le page voudrait vite être grand, Créon lui dit qu'il est fou. Il symbolise l'innocence qui deviendra, elle aussi, compromis."},
  {n:"Polynice et Étéocle",r:"Les frères morts",c:"#4f4f4f",h:"#2b2118",f:false,d:"Absents de la scène, ils sont le point de départ du conflit. Créon révèle qu'ils étaient tous deux des voyous qui voulaient tuer leur père, et que les corps étaient si abîmés qu'on ne sait pas lequel a été enterré. Cette révélation ébranle Antigone un instant."}
 ],
 schema:'<svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="220" fill="#fbf0dc"/><g stroke="#8a6d3b" stroke-width="1.5" fill="none"><line x1="110" y1="80" x2="250" y2="80" stroke="#b5452c" stroke-width="3"/><line x1="110" y1="80" x2="60" y2="160" stroke-dasharray="4 3"/><line x1="110" y1="80" x2="150" y2="170" stroke="#1f6f78" stroke-dasharray="4 3"/><line x1="250" y1="80" x2="150" y2="170" stroke-dasharray="4 3"/><line x1="250" y1="80" x2="300" y2="160" stroke-dasharray="4 3"/><line x1="110" y1="80" x2="60" y2="30" stroke-dasharray="4 3"/><line x1="250" y1="80" x2="310" y2="30" stroke-dasharray="4 3"/></g><g font-size="8" fill="#7a6a58"><text x="165" y="72">CONFLIT</text><text x="70" y="125">sœur</text><text x="118" y="135" fill="#1f6f78">fiancés</text><text x="205" y="135">père/fils</text><text x="282" y="125">époux</text><text x="72" y="52">nourrice</text><text x="282" y="52">neveu</text></g><g font-size="9" font-weight="700" text-anchor="middle"><circle cx="110" cy="80" r="26" fill="#b5452c"/><text x="110" y="84" fill="#fff">Antigone</text><circle cx="250" cy="80" r="26" fill="#2b2118"/><text x="250" y="84" fill="#fff">Créon</text><circle cx="60" cy="160" r="20" fill="#d9a441"/><text x="60" y="164">Ismène</text><circle cx="150" cy="170" r="20" fill="#1f6f78"/><text x="150" y="174" fill="#fff">Hémon</text><circle cx="300" cy="160" r="20" fill="#9c4f7a"/><text x="300" y="164" fill="#fff">Eurydice</text><circle cx="60" cy="30" r="18" fill="#8a6d3b"/><text x="60" y="34" fill="#fff">Nourrice</text><circle cx="310" cy="30" r="18" fill="#7a6a58"/><text x="310" y="34" fill="#fff">Gardes</text></g><text x="180" y="210" text-anchor="middle" font-size="9" fill="#7a6a58">Le Chœur observe et commente, hors du schéma</text></svg>',
 notions:[
  {n:"Tragédie",d:"Pièce de théâtre mettant en scène un héros noble face à un destin inéluctable, qui se termine par la mort. Elle inspire terreur et pitié."},
  {n:"Tragédie moderne",d:"Tragédie du XXᵉ siècle qui reprend un mythe antique en prose, en costumes contemporains, avec anachronismes et sans intervention des dieux."},
  {n:"Mythe",d:"Récit légendaire fondateur transmis depuis l'Antiquité (ici : Œdipe et ses enfants), repris et réinterprété par les auteurs."},
  {n:"Fatalité (fatum)",d:"Destin fixé d'avance auquel le héros ne peut échapper. Chez Anouilh, elle est annoncée dès le Prologue et incarnée par le Chœur."},
  {n:"Prologue",d:"Personnage qui, au début, présente les personnages et annonce l'histoire. Procédé antique repris par Anouilh pour créer la distance."},
  {n:"Chœur",d:"Dans la tragédie grecque, groupe qui commente l'action. Chez Anouilh, un seul personnage qui réfléchit sur la tragédie et le destin."},
  {n:"Anachronisme",d:"Élément d'une époque placé dans une autre : cigarettes, cartes, voiture, bal dans une Thèbes antique. Il modernise et universalise."},
  {n:"Catharsis",d:"Purification des passions du spectateur par la terreur et la pitié qu'inspire la tragédie (Aristote)."},
  {n:"Hybris (démesure)",d:"Orgueil excessif du héros tragique qui défie l'ordre établi. L'absolu d'Antigone peut être lu comme une forme d'hybris."},
  {n:"Dilemme tragique",d:"Choix impossible entre deux devoirs : pour Créon, sauver sa nièce ou faire respecter la loi."},
  {n:"Didascalie",d:"Indication scénique de l'auteur (gestes, ton, décor) en italique, non prononcée par les acteurs."},
  {n:"Réplique",d:"Prise de parole d'un personnage dans un dialogue."},
  {n:"Tirade",d:"Longue réplique d'un personnage, ex. : Créon expliquant son métier de roi, l'image du bateau."},
  {n:"Stichomythie",d:"Échange rapide de répliques brèves, vers à vers ou phrase à phrase, qui traduit la tension (Antigone/Créon)."},
  {n:"Monologue",d:"Un personnage seul en scène parle à lui-même ou au public (ex. : le Chœur sur la tragédie)."},
  {n:"Aparté",d:"Réplique dite à part, que les autres personnages sont censés ne pas entendre."},
  {n:"Double énonciation",d:"Au théâtre, le personnage parle à un autre personnage ET au public en même temps."},
  {n:"Ironie tragique",d:"Le spectateur sait ce que le personnage ignore (grâce au Prologue) : chaque espoir des personnages sonne faux."},
  {n:"Registre tragique",d:"Exprime la fatalité, la mort, la grandeur du héros face au destin : lexique de la mort, du devoir, de la nécessité."},
  {n:"Registre pathétique",d:"Vise à émouvoir, à faire pleurer : supplications d'Hémon, adieux d'Antigone, lettre à Hémon."},
  {n:"Registre polémique",d:"Affrontement d'idées, ton vif, arguments et attaques : le débat Antigone/Créon."},
  {n:"Registre comique",d:"Les gardes (paie, avancement, langage familier) et la Nourrice apportent le rire dans la tragédie."},
  {n:"Antithèse",d:"Opposition de termes : oui / non, vivre / mourir, bonheur / absolu, enfant / adulte."},
  {n:"Métaphore filée",d:"Image poursuivie sur plusieurs phrases : le bateau qui coule et son capitaine (Créon sur le pouvoir)."},
  {n:"Mise en abyme",d:"La pièce parle d'elle-même : le Chœur explique ce qu'est une tragédie pendant la tragédie."},
  {n:"Distanciation",d:"Procédé qui empêche le spectateur de s'identifier totalement (Prologue, Chœur, anachronismes) pour le faire réfléchir."},
  {n:"Schéma actantiel",d:"Sujet : Antigone · Objet : enterrer Polynice / rester fidèle à soi · Opposant : Créon, la loi, Ismène · Adjuvant : personne (solitude du héros)."},
  {n:"Les Labdacides",d:"Lignée maudite de Thèbes : Laïos, Œdipe, puis Étéocle, Polynice, Antigone, Ismène."}

 methode:'<div class="card"><h2>Production écrite — Méthode</h2><p>Au régional, la production écrite (10 pts) demande un <b>texte argumentatif</b> d\'une quinzaine de lignes sur un thème lié à l\'œuvre ou à la société.</p>'
 +'<div class="fig"><svg viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="120" fill="#fbf0dc"/><g font-size="10" font-weight="700" text-anchor="middle"><rect x="10" y="30" width="100" height="60" rx="8" fill="#1f6f78"/><text x="60" y="52" fill="#fff">INTRODUCTION</text><text x="60" y="66" fill="#fff" font-weight="400">thème + question</text><text x="60" y="78" fill="#fff" font-weight="400">+ annonce du plan</text><rect x="130" y="30" width="100" height="60" rx="8" fill="#b5452c"/><text x="180" y="52" fill="#fff">DÉVELOPPEMENT</text><text x="180" y="66" fill="#fff" font-weight="400">2 ou 3 arguments</text><text x="180" y="78" fill="#fff" font-weight="400">+ exemples</text><rect x="250" y="30" width="100" height="60" rx="8" fill="#d9a441"/><text x="300" y="52" fill="#2b2118">CONCLUSION</text><text x="300" y="66" fill="#2b2118" font-weight="400">bilan + avis</text><text x="300" y="78" fill="#2b2118" font-weight="400">+ ouverture</text><path d="M110 60 L128 60" stroke="#2b2118" stroke-width="2"/><path d="M230 60 L248 60" stroke="#2b2118" stroke-width="2"/></g></svg></div>'
 +'<h3>Connecteurs indispensables</h3><table><tr><th>Pour…</th><th>Utilisez</th></tr><tr><td>Introduire</td><td>De nos jours, Il est fréquent de constater que, La question se pose de savoir si</td></tr><tr><td>Ajouter un argument</td><td>D\'abord, Ensuite, De plus, Par ailleurs, Enfin</td></tr><tr><td>Illustrer</td><td>Par exemple, Ainsi, Comme le montre Anouilh dans Antigone</td></tr><tr><td>Opposer / nuancer</td><td>Cependant, Toutefois, Néanmoins, Certes… mais</td></tr><tr><td>Cause / conséquence</td><td>Car, Parce que, En effet · Donc, C\'est pourquoi, Par conséquent</td></tr><tr><td>Conclure</td><td>En somme, Pour conclure, En définitive</td></tr></table>'
 +'<h3>Les thèmes qui tombent (et un plan pour chacun)</h3>'
 +'<div class="model"><b>Faut-il toujours obéir aux lois ?</b> — Thèse (Créon) : la loi garantit l\'ordre, sans elle c\'est le chaos. Antithèse (Antigone) : une loi injuste doit être refusée ; la conscience est au-dessus. Conclusion : obéir, mais garder le droit de dire non à l\'injustice par des moyens légitimes.</div>'
 +'<div class="model"><b>La révolte des jeunes contre les adultes</b> — Thèse : les jeunes ont raison de refuser les compromis et l\'hypocrisie (Antigone). Antithèse : l\'expérience des adultes évite des drames (Créon, Ismène). Conclusion : dialogue entre générations.</div>'
 +'<div class="model"><b>Qu\'est-ce que le bonheur ?</b> — Thèse : le bonheur modeste (famille, travail, petites joies) que défend Créon. Antithèse : Antigone refuse ce bonheur « tiède », elle veut l\'absolu. Conclusion : définir son propre bonheur sans mépriser celui des autres.</div>'
 +'<div class="model"><b>Le pouvoir et ses compromissions</b> — Thèse : gouverner oblige à des choix impurs (le « sale travail »). Antithèse : le pouvoir sans morale détruit (Créon perd tout). Conclusion : autorité et éthique doivent aller ensemble.</div>'
 +'<div class="model"><b>Peut-on mourir pour une idée ?</b> — Thèse : certains sacrifices donnent sens à l\'histoire (résistants, martyrs). Antithèse : la vie est la valeur suprême ; Antigone meurt sans même savoir pourquoi. Conclusion : vivre pour ses idées plutôt que mourir pour elles.</div>'
 +'<div class="model"><b>La place de la femme face à l\'autorité</b> — Antigone, jeune femme seule face au roi et aux gardes ; Ismène, la soumise. Plan : la force d\'Antigone / ses limites / la femme d\'aujourd\'hui.</div>'
 +'<h3>Les 5 erreurs qui coûtent des points</h3><ul><li>Oublier d\'<b>annoncer le plan</b> dans l\'introduction.</li><li>Donner des arguments <b>sans exemple</b> (prenez-en un dans la pièce et un dans la vie réelle).</li><li>Un seul long paragraphe : <b>un paragraphe par argument</b>, avec un connecteur en tête.</li><li>Raconter la pièce au lieu d\'<b>argumenter</b>.</li><li>Ne pas donner son <b>avis personnel</b> en conclusion.</li></ul>'
 +'<h3>Spécial théâtre : les questions de langue qui tombent</h3><table><tr><th>On vous demande</th><th>Répondez</th></tr><tr><td>Genre du texte</td><td>Texte théâtral (dialogue, répliques, didascalies, noms des personnages en tête de réplique)</td></tr><tr><td>Type de texte</td><td>Souvent argumentatif (débat Créon/Antigone) ou narratif (récit du Messager, du Prologue)</td></tr><tr><td>Qui parle à qui ?</td><td>Nommer les deux personnages + rappeler la double énonciation (au public aussi)</td></tr><tr><td>Tonalité / registre</td><td>Tragique, pathétique, polémique, comique selon l\'extrait ; justifier par le lexique</td></tr><tr><td>Rôle des didascalies</td><td>Indiquer le ton, les gestes, les déplacements ; révéler les sentiments</td></tr></table>'
 +'</div>'
});

 {p:"عند رفع الستار تكون <b>كل الشخصيات</b> على الخشبة تثرثر أو تحيك. تتقدم شخصية: <b>المقدّم</b>. يخاطب <b>الجمهور</b> مباشرة ويقدّم كل واحد: أنتيغون، إسمين، هيمون، كريون، أوريديس، المربية، الرسول، الحراس. ويروي أيضاً ما جرى من قبل (موت الأخوين، مرسوم كريون).",k:"<b>الأسلوب:</b> <b>مشهد عرض</b> تتكفل به شخصية واحدة تخاطب الجمهور: كسر <b>الوهم المسرحي</b>، <b>تغريب</b>."},
 {p:"يصف المقدّم أنتيغون بأنها فتاة <b>نحيلة</b>، <b>سمراء</b>، منطوية، لم يكن أحد في الأسرة يأخذها على محمل الجد. تفكر في أنها ستموت، وأنها شابة، وأنها كانت تود أن تعيش، لكن لا حيلة: عليها أن <b>تلعب دورها حتى النهاية</b>. وكلمة «دور» تذكّر بأن الأمر مسرح.",k:"<b>صورة بالتقابل:</b> أنتيغون (نحيلة، داكنة، جادة) مقابل إسمين (شقراء، جميلة، ضاحكة). التضاد يبني المسرحية كلها."},
 {p:"يُقدَّم كريون رجلاً <b>قوي البنية</b>، أبيض الشعر، كان يحب الموسيقى والكتب والتجليدات الجميلة، واضطر إلى قبول الحكم بعد موت أوديب لأنه كان لا بد من أحد يقول نعم. <b>شمّر عن ساعديه</b>. لا يقدّمه المقدّم طاغية، بل <b>رجلاً متعباً</b>."},
 {p:"يعلن المقدّم <b>موت</b> أنتيغون ويذكّر بأن الشخصيات الأخرى ستعيش الأحداث دون أن تستطيع تغيير شيء. فيعرف المتفرج النهاية قبل البداية: لن ينظر إلى <b>ما</b> سيحدث بل إلى <b>كيف</b>. وهذا هو تعريف <b>التراجيديا</b> نفسه: <b>القدر</b> يحل محل التشويق.",k:"<b>للامتحان:</b> شرح دور المقدّم = <b>عرض</b> + <b>إعلان الخاتمة</b> + <b>تغريب</b> + نبرة <b>مألوفة</b> و<b>ساخرة</b> (مفارقات زمنية: حفل راقص، ورق لعب، هيمون يدعو إسمين للرقص)."}

 fiche:'<div class="card"><h2>Fiche d\'identité de l\'œuvre</h2>'

 +'<table><tr><th>Auteur</th><td>Ahmed Sefrioui (Fès 1915 – Rabat 2004), premier romancier marocain d\'expression française</td></tr>'
 +'<tr><th>Parution</th><td>1954 (Paris, Seuil)</td></tr>'
 +'<tr><th>Genre</th><td>Roman autobiographique</td></tr>'
 +'<tr><th>Narrateur</th><td>Sidi Mohammed, 6 ans · double narrateur : l\'<b>adulte</b> qui se souvient et l\'<b>enfant</b> qui vit</td></tr>'
 +'<tr><th>Cadre</th><td>Fès, Dar Chouafa (impasse Zankat Hajjama), vers 1920</td></tr>'
 +'<tr><th>Structure</th><td>12 chapitres, 1ʳᵉ personne, alternance présent (adulte) / passé (enfant)</td></tr>'
 +'<tr><th>Thèmes</th><td>Solitude de l\'enfant, rêve et imaginaire, croyances et superstition, vie de la médina, relation mère-fils, pauvreté et dignité</td></tr>'
 +'<tr><th>Registres</th><td>Réaliste, lyrique, parfois comique</td></tr></table>'
 +'<h3>Pourquoi « roman autobiographique » ?</h3><ul><li>Le narrateur dit « je » et raconte son enfance → <b>pacte autobiographique</b> implicite.</li><li>Mais il s\'appelle Sidi Mohammed, pas Ahmed → <b>distance fictionnelle</b>.</li><li>Les temps : <b>passé</b> (imparfait, passé simple) pour l\'enfance ; <b>présent</b> quand l\'adulte commente.</li></ul>'

 +'<circle cx="265" cy="128" r="6" fill="#b5452c"/><text x="265" y="160">Ch.9-11</text><text x="265" y="171">ruine, départ</text><text x="265" y="182">du père</text>'

 +'<h3>Les trois piliers à mémoriser</h3><div class="keypoints"><strong>1.</strong> Un enfant <b>solitaire</b> qui se réfugie dans sa <b>boîte à merveilles</b> (symbole de l\'imaginaire).<br><strong>2.</strong> Une <b>mère</b> omniprésente, superstitieuse, bavarde ; un <b>père</b> calme, digne, travailleur.<br><strong>3.</strong> Une <b>maison collective</b> (Dar Chouafa), petit monde de voisines, de disputes, de fêtes et de rites.</div>'

 persos:[
  {n:"Sidi Mohammed",r:"Le narrateur, 6 ans",c:"#f3b54a",h:"#2b2118",f:false,d:"Enfant unique, solitaire, rêveur, sensible et parfois jaloux (de Zineb). Il observe le monde des adultes sans tout comprendre. Sa boîte à merveilles est son refuge. Il tombe souvent malade quand l'émotion est trop forte. L'adulte qu'il est devenu raconte avec tendresse et mélancolie."},
  {n:"Lalla Zoubida",r:"La mère",c:"#1f6f78",h:"#2b2118",f:true,d:"Femme de caractère, bavarde, émotive, superstitieuse, fière d'être chérifa (descendante du Prophète). Très attachée à son fils, elle se dispute volontiers avec les voisines puis se réconcilie. Elle est jalouse de la lampe de Fatma Bziouya. Pendant l'absence du père, elle consulte voyants et marabouts."},
  {n:"Maâlem Abdeslem",r:"Le père, tisserand",c:"#2b2118",h:"#2b2118",f:false,d:"Homme calme, pieux, digne, d'origine montagnarde. Il parle peu mais raconte des histoires (Abdallah l'épicier). Il perd son capital (ch. 9) et part travailler comme moissonneur à la campagne pour ne pas s'endetter. Son retour (ch. 12) ramène la joie."},
  {n:"Lalla Aïcha",r:"Amie de la mère",c:"#8a6d3b",h:"#555",f:true,d:"Ancienne voisine, grosse, chérifa comme Lalla Zoubida. Elle apparaît dès le ch. 2 (visite à Sidi Boughaleb). Son mari Moulay Larbi, babouchier, est ruiné par son associé puis se remarie. Elle conseille à Lalla Zoubida de consulter le voyant Si El Arafi. Personnage de la fidélité en amitié."},
  {n:"Moulay Larbi",r:"Mari de Lalla Aïcha",c:"#4a3b5c",h:"#2b2118",f:false,d:"Babouchier. Trahi par son associé Abdelkader (ch. 4), il perd son atelier. Il prend une seconde épouse, la fille du coiffeur (ch. 11), puis la répudie et revient vers Lalla Aïcha (ch. 12). Il incarne les malheurs qui frappent les gens simples."},
  {n:"Lalla Kenza (la Chouafa)",r:"La voyante du rez-de-chaussée",c:"#7a6a58",h:"#555",f:true,d:"Donne son nom à la maison. Reçoit des clientes et organise des cérémonies avec les Gnaouas. Elle incarne le monde des croyances et de la superstition."},
  {n:"Rahma",r:"Voisine du 1er étage",c:"#b5452c",h:"#2b2118",f:true,d:"Épouse de Driss El Aouad, mère de Zineb. Se dispute avec Lalla Zoubida (ch. 1), mais devient une alliée : la maison entière cherche Zineb (ch. 3) et Rahma offre un repas aux mendiants pour remercier Dieu. Elle raconte l'histoire de Lalla Khadija (ch. 6)."},
  {n:"Zineb",r:"Fille de Rahma",c:"#d9a441",h:"#2b2118",f:true,d:"La seule autre enfant de la maison. Le narrateur la déteste, la trouve sotte et se dispute avec elle. Elle se perd dans la médina (ch. 3) et est retrouvée chez les Idrissides."},
  {n:"Fatma Bziouya",r:"Voisine du 2e étage",c:"#5aa9d6",h:"#2b2118",f:true,d:"Épouse d'Allal le jardinier. Sa lampe à pétrole (ch. 3) provoque la jalousie de Lalla Zoubida : épisode qui révèle la modernité qui entre dans la maison et la rivalité des femmes."},
  {n:"Le fqih",r:"Maître du Msid",c:"#2e7d4f",h:"#2b2118",f:false,d:"Maître de l'école coranique, sévère et craint (sa baguette). Mais à l'approche de l'Achoura il devient plus doux et organise la fête avec les élèves (ch. 5-7). Figure de l'autorité traditionnelle."},
  {n:"Abdallah l'épicier",r:"Le conteur du quartier",c:"#c48a5a",h:"#555",f:false,d:"Épicier dont le père rapporte les histoires merveilleuses (ch. 4). Il représente la tradition orale, la sagesse populaire et nourrit l'imaginaire de l'enfant."},
  {n:"Si El Arafi",r:"Le voyant aveugle",c:"#4f4f4f",h:"#999",f:false,d:"Voyant aveugle consulté par Lalla Zoubida et Lalla Aïcha pendant l'absence du père (ch. 10). Il rassure les deux femmes. Incarne la sagesse populaire et la religiosité du peuple."},
  {n:"Salama",r:"La marieuse",c:"#9c4f7a",h:"#2b2118",f:true,d:"Entremetteuse qui a arrangé le second mariage de Moulay Larbi avec la fille du coiffeur (ch. 11). Elle le regrette et raconte les difficultés du couple."},
  {n:"Driss El Aouad · Allal · Driss le teigneux",r:"Personnages secondaires",c:"#7a6a58",h:"#2b2118",f:false,d:"Driss El Aouad : mari de Rahma, fabricant de charrues. Allal : jardinier, mari de Fatma Bziouya. Driss le teigneux : apprenti du père, qui fait les courses et apporte les nouvelles."}

 schema:'<svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="220" fill="#fbf0dc"/><g stroke="#8a6d3b" stroke-width="1.5" fill="none"><line x1="180" y1="50" x2="90" y2="100"/><line x1="180" y1="50" x2="270" y2="100"/><line x1="90" y1="100" x2="270" y2="100"/><line x1="90" y1="100" x2="40" y2="165" stroke="#b5452c" stroke-dasharray="4 3"/><line x1="90" y1="100" x2="120" y2="175" stroke="#8a6d3b" stroke-dasharray="4 3"/><line x1="120" y1="175" x2="200" y2="190" stroke="#4a3b5c" stroke-dasharray="4 3"/><line x1="180" y1="50" x2="300" y2="175" stroke="#2e7d4f" stroke-dasharray="4 3"/><line x1="40" y1="165" x2="70" y2="205" stroke="#d9a441" stroke-dasharray="4 3"/></g><g font-size="8" fill="#7a6a58"><text x="52" y="128">voisine/dispute</text><text x="96" y="145">amie</text><text x="150" y="190">époux</text><text x="246" y="112">élève</text><text x="18" y="195">mère</text><text x="246" y="92">couple</text></g><g font-size="9" font-weight="700" text-anchor="middle"><circle cx="180" cy="50" r="24" fill="#f3b54a"/><text x="180" y="47">Sidi</text><text x="180" y="59">Mohammed</text><circle cx="90" cy="100" r="24" fill="#1f6f78"/><text x="90" y="97" fill="#fff">Lalla</text><text x="90" y="109" fill="#fff">Zoubida</text><circle cx="270" cy="100" r="24" fill="#2b2118"/><text x="270" y="97" fill="#fff">Maâlem</text><text x="270" y="109" fill="#fff">Abdeslem</text><circle cx="40" cy="165" r="18" fill="#b5452c"/><text x="40" y="169" fill="#fff">Rahma</text><circle cx="70" cy="205" r="13" fill="#d9a441"/><text x="70" y="208">Zineb</text><circle cx="120" cy="175" r="20" fill="#8a6d3b"/><text x="120" y="172" fill="#fff">Lalla</text><text x="120" y="183" fill="#fff">Aïcha</text><circle cx="200" cy="190" r="20" fill="#4a3b5c"/><text x="200" y="187" fill="#fff">Moulay</text><text x="200" y="198" fill="#fff">Larbi</text><circle cx="300" cy="175" r="20" fill="#2e7d4f"/><text x="300" y="179" fill="#fff">Le fqih</text></g></svg>',
 notions:[
  {n:"Roman autobiographique",d:"Récit à la 1ʳᵉ personne inspiré de la vie de l'auteur, mais avec une part de fiction (le narrateur ne porte pas le nom de l'auteur)."},
  {n:"Pacte autobiographique",d:"Engagement de l'auteur à dire la vérité sur sa vie ; auteur = narrateur = personnage. Dans La Boîte à merveilles, ce pacte n'est qu'implicite."},
  {n:"Narrateur-personnage",d:"Le narrateur participe à l'histoire et dit « je ». Ici, il y a deux « je » : l'enfant qui vit et l'adulte qui se souvient."},
  {n:"Point de vue interne",d:"Le lecteur perçoit l'histoire à travers un seul personnage : ses pensées, ses sentiments, ce qu'il voit."},
  {n:"Point de vue omniscient",d:"Le narrateur sait tout de tous les personnages, passé et avenir compris."},
  {n:"Point de vue externe",d:"Le narrateur ne décrit que ce qu'une caméra verrait ; pas d'accès aux pensées."},
  {n:"Présent d'énonciation",d:"Présent qui renvoie au moment où le narrateur parle ; signale la voix de l'adulte qui commente."},
  {n:"Analepse (retour en arrière)",d:"Récit d'un événement antérieur au moment de l'histoire. Tout le roman est une grande analepse de l'adulte vers l'enfance."},
  {n:"Hyperbole",d:"Exagération pour frapper l'esprit. Ex. : le bain maure décrit comme un enfer."},
  {n:"Comparaison",d:"Rapprochement de deux éléments avec un outil (comme, tel, pareil à…)."},
  {n:"Métaphore",d:"Comparaison sans outil : un mot est employé pour un autre. Ex. : « un enfer » pour le bain."},
  {n:"Personnification",d:"Donner des traits humains à une chose ou un animal. Ex. : les objets de la boîte sont des « amis »."},
  {n:"Antithèse",d:"Opposition de deux idées ou mots dans une même phrase. Ex. : la fête de l'Achoura / la tristesse du départ."},
  {n:"Énumération",d:"Suite de mots ou groupes de même nature. Ex. : la liste des objets de la boîte."},
  {n:"Champ lexical",d:"Ensemble de mots d'un texte qui renvoient à une même idée (solitude, peur, religion…)."},
  {n:"Registre lyrique",d:"Expression des sentiments personnels (nostalgie, tristesse, émerveillement)."},
  {n:"Registre réaliste",d:"Description précise et fidèle de la vie quotidienne (métiers, lieux, objets)."},
  {n:"Registre comique",d:"Vise à faire rire : disputes de voisines, exagérations de la mère."},
  {n:"Texte narratif",d:"Raconte des événements (passé simple, imparfait, connecteurs temporels)."},
  {n:"Texte descriptif",d:"Décrit un lieu, un personnage, un objet (imparfait, adjectifs, repères spatiaux)."},
  {n:"Texte argumentatif",d:"Défend une thèse avec des arguments et des exemples (présent, connecteurs logiques)."},
  {n:"Discours direct",d:"Paroles rapportées telles quelles, entre guillemets, avec verbe de parole."},
  {n:"Discours indirect",d:"Paroles rapportées dans une subordonnée (il dit que…), avec changement de temps et de pronoms."},
  {n:"Schéma narratif",d:"Situation initiale → élément perturbateur → péripéties → dénouement → situation finale. Ici : équilibre → ruine et départ du père → épreuves → retour."},
  {n:"Leitmotiv",d:"Thème ou mot qui revient de façon répétée. Ex. : la solitude du narrateur."},
  {n:"Chérifa",d:"Femme descendant du Prophète ; titre dont Lalla Zoubida et Lalla Aïcha sont fières."},
  {n:"Msid",d:"École coranique où l'enfant apprend le Coran sous la baguette du fqih."},
  {n:"Achoura",d:"Fête religieuse (10 Muharram) : jouets, tambours, habits neufs ; point culminant de la joie dans le roman (ch. 5-7)."}
 ],
 methode:'<div class="card"><h2>Production écrite — Méthode</h2><p>Au régional, la production écrite (10 pts) demande un <b>texte argumentatif</b> d\'une quinzaine de lignes sur un thème lié à l\'œuvre ou à la société.</p>'
 +'<div class="fig"><svg viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="120" fill="#fbf0dc"/><g font-size="10" font-weight="700" text-anchor="middle"><rect x="10" y="30" width="100" height="60" rx="8" fill="#1f6f78"/><text x="60" y="52" fill="#fff">INTRODUCTION</text><text x="60" y="66" fill="#fff" font-weight="400">thème + question</text><text x="60" y="78" fill="#fff" font-weight="400">+ annonce du plan</text><rect x="130" y="30" width="100" height="60" rx="8" fill="#b5452c"/><text x="180" y="52" fill="#fff">DÉVELOPPEMENT</text><text x="180" y="66" fill="#fff" font-weight="400">2 ou 3 arguments</text><text x="180" y="78" fill="#fff" font-weight="400">+ exemples</text><rect x="250" y="30" width="100" height="60" rx="8" fill="#d9a441"/><text x="300" y="52" fill="#2b2118">CONCLUSION</text><text x="300" y="66" fill="#2b2118" font-weight="400">bilan + avis</text><text x="300" y="78" fill="#2b2118" font-weight="400">+ ouverture</text><path d="M110 60 L128 60" stroke="#2b2118" stroke-width="2"/><path d="M230 60 L248 60" stroke="#2b2118" stroke-width="2"/></g></svg></div>'
 +'<h3>Connecteurs indispensables</h3><table><tr><th>Pour…</th><th>Utilisez</th></tr><tr><td>Introduire</td><td>De nos jours, Il est fréquent de constater que, La question se pose de savoir si</td></tr><tr><td>Ajouter un argument</td><td>D\'abord, Ensuite, De plus, Par ailleurs, Enfin</td></tr><tr><td>Illustrer</td><td>Par exemple, Ainsi, Comme le montre, Dans La Boîte à merveilles</td></tr><tr><td>Opposer / nuancer</td><td>Cependant, Toutefois, Néanmoins, Certes… mais</td></tr><tr><td>Exprimer la cause / conséquence</td><td>Car, Parce que, En effet · Donc, C\'est pourquoi, Par conséquent</td></tr><tr><td>Conclure</td><td>En somme, Pour conclure, En définitive</td></tr></table>'
 +'<h3>Les thèmes qui tombent (et un plan pour chacun)</h3>'
 +'<div class="model"><b>La solitude de l\'enfant</b> (ch. 1, 12) — Thèse : l\'enfant d\'aujourd\'hui, entouré d\'écrans, est moins seul. Antithèse : une compagnie virtuelle n\'est pas une présence. Conclusion : la solitude a changé de forme.</div>'
 +'<div class="model"><b>La superstition et les voyants</b> (ch. 1, 10) — Thèse : consulter un voyant rassure dans l\'épreuve, comme Lalla Zoubida. Antithèse : c\'est une exploitation de la crédulité ; la raison et la médecine valent mieux. Conclusion : comprendre sans juger, éduquer.</div>'
 +'<div class="model"><b>Le bain maure / les traditions</b> (ch. 1) — Thèse : les traditions (hammam, fêtes, contes) créent du lien social. Antithèse : certaines sont dépassées ou pénibles. Conclusion : garder l\'esprit, adapter la forme.</div>'
 +'<div class="model"><b>L\'école et la sévérité du maître</b> (ch. 2, 5) — Thèse : la discipline forge le caractère. Antithèse : la peur bloque l\'apprentissage ; la pédagogie moderne respecte l\'enfant. Conclusion : autorité sans violence.</div>'
 +'<div class="model"><b>Les fêtes (Achoura) et la joie collective</b> (ch. 6-7) — Thèse : les fêtes transmettent les valeurs et unissent la famille. Antithèse : elles deviennent commerciales et pèsent sur les familles pauvres. Conclusion : revenir au sens.</div>'
 +'<div class="model"><b>La pauvreté, la dignité, le travail</b> (ch. 9) — Thèse : le père qui part moissonner montre la dignité du travail. Antithèse : la société devrait protéger les familles frappées par la ruine. Conclusion : solidarité et courage.</div>'
 +'<div class="model"><b>L\'amitié</b> (Lalla Zoubida / Lalla Aïcha) — Thèse : l\'amie est présente dans le malheur. Antithèse : l\'amitié peut aussi mal conseiller (voyants). Conclusion : une vraie amitié est sincère et lucide.</div>'
 +'<div class="model"><b>La polygamie / le remariage</b> (ch. 11-12) — Sujet délicat : exposer les deux positions avec respect, s\'appuyer sur l\'échec du second mariage de Moulay Larbi, conclure sur le respect et l\'équité.</div>'
 +'<h3>Les 5 erreurs qui coûtent des points</h3><ul><li>Oublier d\'<b>annoncer le plan</b> dans l\'introduction.</li><li>Donner des arguments <b>sans exemple</b> (prenez-en un dans l\'œuvre et un dans la vie réelle).</li><li>Un seul long paragraphe : <b>un paragraphe par argument</b>, avec un connecteur en tête.</li><li>Mélanger les temps : le <b>présent</b> pour argumenter.</li><li>Ne pas donner son <b>avis personnel</b> en conclusion.</li></ul>'
 +'<h3>Rappel du format de l\'épreuve</h3><table><tr><th>Partie</th><th>Points</th><th>Ce qu\'on attend</th></tr><tr><td>Compréhension</td><td>10</td><td>Situer le passage, genre, énonciation, type de texte, champ lexical, figure de style, point de vue, compréhension, réaction personnelle</td></tr><tr><td>Production écrite</td><td>10</td><td>Texte argumentatif de 15 lignes environ : respect du sujet, plan, arguments, langue</td></tr></table>'
 +'</div>'
});

addAr('bam',0,{tip:"الفصل الافتتاحي يضع الإطار والشخصيات والنبرة. وهو، مع فصل المسيد، الأكثر وروداً في الامتحان.",ep:[
 {p:"يتذكر الراوي البالغ: في <b>السادسة</b> من عمره كان طفلاً <b>وحيداً</b>، بلا صديق، لا يرتاح مع الأطفال الآخرين. يعيش مع والديه في <b>الطابق الأول</b> من <b>دار الشوافة</b>، وهي دار مشتركة تشغل طابقَها الأرضي <b>الشوافة</b> (العرّافة) لالة كنزة.",k:"<b>للحفظ:</b> الافتتاحية <b>تأمل</b> للبالغ في وحدته؛ النبرة <b>حزينة</b>؛ وكلمة «الوحدة» تتكرر كلازمة."},
 {p:"تحمل الدار اسم أشهر ساكنة فيها: <b>الشوافة</b>، عرّافة تأتي النساء لاستشارتها. تعيش الأسر فوق بعضها: رحمة وزوجها <b>إدريس العواد</b> (صانع المحاريث) وابنتهما <b>زينب</b>؛ و<b>فاطمة بزيوية</b> وزوجها علال البستاني. <b>الصحن</b> و<b>السطح</b> مشتركان، ولذلك هما مصدر <b>الخصومات</b>."},
 {p:"تأخذ الأم الطفل إلى <b>الحمام</b>. وهو بالنسبة إليه مكان <b>مخيف</b>: بخار، حرارة، نساء يصرخن، شجار حول الدلاء. يشعر فيه بأنه <b>غريب</b> وضائع، ويحتفظ من هذه التجربة بذكرى <b>مؤلمة</b>.",k:"<b>الأسلوب المفتاح:</b> وصف الحمام <b>مبالغة</b> متواصلة (الطفل يضخّم)، مع <b>حقل معجمي للجحيم</b> و<b>الضيق</b>."},
 {p:"تنظم الشوافة <b>حفلاً</b> بموسيقيين من <b>كناوة</b>: بخور، أناشيد، قراقب، رقص حتى الجذبة. تهتز الدار كلها. يراقب الطفل المشهد بمزيج من <b>الخوف</b> و<b>الانبهار</b>."},
 {p:"في يوم <b>غسيل</b>، تحتل رحمة السطح؛ وترى لالة زبيدة أنها مظلومة. تتبادل المرأتان <b>الشتائم</b> بعنف وتتدخل الدار كلها. يفزع الطفل ويلجأ إلى الزقاق ثم يتعزّى. تُظهر الخصومة <b>العنف اللفظي</b> للنساء لكنها تُظهر أيضاً قوة روابطهن: فستتصالحان لاحقاً."},
 {p:"هرباً من الحزن، يفتح الطفل <b>علبة العجائب</b>: أشياء تافهة (أزرار، كرات زجاجية، مسامير، خواتم...) تصبح عنده كنوزاً و<b>أصدقاء</b>. إنها <b>رمز</b> <b>الخيال</b> والعزاء، وهي التي تمنح الرواية عنوانها.",k:"<b>للامتحان:</b> العلبة = ملجأ، خيال، طفولة. تفتتح الرواية (ف1) وتختمها (ف12): <b>بنية دائرية</b>."}
]});

 +'<h3>Pourquoi le condamné est-il anonyme ?</h3><ul><li>Pour qu\'il représente <b>tous</b> les condamnés : c\'est l\'<b>universalité</b> du propos.</li><li>Pour que le lecteur ne juge pas le <b>crime</b> mais ressente le <b>châtiment</b>.</li><li>Pour que le lecteur s\'<b>identifie</b> : « je » peut être n\'importe qui. Le chapitre 47, « Mon histoire », reste <b>vide</b>.</li></ul>'

 +'<h3>Les trois piliers à mémoriser</h3><div class="keypoints"><strong>1.</strong> Une <b>idée fixe</b> : la pensée de la mort obsède chaque page ; le temps devient le vrai sujet.<br><strong>2.</strong> Un <b>plaidoyer</b> par l\'émotion : Hugo veut faire <b>sentir</b>, pas démontrer ; la préface démontre.<br><strong>3.</strong> Une <b>société accusée</b> : juges, prêtre indifférent, foule avide de spectacle, geôliers, architecte : tous complices.</div>'

  {n:"Le condamné",r:"Narrateur anonyme",c:"#b5452c",h:"#2b2118",f:false,d:"Jeune homme instruit (il écrit, cite, raisonne), issu d'une famille aisée, marié, père d'une petite fille, Marie. On ne connaît ni son nom ni son crime (un meurtre, semble-t-il, jamais précisé). Il traverse l'espoir, la révolte, le désespoir, la peur ; il écrit pour résister et témoigner. Il représente tout condamné."},
  {n:"Marie",r:"Sa fille, trois ans",c:"#d9a441",h:"#2b2118",f:true,d:"Pensée la plus douce et la plus douloureuse du condamné. Lors de la visite (ch. 43), elle ne le reconnaît pas et l'appelle « monsieur » : elle croit son papa mort. Elle incarne l'innocence frappée par le châtiment et l'avenir volé. Argument central contre la peine de mort."},
  {n:"La mère, la femme",r:"Les siennes",c:"#8a6d3b",h:"#999",f:true,d:"Évoquées surtout au chapitre 9 : sa mère âgée qui mourra de chagrin, sa femme malade qui ne survivra pas. Elles ne viennent pas le voir. Le condamné pense à ces « trois femmes » dont il est le soutien : la peine frappe toute une famille."},
  {n:"Le friauche",r:"Le forçat de la Conciergerie",c:"#7a6a58",h:"#2b2118",f:false,d:"Condamné aux galères, puis à mort, qu'il rencontre au chapitre 23. Fils d'un pendu, voleur par misère, il raconte sa vie en argot avec insolence et demande au narrateur sa redingote pour la vendre. Il montre comment la société fabrique les criminels : la misère et la prison."},
  {n:"L'aumônier",r:"Le prêtre",c:"#4f4f4f",h:"#999",f:false,d:"Prêtre de la prison, bienveillant mais mécanique : il récite des consolations usées, sans vraie compassion. Le condamné ne trouve en lui aucun réconfort et refuse sa confession ; il aurait voulu un prêtre qui pleure avec lui. Critique de la religion institutionnelle."},
  {n:"Les geôliers et gendarmes",r:"Les exécutants",c:"#555",h:"#2b2118",f:false,d:"Le guichetier, le directeur de Bicêtre, l'huissier qui lit l'arrêt, le gendarme qui demande des numéros de loterie (ch. 32) : des hommes ordinaires, parfois humains, souvent indifférents. Ils font « leur métier » : la banalité de l'appareil judiciaire."},
  {n:"Les forçats",r:"La chaîne pour Toulon",c:"#4a3b5c",h:"#2b2118",f:false,d:"Au chapitre 13, le condamné assiste au ferrement des forçats dans la cour de Bicêtre : hommes enchaînés, chantant, insultant, à demi nus sous la pluie. Scène d'enfer réaliste qui dénonce le bagne, autre face de la justice."},
  {n:"La foule",r:"Personnage collectif",c:"#2b2118",h:"#2b2118",f:false,d:"Présente à la cour d'assises, au ferrement, sous les fenêtres, à la Grève. Curieuse, cruelle, joyeuse : elle loue des fenêtres pour voir l'exécution. Hugo en fait l'accusée principale : le spectacle de la mort corrompt le peuple au lieu de l'édifier."},
  {n:"Pepa / Pepita",r:"L'amour d'enfance",c:"#9c4f7a",h:"#2b2118",f:true,d:"Jeune Andalouse dont le narrateur se souvient au chapitre 33 : un après-midi dans un jardin, une lecture partagée, un premier émoi. Souvenir lumineux qui contraste avec le cachot et rappelle que le condamné a été un enfant heureux."},
  {n:"L'architecte, le bourreau",r:"Les figures de la machine",c:"#8a8494",h:"#999",f:false,d:"L'architecte vient mesurer le cachot pour des travaux (ch. 31) comme si le prisonnier n'existait pas ; le bourreau et ses aides font la toilette du condamné (ch. 48) avec gestes d'habitude. Ils incarnent la mécanique froide de l'exécution."}

 schema:'<svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="220" fill="#fbf0dc"/><circle cx="180" cy="110" r="34" fill="#b5452c"/><text x="180" y="106" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">LE</text><text x="180" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">CONDAMNÉ</text><g stroke="#8a6d3b" stroke-width="1.5" fill="none"><line x1="180" y1="76" x2="180" y2="40"/><line x1="150" y1="92" x2="70" y2="60"/><line x1="210" y1="92" x2="290" y2="60"/><line x1="150" y1="128" x2="70" y2="170"/><line x1="210" y1="128" x2="290" y2="170"/><line x1="180" y1="144" x2="180" y2="185"/></g><g font-size="9" text-anchor="middle" font-weight="700"><circle cx="180" cy="28" r="18" fill="#d9a441"/><text x="180" y="32">Marie</text><circle cx="60" cy="50" r="18" fill="#8a6d3b"/><text x="60" y="47" fill="#fff">mère,</text><text x="60" y="58" fill="#fff">femme</text><circle cx="300" cy="50" r="18" fill="#4f4f4f"/><text x="300" y="54" fill="#fff">prêtre</text><circle cx="60" cy="178" r="18" fill="#7a6a58"/><text x="60" y="182" fill="#fff">friauche</text><circle cx="300" cy="178" r="18" fill="#555"/><text x="300" y="175" fill="#fff">geôliers</text><text x="300" y="186" fill="#fff">bourreau</text><circle cx="180" cy="200" r="16" fill="#2b2118"/><text x="180" y="204" fill="#fff">foule</text></g><g font-size="8" fill="#7a6a58"><text x="196" y="60">amour</text><text x="108" y="70">absence</text><text x="232" y="70">froideur</text><text x="100" y="158">pitié</text><text x="232" y="158">machine</text><text x="196" y="170">cruauté</text></g></svg>',
 notions:[
  {n:"Roman à thèse",d:"Roman qui défend une idée (ici l'abolition de la peine de mort) en la faisant vivre à travers une histoire et des personnages."},
  {n:"Thèse",d:"Idée défendue par l'auteur : la peine de mort est cruelle, inutile, injuste et irréversible."},
  {n:"Argument",d:"Raison qui soutient la thèse. Ex. : la peine frappe aussi la famille innocente (Marie)."},
  {n:"Exemple",d:"Fait concret qui illustre un argument. Ex. : le friauche, fils de pendu devenu voleur, montre que le châtiment n'empêche rien."},
  {n:"Plaidoyer",d:"Discours pour défendre une cause ou une personne. La préface de 1832 est un plaidoyer contre la peine de mort."},
  {n:"Réquisitoire",d:"Discours qui accuse. Le roman est un réquisitoire contre la société et la justice de son temps."},
  {n:"Journal intime",d:"Forme du récit : écriture au jour le jour, à la 1ʳᵉ personne, au présent, pour soi-même."},
  {n:"Monologue intérieur",d:"Flux de pensées du personnage retranscrit sans intermédiaire : angoisses, souvenirs, calculs du condamné."},
  {n:"Narrateur anonyme",d:"Le condamné n'a ni nom ni crime connu : procédé d'universalisation, le lecteur s'identifie."},
  {n:"Focalisation interne",d:"Tout est vu par le condamné : ses peurs déforment le réel (le cachot, la foule, la guillotine)."},
  {n:"Présent d'énonciation",d:"Le narrateur écrit au moment où il vit : le présent crée l'urgence et l'immédiateté."},
  {n:"Analepse (retour en arrière)",d:"Souvenirs insérés dans le présent du cachot : le procès (ch. 2), Pepa (ch. 33), Notre-Dame (ch. 36)."},
  {n:"Ellipse",d:"Omission d'une partie du temps : les cinq semaines sont résumées, le crime n'est jamais raconté (ch. 47 vide)."},
  {n:"Rythme du récit",d:"Chapitres de plus en plus courts à mesure que l'heure approche : accélération et dilatation du temps."},
  {n:"Registre pathétique",d:"Vise à émouvoir : la visite de Marie, les adieux, les larmes."},
  {n:"Registre tragique",d:"Le héros face à une mort inéluctable ; le temps compté ; l'absence d'issue."},
  {n:"Registre polémique",d:"Attaque d'une institution ou d'une idée : la justice, la foule, le prêtre, la guillotine."},
  {n:"Registre réaliste",d:"Description précise du monde carcéral : argot, cachot, ferrement, toilette du condamné."},
  {n:"Argot",d:"Langue des prisonniers et des voleurs (le friauche, la chanson). Hugo l'utilise pour montrer un monde à part et ses codes."},
  {n:"Hyperbole",d:"Exagération : la guillotine devient un monstre, la foule une mer hurlante."},
  {n:"Personnification",d:"L'idée de la mort devient une compagne qui habite avec lui ; la guillotine « attend »."},
  {n:"Antithèse",d:"Opposition : vie/mort, dedans/dehors, soleil/cachot, enfant/bourreau."},
  {n:"Ironie",d:"Dire le contraire de ce qu'on pense pour dénoncer : le gendarme qui demande les numéros de loterie, l'architecte qui mesure."},
  {n:"Champ lexical",d:"Ensemble de mots liés à une idée : mort, enfermement, temps, angoisse, foule."},
  {n:"Préface de 1832",d:"Texte ajouté par Hugo où il assume la thèse abolitionniste et répond aux objections : arguments politiques, moraux, religieux."},
  {n:"Peine de mort en France",d:"Hugo la combat toute sa vie (discours de 1848). Elle est abolie en 1981 (loi Badinter)."},
  {n:"Bicêtre / Conciergerie / Grève",d:"Les trois lieux du roman : prison d'attente, prison du dernier jour, place de l'exécution."},
  {n:"Marie",d:"Fille du condamné, trois ans ; ne le reconnaît pas (ch. 43). Argument affectif majeur contre la peine de mort."}
 ],
 methode:'<div class="card"><h2>Production écrite — Méthode</h2><p>Au régional, la production écrite (10 pts) demande un <b>texte argumentatif</b> d\'une quinzaine de lignes. Avec cette œuvre, le sujet porte très souvent sur la <b>peine de mort</b> ou la <b>justice</b> : préparez vos arguments des deux côtés.</p>'
 +'<div class="fig"><svg viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="120" fill="#fbf0dc"/><g font-size="10" font-weight="700" text-anchor="middle"><rect x="10" y="30" width="100" height="60" rx="8" fill="#1f6f78"/><text x="60" y="52" fill="#fff">INTRODUCTION</text><text x="60" y="66" fill="#fff" font-weight="400">thème + question</text><text x="60" y="78" fill="#fff" font-weight="400">+ annonce du plan</text><rect x="130" y="30" width="100" height="60" rx="8" fill="#b5452c"/><text x="180" y="52" fill="#fff">DÉVELOPPEMENT</text><text x="180" y="66" fill="#fff" font-weight="400">2 ou 3 arguments</text><text x="180" y="78" fill="#fff" font-weight="400">+ exemples</text><rect x="250" y="30" width="100" height="60" rx="8" fill="#d9a441"/><text x="300" y="52" fill="#2b2118">CONCLUSION</text><text x="300" y="66" fill="#2b2118" font-weight="400">bilan + avis</text><text x="300" y="78" fill="#2b2118" font-weight="400">+ ouverture</text><path d="M110 60 L128 60" stroke="#2b2118" stroke-width="2"/><path d="M230 60 L248 60" stroke="#2b2118" stroke-width="2"/></g></svg></div>'
 +'<h3>Le sujet n° 1 : pour ou contre la peine de mort</h3><table><tr><th>Arguments CONTRE (Hugo)</th><th>Arguments POUR (à connaître pour nuancer)</th></tr><tr><td>Cruelle : torture morale de l\'attente (tout le roman)</td><td>Justice pour les victimes et leurs familles</td></tr><tr><td>Inutile : ne dissuade pas, la foule s\'amuse (ch. 48)</td><td>Dissuasion supposée des criminels</td></tr><tr><td>Injuste : frappe les pauvres, les innocents (Marie), les fils de pendus (friauche)</td><td>Protection de la société contre les récidivistes</td></tr><tr><td>Irréversible : l\'erreur judiciaire est sans retour</td><td>Coût de la détention à perpétuité</td></tr><tr><td>Barbare : une société qui tue se rabaisse au niveau du criminel</td><td>Tradition, textes religieux (interprétations discutées)</td></tr></table>'
 +'<h3>Les autres thèmes qui tombent</h3>'
 +'<div class="model"><b>La prison rend-elle meilleur ?</b> — Thèse : elle punit et protège. Antithèse : elle fabrique des criminels (le friauche, le bagne). Conclusion : punir en vue de réinsérer.</div>'
 +'<div class="model"><b>Le spectacle de la violence</b> (foule de la Grève, aujourd\'hui vidéos et réseaux) — Thèse : voir dissuade et informe. Antithèse : voir banalise et excite la cruauté. Conclusion : protéger surtout les jeunes.</div>'
 +'<div class="model"><b>L\'écriture peut-elle sauver ?</b> — Thèse : écrire soulage, résiste, témoigne (ch. 6). Antithèse : écrire ne change pas le réel ; le condamné meurt. Conclusion : l\'écriture sauve la dignité et transforme le lecteur.</div>'
 +'<div class="model"><b>Peut-on juger un homme sans connaître son histoire ?</b> — Le crime n\'est jamais dit (ch. 47 vide). Thèse : un acte suffit à juger. Antithèse : comprendre les causes (misère, enfance). Conclusion : juger l\'acte, comprendre l\'homme.</div>'
 +'<div class="model"><b>La famille du coupable est-elle coupable ?</b> — Marie, la mère, la femme. Thèse : non, et la société doit les protéger. Antithèse : elles subissent le déshonneur. Conclusion : la justice ne doit pas punir les innocents par ricochet.</div>'
 +'<h3>Les 5 erreurs qui coûtent des points</h3><ul><li>Oublier d\'<b>annoncer le plan</b>.</li><li>Prendre parti dès l\'introduction sans <b>exposer l\'autre thèse</b>.</li><li>Raconter le roman au lieu de l\'<b>utiliser comme exemple</b>.</li><li>Un seul paragraphe : <b>un argument = un paragraphe</b>.</li><li>Oublier l\'<b>ouverture</b> finale (ex. : l\'abolition en France en 1981, le débat dans le monde).</li></ul>'
 +'<h3>Rappel : les questions de langue sur ce roman</h3><table><tr><th>On vous demande</th><th>Répondez</th></tr><tr><td>Genre</td><td>Roman à thèse sous forme de journal intime</td></tr><tr><td>Énonciation</td><td>Narrateur-personnage anonyme, 1ʳᵉ personne, présent ; le lecteur est le destinataire implicite</td></tr><tr><td>Type de texte</td><td>Narratif, descriptif (cachot, foule), argumentatif (ch. 7, préface), souvent mêlés</td></tr><tr><td>Point de vue</td><td>Interne : on ne sait que ce que le condamné perçoit</td></tr><tr><td>Tonalité</td><td>Pathétique, tragique, polémique, ironique selon l\'extrait</td></tr><tr><td>Visée</td><td>Émouvoir pour convaincre : plaidoyer contre la peine de mort</td></tr></table>'
 +'</div>'
});

addChap('ddc',{
 titre:"« Condamné à mort ! » (ch. 1-2)",
 sous:"L'idée fixe · avant et après · le procès aux assises · le verdict",
 tip:"L'incipit le plus célèbre du programme. Il tombe presque chaque année dans une académie.",
 episodes:[
  {t:"L'incipit : une pensée qui habite avec lui",
   svg:'<svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="170" fill="#2a2630"/><rect x="40" y="20" width="280" height="130" fill="#3b3542"/><g stroke="#8a8494" stroke-width="3"><line x1="80" y1="20" x2="80" y2="150"/><line x1="130" y1="20" x2="130" y2="150"/><line x1="180" y1="20" x2="180" y2="150"/><line x1="230" y1="20" x2="230" y2="150"/><line x1="280" y1="20" x2="280" y2="150"/></g><g transform="translate(140,60)"><rect x="10" y="22" width="36" height="70" rx="5" fill="#d8d2c4"/><circle cx="28" cy="12" r="12" fill="#e3b58a"/><path d="M16 10 Q28 -3 40 10Z" fill="#2b2118"/></g><g opacity=".35"><path d="M40 20 Q180 170 320 20" stroke="#b5452c" stroke-width="40" fill="none"/></g><text x="180" y="164" text-anchor="middle" font-size="10" fill="#f3e6c9">Toujours seul avec elle, toujours glacé de sa présence</text></svg>',
   cap:"La pensée de la mort : une présence physique, un poids",
   p:"Le roman s'ouvre sur un cri : <b>« Condamné à mort ! »</b>. Depuis <b>cinq semaines</b>, le narrateur vit avec cette pensée, seul avec elle, glacé de sa présence, courbé sous son poids. <b>Autrefois</b>, il était un homme comme les autres : chaque jour, chaque heure apportait une idée nouvelle, il était libre, jeune, riche de projets. <b>Maintenant</b>, une seule idée l'occupe, une idée <b>fixe</b> qui le réveille, qui s'interpose entre lui et le monde.<div class=\"model\"><b>Extrait (ch. 1) :</b> « Condamné à mort ! Voilà cinq semaines que j'habite avec cette pensée, toujours seul avec elle, toujours glacée de sa présence, toujours courbé sous son poids ! »</div>",
   k:"<strong>Procédés :</strong> phrase nominale exclamative en ouverture ; <b>personnification</b> de la pensée (elle habite, elle glace) ; <b>anaphore</b> de « toujours » ; <b>antithèse</b> autrefois / maintenant."},
  {t:"Le procès : une belle matinée d'août",
   p:"Le chapitre 2 est un <b>retour en arrière</b> : le dernier jour du procès, par une belle matinée d'août. Le narrateur se souvient de la salle d'assises : le soleil, les jurés fatigués après trois jours de débats, les juges, l'avocat qui parle avec peu de conviction, la <b>foule</b> curieuse qui le regarde comme une bête. Il n'écoute presque pas, il a <b>faim</b>, il regarde la lumière par la fenêtre. On le ramène ; la réponse du jury tombe : <b>coupable</b>.",
   k:"<strong>Réalisme et ironie :</strong> la justice est décrite comme une <b>mécanique lasse</b> ; le condamné pense à la vie (le soleil, la faim) pendant qu'on décide de sa mort : <b>antithèse</b> vie/mort."},
  {t:"Le verdict",
   p:"Le président prononce la sentence : <b>peine de mort</b>. Le narrateur raconte sa <b>stupeur</b> : la foule se rue vers la sortie, ravie du spectacle ; lui ne pense d'abord à rien, puis sent le sang lui monter au visage et comprend. Le mot « mort » devient physique. On le reconduit à Bicêtre dans une voiture grillagée : le peuple le regarde passer.",
   k:"<strong>Thème :</strong> dès le début, la <b>foule</b> est montrée avide de spectacle. Le procès n'est qu'une <b>formalité</b> : Hugo discrédite la justice sans la caricaturer."},
  {t:"Ce que l'incipit installe",
   p:"Trois choses sont posées : un narrateur <b>anonyme</b> (ni nom, ni crime), une <b>situation</b> sans issue (la mort certaine), et une <b>forme</b> (le monologue intérieur au présent). Le lecteur sait déjà la fin ; il va vivre l'attente <b>de l'intérieur</b>."}
 ],
 chrono:["<b>Ch. 1</b> — l'idée fixe, autrefois / maintenant","<b>Ch. 2</b> — retour en arrière : le procès","<b>Le jury</b> — « coupable »","<b>La sentence</b> — peine de mort","<b>Le retour</b> — Bicêtre, la foule"],
 analyse:[["Énonciation","1ʳᵉ personne, présent (ch. 1) puis passé (ch. 2 : analepse)"],["Figures","Personnification de la pensée, anaphore de « toujours », antithèse autrefois/maintenant, hyperbole"],["Registres","Tragique (la mort certaine), pathétique, réaliste (la salle d'assises)"],["Champs lexicaux","Mort, enfermement, poids ; lumière et vie dans le souvenir du procès"],["Point de vue","Interne : la salle vue par le regard distrait du condamné"],["Rôle de l'incipit","Poser le narrateur anonyme, la situation sans issue, la forme du journal"]],
 citations:"Mots-clés : <b>idée fixe</b>, <b>cinq semaines</b>, <b>autrefois / maintenant</b>, <b>personnification</b>, <b>anaphore</b>, <b>foule</b>, <b>Bicêtre</b>.",
 quiz:[
  {t:"Compréhension",s:"Depuis combien de temps le narrateur vit-il avec la pensée de sa condamnation au début du roman ?",o:["Trois jours","Cinq semaines","Six mois","Un an"],a:1,e:"« Voilà cinq semaines » : le roman résume d'abord ces semaines, puis s'attarde sur le dernier jour."},
  {t:"Compréhension",s:"Que sait-on du crime du narrateur ?",o:["Il a volé","Il a tué un gendarme","Presque rien : le crime n'est jamais précisé","Il est innocent"],a:2,e:"Hugo laisse le crime dans l'ombre (le ch. 47 « Mon histoire » est vide) pour que le lecteur juge la peine, non l'homme."},
  {t:"Compréhension",s:"À quoi pense le narrateur pendant que le jury délibère (ch. 2) ?",o:["À son crime","Au soleil, à la lumière, à sa faim","À sa vengeance","À s'évader"],a:1,e:"Détails de vie au moment où l'on décide de sa mort : antithèse poignante et réalisme."},
  {t:"Figure de style",s:"« Toujours seul avec elle, toujours glacée de sa présence, toujours courbé sous son poids. » Quelles figures ?",o:["Comparaison et métaphore","Anaphore et personnification","Litote et euphémisme","Ellipse et chiasme"],a:1,e:"Répétition de « toujours » en tête de groupe (anaphore) ; la pensée a une présence, un poids (personnification)."},
  {t:"Structure",s:"Le chapitre 2 (le procès) est par rapport au chapitre 1 :",o:["Une anticipation","Un retour en arrière (analepse)","Une description","Une préface"],a:1,e:"Le narrateur revient cinq semaines plus tôt pour raconter le procès : analepse."},
  {t:"Énonciation",s:"Quel temps domine le chapitre 1 et quel effet produit-il ?",o:["Le passé simple : distance","Le présent : urgence et immédiateté","Le futur : espoir","L'imparfait : nostalgie"],a:1,e:"Le présent du journal met le lecteur dans la tête du condamné, en temps réel."},
  {t:"Thème",s:"Comment la foule est-elle présentée dès le procès ?",o:["Compatissante","Indifférente","Curieuse et avide de spectacle","Révoltée contre le verdict"],a:2,e:"Elle regarde le condamné comme une bête et se rue dehors, satisfaite : première charge contre la société."},
  {t:"Question ouverte",s:"Analysez l'opposition autrefois / maintenant dans le chapitre 1. (3 phrases)",open:true,m:"Autrefois, le narrateur était libre et sa pensée allait de projet en projet, d'heure en heure, comme la vie elle-même. Maintenant, une seule idée l'occupe, fixe, qui exclut toutes les autres : il est prisonnier dans sa tête avant de l'être dans son cachot. Cette antithèse structure l'incipit et annonce le sujet du roman : non pas le crime, mais le supplice de l'attente."},
  {t:"Réaction personnelle",s:"Hugo choisit de ne pas dire le crime de son personnage. Approuvez-vous ce choix ? 3 lignes.",open:true,m:"Position + arguments + exemple. Ex. : Oui, car le lecteur ne peut pas se dire « il l'a mérité » : il est obligé de penser à la peine elle-même. Le condamné devient n'importe quel homme, et donc chacun de nous. Certains trouveront le procédé manipulateur, mais c'est la force du roman à thèse."}
 ]
});

addAr('ddc',0,{tip:"أشهر استهلال في المقرر. يرد كل سنة تقريباً في إحدى الأكاديميات.",ep:[
 {p:"تفتتح الرواية بصرخة: <b>«محكوم بالإعدام!»</b>. منذ <b>خمسة أسابيع</b> يعيش الراوي مع هذه الفكرة، وحيداً معها، متجمداً من حضورها، منحنياً تحت ثقلها. <b>في الماضي</b> كان رجلاً كالآخرين: كل يوم، كل ساعة، تأتي بفكرة جديدة، كان حراً شاباً غنياً بالمشاريع. <b>الآن</b> فكرة واحدة تشغله، فكرة <b>ثابتة</b> توقظه وتحول بينه وبين العالم.",k:"<b>أساليب:</b> جملة اسمية تعجبية في الافتتاح؛ <b>تشخيص</b> الفكرة (تسكن، تجمّد)؛ <b>تكرار استهلالي</b> لـ«دائماً»؛ <b>تضاد</b> الماضي/الآن."},
 {p:"الفصل الثاني <b>عودة إلى الوراء</b>: اليوم الأخير من المحاكمة، في صباح جميل من أغسطس. يتذكر الراوي قاعة الجنايات: الشمس، المحلفون المتعبون بعد ثلاثة أيام من المرافعات، القضاة، المحامي الذي يتكلم بقليل من الاقتناع، <b>الحشد</b> الفضولي الذي ينظر إليه كوحش. لا يكاد يستمع، <b>جائع</b>، ينظر إلى الضوء من النافذة. يُعاد إلى القاعة؛ ويسقط جواب المحلفين: <b>مذنب</b>.",k:"<b>واقعية وسخرية:</b> تُوصف العدالة كـ<b>آلية متعبة</b>؛ يفكر المحكوم في الحياة (الشمس، الجوع) بينما يُقرَّر موته: <b>تضاد</b> حياة/موت."},
 {p:"ينطق الرئيس بالحكم: <b>عقوبة الإعدام</b>. يروي الراوي <b>ذهوله</b>: يندفع الحشد نحو الخروج مسروراً بالمشهد؛ أما هو فلا يفكر في شيء أولاً، ثم يشعر بالدم يصعد إلى وجهه ويفهم. تصبح كلمة «الموت» جسدية. يُعاد إلى بيسيتر في عربة مسيَّجة: ويراه الشعب يمر.",k:"<b>الموضوع:</b> منذ البداية يُعرض <b>الحشد</b> متعطشاً للفرجة. المحاكمة مجرد <b>إجراء شكلي</b>: يُسقط هيغو مصداقية العدالة دون تشويهها."},
 {p:"تُوضع ثلاثة أشياء: راوٍ <b>مجهول</b> (لا اسم ولا جريمة)، <b>وضعية</b> بلا مخرج (الموت المؤكد)، و<b>شكل</b> (المونولوغ الداخلي في الحاضر). يعرف القارئ النهاية سلفاً؛ وسيعيش الانتظار <b>من الداخل</b>."}
