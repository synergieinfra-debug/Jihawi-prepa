   svg:'<svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="170" fill="#1b1f2a"/><g transform="translate(40,60)"><rect x="0" y="20" width="34" height="70" rx="5" fill="#4a3b5c"/><circle cx="17" cy="10" r="12" fill="#e3b58a"/><path d="M30 40 l50 -8" stroke="#e3b58a" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(130,40)"><rect x="0" y="0" width="200" height="100" rx="8" fill="#2b2a3a" stroke="#d9a441"/><g stroke="#d9a441" stroke-width="2" fill="none"><path d="M20 70 q10-40 20-10 q10 30 20 -10 q10-40 20 -10 q10 30 20 -10 q10-40 20 -10 q10 30 20 -10"/></g><circle cx="20" cy="70" r="4" fill="#b5452c"/><circle cx="160" cy="30" r="4" fill="#b5452c"/><text x="100" y="92" text-anchor="middle" font-size="9" fill="#f3e6c9">ressort bandé → ça se déroule tout seul</text></g><text x="180" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#f3e6c9">Tragédie : propre, reposante, sûre</text><text x="180" y="160" text-anchor="middle" font-size="9" fill="#c9b48e">Drame : on pourrait encore s’en sortir. Tragédie : non.</text></svg>',
   cap:"Le Chœur arrête l'action pour expliquer la mécanique tragique",
   p:"Seul en scène, le <b>Chœur</b> s'adresse au public : maintenant, <b>le ressort est bandé</b>, la tragédie n'a plus qu'à se dérouler. Il compare la tragédie à une <b>machine</b> qu'un rien met en marche : un regard, une envie d'honneur, une question posée un soir. Il oppose la tragédie au <b>drame</b> : dans le drame, il y a des traîtres, des méchants, de l'<b>espoir</b>, on se débat ; dans la tragédie, <b>tout le monde est innocent</b>, il n'y a plus d'espoir, c'est <b>propre</b>, <b>reposant</b>, <b>sûr</b>. Enfin, on peut <b>crier</b>, dire ce qu'on n'avait jamais dit.",
   k:"<strong>Mise en abyme :</strong> la pièce définit son propre genre. <b>Paradoxes</b> à retenir : « reposant » parce qu'on ne peut rien faire ; « gratuit » parce que sans espoir ; les personnages sont « des rois » = la tragédie ennoblit."},
  {t:"Antigone ramenée par les gardes",
   svg:'<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="160" fill="#e9e2d6"/><rect x="0" y="125" width="360" height="35" fill="#c9b48e"/><g transform="translate(70,45)"><rect x="0" y="24" width="36" height="74" rx="6" fill="#7a6a58"/><circle cx="18" cy="12" r="12" fill="#e3b58a"/><rect x="6" y="-2" width="24" height="8" rx="2" fill="#4f4f4f"/><path d="M34 45 l24 4" stroke="#e3b58a" stroke-width="6" stroke-linecap="round"/></g><g transform="translate(150,55)"><path d="M0 70 Q0 26 20 26 Q40 26 40 70Z" fill="#b5452c"/><circle cx="20" cy="16" r="12" fill="#e3b58a"/><path d="M8 14 Q20 0 32 14Z" fill="#2b2118"/><path d="M15 20 Q20 18 25 20" stroke="#2b2118" fill="none"/></g><g transform="translate(220,45)"><rect x="0" y="24" width="36" height="74" rx="6" fill="#7a6a58"/><circle cx="18" cy="12" r="12" fill="#e3b58a"/><rect x="6" y="-2" width="24" height="8" rx="2" fill="#4f4f4f"/><path d="M2 45 l-24 4" stroke="#e3b58a" stroke-width="6" stroke-linecap="round"/></g><g transform="translate(290,60)"><rect x="0" y="0" width="5" height="55" fill="#8a6d3b"/><path d="M-6 55 h17 l-3 12 h-11Z" fill="#555"/></g><text x="293" y="140" text-anchor="middle" font-size="8" fill="#7a6a58">la pelle</text><text x="180" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#2b2118">Prise en flagrant délit, en plein jour</text><text x="170" y="150" text-anchor="middle" font-size="9" fill="#b5452c">Antigone, les mains tenues</text></svg>',
   cap:"Les gardes tiennent la « petite » qui grattait la terre à mains nues",
   p:"Les trois <b>gardes</b> entrent en traînant <b>Antigone</b>. Ils l'ont surprise en <b>plein midi</b>, revenue <b>recouvrir à nouveau</b> le corps que l'on avait découvert, grattant la terre avec ses <b>ongles</b>. Les gardes sont <b>brutaux</b> et <b>vulgaires</b> : ils plaisantent, parlent de la <b>prime</b>, de la <b>fête</b> qu'ils feront. Antigone, <b>calme</b>, leur demande de la lâcher ; ils la tutoient et ricanent.",
   k:"<strong>Contraste :</strong> la <b>dignité</b> silencieuse d'Antigone / la <b>grossièreté</b> des gardes. Antigone est revenue : son acte est une <b>décision répétée</b>, pas un accident."},
  {t:"Le Chœur et Créon",
   p:"Avant l'arrivée de Créon, le Chœur l'a averti : la « petite » qui a recouvert le corps, c'est <b>Antigone</b>. Créon ne veut d'abord pas y croire. Quand il entre et la voit entre les gardes, il comprend que la <b>machine</b> dont parlait le Chœur s'est emparée de sa propre famille."}
 ],
 chrono:["<b>Le Chœur</b> — tirade sur la tragédie","<b>Arrestation</b> — Antigone surprise à midi","<b>Les gardes</b> — brutalité, prime, plaisanteries","<b>Antigone</b> — calme, dignité","<b>Créon</b> — entre et découvre sa nièce"],
 analyse:[["Mise en abyme","Le Chœur définit la tragédie dans la tragédie"],["Antithèses","Tragédie/drame · espoir/absence d'espoir · innocents/coupables · propre/sale"],["Figures","Métaphore de la machine et du ressort ; énumération ; paradoxes (reposant, gratuit)"],["Registres","Didactique et ironique (Chœur) ; comique et brutal (gardes) ; tragique (Antigone)"],["Niveaux de langue","Familier et grossier chez les gardes / sobre chez Antigone"],["Thème","Fatalité : l'action se déroule sans que personne puisse l'arrêter"]],
 citations:"Mots-clés : <b>ressort bandé</b>, <b>machine</b>, <b>tragédie ≠ drame</b>, <b>propre / reposant / sûr</b>, <b>crier</b>, <b>plein midi</b>, <b>ongles</b>, <b>prime</b>.",
 quiz:[
  {t:"Compréhension",s:"À quoi le Chœur compare-t-il la tragédie ?",o:["À un orage","À une machine dont le ressort est bandé","À un jardin","À une guerre"],a:1,e:"Métaphore mécanique : une fois le ressort bandé, tout se déroule tout seul, sans espoir d'arrêt."},
  {t:"Compréhension",s:"Selon le Chœur, quelle est la différence entre tragédie et drame ?",o:["La tragédie est plus courte","Dans le drame il y a de l'espoir et des méchants ; dans la tragédie, tout le monde est innocent et il n'y a plus d'espoir","Le drame est en vers","Il n'y a pas de différence"],a:1,e:"Le drame laisse une issue possible ; la tragédie est « propre, reposante, sûre » parce que fermée."},
  {t:"Compréhension",s:"Dans quelles circonstances Antigone est-elle arrêtée ?",o:["La nuit, en fuyant","En plein midi, revenue recouvrir le corps à mains nues","Au palais, dénoncée par Ismène","Au bal, avec Hémon"],a:1,e:"Elle est revenue une seconde fois, en plein jour : l'acte est délibéré et répété."},
  {t:"Compréhension",s:"De quoi parlent les gardes après l'arrestation ?",o:["De justice","De la prime et de la fête qu'ils feront","Du mythe d'Œdipe","De la pitié qu'ils ont pour Antigone"],a:1,e:"Indifférents au drame, ils pensent à la récompense : banalité du mal, comique grinçant."},
  {t:"Figure de style",s:"Dire que la tragédie est « reposante » parce qu'on ne peut rien y faire est un :",o:["Euphémisme","Paradoxe","Pléonasme","Comparaison"],a:1,e:"Affirmation contraire à l'opinion commune, qui fait réfléchir : le repos vient de l'absence de choix."},
  {t:"Procédé",s:"Le Chœur qui explique la tragédie au milieu de la tragédie est un exemple de :",o:["Quiproquo","Mise en abyme","Hyperbole","Monologue intérieur"],a:1,e:"L'œuvre parle d'elle-même et de son genre : procédé de distanciation."},
  {t:"Contraste",s:"Quel effet produit le face-à-face entre Antigone silencieuse et les gardes grossiers ?",o:["Il rend Antigone ridicule","Il souligne la dignité d'Antigone et la bassesse de ses geôliers","Il montre que les gardes sont méchants par nature","Aucun effet"],a:1,e:"Le contraste des niveaux de langue et des attitudes grandit l'héroïne."},
  {t:"Question ouverte",s:"Expliquez pourquoi, selon le Chœur, la tragédie est « propre » et « reposante ». (3 phrases)",open:true,m:"Dans la tragédie, l'issue est connue et inévitable : il n'y a plus d'espoir, donc plus d'agitation inutile pour s'en sortir. Personne n'est vraiment coupable : chacun joue son rôle, ce qui la rend « propre », sans traîtres ni méchants. Elle est « reposante » parce que le spectateur et les personnages n'ont plus qu'à laisser la machine se dérouler et à dire enfin ce qu'ils n'avaient jamais dit."},
  {t:"Réaction personnelle",s:"Préférez-vous les histoires où l'on peut encore s'en sortir (le drame) ou celles où tout est joué d'avance (la tragédie) ? 3 lignes.",open:true,m:"Position + arguments + exemple. Ex. : Je préfère le drame : l'espoir rend l'histoire vivante et permet de s'identifier. Pourtant, la tragédie fascine par la grandeur de ceux qui vont jusqu'au bout en sachant tout, comme Antigone. Elle apprend quelque chose sur la liberté dans la contrainte."}
 ]
});

addChap('antigone',{
 titre:"Créon et Antigone (1) : sauver la petite",
 sous:"Étouffer l'affaire · « pour qui ? » · le devoir envers un frère · la vérité sur Polynice et Étéocle",
 tip:"Premier temps du grand affrontement : Créon ne veut pas la mort d'Antigone ; il argumente, menace, puis révèle.",
 episodes:[
  {t:"Créon veut étouffer l'affaire",
   p:"Resté seul avec Antigone (les gardes renvoyés), <b>Créon</b> ne la condamne pas : il veut <b>sauver</b> la petite. Il propose de faire disparaître les trois gardes et d'<b>oublier</b> : qu'elle rentre, qu'elle se taise, qu'elle épouse Hémon. Antigone refuse : elle <b>recommencera</b>. Créon s'emporte : ne comprend-elle pas qu'il risque sa peau et celle de Thèbes ?",
   k:"<strong>Créon</strong> n'est pas le tyran de Sophocle : il offre la <b>vie</b>, la <b>complicité</b> du silence. Antigone refuse d'être <b>sauvée</b>."},
  {t:"« Pour qui ? » — le sens de l'acte",
   svg:'<svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="170" fill="#fbf0dc"/><rect x="0" y="135" width="360" height="35" fill="#e8d4b0"/><g transform="translate(60,45)"><rect x="0" y="24" width="44" height="84" rx="6" fill="#2b2118"/><circle cx="22" cy="12" r="15" fill="#e3b58a"/><path d="M7 10 Q22 -6 37 10Z" fill="#999"/><path d="M16 18 Q22 15 28 18" stroke="#2b2118" fill="none"/><path d="M42 55 l22 -10" stroke="#e3b58a" stroke-width="6" stroke-linecap="round"/></g><g transform="translate(250,60)"><path d="M0 75 Q0 28 22 28 Q44 28 44 75Z" fill="#b5452c"/><circle cx="22" cy="18" r="12" fill="#e3b58a"/><path d="M10 16 Q22 2 34 16Z" fill="#2b2118"/><path d="M17 23 Q22 21 27 23" stroke="#2b2118" fill="none"/></g><g font-size="10" text-anchor="middle" font-weight="700"><rect x="105" y="30" width="60" height="24" rx="12" fill="#2b2118"/><text x="135" y="46" fill="#fff">Pour qui ?</text><rect x="175" y="70" width="110" height="24" rx="12" fill="#b5452c"/><text x="230" y="86" fill="#fff">Pour personne. Pour moi.</text></g><text x="180" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#2b2118">Le cœur du conflit</text><text x="82" y="160" text-anchor="middle" font-size="9" fill="#2b2118">Créon</text><text x="272" y="160" text-anchor="middle" font-size="9" fill="#b5452c">Antigone</text></svg>',
   cap:"Antigone n'agit ni pour les dieux ni pour la foule, mais pour elle-même",
   p:"Créon l'interroge : croit-elle aux <b>rites</b>, aux prêtres qui bâclent les enterrements ? Non. Agit-elle pour <b>Polynice</b>, ce frère qui la méprisait ? Pas vraiment. <b>Pour qui</b>, alors ? Antigone répond : <b>pour personne, pour elle-même</b>. Elle devait le faire, c'est tout. Créon découvre une révolte <b>sans cause extérieure</b> : l'<b>orgueil</b> d'Œdipe, dit-il.",
   k:"<strong>Modernité :</strong> chez Sophocle, Antigone obéit aux <b>lois divines</b> ; chez Anouilh, elle obéit à <b>elle-même</b>. C'est une tragédie <b>sans dieux</b>."},
  {t:"Le métier de roi",
   p:"Créon explique son <b>métier</b> : quelqu'un devait <b>dire oui</b>, prendre la barre du <b>bateau</b> qui prenait l'eau, taper dans le tas pour éviter le naufrage. Gouverner, c'est accepter le <b>sale travail</b>, les mains dans le cambouis, sans se demander si c'est beau. Il n'a pas voulu le pouvoir ; il l'a <b>accepté</b> par devoir.",
   k:"<strong>Métaphore filée du bateau :</strong> l'équipage affolé, le capitaine, la tempête = l'État en crise et le chef. À connaître pour l'examen."},
  {t:"La révélation : deux voyous",
   svg:'<svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="150" fill="#2b2a3a"/><g fill="#4f4f4f"><rect x="60" y="60" width="90" height="60" rx="8"/><rect x="210" y="60" width="90" height="60" rx="8"/></g><g font-size="10" text-anchor="middle" fill="#f3e6c9" font-weight="700"><text x="105" y="90">Étéocle ?</text><text x="255" y="90">Polynice ?</text></g><text x="180" y="95" text-anchor="middle" font-size="18" fill="#d9a441">?</text><text x="180" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#f3e6c9">Deux corps en bouillie, méconnaissables</text><text x="180" y="140" text-anchor="middle" font-size="9" fill="#c9b48e">On a enterré « le moins abîmé » et appelé l’autre Polynice</text></svg>',
   cap:"La vérité d'État : le héros et le traître sont interchangeables",
   p:"Pour briser l'idéal d'Antigone, Créon révèle la <b>vérité</b> : Étéocle et Polynice étaient tous deux des <b>voyous</b> ; chacun avait tenté de <b>tuer</b> leur père Œdipe, chacun avait trahi Thèbes. Les corps étaient tellement <b>abîmés</b> qu'on ne savait plus lequel était lequel : Créon a fait enterrer le <b>moins abîmé</b> avec les honneurs et a laissé l'autre pourrir, pour les besoins de la <b>politique</b>. Antigone, <b>ébranlée</b>, ne sait plus pour qui elle a agi. Elle est prête à <b>remonter</b> dans sa chambre.",
   k:"<strong>Tournant :</strong> pendant un instant, Créon <b>gagne</b>. Le spectateur croit la tragédie évitée ; c'est l'erreur du mot « bonheur » qui va tout relancer (séquence 8)."}
 ],

 analyse:[["Type de texte","Argumentatif : Créon convainc (raison) et persuade (émotion, révélation)"],["Registre","Polémique ; pathétique dans la révélation"],["Figures","Métaphore filée du bateau ; antithèse oui/non ; questions rhétoriques"],["Personnages","Créon humain, habile, paternel ; Antigone ébranlée pour la seule fois"],["Thèmes","Pouvoir, devoir, vérité politique, absurdité du sacrifice"],["Modernité","Antigone sans dieux : révolte pour soi-même"]],
 citations:"Mots-clés : <b>pour personne, pour moi</b>, <b>dire oui</b>, <b>le bateau</b>, <b>sale travail</b>, <b>deux voyous</b>, <b>corps confondus</b>.",
 quiz:[
  {t:"Compréhension",s:"Que propose d'abord Créon à Antigone ?",o:["De l'exiler","D'oublier l'affaire, de se taire et d'épouser Hémon","De la juger publiquement","De devenir reine"],a:1,e:"Créon veut la sauver : faire disparaître les gardes et étouffer le scandale."},
  {t:"Compréhension",s:"Pour qui Antigone dit-elle avoir enterré Polynice ?",o:["Pour les dieux","Pour la foule","Pour personne, pour elle-même","Pour Hémon"],a:2,e:"Révolte sans cause extérieure : fidélité à soi. C'est la grande différence avec Sophocle."},
  {t:"Compréhension",s:"Quelle vérité Créon révèle-t-il sur les deux frères ?",o:["Qu'ils sont vivants","Qu'ils étaient deux voyous et que les corps étaient méconnaissables","Que Polynice était un héros","Qu'il les a tués lui-même"],a:1,e:"Les deux avaient trahi et voulu tuer Œdipe ; on a enterré « le moins abîmé » par calcul politique."},
  {t:"Figure de style",s:"Créon compare l'État à un bateau qui prend l'eau et le roi à celui qui tient la barre. Cette image poursuivie est une :",o:["Comparaison simple","Métaphore filée","Hyperbole","Litote"],a:1,e:"Image développée sur plusieurs phrases : métaphore filée du navire."},
  {t:"Argumentation",s:"Quand Créon révèle la vérité sur les frères, quel est son but ?",o:["Humilier Antigone","Ôter tout sens à son sacrifice pour la faire renoncer","Justifier sa propre cruauté","Faire rire"],a:1,e:"Si Polynice ne valait rien et si on ne sait même pas qui est enterré, l'acte d'Antigone perd son objet."},
  {t:"Personnage",s:"Comment Antigone réagit-elle à la révélation ?",o:["Elle rit","Elle est ébranlée et prête à remonter dans sa chambre","Elle frappe Créon","Elle s'enfuit"],a:1,e:"C'est le seul moment où elle vacille : la tragédie semble pouvoir être évitée."},
  {t:"Comparaison des œuvres",s:"Chez Sophocle, Antigone agit par respect des lois divines ; chez Anouilh :",o:["Par respect des lois de la cité","Par fidélité à elle-même, sans dieux","Par amour pour Hémon","Par haine de Créon"],a:1,e:"La tragédie moderne intériorise la fatalité : plus de dieux, un choix personnel absolu."},
  {t:"Question ouverte",s:"Créon est-il un tyran ? Répondez à partir de cette scène. (3-4 phrases)",open:true,m:"Non : Créon veut sauver Antigone, lui offre le silence et la vie, lui parle avec patience, presque en père. Il n'a pas voulu le pouvoir, il l'a accepté par devoir, comme on prend la barre d'un bateau en tempête. Mais il accepte le mensonge d'État (les corps confondus) et la mort des gardes : son réalisme a un prix moral. Anouilh en fait un homme responsable, pas un monstre."},
  {t:"Réaction personnelle",s:"Créon dit qu'il faut parfois accepter le « sale travail » pour gouverner. Êtes-vous d'accord ? 3 lignes.",open:true,m:"Position + arguments + exemple. Ex. : En partie : diriger impose des décisions impopulaires et des compromis. Mais le « sale travail » ne doit pas inclure le mensonge et l'injustice, sinon l'autorité perd sa légitimité, comme Créon qui finit seul. La fin ne justifie pas tous les moyens."}

addAr('antigone',1,{tip:"أول مشهد حقيقي: حوار حميم يكشف حساسية أنتيغون ويرسّخ السخرية التراجيدية.",ep:[
 {p:"تعود أنتيغون إلى القصر عند الفجر <b>حافية</b>، صندلها في يدها. تفاجئها <b>المربية</b> وتوبخها: من أين تأتي؟ تصف أنتيغون بـ<b>انبهار</b> الحديقة النائمة، العالم ما يزال <b>رمادياً</b> بلا ألوان، كأنه لا يخص أحداً. كانت أول من استيقظ، كطفلة تقترف حماقة.",k:"<b>سجل غنائي:</b> العالم بعين أنتيغون <b>بطاقة بريدية</b>؛ معجم الجمال والنقاء. أما المتفرج فيعرف أنها عائدة من <b>دفن</b> بولينيس: <b>سخرية تراجيدية</b>."},
 {p:"تشك المربية في <b>موعد غرامي</b>. وأنتيغون، كي لا تعترف، تتركها تظن بل وتؤكد أن لها <b>حبيباً</b>. تستنكر المربية: ابنة أوديب، خطيبة هيمون! <b>سوء الفهم</b> مضحك ومؤلم معاً: تكذب أنتيغون لتحمي سرها.",k:"<b>قراءة مزدوجة:</b> تقلق المربية على الشرف؛ ويعرف المتفرج أن الأمر يتعلق بالموت. لكل جملة <b>معنيان</b>."},
 {p:"تطلب أنتيغون من المربية <b>ألا تبكي</b> وألا تصرخ. تقول لها إنها <b>طاهرة</b> وليس لها حبيب غير هيمون. والمربية، الجريحة في حبها، تذكّر بكل ما فعلته للفتاتين: إيقاظهما، غسلهما، مواساتهما. تدللها أنتيغون: إنه مشهد <b>أم وطفلة</b>.",k:"<b>شخصية:</b> تمثل المربية <b>الطفولة</b> و<b>دفء</b> اليومي (القهوة، الخبز بالزبدة) الذي ستغادره أنتيغون."},
 {p:"أنتيغون ليست بطلة من رخام: تحب الحياة والحديقة والحيوانات وحنان مربيتها. ولأنها تحب كل هذا بالذات سيكون <b>تضحيتها</b> تراجيدية. ويمهد المشهد أيضاً لـ<b>المشهد الثاني مع المربية</b> (دوس) ويخلق <b>انتظاراً</b>: ماذا تخفي أنتيغون؟"}
]});

addAr('antigone',2,{tip:"أول جدال أفكار في المسرحية: عقل إسمين مقابل مطلق أنتيغون. مقطع متكرر جداً في الامتحان.",ep:[
 {p:"تلحق <b>إسمين</b> بأنتيغون: لم تنم، لقد <b>فكرت</b>. جاءت لتثني أختها عن دفن بولينيس. تجيب أنتيغون بأنها هي لم تفكر، وأنها لا تريد أن <b>تفهم</b>: الفهم كلمة الكبار، تلك التي تُردَّد للأطفال كي يتخلوا."},
 {p:"تسرد إسمين أسباب <b>الحذر</b>: كريون هو الملك وله <b>السلطة</b>؛ وهو يفكر بصواب أحياناً؛ وهما <b>امرأتان</b> شابتان؛ و<b>الحشد</b> سيصيح عليهما ويجرّهما إلى العذاب؛ وبولينيس مات، وهذا لن يحييه. تصف برعب <b>الموت</b>: الحراس، البصاق، الألم. وتعترف بـ<b>خوفها</b>.",k:"<b>حجاج:</b> تستعمل إسمين حججاً <b>منطقية</b> (السلطة، عدم الجدوى) و<b>عاطفية</b> (الخوف، الألم). تجسد <b>العقل</b> و<b>التسوية</b>."},
 {p:"لا تناقش أنتيغون: <b>ترفض</b>. لا تريد أن تكون على حق ولا أن تكون عاقلة؛ لكل واحدة دورها: لإسمين الجمال والحياة، ولها... شيء آخر. تذكّر بـ<b>الطفولة</b>: حين كانت إسمين الحكيمة وهي المتمردة. تصرف إسمين إلى فراشها وتعدها، كاذبةً، بألا تفعل شيئاً هذا الصباح.",k:"<b>صورة:</b> أنتيغون <b>عنيدة</b>، <b>مطلقة</b>، وفية للطفلة التي كانتها. لا يُحاجَج «لاؤها»: إنها <b>طبيعة</b> لا استدلال."},
 {p:"ما تزال إسمين تظن أنها تستطيع منع الفعل؛ أما المتفرج فيعرف أن أنتيغون <b>أنجزته</b> هذه الليلة. فالمشهد كله جدال حول قرار اتُّخذ: <b>عدم جدوى</b> كلام إسمين يبرز <b>القدر</b>."}
]});

addAr('antigone',3,{tip:"مشهد وداع مقنّع: تسوّي أنتيغون شؤونها دون أن يفهم أحد. سجل مؤثر وسخرية تراجيدية.",ep:[
 {p:"بقيت أنتيغون وحدها مع المربية، فتطلب منها، إن <b>ماتت</b>، أن <b>تكلّم</b> كلبتها <b>دوس</b>، وألا توبخها حين تتسخ، بل وأن <b>تقتلها</b> إن اشتاقت إليها كثيراً. لا تفهم المربية هذه الكلمات الغريبة وتعزوها إلى التعب. أما المتفرج فيرى <b>وصية</b>.",k:"<b>مؤثر:</b> حب حيوان، تفاصيل اليومي؛ <b>سخرية تراجيدية</b>: لا تفهم المربية أن أنتيغون تودّع."},
 {p:"يصل <b>هيمون</b>. تعتذر له أنتيغون عن <b>شجارهما</b> البارحة: كانت قد تجمّلت وتزينت وتعطرت بفستان إسمين، وضحك هو. كانت تريد أن <b>يشتهيها</b> لأنها أرادت أن تصبح <b>زوجته</b> تلك الليلة. تطلب منه أن يضمها بقوة وأن يقول لها إنه يحبها <b>حقاً</b>.",k:"<b>صورة:</b> أنتيغون <b>عاشقة</b> راغبة، بعيدة عن البطلة المتقشفة. فتضحيتها تكلّف أكثر."},
 {p:"تتحدث أنتيغون عن <b>الولد الصغير</b> الذي <b>كانا سيُرزقان</b> به: كانت ستكون أماً حقيقية، قوية، تحميه. واستعمال <b>الشرطي الماضي</b> يقول كل شيء: هذا المستقبل لن يكون. ولا يفهم هيمون، المضطرب، <b>زمن</b> الأسف هذا.",k:"<b>لغة:</b> رصد <b>الشرطي</b> و<b>الماضي</b> في كلامها: بالقواعد تعلن أنتيغون موتها."},
 {p:"تُقسم أنتيغون هيمون أن <b>يخرج بلا كلمة</b> بعد ما ستقوله له. تعلن أنها لن تستطيع <b>الزواج به أبداً</b>، دون تفسير. يطيع هيمون المصدوم ويخرج. وأنتيغون وحدها تهمس بأن الأمر انتهى بالنسبة إلى هيمون.",k:"<b>بنية:</b> <b>تقطع</b> أنتيغون الروابط واحداً تلو الآخر (المربية، إسمين، هيمون): تستعد لـ<b>وحدة</b> البطل التراجيدي."}
]});

 {p:"تعود <b>إسمين</b> قلقة: تتوسل مجدداً إلى أنتيغون ألا تحاول دفن بولينيس، وتصف خوفها. تقاطعها أنتيغون: <b>لقد تم</b>، ذهبت <b>هذه الليلة</b> بـ<b>مجرفة</b> حديدية صغيرة. تنهار إسمين. وتخرج أنتيغون: لم يعد لديها ما تقوله للأحياء.",k:"<b>مفاجأة مسرحية لإسمين</b>، وتأكيد للمتفرج: يتحقق <b>القدر</b>. كان جدال المقطع 3 عبثاً فعلاً."},
 {p:"يدخل <b>كريون</b> مع <b>وصيفه</b>، صبي صامت. كريون رجل يعمل: يتحدث عن هموم الملك وعن التعب. والوصيف هو <b>الكاتم الصامت</b> الذي سيظهر مجدداً في النهاية. أول صورة لكريون: <b>قائد</b> عادي لا طاغية.",k:"<b>شخصية:</b> <b>يؤنسن</b> أنوي كريون منذ دخوله: رجل وحيد مع طفل لا يجيب."},
 {p:"يصل <b>الحارس جوناس</b> مذعوراً. يروي بطريقة <b>مرتبكة</b> ومضحكة أن أحداً <b>غطى بالتراب</b> جثة بولينيس ليلاً رغم مراقبة الحراس الثلاثة. لا أثر سوى أثر <b>طائر</b> أو طفل، و<b>مجرفة</b> صغيرة. يبرر نفسه ويتحدث عن <b>رتبته</b> وسنوات خدمته: <b>يخاف على جلده</b>.",k:"<b>سجل هزلي:</b> لغة مألوفة، هوس بالترقية، جبن. يجسد الحارس <b>الشعب الخاضع</b> اللامبالي بمعنى الأحداث."},
 {p:"يفكر كريون: <b>طفل</b>؟ يحدس فعلاً سياسياً، <b>معارضة</b>. يأمر الحارس بـ<b>كشف</b> الجثة ومضاعفة الحراسة وخصوصاً <b>الصمت</b>: إن انتشر الأمر مات الحراس. يريد خنق الفضيحة كي تستمر <b>آلة</b> الدولة في الدوران.",k:"<b>الموضوع:</b> <b>السلطة</b> تدير المظاهر. كريون ليس قاسياً بل <b>براغماتي</b>: التهديد جزء من المهنة."}
]});

addAr('antigone',5,{tip:"خطبة الجوقة نص مرجعي في الجنس التراجيدي: يجب معرفته عن ظهر قلب تقريباً.",ep:[
 {p:"وحدها على الخشبة، تخاطب <b>الجوقة</b> الجمهور: الآن <b>شُدّ النابض</b>، ولم يبقَ للتراجيديا إلا أن تنفرج. تشبّه التراجيديا بـ<b>آلة</b> يحركها أي شيء: نظرة، رغبة في الشرف، سؤال طُرح ذات مساء. تقابلها بـ<b>الدراما</b>: في الدراما خونة وأشرار و<b>أمل</b>، ويُقاوَم؛ أما في التراجيديا فـ<b>الجميع أبرياء</b>، ولا أمل، إنها <b>نظيفة</b>، <b>مريحة</b>، <b>مضمونة</b>. وأخيراً يمكن <b>الصراخ</b>، وقول ما لم يُقَل أبداً.",k:"<b>مرآة داخلية:</b> المسرحية تعرّف جنسها. <b>مفارقات</b> للحفظ: «مريحة» لأنه لا حيلة؛ «مجانية» لأنها بلا أمل؛ الشخصيات «ملوك» = التراجيديا تشرّف."},
 {p:"يدخل <b>الحراس</b> الثلاثة يجرّون <b>أنتيغون</b>. فاجأوها في <b>وضح النهار</b> عائدة <b>تغطي</b> من جديد الجثة التي كُشفت، تنبش التراب بـ<b>أظافرها</b>. الحراس <b>فظون</b> و<b>سوقيون</b>: يمزحون، يتحدثون عن <b>المكافأة</b> وعن <b>الحفلة</b> التي سيقيمونها. وأنتيغون <b>هادئة</b> تطلب منهم أن يتركوها؛ يخاطبونها بلا احترام ويضحكون.",k:"<b>تضاد:</b> <b>كرامة</b> أنتيغون الصامتة / <b>فظاظة</b> الحراس. عادت أنتيغون: فعلها <b>قرار متكرر</b> لا حادث."},
 {p:"قبل وصول كريون، تكون الجوقة قد حذرته: «الصغيرة» التي غطت الجثة هي <b>أنتيغون</b>. لا يريد كريون أن يصدق أولاً. وحين يدخل ويراها بين الحراس يفهم أن <b>الآلة</b> التي تحدثت عنها الجوقة استولت على أسرته هو."}
]});

/* === antigone/90-ar.js === */
addAr('antigone',6,{tip:"الزمن الأول من المواجهة الكبرى: لا يريد كريون موت أنتيغون؛ يحاجج ويهدد ثم يكشف.",ep:[
 {p:"وحده مع أنتيغون (بعد صرف الحراس)، لا يدينها <b>كريون</b>: يريد <b>إنقاذ</b> الصغيرة. يقترح إخفاء الحراس الثلاثة و<b>النسيان</b>: فلتعد إلى غرفتها، ولتصمت، ولتتزوج هيمون. ترفض أنتيغون: <b>ستعيد الكرّة</b>. يثور كريون: ألا تفهم أنه يخاطر بجلده وبطيبة؟",k:"<b>كريون</b> ليس طاغية سوفوكليس: يعرض <b>الحياة</b> و<b>تواطؤ</b> الصمت. ترفض أنتيغون أن <b>تُنقَذ</b>."},
 {p:"يستجوبها كريون: أتؤمن بـ<b>الطقوس</b>، بالكهنة الذين يسلقون الدفن؟ لا. أتفعل ذلك من أجل <b>بولينيس</b>، هذا الأخ الذي كان يحتقرها؟ ليس تماماً. <b>من أجل من</b> إذن؟ تجيب أنتيغون: <b>من أجل لا أحد، من أجل نفسها</b>. كان عليها أن تفعل، هذا كل شيء. يكتشف كريون تمرداً <b>بلا سبب خارجي</b>: <b>كبرياء</b> أوديب، كما يقول.",k:"<b>حداثة:</b> عند سوفوكليس تطيع أنتيغون <b>القوانين الإلهية</b>؛ عند أنوي تطيع <b>نفسها</b>. إنها تراجيديا <b>بلا آلهة</b>."},
 {p:"يشرح كريون <b>مهنته</b>: كان لا بد من أحد <b>يقول نعم</b>، يمسك دفة <b>السفينة</b> التي تغرق، يضرب في الكومة لتجنب الغرق. الحكم هو قبول <b>العمل القذر</b>، اليدان في الشحم، دون التساؤل إن كان جميلاً. لم يرد السلطة؛ <b>قبلها</b> بدافع الواجب.",k:"<b>استعارة ممتدة للسفينة:</b> الطاقم المذعور، الربان، العاصفة = الدولة في أزمة والقائد. للحفظ من أجل الامتحان."},
 {p:"لكسر مثال أنتيغون، يكشف كريون <b>الحقيقة</b>: كان إتيوكل وبولينيس كلاهما <b>صعلوكين</b>؛ حاول كل منهما <b>قتل</b> أبيهما أوديب، وخان كل منهما طيبة. وكانت الجثتان <b>مشوهتين</b> إلى درجة لم يُعرف معها أيهما أيهما: فأمر كريون بدفن <b>الأقل تشوهاً</b> بالتكريم وترك الآخر يتعفن، لحاجات <b>السياسة</b>. وأنتيغون <b>المهزوزة</b> لم تعد تعرف من أجل من فعلت. وهي مستعدة لـ<b>الصعود</b> إلى غرفتها.",k:"<b>منعطف:</b> للحظة <b>ينتصر</b> كريون. يظن المتفرج أن التراجيديا تفادت؛ وخطأ كلمة «السعادة» هو الذي سيعيد إطلاق كل شيء (المقطع 8)."}
]});

/* === antigone/90-ar.js === */
addAr('antigone',7,{tip:"ذروة المسرحية. خطبة أنتيغون عن السعادة من أكثر المقاطع وروداً في الامتحان الجهوي.",ep:[
 {p:"كانت أنتيغون ستصعد. يحدثها كريون، مرتاحاً، عن <b>الحياة</b> التي تنتظرها: الزواج، الأطفال، <b>الأفراح الصغيرة</b>، <b>السعادة</b>. عند هذه الكلمة <b>تتوقف</b> أنتيغون. أي سعادة؟ ماذا ستكون حياتها؟ لمن ستضطر أن <b>تكذب</b> وأن <b>تبتسم</b> وأن <b>تبيع نفسها</b>؟ الكلمة التي ظنها كريون مهدئة <b>تعيد إطلاق</b> التراجيديا.",k:"<b>سخرية تراجيدية:</b> بمحاولة إنقاذها يخسرها كريون. «نابض» الجوقة: تكفي <b>كلمة</b>."},
 {p:"<b>تبصق</b> أنتيغون على هذه السعادة: لا تريد حياة يُقبَل فيها ويُكتفى ويُشاخ فيها بالكذب. تريد <b>كل شيء، فوراً</b>، وأن يكون <b>كاملاً</b>، وإلا رفضت. تفضل <b>الموت</b> على أن تصبح مثل الكبار الذين تعلموا قول نعم. يحدثها كريون عن <b>كبرياء</b> أوديب: تتبناه.",k:"<b>سجل جدلي وغنائي:</b> جمل تعجبية، تكرار استهلالي، تضادات كامل/صغير، نعم/لا، حياة/موت. إنه <b>عقيدة</b> أنتيغون."},
 {p:"تهاجم أنتيغون: ليس كريون سوى <b>طبّاخ</b> للسلطة؛ يجعلها <b>تخجل</b>. <b>تصرخ</b> كي يسمع القصر كله: هي التي دفنت بولينيس. يكاد كريون المغلوب <b>يضربها</b>، ثم ينادي. لقد <b>اختارت</b> أنتيغون: تنادي هي نفسها <b>الحراس</b>. ينفجر السر الذي أراد كريون حفظه.",k:"<b>انقلاب:</b> أنتيغون هي التي تقود الحدث. وكريون الذي أراد إنقاذها <b>مضطر</b> إلى إدانتها ليبقى ملكاً."},
 {p:"تهرع <b>إسمين</b> شعثاء: تريد أن <b>تموت مع</b> أختها، ستذهب هي أيضاً لدفن بولينيس. <b>تصدّها</b> أنتيغون بقسوة: <b>فات الأوان</b>؛ اختارت إسمين الحياة فلتبقَ فيها. لا تستحق إسمين أن تموت معها. ويأمر كريون المنهك الحراس بـ<b>أخذ</b> أنتيغون.",k:"<b>قسوة أنتيغون:</b> ترفض أن تشارك إسمين مجدها. البطلة التراجيدية <b>وحيدة</b> وتريد ذلك."}
]});

/* === antigone/90-ar.js === */
addAr('antigone',8,{tip:"مشهدا وحدة: الابن أمام الأب، والمحكومة أمام حارس لا مبالٍ.",ep:[
 {p:"تلحّ <b>الجوقة</b> على كريون: إنها <b>مجنونة</b>، إنها طفلة، يجب منعها من الموت، ابتكار شيء ما. يجيب كريون بأنه <b>لم يبقَ ما يُفعل</b>: تريد الموت، وصرخت بذلك أمام الجميع؛ وطيبة كلها تعرف. لم يعد يستطيع إنقاذها دون أن يكفّ عن كونه ملكاً.",k:"<b>قدر:</b> كريون من الآن <b>سجين</b> دوره كما أنتيغون سجينة دورها."},
 {p:"يقتحم <b>هيمون</b> المكان: غير ممكن، لن يدع أبوه أنتيغون تموت. يتوسل، يرتمي في أحضانه، يذكّر بالطفل الذي كانه وبـ<b>الأب العملاق</b> الذي كان يعجب به. يطلب منه كريون أن <b>يصبح رجلاً</b>: أن ينظر إلى أبيه في وجهه ويقبل أنه ليس كلي القدرة. <b>يرفض</b> هيمون درس الكبار هذا، يصرخ أنه لا يريد العيش بلا أنتيغون، ويهرب <b>متبرئاً</b> من أبيه.",k:"<b>الموضوع:</b> العبور إلى <b>سن الرشد</b> = قبول أن الآباء قابلون للخطأ. هيمون، كأنتيغون، <b>يرفض أن يكبر</b> هكذا."},
 {p:"تنتظر أنتيغون الموت يحرسها <b>جوناس</b>. تطرح عليه أسئلة عن موتها؛ يجيب باعتبارات عن <b>الراتب</b> و<b>الرتبة</b> والفرق بين الحارس والرقيب. تطلب منه أنتيغون أن <b>يكتب رسالة</b> لأحدهم مقابل خاتمها. يقبل الحارس ويكتب بعناء.",k:"<b>تضاد مؤثر/هزلي:</b> ضيق أنتيغون المطلق أمام <b>لامبالاة</b> الحارس الثرثارة: <b>وحدة</b> البطلة في ذروتها."},
 {p:"تملي أنتيغون على <b>هيمون</b>: إنها <b>خائفة</b>، لم تعد تعرف لماذا تموت، ربما كان كريون على حق، فظيع أن يموت المرء. ثم <b>تستدرك</b>: اشطب كل هذا، قل فقط إنها تحبه وتطلب منه الصفح. يأتون لأخذها: <b>تذهب</b> منتصبة دون أن تلتفت.",k:"<b>إنسانية البطلة:</b> على عتبة الموت، <b>الشك</b> و<b>الخوف</b>؛ ثم <b>الحياء</b> الذي يمحو. تموت بلا يقين: هذه حداثة أنوي التراجيدية."}
]});

addAr('antigone',9,{tip:"كل ما أعلنه المقدّم يتحقق. الخاتمة تُروى ولا تُعرض: حكاية الرسول.",ep:[
 {p:"يدخل <b>الرسول</b> ويروي لكريون (وللجمهور) ما جرى: <b>سُجنت</b> أنتيغون حية في قبر اللبداكيين. وحين أُعيد فتح القبر بطلب من هيمون كانت قد <b>شنقت</b> نفسها بخيوط <b>حزامها</b>. و<b>هيمون</b>، الجاثي قربها، <b>بصق</b> في وجه أبيه، وسلّ <b>سيفه</b>، ثم <b>طعن</b> نفسه واضطجع إلى جانب أنتيغون في بركة دم.",k:"<b>لياقة تراجيدية:</b> الموتات <b>تُروى</b> ولا تُعرض. <b>حكاية</b> الرسول نص <b>سردي</b> في الماضي مشحون بالمؤثر."},
 {p:"تعلن الجوقة الموت الثالث: <b>أوريديس</b>، الملكة، التي كانت تحيك للفقراء منذ بداية المسرحية، <b>وضعت حياكتها</b> حين علمت بموت ابنها، صعدت إلى غرفتها و<b>قطعت عنقها</b>. تموت بلا كلمة كما عاشت.",k:"<b>شخصية صامتة:</b> لم تتكلم أوريديس قط؛ وموتها <b>الصامت</b> يصدم أكثر. الحياكة غير المكتملة = الحياة المقطوعة."},
 {p:"<b>كريون</b>، الذي فقد للتو ابنه وزوجته، يبقى هادئاً. يقول لـ<b>الوصيف</b> المرافق إن لديه عملاً: <b>مجلس في الخامسة</b>. يتمنى الوصيف أن <b>يكبر بسرعة</b>؛ يجيبه كريون بأنه مجنون، وأنه <b>لا ينبغي أبداً أن يكبر المرء</b>. ثم يخرج ليحكم.",k:"<b>سخرية ختامية:</b> المدافع عن سن الرشد يعترف بأن الكبر مصيبة. يستمر <b>الواجب</b> فارغاً من المعنى: <b>تراجيدية اليومي</b>."},
 {p:"تختم <b>الجوقة</b>: لولا أنتيغون الصغيرة لكانوا جميعاً في سلام؛ والآن <b>انتهى الأمر</b>، مات من كان عليهم أن يموتوا، من آمنوا بشيء ومن آمنوا بعكسه، وحتى من لم يؤمنوا بشيء؛ يبقى كريون وحده سيشرع في <b>انتظار</b> الموت. ويهبط على طيبة <b>سكون</b> حزين كبير. وفي هذه الأثناء يواصل <b>الحراس</b> اللامبالون <b>لعب الورق</b>.",k:"<b>الصورة الأخيرة:</b> ورق الحراس = العالم <b>يستمر</b> غير حساس للتراجيديا. تنتهي المسرحية كما بدأت، بـ<b>المسافة</b>."}
]});

/* === antigone/95-redactions.js === */
addRedac('antigone',[
 {t:"Faut-il toujours obéir aux lois ?",sujet:"Antigone désobéit à l'édit de Créon pour enterrer son frère. Selon vous, un citoyen doit-il toujours obéir aux lois, même lorsqu'il les juge injustes ?",paras:[
  {type:'i',txt:"Dans Antigone de Jean Anouilh, une jeune fille brave l'interdiction du roi et enterre son frère au prix de sa vie. Ce geste pose une question qui traverse toutes les sociétés : doit-on obéir à une loi que l'on juge injuste ? Nous verrons d'abord pourquoi l'obéissance aux lois est nécessaire, puis dans quelles limites la désobéissance peut se justifier."},
  {type:'t',txt:"Tout d'abord, la loi est la condition de la vie en commun. Créon le rappelle avec force : quelqu'un doit « dire oui » et tenir la barre du bateau, sinon la cité sombre dans le désordre. Si chacun décidait de n'obéir qu'aux règles qui lui plaisent, il n'y aurait plus ni sécurité ni justice, mais la loi du plus fort. Par exemple, le code de la route ou les impôts ne sont supportables que parce qu'ils s'imposent à tous. L'obéissance est donc, en temps normal, un devoir civique."},
  {type:'at',txt:"Cependant, une loi peut être injuste, et la conscience a alors le droit de dire non. L'édit de Créon, qui laisse un corps pourrir sans sépulture, viole un sentiment d'humanité plus profond que la raison d'État ; Antigone le refuse non par calcul mais par fidélité à elle-même. L'histoire donne raison à de telles révoltes : la lutte contre l'esclavage, la Résistance contre l'occupant (la pièce fut créée en 1944) ou le combat pour l'égalité ont tous commencé par une désobéissance. En effet, obéir à l'injustice, c'est en devenir complice."},
  {type:'c',txt:"En somme, l'obéissance aux lois est la règle, mais elle n'est pas absolue : face à une loi qui nie la dignité humaine, le refus devient un devoir, à condition d'en accepter les conséquences et de passer, quand c'est possible, par des moyens pacifiques. À mon avis, la grandeur d'Antigone est de dire non sans violence et sans fuir ; sa limite est de refuser tout dialogue. Un citoyen éclairé devrait savoir à la fois respecter la loi et la contester lorsqu'elle le mérite."}
 ],note:"Le sujet classique sur cette œuvre. Citez impérativement la métaphore du bateau (Créon) et le « non » d'Antigone, puis un exemple historique."},
 {t:"La révolte des jeunes contre les adultes",sujet:"Antigone refuse le monde des adultes qui « ont appris à dire oui ». Pensez-vous que la révolte des jeunes contre leurs aînés soit utile ou dangereuse ?",paras:[
  {type:'i',txt:"« Vous me dégoûtez tous avec votre bonheur ! » : par cette révolte, Antigone rejette en bloc le monde des adultes et leurs compromis. À chaque génération, les jeunes contestent les règles de leurs parents, à l'école, dans la famille ou dans la société. Cette révolte est-elle une force ou un danger ? Nous montrerons d'abord sa valeur, puis ses risques."},
  {type:'t',txt:"D'abord, la révolte des jeunes fait avancer le monde. Parce qu'ils n'ont pas encore accepté les renoncements, ils voient l'injustice que les adultes ne remarquent plus : Antigone refuse de « comprendre », c'est-à-dire de se résigner comme Ismène ou Créon. De nos jours, ce sont souvent les jeunes qui mobilisent pour le climat, dénoncent les discriminations ou inventent de nouvelles façons de travailler. Sans cette exigence de pureté, les sociétés s'endormiraient dans l'habitude."},
  {type:'at',txt:"Toutefois, la révolte sans mesure peut détruire. Antigone meurt sans savoir pourquoi, Hémon se tue, et Créon, qui a bien des défauts, n'avait pas tort de rappeler que quelqu'un doit faire tourner la cité. De même, un adolescent qui rejette tout conseil de ses parents se prive de leur expérience et commet des erreurs évitables. L'expérience des aînés n'est pas seulement lâcheté : elle est aussi connaissance des conséquences."},
  {type:'c',txt:"Pour conclure, la révolte des jeunes est utile quand elle questionne, dangereuse quand elle refuse tout dialogue. Personnellement, je crois que la pièce d'Anouilh ne donne raison ni à Antigone ni à Créon, mais montre le prix de leur incompréhension. L'idéal serait un dialogue où les jeunes apportent l'exigence et les adultes la prudence."}
 ]},
 {t:"Qu'est-ce que le bonheur ?",sujet:"Créon propose à Antigone un bonheur simple ; elle le refuse et veut « tout, tout de suite ». Laquelle de ces deux conceptions du bonheur partagez-vous ?",paras:[
  {type:'i',txt:"Au cœur de la pièce d'Anouilh, le mot « bonheur » déclenche la révolte d'Antigone : Créon lui promet une vie modeste et douce, elle exige l'absolu. Chacun de nous, un jour, se demande ce qui rend une vie heureuse. Faut-il viser le bonheur paisible des adultes ou l'intensité rêvée par Antigone ? Nous présenterons d'abord la sagesse de Créon, puis la grandeur du refus d'Antigone, avant de prendre position."},
  {type:'t',txt:"D'une part, le bonheur défendu par Créon a le mérite d'être réel. Il parle des petites joies : un livre, un jardin, un enfant qui joue, la vieillesse apaisée. C'est le bonheur que connaissent la plupart des gens, fait de patience et d'acceptation. Par exemple, un couple qui traverse ensemble les difficultés pendant trente ans n'a rien d'héroïque, mais il a construit quelque chose de solide. Refuser ce bonheur au nom d'un idéal, c'est risquer de n'avoir rien."},
  {type:'at',txt:"D'autre part, Antigone a raison de se méfier d'un bonheur qui coûte trop cher. Elle demande : à qui devrai-je mentir, sourire, me vendre ? Le « petit bonheur » de Créon suppose d'accepter la compromission, le mensonge d'État, le corps de Polynice laissé aux corbeaux. Or un bonheur bâti sur le renoncement à ses valeurs n'en est plus un. En outre, l'exigence d'Antigone, même excessive, rappelle que la vie mérite d'être vécue pleinement et non supportée."},
  {type:'c',txt:"En définitive, je partage l'exigence d'Antigone mais pas sa conclusion : il ne faut pas mourir pour l'absolu, il faut vivre en refusant les renoncements qui abîment. Le bonheur n'est ni la résignation de Créon ni le tout-ou-rien d'Antigone, mais une fidélité à soi-même qui accepte le temps. C'est peut-être ce que la pièce nous laisse chercher, puisqu'elle ne tranche pas."}
 ]},
 {t:"Le pouvoir et ses compromissions",sujet:"Créon affirme qu'il faut accepter le « sale travail » pour gouverner. Pensez-vous que l'exercice du pouvoir oblige nécessairement à renoncer à ses principes ?",paras:[
  {type:'i',txt:"Dans Antigone, Créon se présente non comme un tyran mais comme un homme qui a « retroussé ses manches » pour faire tourner la cité, quitte à mentir et à condamner. Cette image du pouvoir comme « sale travail » revient souvent dans l'actualité politique. Gouverner impose-t-il vraiment de renoncer à ses principes ? Nous verrons d'abord ce que la position de Créon a de réaliste, puis ce qu'elle a d'inacceptable."},
  {type:'t',txt:"Il est vrai que diriger impose des choix impurs. Créon n'a pas voulu le pouvoir : il l'a pris parce qu'il fallait quelqu'un pour « dire oui », et il compare la cité à un bateau en tempête où le capitaine doit frapper pour éviter le naufrage. Un chef d'État qui veut garder les mains propres risque de laisser le désordre s'installer. De nos jours, un ministre doit arbitrer entre des budgets, décevoir une partie de la population, négocier avec des adversaires : gouverner, c'est choisir, et donc renoncer."},
  {type:'at',txt:"Cependant, le réalisme de Créon le conduit à des actes indéfendables. Il fait enterrer « le moins abîmé » des deux frères et le proclame héros ; il menace de tuer les gardes pour étouffer l'affaire ; il condamne sa propre nièce pour ne pas perdre la face. Or un pouvoir qui ment et qui tue perd sa légitimité, et le dénouement le prouve : Créon finit seul, ayant perdu son fils et sa femme. L'histoire confirme que les régimes fondés sur le « sale travail » s'effondrent tôt ou tard. Le pouvoir n'excuse pas tout."},
  {type:'c',txt:"Pour conclure, le pouvoir oblige à des compromis, mais pas à des compromissions : on peut accepter de décevoir sans accepter de mentir ou de tuer. À mon avis, Anouilh montre que Créon a raison sur la nécessité de gouverner et tort sur les moyens. Un vrai chef devrait avoir le réalisme de Créon et l'exigence d'Antigone."}
 ]},
 {t:"Peut-on mourir pour une idée ?",sujet:"Antigone accepte de mourir pour rester fidèle à elle-même, sans même savoir, à la fin, pourquoi elle meurt. Pensez-vous que l'on puisse sacrifier sa vie pour une idée ou un idéal ?",paras:[
  {type:'i',txt:"« Je ne sais plus pourquoi je meurs », avoue Antigone dans sa dernière lettre, avant d'aller pourtant jusqu'au bout. Des martyrs religieux aux résistants, l'histoire est pleine d'hommes et de femmes qui ont donné leur vie pour une cause. Un tel sacrifice est-il admirable ou absurde ? Nous verrons d'abord ce qui peut le justifier, puis ce qui doit nous rendre prudents."},
  {type:'t',txt:"D'abord, certaines causes semblent valoir plus qu'une vie. Les résistants de 1944, année de création de la pièce, ont accepté la mort pour la liberté de leur pays ; sans eux, l'occupation aurait duré. Antigone elle-même, en refusant de courber la tête, affirme que la dignité humaine ne se négocie pas, et son geste inspire Hémon puis le spectateur. En effet, une société où personne n'est prêt à rien risquer pour ses valeurs finit par les perdre toutes."},
  {type:'at',txt:"Néanmoins, la vie est la condition de toutes les autres valeurs, et le sacrifice peut être vain. Antigone meurt pour un frère qui la méprisait, dont on ne sait même pas si c'est lui qui est enterré, et son geste ne change rien à Thèbes : Créon continue de gouverner, les gardes jouent aux cartes. De plus, l'idée de mourir pour une cause est souvent exploitée par des manipulateurs qui envoient les jeunes à la mort à leur place. Il est donc plus difficile, et souvent plus utile, de vivre pour ses idées que de mourir pour elles."},
  {type:'c',txt:"En somme, le sacrifice de la vie peut être admirable lorsqu'il protège réellement les autres, mais il devient absurde lorsqu'il n'est que fidélité à soi-même ou soumission à une manipulation. Personnellement, j'admire le courage d'Antigone sans vouloir l'imiter : je préfère ceux qui, comme elle, refusent l'injustice, mais qui restent vivants pour la combattre."}
 ]},
 {t:"La femme face à l'autorité",sujet:"Antigone, jeune femme seule, tient tête au roi et aux gardes, tandis qu'Ismène se soumet. Que vous inspire la place de la femme face à l'autorité, dans la pièce et aujourd'hui ?",paras:[
  {type:'i',txt:"Dans la pièce d'Anouilh, deux sœurs incarnent deux attitudes face au pouvoir masculin : Ismène rappelle qu'elles ne sont « que des femmes », Antigone affronte le roi sans trembler. Cette opposition fait écho à la situation des femmes dans de nombreuses sociétés, hier comme aujourd'hui. Que nous apprend la pièce sur la place de la femme face à l'autorité ? Nous étudierons d'abord la force d'Antigone, puis ses limites, avant d'élargir à notre époque."},
  {type:'t',txt:"Tout d'abord, Antigone renverse l'image de la femme soumise. Petite, maigre, ignorée de tous, elle est pourtant la seule de la pièce à agir : elle enterre son frère deux fois, refuse le marché de Créon, appelle elle-même les gardes. Face à un roi, à des soldats vulgaires et à une foule, elle ne cède que devant sa propre volonté. Elle prouve que l'autorité morale n'a pas de sexe et annonce toutes les femmes qui, dans l'histoire, ont dit non : des militantes du droit de vote aux femmes qui défendent aujourd'hui leur dignité."},
  {type:'at',txt:"Cependant, la pièce montre aussi le prix de cette révolte et la réalité de la condition féminine. Ismène n'a pas tort de rappeler que la foule « hue les femmes » et que leur révolte est punie plus durement ; Antigone, elle, ne peut s'imposer qu'en mourant, car aucun espace de parole ne lui est reconnu. Par ailleurs, son héroïsme est solitaire : elle repousse sa sœur au lieu de l'entraîner. Or l'émancipation réelle des femmes s'est faite collectivement, par l'école, le travail et les lois, plus que par des sacrifices individuels."},
  {type:'c',txt:"Pour conclure, Antigone est une figure inspirante de la femme qui refuse l'injustice, mais la pièce rappelle qu'une société juste est celle où une femme n'a pas besoin de mourir pour être entendue. À mon sens, le progrès consiste à donner à toutes les Antigone un lieu où parler et à toutes les Ismène le courage de les rejoindre. Le Maroc d'aujourd'hui, avec ses avancées et ses débats, est engagé sur ce chemin."}
 ]}
]);

addAr('bam',1,{tip:"ثاني أكثر الفصول وروداً في الامتحان: الكتّاب القرآني وأول خروج كبير إلى المدينة.",ep:[
 {p:"يتردد الطفل على <b>المسيد</b>، الكتّاب القرآني. يصف القاعة المظلمة، التلاميذ الجالسين على الأرض مع <b>ألواحهم</b>، الترديد الجماعي، وخصوصاً <b>الخوف من الفقيه</b> ومن <b>عصاه</b>. يعود منهكاً ورأسه مملوء بآيات لا يفهمها.",k:"<b>للامتحان:</b> يوصف المسيد بـ<b>حقل معجمي للمعاناة</b> (تعب، خوف، عقاب)؛ في تضاد مع حنان البيت."},
 {p:"<b>الثلاثاء</b> يوم راحة في المسيد. وهو يوم سعادة للطفل: يبقى في البيت، يراقب أمه، يحلم. وهو أيضاً وقت عودة الأب من <b>ورشة النسيج</b> مع متعلمه <b>إدريس الأقرع</b> الذي يقوم بالمشتريات وينقل أخبار الحي."},
 {p:"تزورهم <b>لالة عائشة</b>، الجارة القديمة وصديقة الأم. امرأة بدينة، <b>شريفة</b> مثل لالة زبيدة، ثرثارة وحنون. تتبادل المرأتان الأخبار وتشتكيان من حظهما. تقترح لالة عائشة زيارة ضريح <b>سيدي بوغالب</b> من أجل صحة الطفل.",k:"<b>ملاحظة:</b> لالة عائشة هي شخصية <b>الصداقة النسائية</b>: ستعود في كل محنة (ف4، 7، 9، 10، 11)."},
 {p:"تعبر المرأتان والطفل المدينة إلى ضريح <b>سيدي علي بوغالب</b> المشهور بالشفاء وبـ<b>قططه</b>. وبينما تصلي المرأتان وتبكيان أمام القبر، يريد الطفل مداعبة قط <b>فيخدشه</b>. والطريق مناسبة لـ<b>وصف</b> حي لأزقة فاس ودكاكينها وروائحها."},
 {p:"عند العودة يصاب الطفل بـ<b>الحمى</b>. يبقى أياماً طريح الفراش بين الحلم والواقع؛ تعالجه أمه بالوصفات التقليدية والأدعية. يبعده المرض عن المسيد، وهذا لا يزعجه.",k:"<b>نمط متكرر:</b> يمرض الطفل بعد كل <b>صدمة عاطفية</b> (ف2، ف8). المرض <b>هروب</b> من عالم الكبار."}
]});

addAr('bam',2,{tip:"فصل من الحياة اليومية: الحداثة تدخل الدار، والخوف يجمع الجارات.",ep:[
 {p:"يبقى الطفل، وهو ما يزال ضعيفاً، في البيت ويراقب حياة دار الشوافة: النساء يطبخن ويثرثرن ويتشاجرن لأتفه الأسباب. يستمع ولا يلعب ويحلم. تغمره أمه بعنايتها."},
 {p:"ذات مساء يلاحظ الطفل أن غرفة <b>فاطمة بزيوية</b> مضاءة بـ<b>مصباح الغاز</b>، نور ساطع مقارنة بـ<b>شمعة</b> الأسر الأخرى البائسة. تنتاب <b>لالة زبيدة</b> <b>الغيرة</b> فتشتكي لزوجها: تريد هي أيضاً مصباحاً. وينتهي <b>المعلم عبد السلام</b>، الصبور، بجلب واحد. وفي المساء تتأمل الأسرة كلها النور بإعجاب.",k:"<b>الموضوع:</b> <b>تنافس</b> النساء و<b>دخول الحداثة</b> إلى البيت التقليدي. الأم مضحكة ومحبوبة في آن."},
 {p:"ذات يوم <b>تختفي زينب</b>، ابنة رحمة، في المدينة. تصرخ <b>رحمة</b> وتنتف شعرها؛ وتتعبأ كل الجارات، وفي مقدمتهن لالة زبيدة رغم خصومة الماضي، ويخرجن للبحث عنها. يعثرون عليها أخيراً عند <b>الأدارسة</b> (ضريح مولاي إدريس) وقد آوتها امرأة.",k:"<b>تطور:</b> <b>التضامن</b> يحل محل خصومة الفصل الأول. تعود الدار جماعة واحدة."},
 {p:"شكراً لله على استرجاع ابنتها، تعدّ <b>رحمة</b> <b>وليمة</b> كبيرة وتدعو <b>المتسولين</b> والعميان من الحي. يراقب الطفل هؤلاء الفقراء وأناشيدهم ودعواتهم بفضول ممزوج بالانزعاج. ويظهر <b>الإحسان</b> قيمة مركزية في العالم التقليدي."}
]});

addAr('bam',3,{tip:"فصل الحكايات داخل الحكاية: النساء يروين مصائبهن، والأب يروي العجائب.",ep:[
 {p:"يحل <b>الربيع</b>؛ ويستعيد الطفل بعض المرح. تقرر لالة زبيدة زيارة <b>لالة عائشة</b> التي تسكن داراً متواضعة في زنقة الحجامة. يتأمل الطفل الدار وسكانها ويستمع إلى ثرثرة النساء."},
 {p:"بدموعها، تروي <b>لالة عائشة</b> مصيبة زوجها <b>مولاي العربي</b> صانع البلاغي. شريكه <b>عبد القادر</b>، الذي ساعده وأقرضه المال، <b>خانه</b>: يطالب الآن بنصيبه ويهدد بإفلاسه. اضطرت لالة عائشة إلى <b>بيع حليّها</b> لمساعدة زوجها. وتبكي المرأتان معاً على جحود الرجال.",k:"<b>وظيفة الحكاية:</b> هذه <b>الحكاية المضمّنة</b> تمهّد للمصائب القادمة (إفلاس الأب، ف9). موضوع <b>الجحود</b> و<b>هشاشة</b> صغار الحرفيين."},
 {p:"عند العودة، تروي لالة زبيدة كل شيء لزوجها. يعلّق <b>المعلم عبد السلام</b> بحكمة واستسلام: هكذا هم الرجال، وعلينا التوكل على الله. كلامه الهادئ يتناقض مع اضطراب النساء."},
 {p:"في المساء يذكر الأب <b>عبد الله العطار</b>، تاجر في الحي كان يروي لزبائنه <b>حكايات عجيبة</b> تمزج الحكمة والعبرة والخوارق. كثيرون اتهموه بالكذب، لكن الأب معجب بكلامه. يستمع الطفل مبهوراً: هذه الحكايات تغذّي <b>خياله</b> كما تغذّيه علبته.",k:"<b>للربط:</b> عبد الله = <b>التراث الشفهي</b>؛ العلبة = الخيال؛ الرواية نفسها = حكاية تنقذ من الوحدة."}
]});

addAr('bam',4,{tip:"فصل مفصلي: فرح العيد المعلَن يختلط بأول لقاء للطفل مع الموت.",ep:[
 {p:"في المسيد، يلين <b>الفقيه</b> الصارم عادةً: يعلن للتلاميذ أن <b>عاشوراء</b> تقترب وأنه يجب <b>تنظيف وتزيين</b> الكتّاب. يُوزَّع التلاميذ على فرق ويطلب المعلم من كل واحد مساهمة. يكتشف الطفل فقيهاً يكاد <b>يبتسم</b>.",k:"<b>تضاد:</b> المكان نفسه (المسيد) والشخصية نفسها (الفقيه) ينتقلان من <b>الخوف</b> (ف2) إلى <b>الفرح</b>: العيد يحوّل العالم."},
 {p:"تعلم الدار بوفاة الجار <b>سيدي محمد بن الطاهر</b>، <b>الحجام</b>. تنتحب النساء وينظم الرجال الجنازة. يراقب الطفل <b>النادبات</b> وغسل الجثمان والموكب. لا يفهم كل شيء، لكن <b>الموت</b> يدخل عالمه لأول مرة.",k:"<b>الموضوع:</b> <b>الموت</b> بعين طفل: فضول، عدم فهم، ثم قلق. الراوي البالغ ينقل الانفعال دون شرحه."},
 {p:"في الليلة التالية يرى الطفل <b>كابوساً</b>: رؤى موت ونادبات وظلمات. يستيقظ صارخاً؛ تهدّئه أمه وتدعو. وفي الغد، لطمأنته، تحدثه عن <b>الجنة</b> و<b>الملائكة</b>، وتستأنف الحياة مع أفق العيد.",k:"<b>الأسلوب:</b> <b>الحلم</b> يسمح بالتعبير عن قلق الطفل بـ<b>الصور</b> لا بالشروح: سجل <b>عجائبي</b>."}
]});

addAr('bam',5,{tip:"فصل السعادة: الطفل يُقدَّر في المسيد، وتدلّله أمه، وتهدهده الحكايات.",ep:[
 {p:"ينظف التلاميذ المسيد من أعلاه إلى أسفله: جدران مبيَّضة، أرض مفروكة، مصابيح وزينة. يعيّن الفقيه سيدي محمد <b>رئيس الفاركين</b>: لأول مرة يحصل الطفل الوحيد على <b>دور</b> و<b>سلطة</b>؛ ويستمد منهما <b>فخراً</b> هائلاً.",k:"<b>تطور الشخصية:</b> من الطفل الذي يتحمل (ف2) إلى الطفل الذي <b>يفعل</b> ويأمر. العيد <b>يدمج</b> الوحيد في الجماعة."},
 {p:"تأخذ لالة زبيدة ابنها إلى <b>القيسارية</b>، سوق الأقمشة المسقوف، لتشتري له ثياب العيد. بعد <b>مساومة</b> طويلة تهديه <b>صدرية</b> مطرزة. ينبهر الطفل بالألوان والأقمشة وحركة السوق. والطريق مناسبة لوصف حي لـ<b>تجارة</b> فاس.",k:"<b>للامتحان:</b> مقطع <b>وصفي</b> ذو طابع <b>بصري</b> (ألوان، أقمشة)؛ سجل <b>واقعي</b> و<b>هزلي</b> (المساومة)."},
 {p:"عند العودة يتباهى الطفل بصدريته. تسخر <b>زينب</b> أو تريد لمسها: <b>شجار</b>، صراخ، ضرب؛ تتدخل رحمة ولالة زبيدة. يذكّر الحدث بـ<b>الغيرة</b> الطفولية وبنفور الراوي العنيد من زينب.",k:"<b>صورة:</b> الطفل غير مثالي: <b>مغرور</b>، <b>غيور</b>، وأحياناً قاسٍ. الراوي البالغ يصوّره <b>بوضوح</b>."},
 {p:"في المساء تروي <b>رحمة</b> للنساء حكاية <b>لالة خديجة</b>، الشابة المتزوجة من <b>العم عثمان</b> العجوز، الأرمل الغني البخيل، وخادمته العجوز الغيورة. حكاية مليئة بالفكاهة عن الزيجات غير المتكافئة وحيل النساء. يستمع الطفل مختبئاً بلذة.",k:"<b>الوظيفة:</b> <b>حكاية مضمّنة</b> جديدة (مثل عبد الله، ف4)؛ تنبئ بسخرية بـ<b>الزواج الثاني</b> لمولاي العربي من شابة (ف11)."}
]});

addAr('bam',6,{tip:"ذروة الفرح في الرواية. فصل وصفي جداً: أصوات وألوان وروائح العيد.",ep:[
 {p:"عشية عاشوراء يأخذ الأب الطفل إلى <b>سوق اللعب</b>: في كل مكان <b>طبول</b> ودفوف و<b>أبواق</b>. يشتري له الأب طبلاً وبوقاً. الطفل في قمة السعادة؛ والحي كله يدوّي بضجيج الأطفال.",k:"<b>الأسلوب:</b> وصف ذو طابع <b>سمعي</b> (ضجيج، موسيقى)؛ حقل معجمي لـ<b>الصوت</b> و<b>الفرح</b>."},
 {p:"يأخذ الأب ابنه إلى <b>الحلاق</b> لحلاقة العيد. الطفل، الذي يخشى العملية، يراقب الدكان وزبائنه. وفي المساء تُخرج الأم <b>الثياب الجديدة</b>: صدرية، قميص، بلغة. تستعد الدار كلها، والشوافة تحرق البخور."},
 {p:"صباح عاشوراء يجتمع التلاميذ في <b>المسيد</b> المزيّن بالشموع والأكاليل. <b>الفقيه</b>، بلباس الاحتفال، يقود <b>الأناشيد</b> الدينية. الطفل بصدريته الجديدة ينشد مع الآخرين: يشعر أخيراً بـ<b>الانتماء</b> إلى جماعة. ثم يعود كل واحد ليحتفل مع أسرته."},
 {p:"تتقاسم الأسرة <b>وجبة العيد</b>. وبعد الظهر تصل <b>لالة عائشة</b> بكامل زينتها؛ تتبادل الصديقتان التهاني والأخبار. ويبدو مولاي العربي أحسن حالاً قليلاً. وينتهي اليوم بتعب سعيد؛ ينام الطفل مع طبله.",k:"<b>البنية:</b> هذه <b>ذروة</b> السعادة. ومن الفصل التالي يبدأ <b>السقوط</b> (الأساور، المرض، الإفلاس)."}
]});

addAr('bam',7,{tip:"فصل الانقلاب: فرح العيد ينقلب إلى نذير شؤم.",ep:[
 {p:"بعد العيد تحلم <b>لالة زبيدة</b> بـ<b>أساور</b> ذهبية مثل التي تلبسها النساء الأخريات. يقبل الأب، الذي ربح في تجارته: وذات يوم تتوجه الأسرة كلها إلى <b>سوق الصاغة</b> برفقة المتعلم <b>إدريس الأقرع</b>."},
 {p:"في السوق يعرض <b>دلاّل</b> أساور «شمس وقمر». يشتريها الأب، لكن الدلاّل يستفزه أو يشتمه أو يحاول خداعه. <b>المعلم عبد السلام</b>، الهادئ عادةً، يفقد أعصابه: <b>عراك</b>، صراخ، تجمهر. والطفل المرعوب يرى أباه في صورة لم يعرفها.",k:"<b>صورة:</b> <b>عنف</b> الأب صدمة للطفل وللقارئ: الرجل الوقور يمكن أن يُهان. أول شرخ في العالم المحمي."},
 {p:"عند العودة يكون الجو ثقيلاً. <b>لالة زبيدة</b> مقتنعة بأن هذه الأساور، التي جاءت بالدم والغضب، تجلب <b>الشؤم</b>: لم تعد تريد لبسها. <b>الخرافة</b> تحوّل الحلية المرغوبة إلى شيء ملعون.",k:"<b>رمز:</b> الأساور = رغبة التباهي التي تنقلب <b>لعنة</b>. <b>ستُباع</b> في الفصل 9 لتمويل سفر الأب."},
 {p:"يضطرب الطفل من العراك <b>فيمرض</b>: حمى، هذيان، كوابيس. تسهر عليه أمه وتكثر من الوصفات والأدعية. يدوم المرض أياماً ويغرق الدار في القلق.",k:"<b>نمط:</b> كما في ف2، <b>المرض</b> يعقب الصدمة. جسد الطفل <b>يترجم</b> ما لا يستطيع العقل قوله."}
]});

/* === bam/90-ar.js === */
addAr('bam',8,{tip:"الفصل الأكثر مأساوية: الأسرة تنقلب إلى الفقر والفراق.",ep:[
 {p:"ذات مساء يعود الأب منهاراً: لقد <b>خسر كل رأسماله</b> في صفقة سيئة. لن تستطيع الورشة الاستمرار. تنفجر <b>لالة زبيدة</b> باكية؛ ويفهم الطفل، وهو ما يزال ضعيفاً، أن شيئاً خطيراً وقع. ويصبح جو الدار <b>قاتماً</b>.",k:"<b>الموضوع:</b> <b>هشاشة</b> الحرفيين: لا شيء يحمي أسرة من الإفلاس (قارن مولاي العربي، ف4)."},
 {p:"لمواجهة الوضع، <b>يبيع</b> الأب <b>الأساور</b> المشؤومة وما يملكه القليل. تقبل لالة زبيدة بلا ندم: فقد جلبت الحليّ الشؤم. وسيكفي المال لإطعام الأسرة بعض الوقت."},
 {p:"رفضاً لـ<b>التسول</b> أو <b>الاستدانة</b>، يقرر المعلم عبد السلام السفر للعمل <b>حصّاداً</b> في البوادي حول فاس، ريثما يجمع رأسمالاً صغيراً. وعشية السفر مليئة بالوصايا والدموع. وفي الصباح يرحل وصرّة في يده.",k:"<b>قيمة:</b> <b>الكرامة</b> بالعمل. يرفض الأب مذلة الدَّين: صورة رجل <b>عزيز النفس</b> و<b>مسؤول</b>."},
 {p:"يحل <b>الفراغ</b>. تبكي لالة زبيدة وتدعو وتقتصد. يشعر الطفل بالنقص دون أن يستطيع التعبير عنه؛ ولم تعد علبة العجائب تكفي. وتُظهر الجارات، ورحمة في مقدمتهن، <b>تضامنهن</b>."},
 {p:"تأتي <b>لالة عائشة</b> لمواساة صديقتها. تنصحها باستشارة <b>سي العرافي</b>، <b>عرّاف أعمى</b> ذائع الصيت يستطيع أن يقول إن كان الأب سيعود سالماً. تقبل لالة زبيدة رغم ترددها: وهذا موضوع الفصل التالي.",k:"<b>رابط:</b> أمام المصيبة تلجأ النساء إلى <b>العرافة</b> و<b>الأولياء</b> (ف10). الدين الشعبي = ملاذ."}
]});

addAr('bam',9,{tip:"فصل المعتقدات الشعبية: عرافة وأضرحة وعزاء ديني أثناء غياب الأب.",ep:[
 {p:"تتوجه لالة زبيدة ولالة عائشة والطفل إلى <b>سي العرافي</b>، العرّاف <b>الأعمى</b> الموقّر في الحي. يتكلم الرجل بلطف، يحدس أحزانهن ويبشرهن بأن الأب <b>سيعود</b> سالماً وأن مولاي العربي سيعود إلى رشده. وتعود المرأتان <b>مطمئنتين</b>.",k:"<b>شخصية:</b> سي العرافي ليس دجالاً مضحكاً: يجعله الراوي رمزاً لـ<b>الحكمة</b> و<b>الطيبة</b>. فارق مهم في الامتحان."},
 {p:"تُحلّف لالة زبيدة الطفل ألا يخبر أباه بهذه الزيارة: فالرجال يسخرون من العرافين. والطفل، فخوراً بأنه حارس <b>سرّ</b>، يشعر بأنه كبر. ويقيس القارئ المسافة بين عالم النساء (المعتقدات) وعالم الرجال (الدين الرسمي)."},
 {p:"في الأيام التالية تجرّ الأم الطفل من <b>ضريح إلى ضريح</b>: صلوات، قرابين، شموع، ماء مبارك. يكتشف الطفل الطقوس والمتسولين والنساء الباكيات. يملّ تارة وينبهر تارة. وتبدو المدينة <b>فضاءً مقدساً</b> تحرسه شبكة من الأولياء.",k:"<b>الموضوع:</b> <b>الدين الشعبي</b> جواباً على القلق. يصفه الراوي البالغ بلا سخرية، <b>بمسافة</b>."},
 {p:"ذات يوم يأتي <b>فلاح</b> أرسله المعلم عبد السلام بـ<b>أخبار</b>: الأب بخير، يعمل بجد، ويرسل بعض المال والمؤن. فرح وارتياح: ويبدو أن نبوءة سي العرافي تتحقق."},
 {p:"لتسلية صديقتها، تدعوها <b>لالة عائشة</b> لقضاء يوم عندها. ويفرح الطفل بهذه الخرجة التي سيشغلها الفصل 11."}
]});

addAr('bam',10,{tip:"فصل الحكاية المنقولة: الطفل يستمع إلى النساء يروين زواج مولاي العربي الفاشل.",ep:[
 {p:"تقضي لالة زبيدة والطفل اليوم عند <b>لالة عائشة</b>. يجد الطفل الدار المتواضعة، يراقب الجارات، يملّ ثم يتسلى بالثرثرة. وجبة، شاي، أسرار: الإيقاع البطيء ليوم نسائي."},
 {p:"تصل <b>سلامة</b>، <b>الخطّابة</b> (الوسيطة). هي التي دبّرت <b>الزواج الثاني</b> لـ<b>مولاي العربي</b> من <b>ابنة الحلاق</b>، امرأة شابة. تروي كيف تمت الصفقة ثم كيف <b>تندم</b> عليها: الزوجة الشابة متقلبة ومتطلبة، ومولاي العربي المفلس لا يستطيع إرضاءها.",k:"<b>صدى:</b> حكاية <b>لالة خديجة</b> والعم عثمان العجوز (ف6) تتحقق: الزواج غير المتكافئ ينتهي بالسوء."},
 {p:"تفصّل سلامة <b>الخلافات</b> ولوم أهل الزوجة والديون. يفهم مولاي العربي خطأه ويحنّ إلى <b>لالة عائشة</b> الصبورة المخلصة. وتستمع هذه بوقار، بين <b>الألم</b> و<b>الرضا</b> بأن الوقائع انتقمت لها.",k:"<b>الموضوع:</b> <b>الزواج الثاني</b> ووضع المرأة: لالة عائشة، المطلّقة فعلياً، تحتفظ بكرامتها؛ وتُقدَّم الزوجة الشابة بلا مجاملة."},
 {p:"يفهم الطفل نصف هذه الحكايات. يراقب الوجوه، يحدس حزن لالة عائشة، ويندهش من فصاحة سلامة. وينقل الراوي البالغ <b>سذاجة</b> الطفل و<b>سخرية</b> الموقف معاً."}
]});

/* === bam/90-ar.js === */
addAr('bam',11,{tip:"الخاتمة: يعود الأب ويستعيد النظام، لكن الطفل يبقى الحالم الوحيد كما في البداية. بنية دائرية.",ep:[
 {p:"ذات مساء، ودون سابق إنذار، يعود <b>المعلم عبد السلام</b> إلى دار الشوافة <b>مسمرّ البشرة</b> من شمس الحقول، ومعه بعض المدخرات وهدايا. انفجار <b>فرح</b>: تبكي لالة زبيدة سعادة، يرتمي الطفل في أحضانه، وتأتي الجارات للسلام عليه. وتتحقق نبوءة سي العرافي."},
 {p:"أثناء الوجبة، <b>الطفل</b> هو الذي يروي لأبيه كل ما جرى في غيابه: الزيارات، الجارات، زواج مولاي العربي الثاني ومتاعبه... لكنه يحتفظ بـ<b>سرّ</b> سي العرافي. ولأول مرة يصبح سيدي محمد <b>راوياً</b> داخل الحكاية نفسها.",k:"<b>مرآة داخلية:</b> الطفل الذي يروي لأبيه يبشّر بالبالغ الذي يروي للقارئ. الرواية <b>تتحدث عن ولادتها</b>."},
 {p:"نعلم أن <b>مولاي العربي</b> <b>طلّق</b> أخيراً ابنة الحلاق وعاد إلى <b>لالة عائشة</b> التي قبلته. يعود النظام القديم؛ وتفرح لالة زبيدة لصديقتها. ويعلّق الأب على الأمر بحكمته المعتادة."},
 {p:"بمدخراته ينوي المعلم عبد السلام <b>إعادة فتح ورشته</b>. تستعيد الدار إيقاعها: في المساء تعود الحكايات، ويضيء المصباح، ويبتعد الخوف من الغد."},
 {p:"رغم فرحة العودة، يعود الطفل إلى <b>وحدته</b> و<b>أحلامه</b>. تنتهي الرواية كما بدأت: <b>يفتح</b> سيدي محمد <b>علبة العجائب</b> ويتأمل كنوزه. مرّت المحن، لكن الطفل يبقى حالماً مختلفاً.",k:"<b>بنية دائرية:</b> العلبة تفتتح (ف1) وتختم (ف12) الرواية. الوضع النهائي يشبه الوضع الأولي، لكن الطفل <b>كبر</b> داخلياً."}
]});

/* === bam/95-redactions.js === */
addRedac('bam',[
 {t:"La solitude de l'enfant",sujet:"Certains pensent que les enfants d'aujourd'hui, entourés d'écrans et de réseaux sociaux, sont moins seuls que l'enfant de Sefrioui. D'autres estiment que la solitude de l'enfance n'a pas disparu. Qu'en pensez-vous ?",paras:[
  {type:'i',txt:"Dans La Boîte à merveilles, Sidi Mohammed est un enfant de six ans sans ami, qui se réfugie dans une boîte remplie d'objets sans valeur. De nos jours, les enfants disposent de téléphones, de jeux en ligne et de réseaux sociaux. La question se pose de savoir si ces outils ont vraiment mis fin à la solitude de l'enfance. Nous verrons d'abord en quoi les écrans semblent rapprocher les enfants, puis pourquoi la solitude persiste sous une autre forme."},
  {type:'t',txt:"Tout d'abord, il est vrai que les écrans offrent une compagnie permanente. Un enfant d'aujourd'hui peut jouer en ligne avec des camarades, échanger des messages à toute heure et partager ses passions avec des inconnus du monde entier. Par exemple, un collégien timide trouve souvent sur un forum ou dans un jeu des amis qu'il n'ose pas aborder dans la cour. Ainsi, contrairement à Sidi Mohammed qui n'avait que sa boîte, l'enfant moderne n'est presque jamais physiquement seul face à son ennui."},
  {type:'at',txt:"Cependant, cette compagnie virtuelle n'est pas une véritable présence. Les études montrent que les adolescents les plus connectés se déclarent souvent les plus isolés : les « amis » en ligne ne consolent pas, ne partagent pas un repas, ne tiennent pas la main. De plus, l'écran peut même aggraver l'isolement en remplaçant les jeux collectifs et les visites entre voisins, comme celles qui animaient Dar Chouafa. L'enfant de Sefrioui, au moins, vivait entouré de sa mère, de Lalla Aïcha et de voisines bruyantes mais réelles."},
  {type:'c',txt:"En somme, la solitude de l'enfance n'a pas disparu : elle a changé de forme. Les écrans comblent le vide apparent mais pas le besoin de présence et d'imagination. Personnellement, je pense que ce qui sauve Sidi Mohammed, sa boîte et les contes de son père, reste valable aujourd'hui : un enfant a besoin de rêver et d'être écouté plus que d'être connecté. Ne faudrait-il pas alors apprendre aux enfants à être seuls sans être isolés ?"}
 ],note:"Un paragraphe par partie, un exemple tiré de l'œuvre et un de la vie réelle dans chaque argument, une ouverture sous forme de question : c'est le format qui obtient la note maximale."},
 {t:"La superstition et les voyants",sujet:"Pendant l'absence du père, Lalla Zoubida consulte voyants et marabouts. Pensez-vous que le recours aux voyants puisse aider les gens dans les moments difficiles ?",paras:[
  {type:'i',txt:"Dans La Boîte à merveilles, lorsque le père part travailler loin de Fès, Lalla Zoubida se tourne vers le voyant Si El Arafi et multiplie les visites aux sanctuaires. Aujourd'hui encore, dans nos villes et nos campagnes, beaucoup de personnes consultent des voyants face à la maladie, au chômage ou au chagrin. Peut-on dire que cette pratique les aide réellement ? Nous verrons qu'elle apporte un réconfort certain, avant de montrer ses limites et ses dangers."},
  {type:'t',txt:"D'abord, il faut reconnaître que le voyant rassure. Dans le roman, Si El Arafi est présenté comme un homme doux et bienveillant : il écoute les deux femmes, devine leur peine et leur annonce le retour du père. Elles repartent apaisées, capables d'affronter l'attente. De même, une personne angoissée qui entend des paroles d'espoir retrouve parfois le courage d'agir. En ce sens, le voyant joue le rôle d'un confident que la société traditionnelle n'offrait pas autrement."},
  {type:'at',txt:"Toutefois, ce réconfort repose sur une illusion et peut coûter cher. Le voyant ne sait rien de l'avenir : si le père de Sidi Mohammed revient, c'est grâce à son travail, non à une prédiction. Par ailleurs, de nombreux charlatans exploitent la crédulité des plus pauvres, leur soutirent de l'argent et retardent des soins médicaux nécessaires. Enfin, s'en remettre au destin empêche de chercher de vraies solutions : un conseil d'ami, un médecin, une formation."},
  {type:'c',txt:"Pour conclure, le recours aux voyants console sans résoudre ; il comble un besoin d'écoute que la raison seule ne satisfait pas. À mon avis, il faut comprendre cette pratique sans la condamner brutalement, mais l'éducation et un véritable accompagnement psychologique restent les meilleures réponses à l'angoisse. Le roman de Sefrioui nous invite d'ailleurs à regarder ces croyances avec tendresse et lucidité à la fois."}
 ]},
 {t:"Le bain maure et les traditions",sujet:"Le bain maure, les fêtes, les contes : La Boîte à merveilles est pleine de traditions. Selon vous, faut-il préserver les traditions ou les laisser disparaître avec le temps ?",paras:[
  {type:'i',txt:"Le roman de Sefrioui est un véritable tableau de la vie traditionnelle à Fès : le hammam, la fête de l'Achoura, les veillées de contes, les visites aux saints. À l'heure de la mondialisation, beaucoup de ces pratiques reculent. Faut-il s'en inquiéter et les préserver, ou accepter qu'elles disparaissent ? Nous montrerons d'abord la richesse des traditions, puis la nécessité de les faire évoluer."},
  {type:'t',txt:"En premier lieu, les traditions créent du lien et transmettent des valeurs. Dans le roman, l'Achoura unit toute la maison : le père achète les jouets, la mère choisit les habits, le fqih lui-même se transforme et l'enfant se sent enfin appartenir à un groupe. De même, aujourd'hui, les fêtes religieuses et familiales rassemblent des proches dispersés et apprennent aux jeunes le partage et la générosité. Les contes d'Abdallah l'épicier, eux, transmettent une sagesse et nourrissent l'imagination : perdre ces traditions, c'est perdre une mémoire."},
  {type:'at',txt:"Néanmoins, toutes les traditions ne méritent pas d'être conservées telles quelles. Le bain maure est pour Sidi Mohammed un enfer de vapeur et de cris ; la superstition pousse sa mère à croire que des bracelets portent malheur ; la baguette du fqih fait de l'école un lieu de peur. Certaines coutumes sont donc pénibles, voire nuisibles, et il est normal que les sociétés les abandonnent ou les adoucissent. Une tradition figée devient une prison."},
  {type:'c',txt:"En définitive, il ne s'agit ni de tout garder ni de tout rejeter, mais de distinguer l'esprit de la forme : conserver le partage de l'Achoura sans sa dimension commerciale, la transmission des contes sans la crédulité des voyants. Personnellement, je crois qu'une tradition vivante est une tradition que l'on adapte. C'est peut-être le rôle de notre génération : hériter sans copier."}
 ]},
 {t:"L'école et la sévérité du maître",sujet:"Au Msid, le fqih fait régner la peur avec sa baguette. Pensez-vous qu'un enseignant sévère obtienne de meilleurs résultats qu'un enseignant bienveillant ?",paras:[
  {type:'i',txt:"Sidi Mohammed redoute le Msid : il y récite des versets qu'il ne comprend pas sous la menace de la baguette du fqih. Cette image de l'école autoritaire existe encore dans certains esprits, qui pensent que « sans sévérité, pas de résultats ». Il est fréquent de constater que ce débat divise parents et enseignants. La sévérité est-elle vraiment la clé de la réussite ? Nous verrons ce qu'elle peut apporter, puis pourquoi la bienveillance est plus efficace."},
  {type:'t',txt:"Certes, un cadre strict a des avantages. Un maître exigeant impose le silence, le travail régulier et le respect des règles : les élèves apprennent la discipline et l'effort, qualités utiles toute la vie. Dans le roman, les élèves du Msid finissent par mémoriser le Coran, et le fqih sait aussi organiser la fête de l'Achoura avec méthode. Beaucoup d'adultes reconnaissent d'ailleurs devoir leur rigueur à un professeur redouté."},
  {type:'at',txt:"Cependant, la peur n'est pas l'apprentissage. Sidi Mohammed récite sans comprendre, rentre épuisé et tombe malade : la baguette produit de l'obéissance, pas de l'intelligence. En effet, un enfant angoissé ne retient rien durablement et finit par détester l'école. À l'inverse, lorsque le fqih s'adoucit avant l'Achoura et confie à l'enfant le rôle de chef des frotteurs, celui-ci se montre fier, actif et responsable. Un enseignant bienveillant mais exigeant obtient donc davantage : il donne envie d'apprendre."},
  {type:'c',txt:"En somme, la sévérité impose, la bienveillance construit. L'idéal n'est pas le laxisme mais une autorité sans violence, qui fixe des règles claires tout en respectant l'enfant. À mon sens, le roman de Sefrioui le montre bien : le même maître obtient plus par un sourire la veille de la fête que par des années de coups. L'école de demain devrait s'en souvenir."}
 ]},
 {t:"Les fêtes et la joie collective",sujet:"L'Achoura est le moment le plus heureux du roman. À votre avis, les fêtes gardent-elles aujourd'hui leur sens, ou sont-elles devenues de simples occasions de dépenser ?",paras:[
  {type:'i',txt:"Dans La Boîte à merveilles, la fête de l'Achoura illumine trois chapitres : tambours, habits neufs, chants au Msid, repas en famille. Aujourd'hui, les fêtes religieuses et familiales sont toujours célébrées, mais certains regrettent qu'elles se résument à des achats. Les fêtes ont-elles perdu leur sens ? Nous verrons d'abord ce qu'elles apportent encore, puis les dérives qui les menacent."},
  {type:'t',txt:"D'une part, les fêtes restent un moment irremplaçable de joie et de transmission. Pour Sidi Mohammed, l'Achoura n'est pas d'abord une affaire de jouets : c'est le jour où il chante avec les autres élèves, où son père l'emmène au souk, où sa mère le regarde avec fierté. De même, l'Aïd ou le Mouloud réunissent encore aujourd'hui des familles entières, font découvrir aux enfants les rites et les plats de leurs grands-parents, et créent des souvenirs qui durent toute une vie."},
  {type:'at',txt:"D'autre part, il faut reconnaître que l'aspect commercial prend parfois le dessus. Les publicités, les vêtements de marque et la surenchère des cadeaux transforment la fête en compétition, au point que certaines familles s'endettent pour « faire comme les autres ». Lalla Zoubida elle-même, après la fête, veut des bracelets en or comme ses voisines, et ce désir de paraître conduira la famille à la bagarre et à la ruine. La fête, détournée de son sens, peut ainsi devenir source de malheur."},
  {type:'c',txt:"Pour conclure, les fêtes gardent leur sens tant qu'elles restent centrées sur le partage et non sur la dépense. Personnellement, je pense qu'il appartient à chaque famille de choisir : offrir du temps plutôt que des objets, inviter plutôt qu'acheter. La joie de Sidi Mohammed, un simple tambour à la main, nous rappelle que le bonheur de la fête tient à peu de choses."}
 ]},
 {t:"La pauvreté, la dignité, le travail",sujet:"Ruiné, le père de Sidi Mohammed refuse de s'endetter et part travailler comme moissonneur. Pensez-vous que le travail, même pénible, soit la meilleure réponse à la pauvreté ?",paras:[
  {type:'i',txt:"Lorsque Maâlem Abdeslem perd son capital, il ne mendie pas et n'emprunte pas : il vend ses biens et part moissonner dans les campagnes. Ce choix de la dignité par le travail reste d'actualité dans un pays où beaucoup de familles connaissent la précarité. Le travail, même dur, est-il la meilleure réponse à la pauvreté ? Nous verrons qu'il préserve l'honneur et l'avenir, avant de rappeler qu'il ne suffit pas toujours."},
  {type:'t',txt:"Tout d'abord, le travail protège la dignité. Le père de Sidi Mohammed préfère la fatigue des champs à l'humiliation de la dette, et il revient quelques mois plus tard avec des économies et la tête haute. Il montre à son fils qu'un homme se relève par ses propres forces. De nos jours encore, beaucoup de jeunes diplômés acceptent de petits métiers plutôt que de dépendre de leurs parents, et cette expérience leur apprend la valeur de l'effort. Le travail est ainsi une école de courage autant qu'une source de revenus."},
  {type:'at',txt:"Pourtant, le travail seul ne suffit pas à vaincre la pauvreté. Le départ du père laisse une femme en larmes et un enfant malade : la famille paie cher ce courage. De plus, dans le roman comme aujourd'hui, les petits artisans sont à la merci d'une trahison ou d'une mauvaise affaire, et aucun filet de sécurité ne les protège. Il est vrai que la solidarité des voisines aide Lalla Zoubida, mais c'est la société, par des assurances, des aides et une formation, qui devrait éviter que le malheur ne frappe deux fois."},
  {type:'c',txt:"En définitive, le travail reste la réponse la plus digne à la pauvreté, mais il doit être accompagné par la solidarité et la justice sociale. À mon avis, l'exemple de Maâlem Abdeslem est admirable, et c'est précisément pour cela qu'une société devrait faire en sorte que de tels sacrifices ne soient plus nécessaires."}
 ]},
 {t:"L'amitié",sujet:"Lalla Aïcha est présente à chaque épreuve de Lalla Zoubida. Pensez-vous qu'une véritable amitié se reconnaisse surtout dans le malheur ?",paras:[
  {type:'i',txt:"Dans La Boîte à merveilles, Lalla Aïcha accompagne son amie Lalla Zoubida au sanctuaire, la console lorsque le père s'en va, l'emmène chez le voyant et l'invite chez elle. On dit souvent que « c'est dans le malheur qu'on reconnaît ses vrais amis ». Cette idée est-elle juste ? Nous verrons que l'épreuve révèle en effet l'amitié, puis que l'amitié véritable ne se limite pas à cela."},
  {type:'t',txt:"D'abord, il est certain que le malheur fait le tri. Lorsque tout va bien, les relations sont faciles et nombreuses ; mais quand la ruine, la maladie ou le deuil arrivent, beaucoup s'éloignent. Lalla Aïcha, au contraire, est là précisément quand le père est parti et que la maison est vide : elle écoute, conseille, distrait son amie. De la même façon, dans la vie réelle, l'ami qui vient à l'hôpital ou qui prête de l'argent sans le réclamer prouve plus qu'en mille paroles la sincérité de son attachement."},
  {type:'at',txt:"Cependant, réduire l'amitié au malheur serait injuste. Une amitié véritable se nourrit aussi des joies partagées : Lalla Aïcha vient aussi fêter l'Achoura, bavarder, rire des histoires de Salama. En outre, l'ami fidèle n'est pas toujours de bon conseil : c'est Lalla Aïcha qui pousse Lalla Zoubida vers les voyants, ce qui ne résout rien. Une vraie amitié suppose donc la présence dans l'épreuve, mais aussi la franchise et le partage du bonheur."},
  {type:'c',txt:"En somme, le malheur révèle l'amitié mais ne la définit pas entièrement. Pour moi, un ami véritable est celui qui est présent dans les larmes comme dans les rires, et qui ose dire la vérité. Le lien entre les deux chérifas du roman, avec ses qualités et ses limites, en est une belle illustration."}
 ]},
 {t:"Le remariage de Moulay Larbi",sujet:"Moulay Larbi épouse une seconde femme plus jeune, puis la répudie et revient vers Lalla Aïcha. Que pensez-vous de la décision d'un homme de prendre une seconde épouse ?",paras:[
  {type:'i',txt:"Dans les derniers chapitres de La Boîte à merveilles, Moulay Larbi, ruiné par son associé, épouse la jeune fille du coiffeur grâce à la marieuse Salama, avant de regretter son choix et de revenir vers Lalla Aïcha. Ce sujet délicat du remariage touche encore de nombreuses familles. Comment juger la décision de Moulay Larbi ? Nous exposerons d'abord les raisons qui peuvent la motiver, puis les souffrances qu'elle engendre, avant de donner notre avis."},
  {type:'t',txt:"Il est vrai que, dans la société traditionnelle du roman, un tel remariage était accepté. Moulay Larbi, humilié par sa ruine, cherche peut-être à prouver qu'il est encore un homme respecté ; d'autres invoquent le désir d'enfants ou la solitude. Ces motivations existent et le roman ne caricature pas le personnage : il reste un homme faible et malheureux plutôt qu'un méchant."},
  {type:'at',txt:"Toutefois, le récit montre clairement les dégâts de cette décision. Lalla Aïcha, qui a vendu ses bijoux pour sauver son mari, se retrouve délaissée après des années de dévouement. La jeune épouse, mariée par intérêt, est malheureuse et capricieuse, et le couple sombre dans les disputes et les dettes. Même la marieuse regrette son œuvre. Le conte de Lalla Khadija et du vieil oncle Othman, raconté plus tôt par Rahma, annonçait déjà avec ironie l'échec de ces unions mal assorties. En définitive, personne n'y gagne."},
  {type:'c',txt:"Pour conclure, le remariage de Moulay Larbi apparaît comme une erreur née de l'orgueil et de la faiblesse, réparée tardivement par un retour vers l'épouse fidèle. À mon sens, le roman invite au respect et à l'équité : un engagement se construit à deux, dans la difficulté comme dans l'aisance. La dignité silencieuse de Lalla Aïcha est, de loin, la plus belle leçon de cet épisode."}
 ],note:"Sujet sensible : montrez que vous savez exposer les deux positions avec respect avant de donner un avis mesuré. Le correcteur valorise la nuance, pas la polémique."}
]);

   p:"Le chapitre 6 explique le <b>projet</b> du livre. Écrire, d'abord pour <b>distraire</b> l'angoisse : chaque heure occupée est une heure gagnée sur la peur. Ensuite pour <b>témoigner</b> : ce journal des souffrances d'un condamné, heure par heure, pourrait un jour <b>enseigner</b> ceux qui jugent. Peut-être que cette lecture les rendrait moins prompts à condamner : <b>sauver quelques têtes</b>. Enfin, pour laisser une trace de ce que ressent un homme qui va mourir.",

   k:"<strong>Type de texte :</strong> argumentatif ; <b>questions rhétoriques</b>, raisonnement par l'<b>absurde</b>. Hugo prête sa voix au personnage."},

   cap:"La peine de mort frappe trois innocentes",

  {t:"Procédé",s:"Le narrateur annonce que son journal pourra servir à ceux qui jugent. Ce passage où le livre parle de son propre but est :",o:["Une comparaison","Une mise en abyme","Une ellipse","Un quiproquo"],a:1,e:"Le projet du personnage reflète celui de l'auteur : le roman explique sa propre visée."},
  {t:"Thème",s:"Que représente le pourvoi en cassation pour le condamné ?",o:["Une certitude de salut","Un espoir dérisoire qui prolonge la torture de l'attente","Une humiliation","Une formalité joyeuse"],a:1,e:"Une chance sur mille, six semaines à compter : l'espoir est une souffrance de plus."},
  {t:"Question ouverte",s:"Pourquoi peut-on dire que les chapitres 6 et 7 révèlent la visée du roman ? (3 phrases)",open:true,m:"Au chapitre 6, le narrateur explique qu'il écrit pour témoigner de ce que souffre un condamné et pour éclairer ceux qui jugent : c'est exactement le but de Hugo. Au chapitre 7, il démontre que sa mort ne sert à rien à la société, qui serait aussi bien protégée par la prison. Ces deux chapitres font du roman un plaidoyer contre la peine de mort, porté par la voix du personnage plutôt que par celle de l'auteur."},
  {t:"Réaction personnelle",s:"L'écriture peut-elle aider à supporter une épreuve ? Répondez en 3 lignes.",open:true,m:"Position + arguments + exemple. Ex. : Oui, écrire met des mots sur la peur et redonne un pouvoir sur ce qu'on subit, comme le condamné qui gagne chaque heure sur l'angoisse. Écrire laisse aussi une trace et peut aider d'autres personnes. Mais l'écriture ne remplace pas la présence humaine, dont le condamné est privé."}

  {t:"Les murs couverts d'écritures (ch. 11)",

  {t:"Les noms des suppliciés (ch. 12)",

   k:"<strong>Procédé :</strong> l'<b>énumération</b> de noms réels ancre le roman dans l'<b>histoire</b> (réalisme) et montre la <b>chaîne</b> des exécutions. Le narrateur découvre qu'il appartient désormais à la liste."},
  {t:"La peur monte",

 ],

   k:"<strong>Argument :</strong> la peine ne <b>dissuade</b> pas (son père a été pendu) et la prison <b>forme</b> les criminels. Le friauche = <b>contre-exemple</b> qui démontre l'inutilité de la peine de mort."},
