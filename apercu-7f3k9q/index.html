 episodes:[
  {t:"Imaginer la guillotine (ch. 27-28)",
   svg:'<svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="180" fill="#2a2630"/><rect x="0" y="150" width="360" height="30" fill="#1b181f"/><g fill="#5c4529"><rect x="150" y="30" width="8" height="120"/><rect x="202" y="30" width="8" height="120"/><rect x="146" y="24" width="68" height="8"/><rect x="120" y="140" width="120" height="10"/></g><path d="M158 60 h44 l0 14 l-44 -8Z" fill="#c9cfd6"/><circle cx="180" cy="120" r="12" fill="none" stroke="#8a8494" stroke-width="3"/><g fill="#555" opacity=".6"><rect x="40" y="90" width="20" height="60"/><rect x="70" y="100" width="20" height="50"/><rect x="270" y="95" width="20" height="55"/><rect x="300" y="105" width="20" height="45"/></g><text x="180" y="170" text-anchor="middle" font-size="9" fill="#c9b48e">Il ne l’a jamais vue : il la reconstruit en pensée</text><text x="180" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#f3e6c9">« Qu’est-ce que cela fait, de mourir ? »</text></svg>',
   cap:"Le condamné imagine la machine qu'il n'a jamais regardée",
   p:"Le narrateur se demande <b>comment on meurt</b> sur l'échafaud : souffre-t-on ? Combien de temps la tête vit-elle encore ? Il se rend compte qu'il n'a <b>jamais vu</b> de guillotine : il en a toujours détourné les yeux. Il la <b>reconstruit</b> en imagination d'après les récits : les montants, le couteau, la bascule, la lunette. Chaque détail imaginé est une torture.",
   k:"<strong>Procédé :</strong> description <b>mentale</b> ; questions rhétoriques ; <b>hyperbole</b> de l'angoisse. Hugo fait sentir que la peine commence bien avant le couteau."},
  {t:"Le prêtre, l'architecte, le gendarme (ch. 29-32)",
   p:"Le <b>prêtre</b> revient ; le narrateur refuse encore de se <b>confesser</b>, incapable d'écouter un homme sans chaleur. Puis un <b>architecte</b> entre pour <b>mesurer</b> le cachot en vue de travaux : il parle de murs à abattre comme si le prisonnier n'existait pas. Enfin un <b>gendarme</b>, superstitieux, lui demande de revenir après sa mort lui donner les <b>numéros gagnants</b> de la loterie, en échange de son uniforme pour s'évader… qu'il reprend aussitôt par peur.",
   k:"<strong>Ironie noire :</strong> trois figures de l'<b>indifférence</b> : le fonctionnaire de Dieu, celui des murs, celui de l'ordre. La mort d'un homme n'intéresse personne, sauf pour la <b>loterie</b>."},
  {t:"Les souvenirs : Pepa (ch. 33)",
   svg:'<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="160" fill="#f6e7c8"/><g fill="#7fb069"><ellipse cx="60" cy="110" rx="50" ry="30"/><ellipse cx="300" cy="115" rx="55" ry="32"/><ellipse cx="180" cy="135" rx="120" ry="20"/></g><g fill="#b5452c"><circle cx="40" cy="100" r="4"/><circle cx="80" cy="95" r="4"/><circle cx="290" cy="100" r="4"/><circle cx="320" cy="108" r="4"/></g><circle cx="300" cy="35" r="16" fill="#f3b54a"/><g transform="translate(140,70)"><ellipse cx="14" cy="40" rx="12" ry="18" fill="#1f6f78"/><circle cx="14" cy="14" r="10" fill="#e3b58a"/><path d="M4 12 Q14 0 24 12Z" fill="#2b2118"/></g><g transform="translate(190,70)"><path d="M0 58 Q0 22 16 22 Q32 22 32 58Z" fill="#9c4f7a"/><circle cx="16" cy="14" r="10" fill="#e3b58a"/><path d="M4 16 Q16 -4 28 16 L28 30 Q16 34 4 30Z" fill="#2b2118"/><circle cx="16" cy="14" r="10" fill="#e3b58a"/><path d="M6 12 Q16 0 26 12Z" fill="#2b2118"/></g><rect x="172" y="100" width="18" height="12" fill="#fff8e8" stroke="#8a6d3b"/><text x="180" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#2b2118">Un après-midi d’enfance, un jardin, un livre</text><text x="180" y="155" text-anchor="middle" font-size="9" fill="#7a6a58">Pepa, la petite Andalouse</text></svg>',
   cap:"Le souvenir de Pepa : le seul rayon de soleil du roman",
   p:"Pour fuir, le narrateur s'enfonce dans ses <b>souvenirs</b> : son <b>enfance</b>, le collège, les jeux, et surtout <b>Pepa</b>, la petite Andalouse de quatorze ans, un après-midi dans un jardin, une lecture partagée, la nuque, le premier trouble amoureux. Souvenir d'une <b>douceur</b> absolue, qui rend le présent plus insupportable encore.",
   k:"<strong>Registre lyrique :</strong> nature, lumière, premier amour. <b>Analepse</b> heureuse ; <b>antithèse</b> jardin / cachot. Le condamné a été un <b>enfant</b> : il est un homme, pas un monstre."},
  {t:"Notre-Dame et les cloches (ch. 34-37)",
   p:"Le narrateur se souvient d'une montée dans la <b>tour</b> de Notre-Dame, enfant, et de sa peur du <b>bourdon</b> qui sonnait : il croyait tomber. Aujourd'hui il entend les cloches de Paris marquer les heures. Il songe à l'<b>Hôtel de Ville</b>, à la Grève voisine, à la <b>foule</b> qui déjà se rassemble. Il calcule : il est une heure et quart ; il lui reste moins de trois heures.",
   k:"<strong>Le temps :</strong> les <b>cloches</b> et l'<b>horloge</b> rythment la fin du roman : chaque heure sonnée est un coup de couteau."}
 ],
 chrono:["<b>Ch. 27-28</b> — comment on meurt ; la guillotine imaginée","<b>Ch. 29-30</b> — le prêtre, la confession refusée","<b>Ch. 31</b> — l'architecte mesure le cachot","<b>Ch. 32</b> — le gendarme et les numéros de loterie","<b>Ch. 33</b> — souvenirs d'enfance, Pepa","<b>Ch. 34-37</b> — Notre-Dame, les cloches, l'heure qui avance"],
 analyse:[["Structure","Alternance horreur (guillotine, indifférence) / lumière (souvenirs)"],["Registres","Pathétique, ironique (architecte, gendarme), lyrique (Pepa)"],["Figures","Questions rhétoriques, hyperbole, antithèse jardin/cachot, personnification de la guillotine"],["Analepse","Souvenirs d'enfance insérés dans le présent du cachot"],["Thèmes","Peur physique de la mort, indifférence sociale, enfance, temps"],["Point de vue","Interne : imagination et mémoire remplacent le réel"]],
 citations:"Mots-clés : <b>guillotine imaginée</b>, <b>confession refusée</b>, <b>architecte</b>, <b>numéros de loterie</b>, <b>Pepa</b>, <b>Notre-Dame</b>, <b>cloches</b>, <b>une heure et quart</b>.",
 quiz:[
  {t:"Compréhension",s:"Pourquoi le narrateur doit-il imaginer la guillotine ?",o:["Parce qu'elle est cachée","Parce qu'il ne l'a jamais regardée, en ayant toujours détourné les yeux","Parce qu'il est aveugle","Parce qu'elle n'existe pas encore"],a:1,e:"Comme beaucoup, il a évité le spectacle ; il doit maintenant la reconstruire en pensée, détail par détail."},
  {t:"Compréhension",s:"Que vient faire l'architecte dans le cachot ?",o:["Libérer le prisonnier","Mesurer les murs pour des travaux, sans se soucier du condamné","Dessiner son portrait","Installer la guillotine"],a:1,e:"Il parle de murs à abattre comme si l'homme n'existait pas : ironie de l'indifférence."},
  {t:"Compréhension",s:"Que demande le gendarme au condamné ?",o:["De le pardonner","De revenir après sa mort lui donner les numéros de la loterie","De lui écrire une lettre","D'avouer son crime"],a:1,e:"Superstition grotesque : la mort d'un homme ne vaut que pour un gain possible."},
  {t:"Compréhension",s:"Qui est Pepa ?",o:["Sa fille","Sa femme","Une petite Andalouse, souvenir d'un premier amour d'enfance","Une prisonnière"],a:2,e:"Souvenir lumineux d'un après-midi dans un jardin : le seul rayon de soleil du roman."},
  {t:"Registre",s:"Le souvenir de Pepa (jardin, soleil, lecture partagée) relève du registre :",o:["Polémique","Lyrique","Comique","Tragique"],a:1,e:"Expression des sentiments, nature, nostalgie : registre lyrique, en contraste avec le cachot."},
  {t:"Structure",s:"Le souvenir d'enfance inséré dans le récit du cachot s'appelle :",o:["Une prolepse","Une analepse","Une ellipse","Une digression inutile"],a:1,e:"Retour en arrière qui éclaire le personnage et renforce par contraste l'horreur du présent."},
  {t:"Thème",s:"Que symbolisent les cloches et l'horloge dans ces chapitres ?",o:["La religion consolante","Le temps qui s'écoule inexorablement vers quatre heures","La fête","La liberté"],a:1,e:"Chaque heure sonnée rapproche de l'exécution : le temps devient le bourreau."},
  {t:"Question ouverte",s:"Pourquoi Hugo fait-il alterner l'horreur (guillotine, indifférence) et la lumière (souvenirs) ? (3 phrases)",open:true,m:"L'alternance reproduit le mouvement de l'esprit du condamné, qui fuit l'angoisse dans la mémoire et y est ramené sans cesse. Les souvenirs rendent l'homme attachant : il a été un enfant, il a aimé, il n'est pas un monstre. Par contraste, l'horreur du présent devient insupportable, et le lecteur ressent lui-même l'injustice de la peine."},
  {t:"Réaction personnelle",s:"L'architecte et le gendarme traitent le condamné comme s'il n'existait déjà plus. Avez-vous déjà observé cette indifférence envers des personnes en souffrance ? 3 lignes.",open:true,m:"Témoignage bref + réflexion. Ex. : Oui, dans les hôpitaux ou les administrations, on parle parfois des gens comme de dossiers. Cette froideur blesse autant que l'épreuve elle-même. Hugo nous rappelle qu'un regard humain coûte peu et change tout."}
 ]
});

addChap('ddc',{
 titre:"L'attente et la visite de Marie (ch. 38-47)",
 sous:"Les pensées sur l'au-delà · la grâce espérée · le sommeil · « Monsieur » · le chapitre vide",
 tip:"La visite de Marie (ch. 43) est, avec l'incipit, l'extrait le plus donné à l'examen : le sommet pathétique du roman.",
 episodes:[
  {t:"Pensées sur la mort et l'au-delà (ch. 38-42)",
   p:"Les chapitres se font très <b>courts</b>. Le narrateur pense à ce qu'il y a après : le <b>néant</b> ? un jugement ? Il voudrait croire, n'y parvient pas vraiment. Il espère encore une <b>grâce</b> du <b>roi</b> : il imagine la scène, le cavalier, le papier. Il songe au <b>cimetière</b>, à son corps. Épuisé, il s'<b>endort</b> et fait un rêve confus."},
  {t:"La visite de Marie (ch. 43)",
   svg:'<svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="190" fill="#3b3542"/><rect x="0" y="150" width="360" height="40" fill="#2a2630"/><g transform="translate(90,40)"><rect x="4" y="24" width="44" height="90" rx="6" fill="#d8d2c4"/><circle cx="26" cy="12" r="15" fill="#e3b58a"/><path d="M11 10 Q26 -6 41 10Z" fill="#2b2118"/><path d="M18 18 q8 -6 16 0" stroke="#2b2118" fill="none"/><path d="M46 60 l40 20" stroke="#e3b58a" stroke-width="7" stroke-linecap="round"/></g><g transform="translate(200,95)"><ellipse cx="16" cy="38" rx="13" ry="18" fill="#d9a441"/><circle cx="16" cy="14" r="11" fill="#e3b58a"/><path d="M5 12 Q16 -2 27 12Z" fill="#2b2118"/><circle cx="12" cy="14" r="1.5" fill="#2b2118"/><circle cx="20" cy="14" r="1.5" fill="#2b2118"/><path d="M12 20 Q16 18 20 20" stroke="#2b2118" fill="none" stroke-width="1.2"/></g><g transform="translate(270,50)"><path d="M0 100 Q0 40 24 40 Q48 40 48 100Z" fill="#8a6d3b"/><circle cx="24" cy="30" r="13" fill="#e3b58a"/><path d="M11 28 Q24 14 37 28Z" fill="#555"/></g><g font-size="10" font-weight="700" text-anchor="middle"><rect x="150" y="70" width="90" height="22" rx="11" fill="#fff8e8"/><text x="195" y="85" fill="#b5452c">« Monsieur… »</text></g><text x="116" y="178" text-anchor="middle" font-size="9" fill="#c9b48e">le père</text><text x="216" y="178" text-anchor="middle" font-size="9" fill="#c9b48e">Marie</text><text x="294" y="178" text-anchor="middle" font-size="9" fill="#c9b48e">la bonne</text><text x="180" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#f3e6c9">Elle croit que son papa est mort</text></svg>',
   cap:"Marie ne reconnaît pas son père et l'appelle « monsieur »",
   p:"On amène <b>Marie</b>, trois ans, avec sa <b>bonne</b>. Le narrateur, fou de joie, veut la prendre dans ses bras ; l'enfant a <b>peur</b> de cet homme pâle, barbu, en haillons. Il lui demande si elle le reconnaît : elle répond « <b>monsieur</b> ». Il insiste : où est ton papa ? Elle répond que son <b>papa est mort</b>. Il lui montre ses mains qu'elle embrassait ; elle ne se souvient de rien. Il lui demande de lire un papier qu'elle tient : c'est son <b>arrêt de mort</b>. Il la renvoie, anéanti : il <b>meurt déjà</b> dans la mémoire de sa fille.",
   k:"<strong>Pathétique absolu :</strong> le père est <b>mort</b> avant d'être exécuté. <b>Ironie tragique</b> : l'enfant déchiffre la sentence de son père. Marie = l'innocence frappée."},
  {t:"Le désespoir (ch. 44-46)",
   p:"Après cette visite, il <b>n'a plus rien</b> : la dernière raison de vivre a disparu. Il se dit prêt à mourir. Il entend la <b>foule</b> qui grossit dehors, les cris, les rires, les marchands : on vient voir le spectacle comme à la foire. Il pense à ceux qui <b>loueront des fenêtres</b> pour le voir passer. Il médite sur ce peuple qui se croit meilleur que lui.",
   k:"<strong>Accusation :</strong> la <b>foule</b> est le vrai personnage négatif. Argument : la peine de mort n'<b>édifie</b> pas, elle <b>corrompt</b> le peuple."},
  {t:"Le chapitre 47 : « Mon histoire »",
   svg:'<svg viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="120" fill="#fff8e8"/><text x="180" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2118">XLVII</text><text x="180" y="62" text-anchor="middle" font-size="12" font-style="italic" fill="#2b2118">MON HISTOIRE</text><text x="180" y="95" text-anchor="middle" font-size="9" fill="#7a6a58">(Note de l’éditeur : les feuillets qui se rattachaient à celui-ci n’ont pas été retrouvés.)</text></svg>',
   cap:"Un titre, une note d'éditeur, et rien : le crime restera inconnu",
   p:"Le chapitre 47 porte le titre « <b>Mon histoire</b> » et ne contient qu'une <b>note de l'éditeur</b> : les feuillets n'ont pas été retrouvés. Hugo <b>refuse</b> délibérément de raconter le crime. Ce <b>blanc</b> est un choix : le lecteur ne doit pas pouvoir juger l'homme ; il ne doit voir que la <b>peine</b>.",
   k:"<strong>À l'examen :</strong> expliquer ce chapitre vide = <b>universalité</b> du condamné + <b>focalisation</b> sur le châtiment + fiction du <b>manuscrit trouvé</b> (réalisme)."}
 ],
 chrono:["<b>Ch. 38-42</b> — pensées, espoir de grâce, sommeil","<b>Ch. 43</b> — visite de Marie : « monsieur »","<b>Ch. 44-46</b> — désespoir, la foule dehors","<b>Ch. 47</b> — « Mon histoire » : chapitre vide"],
 analyse:[["Registre","Pathétique (Marie), polémique (la foule), méditatif (l'au-delà)"],["Procédés","Ironie tragique (l'arrêt lu par l'enfant), discours direct enfantin, phrases courtes"],["Rythme","Chapitres de plus en plus brefs : accélération vers quatre heures"],["Thèmes","Paternité, mémoire, innocence, foule-spectacle, mystère du crime"],["Structure","Ch. 47 vide : refus du récit du crime, fiction du manuscrit"],["Point de vue","Interne : la douleur du père exprimée sans analyse"]],
 citations:"Mots-clés : <b>Marie</b>, <b>monsieur</b>, <b>papa est mort</b>, <b>l'arrêt de mort lu par l'enfant</b>, <b>la foule loue des fenêtres</b>, <b>Mon histoire</b>, <b>chapitre vide</b>.",
 quiz:[
  {t:"Compréhension",s:"Comment Marie appelle-t-elle son père lors de la visite ?",o:["Papa","Monsieur","Mon ami","Elle ne parle pas"],a:1,e:"Elle ne le reconnaît pas et croit que son papa est mort : le père est déjà effacé de sa mémoire."},
  {t:"Compréhension",s:"Quel papier Marie tient-elle et lit-elle ?",o:["Une lettre de sa mère","Un dessin","L'arrêt de mort de son père","Une chanson"],a:2,e:"Ironie tragique : l'enfant déchiffre la condamnation de son père sans comprendre."},
  {t:"Compréhension",s:"Que contient le chapitre 47, « Mon histoire » ?",o:["Le récit du crime","Rien : une note d'éditeur disant que les feuillets ont été perdus","La lettre à Marie","La préface"],a:1,e:"Blanc volontaire : Hugo refuse que le lecteur juge le crime ; seule la peine compte."},
  {t:"Compréhension",s:"Qu'entend le narrateur dehors au chapitre 45-46 ?",o:["Le silence","La foule qui se rassemble joyeusement pour l'exécution","Des prières","La pluie seulement"],a:1,e:"Cris, rires, marchands, fenêtres louées : l'exécution est une fête populaire."},
  {t:"Registre",s:"La scène de la visite de Marie est un sommet du registre :",o:["Comique","Pathétique","Épique","Satirique"],a:1,e:"L'enfant qui ne reconnaît pas son père : émotion maximale, argument affectif central."},
  {t:"Procédé",s:"Le fait que Marie lise l'arrêt de mort de son père sans le comprendre relève de :",o:["La comparaison","L'ironie tragique","L'euphémisme","La périphrase"],a:1,e:"Le lecteur et le père savent ce que l'enfant ignore : décalage douloureux."},
  {t:"Argumentation",s:"Pourquoi Hugo laisse-t-il le chapitre 47 vide ?",o:["Par paresse","Pour que le condamné reste universel et que le lecteur juge la peine, non le crime","Parce que le crime est trop horrible","Parce que le manuscrit a vraiment été perdu"],a:1,e:"Choix de composition : l'anonymat et l'absence de crime servent la thèse abolitionniste."},
  {t:"Question ouverte",s:"Pourquoi la visite de Marie est-elle plus cruelle pour le condamné que la mort elle-même ? (3 phrases)",open:true,m:"Il vivait pour sa fille : elle était sa dernière raison d'espérer et le lien avec la vie. Or elle ne le reconnaît pas, l'appelle « monsieur » et croit son père mort : il est donc déjà effacé de sa mémoire, mort une première fois. Qu'elle lise son arrêt de mort sans comprendre achève de lui ôter toute raison de vivre, et il se déclare prêt à mourir."},
  {t:"Réaction personnelle",s:"La foule loue des fenêtres pour assister à l'exécution. Pensez-vous que l'être humain soit attiré par le spectacle de la souffrance ? 3 lignes.",open:true,m:"Position + arguments + exemple actuel. Ex. : Oui, hélas : les accidents filmés et partagés sur les réseaux montrent la même curiosité que la foule de la Grève. Mais cette attirance peut être éduquée : la pitié s'apprend. Hugo veut justement remplacer le spectacle par la réflexion."}
 ]
});

addAr('ddc',1,{tip:"فصول التأمل: يشرح المحكوم مشروع كتابته ويصوغ أولى الحجج ضد عقوبة الإعدام.",ep:[
 {p:"يُسجن المحكوم في <b>بيسيتر</b>، قصر قديم صار سجناً. يصف الزنزانة والقضبان والسجانين الفضوليين أولاً ثم اللامبالين. قدّم <b>طعناً بالنقض</b>: ستة أسابيع انتظار، كما يقول، فرصة من ألف. <b>يحسب</b>: الأيام، مراحل الإجراء، كحساب بقّال على حياته هو.",k:"<b>موضوع الزمن:</b> يصبح المحكوم <b>محاسباً</b> لساعاته؛ الطعن = أمل تافه يطيل العذاب."},
 {p:"يشرح الفصل السادس <b>مشروع</b> الكتاب. الكتابة أولاً لـ<b>تشتيت</b> القلق: كل ساعة مشغولة ساعة مكسوبة على الخوف. ثم لـ<b>الشهادة</b>: يوميات آلام محكوم، ساعة بساعة، قد <b>تعلّم</b> يوماً من يحكمون. وربما تجعلهم هذه القراءة أقل تسرعاً في الإدانة: <b>إنقاذ بعض الرؤوس</b>. وأخيراً لترك أثر لما يشعر به رجل سيموت.",k:"<b>مرآة داخلية:</b> يعلن الراوي <b>غاية</b> رواية هيغو. الكتابة = <b>مقاومة</b> + <b>مرافعة</b>."},
 {p:"يتساءل الراوي عما سيجلبه موته لـ<b>المجتمع</b>. ليس رجلاً خطيراً: مسجوناً لن يؤذي أحداً. تكفي عقوبة <b>الأشغال الشاقة</b> لمعاقبته وجعله نافعاً. يعدّد الحجج المعتادة (العبرة، الردع) و<b>يدحضها</b>: الحشد الذي يأتي لمشاهدة إعدام لا يخرج منه أفضل. هذا أول <b>مقطع حجاجي</b> في الرواية.",k:"<b>نمط النص:</b> حجاجي؛ <b>أسئلة بلاغية</b>، استدلال بـ<b>الخلف</b>. يعير هيغو صوته للشخصية."},
 {p:"يكتب الراوي <b>وصيته</b> المعنوية. يفكر في <b>أمه</b> المسنة التي ستموت كمداً، وفي <b>زوجته</b> المريضة التي لن تنجو، وخصوصاً في ابنته <b>ماري</b>، ثلاث سنوات، التي ستكبر بلا أب، باسم <b>مخزٍ</b>، فقيرة، وربما مسلَّمة للرذيلة. هؤلاء النساء الثلاث ليس لهن غيره؛ بقتله يُقتلن.",k:"<b>حجة عاطفية:</b> عقوبة الإعدام <b>ظالمة</b> لأنها تصيب <b>الأبرياء</b>. ستصبح ماري الخيط المؤثر للرواية (ف26، 43)."}
]});

addAr('ddc',2,{tip:"فصول وصفية: تصبح الزنزانة كتاباً من حجر ترك فيه المحكومون السابقون آثارهم.",ep:[
 {p:"يصف الراوي <b>زنزانته</b>: جدران حجرية نازّة، <b>فراش</b> من قش، كوّة عالية <b>مسيَّجة</b> تمرر مربعاً من السماء، باب سميك. هو <b>وحيد</b>، لكن سجاناً يأتي أحياناً، وأصوات السجن تخترق الجدران. الوصف <b>رصين</b> ودقيق: يريد هيغو <b>الحقيقة</b>.",k:"<b>نمط النص:</b> وصفي ذو طابع <b>بصري</b> و<b>لمسي</b> (برد، رطوبة). حقل معجمي لـ<b>الحبس</b>."},
 {p:"ذات ليلة يتفحص الراوي <b>الجدران</b> على ضوء مصباحه: إنها مغطاة بـ<b>نقوش</b> تركها السجناء السابقون: أسماء، تواريخ، رسوم، شتائم، أدعية، رسوم فاحشة، صورة للمقصلة، قلوب. يقرأ هذه <b>الأصوات</b> لرجال شغلوا الزنزانة نفسها وماتوا.",k:"<b>رمز:</b> الجدار <b>كتاب</b>؛ ينخرط المحكوم في <b>سلسلة</b> من الضحايا. الكتابة على الجدار = البقاء قليلاً."},
 {p:"يتعرف الراوي على <b>أسماء</b>: <b>دوتان</b>، <b>بولان</b>، <b>كاستان</b>، <b>بابافوان</b>، <b>بوريس</b>... محكومون مشهورون في زمنه يتذكر جرائمهم التي نقلتها الصحف. كان، كالحشد، <b>قارئاً</b> فضولياً لهذه القضايا. والآن هو واحد منهم. وفكرة أنهم جميعاً مروا بهذه الزنزانة وبساحة غريف <b>ترعبه</b>؛ يرتمي على قشّه.",k:"<b>أسلوب:</b> <b>تعداد</b> أسماء حقيقية يرسّخ الرواية في <b>التاريخ</b> (واقعية) ويُظهر <b>سلسلة</b> الإعدامات. يكتشف الراوي أنه ينتمي الآن إلى القائمة."},
 {p:"منذ هذه الفصول يتغير طابع القلق: لم يعد مجرداً («محكوم بالإعدام») بل <b>ملموساً</b>: أسماء، تواريخ، مقصلة مرسومة على الجدار. يبدأ الراوي <b>يتخيل</b> موته جسدياً. وسيضخّم الكابوس وتقييد المحكومين بالأشغال الشاقة (المرحلة التالية) هذا الرعب."}
]});

 {p:"ذات صباح يُقاد الراوي إلى غرفة تطل نافذتها على <b>ساحة</b> بيسيتر: إنه يوم <b>تقييد</b> <b>السلسلة</b>، قافلة <b>المحكومين بالأشغال الشاقة</b> المتوجهين إلى سجن <b>طولون</b>. يشهد كل شيء: الحراس، <b>أطواق الحديد</b> المثبتة في الأعناق بضربات المطرقة، الرجال <b>المجرَّدون</b> من ثيابهم قسراً في البرد، الفحص الطبي المهين، السلاسل التي تُربط في صفوف.",k:"<b>نظرة:</b> الراوي <b>متفرج</b> (كالحشد الذي يدينه) و<b>شبيه</b> بالمحكومين في آن. تمنح وجهة النظر الداخلية رؤية <b>جحيم</b>."},
 {p:"يبدأ <b>مطر</b> جليدي يهطل على الرجال شبه العراة. وبدل الشكوى يشرع المحكومون في <b>الغناء</b> بلغة اللصوص، و<b>الرقص</b> بسلاسلهم، و<b>شتم</b> الحراس والفضوليين. فرحهم <b>فظيع</b>: إنه تمرد الملعونين. ينبهر الراوي ويرتعب؛ ويتعرف عليه بعضهم في نافذته <b>فيحيّونه</b> ساخرين: هو إلى المقصلة وهم إلى الأشغال الشاقة.",k:"<b>سجلات:</b> واقعي (تفاصيل فجة)، <b>ملحمي</b> مقلوب (السلسلة كجيش الجحيم)، مؤثر. <b>تضاد</b>: غناء/معاناة، عيد/تعذيب."},
 {p:"حين يعلم المحكومون أنه المحكوم بالإعدام فيهتفون له ويدعونه للانضمام إليهم، <b>يُغمى</b> على الراوي المصدوم. يستيقظ في <b>المستوصف</b>: سرير، نافذة، لحظة رقة خادعة. ظن للحظة أنه في <b>الأشغال الشاقة</b> لا في الموت: حتى السلسلة تبدو له مرغوبة مقارنة بالمشنقة.",k:"<b>فكرة قوية:</b> <b>يحسد</b> المحكوم أصحاب الأشغال الشاقة: السجن ما يزال <b>حياة</b>. حجة ضمنية: عقوبة الإعدام الشر المطلق، أسوأ من كل شيء."}
]});

/* === ddc/90-ar.js === */
addAr('ddc',4,{tip:"أربعة فصول قصيرة يتناوب فيها الأمل واليأس: يبحث المحكوم عن مخرج ولو في الخيال.",ep:[
 {p:"في <b>المستوصف</b> يجد الراوي سريراً ونافذة مفتوحة على الساحة والسماء وأصوات الحياة. ينظر إلى <b>الشمس</b>، يتنفس، ويظن أنه قد <b>يُشفى</b> من كونه محكوماً كما يُشفى من مرض. وهم قصير: يعيده السجان والقضبان إلى حاله.",k:"<b>تضاد:</b> داخل/خارج، زنزانة/سماء. المستوصف <b>استراحة</b> في النزول: الأمل يجعل السقوط أقسى."},
 {p:"من المستوصف يسمع <b>فتاة</b>، سجينة على الأرجح، تغني بـ<b>صوت عذب</b> أغنية بـ<b>لغة اللصوص</b>: قصة لصّ اعتُقل وحوكم و<b>شُنق</b>، تُروى بفجاجة بكلمات قطاع الطرق. والتباين بين نضارة الصوت و<b>بشاعة</b> الكلمات يجمّده: حتى الشباب والغناء ملوثان بـ<b>الموت</b>.",k:"<b>أسلوب:</b> <b>مرآة داخلية</b> (قصة عذاب داخل قصة عذاب)؛ <b>تضاد</b> صوت عذب/كلمات فظيعة؛ <b>لغة اللصوص</b> لغةً لعالم موازٍ."},
 {p:"يحلم الراوي بـ<b>هروب</b>: لو استطاع القفز فوق الجدار، الركض في الحقول، الاختباء، بلوغ الريف، العيش حراً وفقيراً في أي مكان. يبني السيناريو كله بدقة، ثم يعود الواقع: الجدران، الحراس، السلاسل. <b>لا مخرج</b>.",k:"<b>موضوع المخرج المستحيل:</b> لا يوجد الهروب إلا في <b>الخيال</b>، كالذكريات لاحقاً. تُوصف <b>الحرية</b> بصيغة الشرط."},
 {p:"يُعاد إلى <b>الزنزانة</b>. منحت ساعات المستوصف القليلة <b>بروزاً</b> للرعب: يقيس الآن أفضل ما فقده. يستأنف الزمن مسيره؛ وتقترب ساعة القرار."}
]});

/* === ddc/90-ar.js === */
addAr('ddc',5,{tip:"ينقلب الزمن: نهاية الأسابيع الخمسة وبداية اليوم الأخير. يتسارع الإيقاع.",ep:[
 {p:"يدخل <b>مدير</b> بيسيتر <b>مهذباً</b>، يكاد يكون لطيفاً، ويسأل المحكوم إن كان بخير. ثم يعلن: <b>رُفض</b> <b>الطعن</b>، وسيُنفَّذ الإعدام <b>اليوم</b>، في ساحة غريف، في <b>الساعة الرابعة</b>. يروي الراوي ذهوله: تنغلق الأسابيع الخمسة دفعة واحدة. ويعلن له المدير أيضاً <b>نقله</b> إلى الكونسييرجري.",k:"<b>سخرية:</b> <b>تهذيب</b> المدير يجعل الإعلان أبرد: الموت <b>إجراء إداري</b>."},
 {p:"يأتي <b>قسّ</b> لمؤازرته: شيخ طيب لكنه <b>آلي</b>، يردد عزاءات بالية، يتحدث عن الله والغفران دون أن ينظر حقاً إلى الرجل الذي سيموت. كان الراوي يتمنى من <b>يبكي</b> معه ويرتجف؛ فلا يجد إلا <b>موظفاً</b> للموت. لا يكاد يصغي إليه.",k:"<b>نقد:</b> لا يستهدف هيغو الإيمان بل <b>المؤسسة</b>: قسّ رأى محكومين كثراً لم يعد لديه انفعال. يبقى المحكوم <b>وحيداً</b> روحياً."},
 {p:"يُقاد الراوي في <b>عربة سجن</b> مع <b>محضر</b> والقس من بيسيتر إلى <b>الكونسييرجري</b> في قلب باريس. عبر القضبان يرى <b>العالم</b> يستمر: باعة، مارة، أطفال، دكاكين، <b>النهر</b>، نوتردام. يثرثر المحضر عن <b>المطر</b> وعن الحشد الذي سيكون غفيراً؛ ويتمتم القس. والتباين بين <b>حياة</b> المدينة وموته الوشيك لا يُحتمل.",k:"<b>سجل وأسلوب:</b> وصف <b>واقعي</b> لباريس؛ <b>تضاد</b> كبير حياة/موت؛ <b>سخرية</b> كلام المحضر (الطقس المرتقب للإعدام)."}
]});

/* === ddc/90-ar.js === */
addAr('ddc',6,{tip:"الفريوش هو المحكوم الآخر الوحيد الذي يتكلم: قصته مثال مضاد يعزز الأطروحة.",ep:[
 {p:"في قاعة بالكونسييرجري يلتقي الراوي <b>محكوماً بالأشغال الشاقة</b> حُكم عليه بالإعدام لجريمة ارتكبها في السجن: <b>الفريوش</b> (كلمة من لغة اللصوص). رجل سوقي مرح وقح، يتعرف فيه على محكوم ويبدأ الحديث بـ<b>لغة اللصوص</b>. يطلب من الراوي <b>معطفه</b> الذي لن يحتاجه ليبيعه ويشتري تبغاً. يعطيه إياه الراوي."},
 {p:"يروي الفريوش حياته: ابن <b>مشنوق</b>، سرق ليأكل منذ الطفولة، عرف <b>السجن</b> حيث تعلم حرفة السرقة، ثم <b>الأشغال الشاقة</b>؛ وبعد الإفراج بـ<b>جواز أصفر</b> يمنعه من العمل سرق من جديد، فأُعيد اعتقاله، وقتل حارساً. وقصته، المروية بتهكم، هي في الحقيقة <b>لائحة اتهام</b>: المجتمع صنعه.",k:"<b>حجة:</b> لا <b>تردع</b> العقوبة (شُنق أبوه) والسجن <b>يكوّن</b> المجرمين. الفريوش = <b>مثال مضاد</b> يبرهن على عدم جدوى عقوبة الإعدام."},
 {p:"يُقاد الراوي إلى <b>زنزانة</b> أكثر راحة: طاولة، كرسي، أدوات كتابة، دركي عند الباب. يستأنف <b>يومياته</b>، يصف الغرفة، يصغي إلى المدينة. <b>يشعر</b> بالزمن: تدق ساعة الكونسييرجري الساعات التي تقرّبه من الرابعة."},
 {p:"يظن الراوي أنها <b>العاشرة</b>: بقيت له ست ساعات. يكتب إلى <b>ماري</b> <b>رسالة</b> ستقرؤها لاحقاً: يقول لها إنه يحبها، وألا تخجل من أبيها، وأن الناس قتلوه لكنه لم يكن وحشاً. يتخيل الشابة التي ستصبحها و<b>العار</b> الذي سيُحمَّل لها. يبكي على مستقبل طفلته.",k:"<b>المؤثر في ذروته:</b> الرسالة <b>وصية</b>؛ <b>المستقبل</b> (حين تكبرين) يقابل حاضراً بلا غد."}
]});

/* === ddc/90-ar.js === */
addAr('ddc',7,{tip:"يتأرجح المحكوم بين تخيل الموت والهروب إلى ذكريات الطفولة: تتناوب هذه الفصول بين الرعب والنور.",ep:[
 {p:"يتساءل الراوي <b>كيف يُمات</b> على المقصلة: أيتألم المرء؟ كم من الوقت يبقى الرأس حياً؟ يدرك أنه <b>لم يرَ قط</b> مقصلة: كان دائماً يصرف عينيه عنها. <b>يعيد بناءها</b> في خياله من الحكايات: القائمان، السكين، اللوح المتأرجح، الطوق. وكل تفصيل متخيَّل عذاب.",k:"<b>أسلوب:</b> وصف <b>ذهني</b>؛ أسئلة بلاغية؛ <b>مبالغة</b> في القلق. يجعل هيغو يُحَسّ بأن العقوبة تبدأ قبل السكين بكثير."},
 {p:"يعود <b>القس</b>؛ ويرفض الراوي مجدداً <b>الاعتراف</b>، عاجزاً عن الإصغاء إلى رجل بلا دفء. ثم يدخل <b>مهندس معماري</b> لـ<b>قياس</b> الزنزانة تمهيداً لأشغال: يتحدث عن جدران تُهدم كأن السجين غير موجود. وأخيراً <b>دركي</b> خرافي يطلب منه أن يعود بعد موته ليعطيه <b>الأرقام الرابحة</b> في اليانصيب، مقابل بزته ليهرب... ثم يستردها فوراً خوفاً.",k:"<b>سخرية سوداء:</b> ثلاثة وجوه لـ<b>اللامبالاة</b>: موظف الله، موظف الجدران، موظف النظام. لا يهتم أحد بموت رجل إلا من أجل <b>اليانصيب</b>."},
 {p:"هرباً يغوص الراوي في <b>ذكرياته</b>: <b>طفولته</b>، المدرسة، الألعاب، وخصوصاً <b>بيبا</b>، الأندلسية الصغيرة ذات الأربعة عشر عاماً، بعد ظهر في حديقة، قراءة مشتركة، القفا، أول اضطراب عاشق. ذكرى <b>عذوبة</b> مطلقة تجعل الحاضر أكثر فظاعة.",k:"<b>سجل غنائي:</b> طبيعة، نور، حب أول. <b>استرجاع</b> سعيد؛ <b>تضاد</b> حديقة/زنزانة. كان المحكوم <b>طفلاً</b>: إنه إنسان لا وحش."},
 {p:"يتذكر الراوي صعوداً إلى <b>برج</b> نوتردام طفلاً، وخوفه من <b>الجرس الكبير</b> الذي كان يدق: ظن أنه يسقط. اليوم يسمع أجراس باريس تعلن الساعات. يفكر في <b>دار البلدية</b>، في ساحة غريف المجاورة، في <b>الحشد</b> الذي بدأ يتجمع. يحسب: الساعة الواحدة والربع؛ بقي له أقل من ثلاث ساعات.",k:"<b>الزمن:</b> <b>الأجراس</b> و<b>الساعة</b> تضبط إيقاع نهاية الرواية: كل ساعة تدق طعنة سكين."}
]});

/* === ddc/90-ar.js === */
addAr('ddc',8,{tip:"زيارة ماري (ف43)، مع الاستهلال، أكثر المقاطع وروداً في الامتحان: ذروة المؤثر في الرواية.",ep:[
 {p:"تصبح الفصول <b>قصيرة</b> جداً. يفكر الراوي فيما بعد الموت: <b>العدم</b>؟ حساب؟ يود أن يؤمن ولا يفلح حقاً. ما يزال يأمل <b>عفواً</b> من <b>الملك</b>: يتخيل المشهد، الفارس، الورقة. يفكر في <b>المقبرة</b>، في جسده. منهكاً <b>ينام</b> ويرى حلماً مشوشاً."},
 {p:"يُؤتى بـ<b>ماري</b>، ثلاث سنوات، مع <b>مربيتها</b>. يريد الراوي، مجنوناً بالفرح، أن يأخذها بين ذراعيه؛ <b>تخاف</b> الطفلة من هذا الرجل الشاحب الملتحي ذي الأسمال. يسألها إن كانت تعرفه: تجيب «<b>سيدي</b>». يلحّ: أين أبوك؟ تجيب أن <b>أباها مات</b>. يريها يديه اللتين كانت تقبّلهما؛ لا تتذكر شيئاً. يطلب منها قراءة ورقة تمسكها: إنها <b>حكم إعدامه</b>. يصرفها منهاراً: <b>يموت منذ الآن</b> في ذاكرة ابنته.",k:"<b>مؤثر مطلق:</b> الأب <b>ميت</b> قبل إعدامه. <b>سخرية تراجيدية</b>: الطفلة تفك حروف حكم أبيها. ماري = البراءة المصابة."},
 {p:"بعد هذه الزيارة <b>لم يبقَ له شيء</b>: اختفى آخر سبب للحياة. يقول إنه مستعد للموت. يسمع <b>الحشد</b> يتكاثر في الخارج، الصرخات، الضحكات، الباعة: يأتون لمشاهدة الفرجة كما في المعرض. يفكر فيمن <b>سيستأجرون نوافذ</b> ليروه يمر. يتأمل في هذا الشعب الذي يحسب نفسه أفضل منه.",k:"<b>اتهام:</b> <b>الحشد</b> هو الشخصية السلبية الحقيقية. حجة: عقوبة الإعدام لا <b>تهذّب</b> بل <b>تفسد</b> الشعب."},
 {p:"يحمل الفصل 47 عنوان «<b>قصتي</b>» ولا يتضمن سوى <b>ملاحظة من الناشر</b>: لم يُعثر على الأوراق. <b>يرفض</b> هيغو عمداً رواية الجريمة. هذا <b>البياض</b> اختيار: يجب ألا يستطيع القارئ الحكم على الرجل؛ عليه ألا يرى سوى <b>العقوبة</b>.",k:"<b>في الامتحان:</b> شرح هذا الفصل الفارغ = <b>كونية</b> المحكوم + <b>التركيز</b> على العقاب + حيلة <b>المخطوط المعثور عليه</b> (واقعية)."}
]});

/* === ddc/90-ar.js === */
addAr('ddc',9,{tip:"الخاتمة: الفصل 48 طويل ودقيق، والفصل 49 بضعة أسطر فقط. تتوقف الرواية على عتبة الموت.",ep:[
 {p:"في قاعة بدار البلدية يقوم <b>الجلاد</b> ومساعدوه بـ<b>تهيئة</b> المحكوم: <b>يقصّون شعره</b>، <b>يمزقون</b> ياقة قميصه، <b>يقيدون يديه</b> خلف ظهره. الحركات دقيقة <b>معتادة</b> تكاد تكون رقيقة. يصف الراوي كل شيء بوضوح هلوسي: الضوء، شاب يدوّن ملاحظات عند النافذة (صحفي)، القس الذي يصلي. يسأل ماذا يفعلون: «تهيئة المحكوم»، يجيب أحدهم.",k:"<b>واقعية ومؤثر:</b> كل تفصيل ملموس (مقص، حبل، ياقة) يجعل الموت <b>جسدياً</b>. <b>الصحفي</b> = المجتمع الذي يستهلك الفرجة."},
 {p:"يُصعَد في <b>عربة</b>. يعبر الطريق باريس حتى <b>ساحة غريف</b>: في كل مكان <b>الحشد</b>، في النوافذ، على الأسطح، على أعمدة الإنارة؛ نساء يضحكن، أطفال، <b>باعة</b>، أناس <b>دفعوا</b> ثمن مكانهم. يسمع صرخات وسخريات وأحياناً شفقة. يلمح <b>الآلة</b> الحمراء بين فانوسين. يصبح الخوف <b>جسدياً</b>: يرتجف، يظن أنه سيموت قبل الوصول.",k:"<b>أطروحة:</b> لا يتهذب الحشد بالفرجة بل <b>يتسلى</b> بها. الإعدام العلني <b>عيد</b> همجي: حجة مركزية في المقدمة."},
 {p:"عند الوصول إلى دار البلدية يطلب أن <b>يكتب</b> بضعة أسطر: آخر حيلة لكسب الوقت. يُترك في غرفة؛ يكتب ما يرى ويسمع ويشعر. ما يزال يأمل بجنون <b>عفواً</b>. في الفصل 49 القصير جداً يسمع الحشد يعوي والخطوات على الدرج: يأتون لأخذه. يصرخ <b>«عفواً! عفواً!»</b>، يريد كسب خمس دقائق، ثم لا يبقى سوى الساعة: <b>«الرابعة.»</b>",k:"<b>الخاتمة:</b> <b>ينقطع</b> النص لحظة يعجز الراوي عن الكتابة. السطر الأخير <b>ساعة</b>: انتصر الزمن. ويُتمّ القارئ المشهد بنفسه."},
 {p:"لا تعرض الرواية الإعدام <b>أبداً</b>: يبقى الموت <b>خارج النص</b>، وهذا يجعله أكثر حضوراً. وآخر صرخة («عفواً!») موجهة إلى الملك بقدر ما هي موجهة إلى <b>القارئ</b> والمجتمع. واليوميات التي بدأت في الفصل 6 للشهادة تتوقف حين تتوقف اليد: شكل الكتاب <b>هو</b> حجته."}
]});

/* === ddc/95-redactions.js === */
addRedac('ddc',[
 {t:"Pour ou contre la peine de mort",sujet:"Victor Hugo a écrit Le Dernier Jour d'un condamné pour combattre la peine de mort. Partagez-vous son point de vue ? Vous développerez votre réponse à l'aide d'arguments et d'exemples.",paras:[
  {type:'i',txt:"En 1829, Victor Hugo publie le journal imaginaire d'un condamné à mort pour faire ressentir au lecteur l'horreur de ce châtiment. Près de deux siècles plus tard, la peine de mort est abolie dans la majorité des pays mais reste appliquée ou inscrite dans la loi ailleurs, et le débat renaît à chaque crime atroce. Faut-il, comme Hugo, condamner la peine capitale ? Nous exposerons d'abord les arguments de ceux qui la défendent, puis ceux de l'abolition, avant de prendre position."},
  {type:'t',txt:"Il est vrai que les partisans de la peine de mort avancent des raisons compréhensibles. D'abord, ils invoquent la justice due aux victimes : face à un meurtre d'enfant ou à un acte terroriste, la société exprime par cette peine sa condamnation absolue. Ensuite, ils y voient une protection : le criminel exécuté ne récidivera jamais. Enfin, beaucoup croient à son effet dissuasif, pensant que la peur de la mort retient la main des assassins."},
  {type:'at',txt:"Cependant, le roman de Hugo réfute un à un ces arguments. La peine de mort est d'abord cruelle : elle inflige pendant des semaines une torture morale que le roman fait vivre heure par heure, et qui touche aussi des innocents, comme la petite Marie qui ne reconnaît plus son père. Elle est ensuite inutile : le friauche, fils d'un pendu, est devenu voleur puis assassin, et la foule qui loue des fenêtres place de Grève n'en sort pas meilleure mais plus cruelle. Elle est enfin irréversible : une erreur judiciaire, et l'histoire en compte beaucoup, ne peut jamais être réparée. De plus, une société qui tue se rabaisse au niveau de celui qu'elle condamne."},
  {type:'c',txt:"En définitive, je partage la position de Hugo : la justice doit protéger la société sans lui ressembler au criminel, par des peines sévères mais réversibles. Le roman nous rappelle qu'un condamné reste un homme, avec une mère, une fille, des souvenirs. La France a aboli la peine de mort en 1981 ; le débat reste ouvert dans le monde, et c'est aux citoyens informés de le trancher."}
 ],note:"Le sujet n° 1 sur cette œuvre. Les quatre adjectifs à placer : cruelle, inutile, injuste, irréversible. Et toujours exposer honnêtement la thèse adverse avant de la réfuter."},
 {t:"La prison rend-elle meilleur ?",sujet:"Le friauche raconte que c'est en prison qu'il a appris à voler. Pensez-vous que la prison corrige les criminels ou qu'elle les rend pires ?",paras:[
  {type:'i',txt:"Dans Le Dernier Jour d'un condamné, le friauche, fils d'un pendu, explique qu'il est entré en prison petit voleur et en est sorti criminel. Cette question de l'effet réel de la prison se pose encore aujourd'hui, alors que les prisons sont surpeuplées et que la récidive reste élevée. La prison rend-elle meilleur ou pire ? Nous verrons d'abord ce qu'elle apporte à la société, puis ses effets destructeurs, avant d'envisager une solution."},
  {type:'t',txt:"D'abord, la prison remplit des fonctions nécessaires. Elle protège la société en écartant les individus dangereux ; elle punit, ce qui répond au besoin de justice des victimes ; et elle peut, en principe, offrir au détenu un temps de réflexion. Le narrateur lui-même, au chapitre 7, demande les travaux forcés à la place de la mort : il reconnaît qu'une peine est légitime et qu'enfermé, il ne nuirait plus à personne. Sans prison, il n'y aurait que la vengeance privée."},
  {type:'at',txt:"Toutefois, le roman montre que la prison telle qu'elle existe fabrique des criminels. Le friauche y a appris le vol, le bagne l'a endurci, et le passeport jaune l'a empêché de trouver du travail à sa sortie : la société l'a repoussé vers le crime. De même, aujourd'hui, un jeune incarcéré pour un petit délit côtoie des délinquants expérimentés, perd son emploi et son logement, et ressort stigmatisé. En effet, enfermer sans éduquer, c'est préparer la récidive."},
  {type:'c',txt:"Pour conclure, la prison n'est ni bonne ni mauvaise en soi : tout dépend de ce qu'on y fait. Personnellement, je pense qu'une prison qui forme, soigne et prépare la réinsertion peut rendre meilleur, tandis qu'une prison-entrepôt rend pire. Le témoignage du friauche, écrit il y a deux siècles, reste un avertissement pour nos politiques pénales."}
 ]},
 {t:"Le spectacle de la violence",sujet:"La foule se presse place de Grève et loue des fenêtres pour voir mourir le condamné. Aujourd'hui, les images de violence circulent sur les réseaux sociaux. Que pensez-vous de cette attirance pour le spectacle de la souffrance ?",paras:[
  {type:'i',txt:"Dans les derniers chapitres du roman, Hugo décrit une foule joyeuse, des marchands, des fenêtres louées à prix d'or : l'exécution est une fête. Deux siècles plus tard, les vidéos d'accidents, de bagarres ou d'attentats se partagent en quelques secondes sur les téléphones. Pourquoi cette attirance pour la souffrance des autres, et faut-il la combattre ? Nous examinerons d'abord les explications de ce phénomène, puis ses dangers."},
  {type:'t',txt:"Il est vrai que cette curiosité a des racines profondes. Voir la mort ou la violence de loin permet de se sentir vivant et protégé ; c'est aussi une façon de conjurer sa propre peur. Le narrateur de Hugo avoue d'ailleurs qu'il lisait lui-même, autrefois, les récits d'exécutions dans les journaux. Par ailleurs, certains défendent la diffusion des images violentes au nom de l'information : montrer la guerre ou la répression peut éveiller les consciences et provoquer des réactions."},
  {type:'at',txt:"Cependant, le spectacle de la souffrance dégrade plus qu'il n'édifie. La foule de la Grève ne tire aucune leçon morale de l'exécution : elle rit, elle insulte, elle s'amuse, et Hugo en fait l'argument principal contre les exécutions publiques. De même, les vidéos virales banalisent la violence, humilient les victimes filmées sans leur accord et poussent certains jeunes à imiter ce qu'ils voient. En effet, à force de regarder souffrir, on cesse de compatir."},
  {type:'c',txt:"En somme, l'attirance pour le spectacle de la souffrance est humaine, mais elle doit être éduquée et non flattée. À mon avis, la réponse n'est pas la censure mais la conscience : refuser de partager, détourner les yeux, penser à la personne derrière l'image. C'est exactement ce que Hugo demande à son lecteur : ne plus regarder le condamné comme un spectacle, mais comme un homme."}
 ]},
 {t:"L'écriture peut-elle sauver ?",sujet:"Le condamné écrit pour « distraire son angoisse » et pour témoigner. Pensez-vous que l'écriture puisse aider à surmonter les épreuves de la vie ?",paras:[
  {type:'i',txt:"« Puisque j'ai le moyen d'écrire, pourquoi ne le ferais-je pas ? » : dès le chapitre 6, le condamné de Hugo fait de l'écriture son unique refuge. Beaucoup de gens, dans la maladie, le deuil ou l'exil, tiennent de même un journal ou écrivent des lettres. L'écriture peut-elle vraiment aider à surmonter les épreuves ? Nous verrons d'abord ce qu'elle apporte à celui qui écrit, puis ses limites."},
  {type:'t',txt:"Tout d'abord, écrire soulage. Le condamné explique que chaque heure passée à écrire est une heure gagnée sur la peur : mettre des mots sur l'angoisse, c'est déjà la tenir à distance. L'écriture permet aussi de rester soi-même face à ce qui déshumanise : dans son cachot, entre les gardes indifférents et le prêtre mécanique, le narrateur reste un esprit qui pense, se souvient de Pepa, raisonne sur la justice. De nos jours, les psychologues recommandent d'ailleurs le journal intime aux personnes en souffrance pour les mêmes raisons."},
  {type:'at',txt:"Cependant, l'écriture ne change pas le réel. Le condamné écrit jusqu'à la dernière minute et meurt quand même ; sa plume ne lui obtient ni grâce ni évasion. En outre, écrire peut aussi enfermer dans la rumination : relire sans cesse sa douleur ne la guérit pas toujours. Il est vrai que l'écriture console, mais elle ne remplace ni la présence d'un proche, ni l'action, ni les soins. Le narrateur aurait donné tous ses cahiers pour que Marie le reconnaisse."},
  {type:'c',txt:"Pour conclure, l'écriture ne sauve pas la vie, mais elle sauve la dignité et laisse une trace qui peut aider les autres. C'est le pari de Hugo : le journal d'un condamné imaginaire a contribué, un siècle et demi plus tard, à l'abolition de la peine de mort. Personnellement, je crois donc que l'écriture est une arme lente mais réelle, pour soi et pour ceux qui viendront après."}
 ]},
 {t:"Peut-on juger un homme sans connaître son histoire ?",sujet:"Hugo ne révèle jamais le crime de son personnage : le chapitre « Mon histoire » reste vide. Selon vous, peut-on juger un homme sans connaître son passé et les raisons de son acte ?",paras:[
  {type:'i',txt:"Le chapitre 47 du roman porte le titre « Mon histoire » et ne contient qu'une note d'éditeur : les feuillets ont été perdus. Par ce vide, Hugo empêche le lecteur de juger le crime pour l'obliger à juger la peine. Ce choix pose une question essentielle : peut-on juger quelqu'un sans connaître son histoire ? Nous verrons d'abord pourquoi l'acte semble suffire au jugement, puis pourquoi la compréhension de l'homme est nécessaire."},
  {type:'t',txt:"D'une part, la justice juge des actes, non des vies. Un meurtre reste un meurtre, quelles que soient l'enfance ou la misère du coupable, et la victime n'en est pas moins morte. Si chaque criminel pouvait invoquer son passé pour échapper à la sanction, personne ne serait plus responsable de rien. Par exemple, le friauche a tué un gardien : son histoire explique son geste, elle ne le rend pas innocent. L'acte est la base indispensable de tout jugement."},
  {type:'at',txt:"D'autre part, juger l'acte sans comprendre l'homme conduit à des erreurs et à des injustices. Le même friauche montre que la société a fabriqué le criminel : fils de pendu, affamé, formé au vol en prison, rejeté par le passeport jaune. Ignorer cela, c'est punir sans jamais prévenir. En gardant le crime dans l'ombre, Hugo nous rappelle aussi que le condamné est d'abord un fils, un mari, un père : la justice qui l'oublie devient une machine. Comprendre n'est pas excuser, c'est juger avec justesse et éviter que le crime ne se répète."},
  {type:'c',txt:"En définitive, il faut juger l'acte et comprendre l'homme : la sanction répond au premier, la prévention et la mesure de la peine au second. À mon sens, le chapitre vide de Hugo est une leçon de justice : avant de condamner, souvenons-nous que nous ne connaissons jamais toute l'histoire."}
 ]},
 {t:"La famille du coupable est-elle coupable ?",sujet:"La mère, la femme et la petite Marie subissent le déshonneur et la misère à cause de la condamnation du narrateur. Pensez-vous que la société traite justement les familles des condamnés ?",paras:[
  {type:'i',txt:"Au chapitre 9, le condamné pense à sa mère qui mourra de chagrin, à sa femme malade et surtout à sa fille Marie, qui grandira pauvre, avec un nom déshonoré. Aujourd'hui encore, les proches d'un détenu subissent regards, exclusion et difficultés matérielles. La société traite-t-elle justement les familles des condamnés ? Nous verrons d'abord pourquoi elles sont souvent tenues pour responsables, puis pourquoi cette attitude est injuste et dangereuse."},
  {type:'t',txt:"Certes, on peut comprendre la méfiance de la société. Les proches ont parfois fermé les yeux, profité du crime ou transmis des valeurs douteuses ; la famille est le premier lieu d'éducation, et un enfant élevé dans la violence risque de la reproduire. Le friauche lui-même, fils d'un pendu, semble confirmer cette crainte. Par ailleurs, les victimes et leurs familles trouvent parfois insupportable que l'entourage du criminel continue à vivre normalement."},
  {type:'at',txt:"Cependant, faire payer la famille, c'est punir des innocents. Marie a trois ans : elle ne sait même plus qui est son père, et elle portera pourtant toute sa vie la honte d'un acte qu'elle n'a pas commis. La mère et l'épouse du narrateur perdront leur seul soutien et sombreront dans la misère. Une telle « double peine » est contraire au principe selon lequel chacun ne répond que de ses propres actes. De plus, elle est dangereuse : un enfant rejeté par la société est précisément celui qui risque de devenir un nouveau friauche. Protéger ces familles, c'est prévenir le crime de demain."},
  {type:'c',txt:"Pour conclure, la société traite souvent injustement les familles des condamnés, par le regard et par l'abandon matériel. À mon avis, la justice devrait s'arrêter à la porte de la cellule : punir le coupable, mais accompagner les siens, par l'école, l'aide sociale et le respect. Les larmes du condamné sur l'avenir de Marie sont peut-être le plus fort des arguments de Hugo."}
 ]}
]);

<script>
/* ===================== MOTEUR ===================== */
var API='https://jihawi-api.synergieinfra.workers.dev',FREE_CH=99;
var S={oeuvre:null,view:'home',chap:null,hist:[],answers:{},exam:null,full:false,lic:null};
var $=function(id){return document.getElementById(id)};
function store(k,v){try{localStorage.setItem('bp_'+k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{var v=localStorage.getItem('bp_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function fmt(n){return (Math.round(n*10)/10).toString().replace('.',',');}
function esc(s){return String(s).replace(/</g,'&lt;');}
function cur(){return BAM.oeuvres[S.oeuvre];}

function setTitle(t,s){$('title').childNodes[0].nodeValue=t;$('sub').textContent=s||'';}
function go(view,opt,noHist){
  if(!noHist)S.hist.push({view:S.view,chap:S.chap});
  S.view=view;if(opt&&opt.chap!==undefined)S.chap=opt.chap;
  render();window.scrollTo(0,0);
}
function goBack(){var h=S.hist.pop();if(!h)return go('home',null,true);S.view=h.view;S.chap=h.chap;render();window.scrollTo(0,0);}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){
  if(b.dataset.v!=='home'&&!S.oeuvre){go('home');return;}
  S.hist=[];go(b.dataset.v,null,true);
});});

function render(){
  var m=$('main');
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.view||(S.view==='chap'&&b.dataset.v==='chapitres'));});
  $('back').classList.toggle('show',S.hist.length>0);
  var o=cur();
  if(S.view==='home')return renderHome(m);
  if(S.view==='licence')return renderLicence(m);
  if(!o)return renderHome(m);
  setTitle(o.titre,o.auteur+' · '+o.genre);
  if(S.view==='oeuvre')m.innerHTML=o.fiche;
  else if(S.view==='chapitres')renderChapList(m,o);
  else if(S.view==='chap')renderChap(m,o,o.chapitres[S.chap]);
  else if(S.view==='persos')renderPersos(m,o);
  else if(S.view==='exam')renderExam(m,o);
  else if(S.view==='methode')renderMethode(m,o);
}
function renderMethode(m,o){
  var h=o.methode;
  if(o.redactions&&o.redactions.length){
    h+='<div class="card"><h2>Rédactions modèles</h2><p class="tip">Une rédaction complète par thème, au format attendu le jour de l\'examen (15 à 20 lignes). Touchez un titre pour l\'ouvrir. Les connecteurs sont surlignés.</p>';
    o.redactions.forEach(function(r,i){
      h+='<div class="redac" id="rd'+i+'"><button onclick="this.parentNode.classList.toggle(\'open\')"><span class="n">'+(i+1)+'</span><b>'+r.t+'</b><span class="ch">›</span></button><div class="body"><div class="sujet"><b>Sujet :</b> '+r.sujet+'</div>';
      r.paras.forEach(function(p){h+='<p class="para '+p.type+'"><span class="lab">'+({i:'Introduction',a:'Argument',c:'Conclusion',t:'Thèse',at:'Antithèse'}[p.type]||p.type)+'</span>'+hiliteConn(p.txt)+'</p>';});
      if(r.note)h+='<div class="note">💡 '+r.note+'</div>';
      h+='</div></div>';
    });
    h+='</div>';
  }
  m.innerHTML=h;
}
var CONN=['De nos jours','Il est fréquent de constater que','La question se pose de savoir si','Tout d\'abord','D\'abord','Ensuite','De plus','Par ailleurs','En outre','Enfin','Par exemple','Ainsi','Comme le montre','Cependant','Toutefois','Néanmoins','Certes','mais','En effet','Car','Donc','C\'est pourquoi','Par conséquent','En somme','Pour conclure','En définitive','D\'une part','D\'autre part','En revanche','Au contraire','Il est vrai que','Pourtant','Or','Finalement'];
function hiliteConn(t){CONN.forEach(function(c){var re=new RegExp('(^|[\\s(«])('+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?=[\\s,;:.!?»)])','g');t=t.replace(re,'$1<mark class="conn">$2</mark>');});return t;}

/* ---------- accueil ---------- */
function renderHome(m){
  setTitle('Jihawi Prépa','1ʳᵉ année bac · Examen régional');
  var h='<div class="install" id="install"><img src="icon-192.png" alt=""><div class="t"><b>Installer l\'application</b>Icône sur l\'écran d\'accueil, fonctionne hors connexion.</div><button class="ok" onclick="doInstall()">Installer</button><button class="no" onclick="hideInstall(true)">✕</button></div>';

  var ids=['bam','antigone','ddc'];

            antigone:{t:'Antigone',a:'Jean Anouilh · tragédie moderne',c:'linear-gradient(135deg,#1f6f78,#2b2118)'},
            ddc:{t:'Le Dernier Jour d\'un condamné',a:'Victor Hugo · roman à thèse',c:'linear-gradient(135deg,#4a3b5c,#8a6d3b)'}};
  ids.forEach(function(id){
    var ok=!!BAM.oeuvres[id],x=meta[id];
    h+='<button class="oeuvre'+(ok?'':' soon')+'" style="background:'+x.c+'" '+(ok?'onclick="openOeuvre(\''+id+'\')"':'disabled')+'><b>'+x.t+'</b><small>'+x.a+'</small>'+(ok?'':'<span class="ribbon">BIENTÔT</span>')+'</button>';
  });
  h+='</div></div>';
  var p=load('prog',{}),tot=0,done=0;
  Object.keys(BAM.oeuvres).forEach(function(id){BAM.oeuvres[id].chapitres.forEach(function(c,i){tot++;if(p[id+'_'+i])done++;});});
  h+=licCard();
  h+='<div class="card"><h2>Votre progression</h2><div class="stat"><div><b>'+done+'/'+tot+'</b><small>chapitres travaillés</small></div><div><b>'+(load('examBest',null)===null?'—':fmt(load('examBest',0))+'/20')+'</b><small>meilleur examen blanc</small></div></div></div>';
  m.innerHTML=h;refreshInstall();
}

function deviceId(){var d=load('dev',null);if(!d){d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);store('dev',d);}return d;}
function loadPaid(src){try{new Function(src)();S.full=true;return true;}catch(e){return false;}}
function initLicence(){
  if(BAM.preview){S.full=true;S.lic={code:'APERCU-COMPLET',nom:'Aperçu de validation',exp:Date.now()+30*86400000};return;}
  S.lic=load('lic',null);var src=null;try{src=localStorage.getItem('jp_paid');}catch(e){}
  if(S.lic&&src){if(!loadPaid(src)){S.lic=null;}}else{S.lic=null;}
  if(S.lic&&navigator.onLine&&Date.now()-(S.lic.checked||0)>7*86400000){
    fetch(API+'/check?tok='+encodeURIComponent(S.lic.token)).then(function(r){return r.json();}).then(function(j){
      if(j&&j.ok){S.lic.checked=Date.now();S.lic.exp=j.exp;store('lic',S.lic);}
      else if(j&&j.ok===false){clearLicence('Votre licence n\'est plus valide (désactivée ou expirée).');}

}

}

  m.innerHTML='<div class="card"><h2>Activer la version complète</h2><p class="tip">Entrez le code reçu. Il est lié à cet appareil (2 appareils maximum par code). Connexion Internet nécessaire une seule fois : ensuite tout fonctionne hors ligne.</p>'

}
function fmtCode(v){v=v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);return v.replace(/(.{4})(?=.)/g,'$1-');}
function activate(){
  var code=($('licCode').value||'').trim(),nom=($('licNom').value||'').trim(),msg=$('licMsg'),btn=$('licBtn');
  if(code.length!==14){msg.textContent='Le code doit comporter 12 caractères (XXXX-XXXX-XXXX).';return;}
  if(!navigator.onLine){msg.textContent='Connectez-vous à Internet pour activer (une seule fois).';return;}
  btn.disabled=true;msg.textContent='Vérification…';
  fetch(API+'/activate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:code,device:deviceId(),nom:nom})})
  .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
  .then(function(x){
    if(x.s!==200)throw new Error(x.j.error||'Activation refusée');
    msg.textContent='Code accepté. Téléchargement du contenu…';
    return fetch(API+'/content?tok='+encodeURIComponent(x.j.token)).then(function(r){if(!r.ok)throw new Error('Téléchargement impossible ('+r.status+')');return r.text();}).then(function(src){
      if(!loadPaid(src))throw new Error('Contenu invalide');
      try{localStorage.setItem('jp_paid',src);}catch(e){throw new Error('Mémoire du téléphone insuffisante');}
      S.lic={code:code,nom:x.j.nom||nom,exp:x.j.exp,token:x.j.token,checked:Date.now()};store('lic',S.lic);
      msg.textContent='Activation réussie !';setTimeout(function(){S.hist=[];go('home',null,true);},600);
    });
  }).catch(function(e){msg.textContent='✗ '+e.message;btn.disabled=false;});
}
/* ---------- PWA : installation + mise à jour ---------- */
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;refreshInstall();});
window.addEventListener('appinstalled',function(){deferredPrompt=null;hideInstall(false);});
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function refreshInstall(){var el=$('install');if(!el)return;var dismissed=load('installDismissed',0);var show=deferredPrompt&&!isStandalone()&&(Date.now()-dismissed>7*86400000);el.classList.toggle('show',!!show);}
function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;refreshInstall();});}
function hideInstall(remember){if(remember)store('installDismissed',Date.now());var el=$('install');if(el)el.classList.remove('show');}
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!BAM.preview){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound',function(){var nw=reg.installing;nw&&nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)$('toast').classList.add('show');});});
    }).catch(function(){});
  });
}
function openOeuvre(id){S.oeuvre=id;S.hist=[];store('last',id);go('oeuvre',null,true);}

/* ---------- chapitres ---------- */
function renderChapList(m,o){
  var p=load('prog',{});
  var h='<div class="card"><h2>'+o.chapLabel+'</h2><p class="tip">Chaque chapitre : résumé illustré, points clés, puis entraînement type régional.</p><div class="chaplist">';
  o.chapitres.forEach(function(c,i){
    var sc=p[o.id+'_'+i];
    h+='<button class="chapbtn" onclick="go(\'chap\',{chap:'+i+'})"><span class="num">'+(i+1)+'</span><span class="t"><b>'+c.titre+'</b><small>'+c.sous+'</small></span><span class="st">'+(sc?'<b>'+fmt(sc.pts)+'/'+sc.tot+'</b><br>dernier score':'à faire')+'</span></button>';
  });
  if(!S.full&&o.locked){o.locked.forEach(function(c,j){var i=o.chapitres.length+j;
    h+='<button class="chapbtn locked" onclick="go(\'licence\')"><span class="num">🔒</span><span class="t"><b>'+(i+1)+'. '+c.titre+'</b><small>'+c.sous+'</small></span><span class="st">version<br>complète</span></button>';});
    h+='<button class="btn w" onclick="go(\'licence\')">Débloquer tous les chapitres</button>';}
  h+='</div></div>';m.innerHTML=h;
}
function renderChap(m,o,c){
  S.answers={};
  var h='<div class="card"><h2>'+o.chapShort+' '+(S.chap+1)+' — '+c.titre+'</h2>'+(c.tip?'<p class="tip">'+c.tip+'</p>':'')+'<div class="seg"><button class="on" onclick="segChap(0,this)">Cours</button><button onclick="segChap(1,this)">Entraînement</button></div>';
  h+='<div id="seg0">';
  if(c.tip){h+=arBtn('tip',c.ar&&c.ar.tip,c.tip);}
  c.episodes.forEach(function(e,i){
    var a=c.ar&&c.ar.ep&&c.ar.ep[i];
    h+='<h3>'+(i+1)+'. '+e.t+'</h3>';
    if(e.svg)h+='<div class="fig">'+e.svg+(e.cap?'<div class="caption">'+e.cap+'</div>':'')+'</div>';
    h+=arBtn('p'+i,a&&a.p,e.p)+'<p>'+e.p+'</p>';
    if(e.k)h+='<div class="keypoints">'+e.k+'</div>'+arBtn('k'+i,a&&a.k,e.k,true);
  });
  if(c.chrono){h+='<h3>Chronologie</h3><div class="timeline">';c.chrono.forEach(function(t){h+='<div class="tl">'+t+'</div>';});h+='</div>';}
  if(c.analyse){h+='<h3>Outils d\'analyse sur ce chapitre</h3><table><tr><th>Notion</th><th>Dans ce chapitre</th></tr>';c.analyse.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';});h+='</table>';}
  if(c.citations){h+='<h3>À retenir pour l\'examen</h3><div class="keypoints">'+c.citations+'</div>';}
  h+='<button class="btn w alt" onclick="segChap(1,document.querySelectorAll(\'.seg button\')[1])">Passer à l\'entraînement →</button></div>';
  h+='<div id="seg1" style="display:none"><div class="bar"><i id="prog"></i></div><div id="quiz"></div><div class="score" id="score"></div><button class="btn ghost" onclick="resetQuiz()">Recommencer</button>'
    +(S.chap<o.chapitres.length-1?' <button class="btn alt" onclick="go(\'chap\',{chap:'+(S.chap+1)+'})">Chapitre suivant →</button>':'')+'</div></div>';
  if(S.full&&S.lic)h+='<p class="tip" style="text-align:center;font-size:.7rem">Jihawi Prépa · licence '+S.lic.code+(S.lic.nom?' · '+esc(S.lic.nom):'')+' · usage personnel</p>';
  m.innerHTML=h;renderQuiz(c.quiz,'chap');
}
/* ---------- traduction arabe ---------- */
function strip(h){return String(h).replace(/<[^>]+>/g,'');}
function arBtn(id,ar,fr,after){
  var bid='ar_'+id;
  if(ar){return '<button class="arbtn" onclick="toggleAr(this,\''+bid+'\')">🇲🇦 ترجمة · Traduire en arabe</button><div class="ar" id="'+bid+'">'+ar+'</div>';}
  var url='https://translate.google.com/?sl=fr&tl=ar&op=translate&text='+encodeURIComponent(strip(fr).slice(0,1500));
  return '<a class="arbtn" href="'+url+'" target="_blank" rel="noopener">🇲🇦 Traduire en arabe (en ligne)</a>';
}
function toggleAr(btn,id){var d=$(id);var on=d.classList.toggle('show');btn.classList.toggle('on',on);}
function segChap(i,btn){document.querySelectorAll('.seg button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');$('seg0').style.display=i?'none':'block';$('seg1').style.display=i?'block':'none';window.scrollTo(0,0);}

/* ---------- quiz ---------- */
var QZ=[],QMODE='chap';
function renderQuiz(list,mode){
  QZ=list;QMODE=mode;S.answers={};
  var box=$('quiz');box.innerHTML='';
  list.forEach(function(q,i){
    var d=document.createElement('div');d.className='q';
    var h='<span class="tag">'+(i+1)+' · '+q.t+'</span><div class="stem">'+q.s+'</div>';
    if(q.open){
      h+='<textarea placeholder="Rédigez votre réponse…"></textarea><button class="btn alt" onclick="showModel('+i+')">Voir le corrigé modèle</button><div class="expl" id="ex'+i+'"><b>Corrigé modèle :</b><br>'+q.m+'<div class="selfeval"><button onclick="selfEval('+i+',0,this)">Non acquis</button><button onclick="selfEval('+i+',0.5,this)">Partiel</button><button onclick="selfEval('+i+',1,this)">Acquis</button></div></div>';
    }else{
      q.o.forEach(function(o,j){h+='<button class="opt" id="o'+i+'_'+j+'" onclick="answer('+i+','+j+')">'+String.fromCharCode(65+j)+'. '+o+'</button>';});
      h+='<div class="expl" id="ex'+i+'"><b>Explication :</b> '+q.e+'</div>';
    }
    d.innerHTML=h;box.appendChild(d);
  });
  updateScore();
}
function answer(i,j){
  if(S.answers[i]!==undefined)return;
  S.answers[i]=(j===QZ[i].a)?1:0;
  QZ[i].o.forEach(function(_,k){var b=$('o'+i+'_'+k);b.disabled=true;if(k===QZ[i].a)b.classList.add('good');else if(k===j)b.classList.add('bad');});
  $('ex'+i).classList.add('show');updateScore();
}
function showModel(i){$('ex'+i).classList.add('show');}
function selfEval(i,v,btn){S.answers[i]=v;btn.parentNode.querySelectorAll('button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');updateScore();}
function updateScore(){
  var done=Object.keys(S.answers).length,pts=0;for(var k in S.answers)pts+=S.answers[k];
  $('prog').style.width=Math.round(done/QZ.length*100)+'%';
  var s=$('score');if(done===0){s.textContent='';return;}
  s.textContent='Score : '+fmt(pts)+' / '+QZ.length+(done<QZ.length?' ('+done+' répondues)':'');
  if(done===QZ.length){
    if(QMODE==='chap'){var p=load('prog',{});p[S.oeuvre+'_'+S.chap]={pts:pts,tot:QZ.length};store('prog',p);}
    if(QMODE==='exam'){var n=Math.round(pts/QZ.length*200)/10;s.textContent='Note : '+fmt(n)+' / 20';var b=load('examBest',0);if(n>b)store('examBest',n);clearInterval(S.exam);}
  }
}
function resetQuiz(){renderQuiz(QZ,QMODE);window.scrollTo(0,0);}

/* ---------- personnages ---------- */
function avatar(color,hair,female){
  return '<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="40" fill="'+color+'" opacity=".18"/><path d="M14 80 Q14 52 42 52 Q70 52 70 80Z" fill="'+color+'"/><circle cx="42" cy="34" r="17" fill="#e3b58a"/>'
   +(female?'<path d="M22 30 Q42 2 62 30 L62 50 Q42 56 22 50Z" fill="'+hair+'"/><circle cx="42" cy="34" r="17" fill="#e3b58a"/><path d="M25 28 Q42 8 59 28Z" fill="'+hair+'"/>':'<path d="M25 30 Q42 8 59 30Z" fill="'+hair+'"/>')
   +'<circle cx="36" cy="35" r="2" fill="#2b2118"/><circle cx="48" cy="35" r="2" fill="#2b2118"/><path d="M37 43 Q42 46 47 43" stroke="#2b2118" fill="none" stroke-width="1.5"/></svg>';
}
function renderPersos(m,o){
  var h='<div class="card"><h2>Les personnages</h2><p class="tip">Touchez une carte pour voir le détail. À l\'examen : « présentez ce personnage en 2-3 phrases ».</p><div class="grid">';
  o.persos.forEach(function(p,i){h+='<div class="perso" onclick="this.classList.toggle(\'open\')">'+avatar(p.c,p.h,p.f)+'<b>'+p.n+'</b><small>'+p.r+'</small><div class="more">'+p.d+'</div></div>';});
  h+='</div>'+(o.schema?'<h3>Schéma des relations</h3><div class="fig">'+o.schema+'</div>':'')+'</div>';
  m.innerHTML=h;
}

/* ---------- examen blanc ---------- */
function renderExam(m,o){
  var h='<div class="card"><h2>Examen blanc</h2><p class="tip">10 questions tirées au sort dans tous les chapitres, 20 minutes, note sur 20. Comme le jour J : pas de retour en arrière.</p>'
   +'<div class="seg"><button class="on" onclick="examSeg(0,this)">QCM chronométré</button><button onclick="examSeg(1,this)">Flashcards</button></div>'
   +'<div id="eseg0"><button class="btn w" onclick="startExam()">Lancer un examen blanc</button><div id="examzone"></div></div>'
   +'<div id="eseg1" style="display:none"><p class="tip">Touchez la carte pour la retourner.</p><div class="flash" id="flash" onclick="flipCard()"></div><div class="row"><button class="btn ghost" onclick="nextCard()">Carte suivante →</button></div></div></div>';
  m.innerHTML=h;FC=shuffle(o.notions.slice());FI=0;showCard(false);
}
function examSeg(i,btn){document.querySelectorAll('.seg button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');$('eseg0').style.display=i?'none':'block';$('eseg1').style.display=i?'block':'none';}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startExam(){
  var o=cur(),pool=[];o.chapitres.forEach(function(c){c.quiz.forEach(function(q){if(!q.open)pool.push(q);});});
  var list=shuffle(pool).slice(0,10),left=20*60;
  $('examzone').innerHTML='<p class="score">Temps restant : <span class="timer" id="tm">20:00</span></p><div class="bar"><i id="prog"></i></div><div id="quiz"></div><div class="score" id="score"></div>';
  renderQuiz(list,'exam');
  clearInterval(S.exam);
  S.exam=setInterval(function(){left--;var mm=Math.floor(left/60),ss=left%60;var t=$('tm');if(!t){clearInterval(S.exam);return;}t.textContent=mm+':'+(ss<10?'0':'')+ss;if(left<=0){clearInterval(S.exam);t.textContent='Terminé';document.querySelectorAll('.opt').forEach(function(b){b.disabled=true});}},1000);
}
var FC=[],FI=0,FB=false;
function showCard(back){FB=back;var c=FC[FI];var f=$('flash');if(!f||!c)return;f.className='flash'+(back?' back':'');f.innerHTML=back?'<div><b>'+c.d+'</b></div>':'<div><small style="color:#7a6a58">Définissez</small><br><b style="font-size:1.1rem">'+c.n+'</b></div>';}
function flipCard(){showCard(!FB);}
function nextCard(){FI=(FI+1)%FC.length;showCard(false);}

/* ---------- init ---------- */
(function(){initLicence();var last=load('last',null);if(last&&BAM.oeuvres[last]){S.oeuvre=last;}go('home',null,true);})();
